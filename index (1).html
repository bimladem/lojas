<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f0f0; color: #222; font-size: 14px; }

.header {
  background: #fff; border-bottom: 3px solid #222;
  padding: 16px 28px; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.header h1 { font-size: 20px; color: #111; }
.header .sub { font-size: 12px; color: #777; margin-top: 3px; }
.periodo { padding: 5px 14px; background: #f7f7f7; border-left: 4px solid #555; border-radius: 2px; font-size: 13px; color: #333; }

.container { max-width: 1200px; margin: 24px auto; padding: 0 16px 48px; }

.loading { text-align: center; padding: 60px 20px; color: #888; font-size: 16px; }

/* Legenda */
.legenda { font-size: 12px; color: #888; margin-bottom: 16px; padding: 10px 16px; background: #fff; border-radius: 6px; border: 1px solid #e8e8e8; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Tabela principal */
.tabela-wrap { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }

.tabela-header {
  display: grid;
  grid-template-columns: 70px 160px 220px 150px 150px 200px 80px;
  background: #222; color: #fff;
  padding: 10px 12px; gap: 8px; font-size: 13px; font-weight: 500;
}

/* Linha de loja */
.loja-bloco { border-top: 1px solid #e8e8e8; }

.loja-linha {
  display: grid;
  grid-template-columns: 70px 160px 220px 150px 150px 200px 80px;
  padding: 12px; gap: 8px; align-items: center;
  cursor: pointer; transition: background 0.12s;
}
.loja-linha:hover { background: #fafafa; }

/* Células */
.cel-rank { text-align: center; }
.rank-num { font-size: 16px; font-weight: bold; }
.nivel-badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: bold; border: 1px solid; margin-top: 4px; }
.n1 { color: #27ae60; border-color: #27ae60; }
.n2 { color: #e65100; border-color: #e65100; }
.n3 { color: #b71c1c; border-color: #b71c1c; }

.cel-loja .nome { font-size: 14px; font-weight: bold; color: #111; }
.cel-loja .local { font-size: 12px; color: #666; margin-top: 2px; }

.cel-tarefas { text-align: center; }
.tarefas-val { font-size: 24px; font-weight: bold; color: #111; }
.tarefas-sub { font-size: 11px; color: #888; margin-top: 2px; }
.tarefas-np { font-size: 12px; color: #555; margin-top:4px; }

.cel-pct { text-align: center; }
.pct-nc { font-size: 20px; font-weight: bold; }
.pct-lbl { font-size: 11px; color: #888; }
.pct-c { font-size: 14px; font-weight: bold; color: #27ae60; margin-top: 6px; }

.cel-hist { font-size: 12px; }
.hist-mini { display: flex; flex-direction: column; gap: 3px; }
.hist-row { display: flex; justify-content: space-between; gap: 8px; }
.hist-sem { color: #777; white-space: nowrap; font-size: 11px; }
.hist-val { font-weight: bold; color: #111; font-size: 11px; }
.hist-atual { background: #f0f0f0; padding: 2px 4px; border-radius: 3px; }
.tendencia { margin-top: 5px; font-size: 12px; }
.up { color: #c0392b; font-weight: bold; }
.down { color: #27ae60; font-weight: bold; }

.cel-seccoes { text-align: center; }
.btn-seccoes {
  background: none; border: 1px solid #ccc; border-radius: 5px;
  padding: 6px 12px; font-size: 12px; cursor: pointer; color: #444;
  transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-seccoes:hover { background: #f0f0f0; border-color: #999; }
.btn-seccoes.open { background: #222; color: #fff; border-color: #222; }
.sec-count { font-size: 11px; color: #aaa; margin-top: 4px; }

/* Painel de secções */
.seccoes-painel {
  display: none; background: #f7f7f7;
  border-top: 1px solid #e0e0e0; padding: 0;
}
.seccoes-painel.visible { display: block; }

.seccoes-tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
.seccoes-tabela thead tr { background: #444; color: #fff; }
.seccoes-tabela thead th { padding: 7px 14px; font-weight: 500; text-align: left; }
.seccoes-tabela thead th:not(:first-child) { text-align: center; }
.seccoes-tabela tbody tr { border-bottom: 1px solid #ebebeb; cursor: pointer; background: #fff; }
.seccoes-tabela tbody tr:hover { background: #f0f0f0; }
.seccoes-tabela tbody td { padding: 8px 14px; }
.seccoes-tabela tbody td:not(:first-child) { text-align: center; font-weight: bold; }

/* Detalhe de secção */
.sec-detalhe { display: none; background: #fff; border-top: 1px solid #e8e8e8; padding: 14px 20px; }
.sec-detalhe.visible { display: block; }
.sec-detalhe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 600px; }
.sec-detalhe-box { background: #f7f7f7; border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px 16px; }
.sec-detalhe-box h4 { font-size: 12px; color: #555; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.03em; }
.sec-detalhe-num { font-size: 30px; font-weight: bold; color: #111; }
.sec-detalhe-sub { font-size: 11px; color: #888; margin-top: 3px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 Análise Semanal IM</h1>
    <div class="sub" id="sub-info">A carregar dados...</div>
  </div>
  <div class="periodo" id="periodo-label">—</div>
</div>

<div class="container">
  <div id="app"><div class="loading">⏳ A carregar dados...</div></div>
</div>

<script>
var openLojas = {};
var openSecs  = {};

function corPct(pct) {
  var v = parseFloat(pct);
  if (v <= 20) return '#27ae60';
  if (v <= 40) return '#e65100';
  return '#b71c1c';
}

function seta(diff) {
  if (diff === null || diff === undefined) return '—';
  if (diff > 0) return '<span class="up">▲ +' + diff + '</span>';
  if (diff < 0) return '<span class="down">▼ ' + diff + '</span>';
  return '<span style="color:#888">→</span>';
}

function toggleSeccoes(li) {
  var painel = document.getElementById('painel-' + li);
  var btn    = document.getElementById('btn-' + li);
  if (!painel) return;
  if (openLojas[li]) {
    painel.classList.remove('visible');
    btn.classList.remove('open');
    btn.innerHTML = '▶ Secções';
    openLojas[li] = false;
  } else {
    painel.classList.add('visible');
    btn.classList.add('open');
    btn.innerHTML = '▼ Secções';
    openLojas[li] = true;
  }
}

function toggleSecDetalhe(li, si) {
  var id  = li + '-' + si;
  var det = document.getElementById('secdet-' + id);
  var row = document.getElementById('secrow-' + id);
  if (!det) return;
  if (openSecs[id]) {
    det.classList.remove('visible');
    if (row) row.style.background = '';
    openSecs[id] = false;
  } else {
    det.classList.add('visible');
    if (row) row.style.background = '#f0f7ff';
    openSecs[id] = true;
  }
}

function renderApp(dados) {
  var lojas  = Array.isArray(dados) ? dados : (dados.lojas || []);
  var semana = Array.isArray(dados) ? '—' : (dados.semana || '—');
  var gerado = Array.isArray(dados) ? '—' : (dados.gerado || '—');

  document.getElementById('sub-info').textContent = 'Gerado em ' + gerado + ' · ' + lojas.length + ' lojas';
  document.getElementById('periodo-label').innerHTML = '📅 <strong>' + semana + '</strong>';

  var legenda = '<div class="legenda">'
    + '<span>🔴 Top 3 críticas</span>'
    + '<span>🟡 Em alerta</span>'
    + '<span style="color:#27ae60;font-weight:bold">Nível 1</span><span style="color:#888">0–20%</span>'
    + '<span style="color:#e65100;font-weight:bold">Nível 2</span><span style="color:#888">21–40%</span>'
    + '<span style="color:#b71c1c;font-weight:bold">Nível 3</span><span style="color:#888">41%+</span>'
    + '<span>▲ A piorar · ▼ A melhorar</span>'
    + '<span style="color:#888">Clique em "Secções" para expandir</span>'
    + '</div>';

  var header = '<div class="tabela-header">'
    + '<div># / Nível</div>'
    + '<div>Loja / Localidade</div>'
    + '<div style="text-align:center">Tarefas em aberto<br><span style="font-weight:normal;font-size:11px">P · NP (sem data limite)</span></div>'
    + '<div style="text-align:center">% P<br><span style="font-weight:normal;font-size:11px">não cumpridas · cumpridas</span></div>'
    + '<div style="text-align:center">% NP<br><span style="font-weight:normal;font-size:11px">não cumpridas · cumpridas</span></div>'
    + '<div>Histórico P<br><span style="font-weight:normal;font-size:11px">semanas anteriores</span></div>'
    + '<div style="text-align:center">Secções</div>'
    + '</div>';

  var blocos = lojas.map(function(l, li) {
    var emoji = li < 3 ? '🔴' : '🟡';
    var nc    = l.nivel === 1 ? 'n1' : l.nivel === 2 ? 'n2' : 'n3';

    // Histórico mini
    var histRows = '';
    if (l.historico && l.historico.length > 0) {
      histRows = l.historico.map(function(h) {
        return '<div class="hist-row"><span class="hist-sem">' + h.semana + '</span><span class="hist-val">' + h.pAberto + '</span></div>';
      }).join('');
      histRows += '<div class="hist-row hist-atual"><span class="hist-sem">' + semana + ' (atual)</span><span class="hist-val">' + l.pAberto + '</span></div>';
      histRows += '<div class="tendencia">Tendência: ' + seta(l.diff) + '</div>';
    } else {
      histRows = '<div style="font-size:11px;color:#aaa">Sem histórico</div><div class="hist-row hist-atual" style="margin-top:4px"><span class="hist-sem">Atual</span><span class="hist-val">' + l.pAberto + '</span></div>';
    }

    // Secções painel
    var seccoes = l.seccoes || [];
    var secLinhas = seccoes.map(function(s, si) {
      var id   = li + '-' + si;
      var pVal  = s.pAberto  > 0 ? s.pAberto  : '—';
      var npVal = s.npAberto > 0 ? s.npAberto : '—';
      return '<tr id="secrow-' + id + '" onclick="toggleSecDetalhe(' + li + ',' + si + ')">'
        + '<td><b>' + s.nome + '</b></td>'
        + '<td>' + pVal + '</td>'
        + '<td>' + npVal + '</td>'
        + '</tr>'
        + '<tr><td colspan="3" style="padding:0;border:none">'
        + '<div class="sec-detalhe" id="secdet-' + id + '">'
        + '<div class="sec-detalhe-grid">'
        + '<div class="sec-detalhe-box"><h4>Programadas (P)</h4><div class="sec-detalhe-num">' + s.pAberto + '</div><div class="sec-detalhe-sub">tarefas programadas não cumpridas no período</div></div>'
        + '<div class="sec-detalhe-box"><h4>Não Programadas (NP)</h4><div class="sec-detalhe-num">' + s.npAberto + '</div><div class="sec-detalhe-sub">tarefas não programadas em aberto (sem data limite)</div></div>'
        + '</div></div></td></tr>';
    }).join('');

    var painelSeccoes = seccoes.length > 0
      ? '<div class="seccoes-painel" id="painel-' + li + '">'
        + '<table class="seccoes-tabela">'
        + '<thead><tr><th>Secção</th><th>P em aberto</th><th>NP em aberto</th></tr></thead>'
        + '<tbody>' + secLinhas + '</tbody>'
        + '</table></div>'
      : '<div class="seccoes-painel" id="painel-' + li + '" style="padding:12px 20px;font-size:13px;color:#aaa">Sem secções com tarefas em aberto</div>';

    return '<div class="loja-bloco">'
      + '<div class="loja-linha" onclick="toggleSeccoes(' + li + ')">'

      // Rank / Nível
      + '<div class="cel-rank">'
      + '<div class="rank-num">' + emoji + ' ' + (li + 1) + '</div>'
      + '<span class="nivel-badge ' + nc + '">Nível ' + l.nivel + '</span>'
      + '</div>'

      // Loja
      + '<div class="cel-loja">'
      + '<div class="nome">' + l.loja + '</div>'
      + '<div class="local">' + (l.localidade || '—') + '</div>'
      + '</div>'

      // Tarefas
      + '<div class="cel-tarefas">'
      + '<div class="tarefas-val">' + l.pAberto + '</div>'
      + '<div class="tarefas-sub">P em aberto de ' + l.pTotal + '</div>'
      + '<div class="tarefas-np">NP: <b>' + l.npAberto + '</b> de ' + l.npTotal + '<br><span style="font-size:11px;color:#aaa">(sem data limite)</span></div>'
      + '</div>'

      // % P
      + '<div class="cel-pct">'
      + '<div class="pct-nc" style="color:' + corPct(l.pctPNaoCumpridas) + '">' + l.pctPNaoCumpridas + '%</div>'
      + '<div class="pct-lbl">P não cumpridas</div>'
      + '<div class="pct-c">' + l.pctPCumpridas + '%</div>'
      + '<div class="pct-lbl">P cumpridas</div>'
      + '</div>'

      // % NP
      + '<div class="cel-pct">'
      + '<div class="pct-nc" style="color:' + corPct(l.pctNPNaoCumpridas) + '">' + l.pctNPNaoCumpridas + '%</div>'
      + '<div class="pct-lbl">NP não cumpridas</div>'
      + '<div class="pct-c">' + l.pctNPCumpridas + '%</div>'
      + '<div class="pct-lbl">NP cumpridas</div>'
      + '</div>'

      // Histórico
      + '<div class="cel-hist"><div class="hist-mini">' + histRows + '</div></div>'

      // Botão secções
      + '<div class="cel-seccoes">'
      + '<button class="btn-seccoes" id="btn-' + li + '" onclick="event.stopPropagation();toggleSeccoes(' + li + ')">▶ Secções</button>'
      + '<div class="sec-count">' + seccoes.length + ' secções</div>'
      + '</div>'

      + '</div>'
      + painelSeccoes
      + '</div>';
  }).join('');

  document.getElementById('app').innerHTML = legenda
    + '<div class="tabela-wrap">' + header + blocos + '</div>';
}

fetch('dados.json?t=' + Date.now())
  .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(d) { renderApp(d); })
  .catch(function(err) {
    document.getElementById('app').innerHTML =
      '<div class="loading" style="color:#c0392b">❌ Erro ao carregar dados: ' + err.message
      + '<br><br><span style="font-size:13px;color:#888">Verifica que o ficheiro <b>dados.json</b> existe no repositório.</span></div>';
  });
</script>
</body>
</html>
