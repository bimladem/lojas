<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; color: #222; }
  .header {
    background: #fff; border-bottom: 4px solid #222; padding: 20px 28px;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
  }
  .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
  .loading, .error { text-align: center; padding: 80px 20px; font-size: 18px; }
  .error { color: #c0392b; background: white; border-radius: 8px; }
  .legenda { background: #fff; padding: 12px 18px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; border: 1px solid #ddd; }
  .loja-card {
    background: #fff; margin-bottom: 25px; border-radius: 8px; overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 Análise Semanal IM</h1>
    <div id="sub-gerado">A carregar Excel...</div>
  </div>
  <div id="periodo-label" style="font-weight:600; font-size:15px;">—</div>
</div>

<div class="container">
  <div id="app"><div class="loading">⏳ A processar o ficheiro Excel...</div></div>
</div>

<script>
const EXCEL_FILE = 'Análise Semanal IM.xlsx';   // ← Muda aqui se renomeares o ficheiro

async function carregarExcel() {
  const app = document.getElementById('app');
  
  try {
    const response = await fetch(EXCEL_FILE + '?t=' + Date.now());
    if (!response.ok) throw new Error(`Ficheiro "${EXCEL_FILE}" não encontrado`);

    const arrayBuffer = await response.arrayBuffer();
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });

    // Tenta encontrar as sheets
    const sheetAnalise = workbook.Sheets['Análise'] || workbook.Sheets[workbook.SheetNames[0]];
    const sheetHistorico = workbook.Sheets['Por Loja Histórico'] || workbook.Sheets[workbook.SheetNames.find(n => n.includes('Histórico'))];

    if (!sheetHistorico) throw new Error('Sheet "Por Loja Histórico" não encontrada no Excel');

    const analiseData = XLSX.utils.sheet_to_json(sheetAnalise);
    const historicoData = XLSX.utils.sheet_to_json(sheetHistorico);

    // === LÓGICA IDÊNTICA AO TEU CÓDIGO n8n ===
    const semanas = historicoData.map(r => String(r['Semana'] || '').trim()).filter(s => s !== '');
    const ultimaSemana = semanas[semanas.length - 1];

    let lojas = historicoData
      .filter(r => String(r['Semana'] || '').trim() === ultimaSemana && r['Loja'])
      .map(r => {
        const pTotal = Number(r['P Total']) || 0;
        const pAberto = Number(r['P Aberto']) || 0;
        const pFechado = Number(r['P Fechado']) || 0;
        const npTotal = Number(r['NP Total']) || 0;
        const npAberto = Number(r['NP Aberto']) || 0;
        const npFechado = Number(r['NP Fechado']) || 0;

        const pctPAberto = pTotal > 0 ? (pAberto / pTotal * 100).toFixed(1) : '0.0';
        const pctNPAberto = npTotal > 0 ? (npAberto / npTotal * 100).toFixed(1) : '0.0';
        const pctPFechado = pTotal > 0 ? (pFechado / pTotal * 100).toFixed(1) : '0.0';
        const pctNPFechado = npTotal > 0 ? (npFechado / npTotal * 100).toFixed(1) : '0.0';

        const pctP = parseFloat(pctPAberto);
        const nivel = pctP <= 20 ? 1 : pctP <= 40 ? 2 : 3;

        return {
          loja: String(r['Loja']).trim(),
          localidade: String(r['Resumo contactos.Localidade'] || r['IM.Localidade'] || '').trim(),
          pAberto, pTotal, npAberto, npTotal,
          pctPAberto, pctNPAberto, pctPFechado, pctNPFechado,
          nivel,
          historico: [],
          seccoes: []
        };
      })
      .filter(r => r.pAberto > 0);

    lojas.sort((a, b) => b.pAberto - a.pAberto);
    const topLojas = lojas.slice(0, 10);

    // Histórico e Secções (simplificado por agora)
    document.getElementById('sub-gerado').textContent = `Gerado em: ${new Date().toLocaleDateString('pt-PT')}`;
    document.getElementById('periodo-label').innerHTML = `📅 Período: <strong>${ultimaSemana}</strong>`;

    // Render
    let html = `<div class="legenda">🔴 Top 3 | 🟡 Em alerta | Total de lojas: ${topLojas.length}</div>`;

    topLojas.forEach((l, i) => {
      const emoji = i < 3 ? '🔴' : '🟡';
      html += `
      <div class="loja-card">
        <div style="padding:18px 22px; background:#fafafa; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <span style="font-size:21px; font-weight:bold;">${emoji} ${i+1}</span> 
            <strong style="font-size:18px;">${l.loja}</strong><br>
            <span style="color:#555;">${l.localidade || '—'}</span>
          </div>
          <div style="text-align:right">
            <span style="font-size:32px; font-weight:bold; color:#111;">${l.pAberto}</span><br>
            <small style="color:#c0392b">${l.pctPAberto}% em aberto</small>
          </div>
        </div>
      </div>`;
    });

    app.innerHTML = html;

  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="error">
      <strong>❌ ${err.message}</strong><br><br>
      Coloca o ficheiro <strong>${EXCEL_FILE}</strong> na raiz da pasta do GitHub Pages.
    </div>`;
  }
}

carregarExcel();
</script>
</body>
</html>
