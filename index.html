<script>

var stateHist = {};
var stateSec = {};

function toggleHist(li){

  var p = document.getElementById('hist-' + li);

  if(!p) return;

  stateHist[li] = !stateHist[li];

  p.classList.toggle(
    'visible',
    stateHist[li]
  );

}

function toggleSec(li){

  var p = document.getElementById('sec-' + li);

  if(!p) return;

  stateSec[li] = !stateSec[li];

  p.classList.toggle(
    'visible',
    stateSec[li]
  );

}

fetch('dados.json?t=' + Date.now())

.then(r => r.json())

.then(json => {

  var data = json.data || [];

  var semanas = [];

  data.forEach(i => {

    var s = String(
      i["Semana"] || ""
    ).trim();

    if(
      s &&
      semanas.indexOf(s) === -1
    ){
      semanas.push(s);
    }

  });

  var ultima =
    semanas[semanas.length - 1] || '';

  /* ========================= */
  /* LOJAS ÚLTIMA SEMANA */
  /* ========================= */

  var lojas = data

  .filter(i =>

    i["Loja"] &&

    (
      !i["Secção"] ||
      i["Secção"] === ""
    ) &&

    String(
      i["Semana"] || ""
    ).trim() === ultima

  )

  .map(i => {

    var pT = Number(
      i["P Total"] || 0
    );

    var pA = Number(
      i["P Aberto"] || 0
    );

    var pF = Number(
      i["P Fechado"] || 0
    );

    var npT = Number(
      i["NP Total"] || 0
    );

    var npA = Number(
      i["NP Aberto"] || 0
    );

    var npF = Number(
      i["NP Fechado"] || 0
    );

    var pctFechado =
      pT > 0
      ? (pF / pT) * 100
      : 0;

    return {

      loja: String(
        i["Loja"] || ""
      ).trim(),

      local: String(
        i["Resumo contactos.Localidade"] || ""
      ).trim(),

      pT,
      pA,
      pF,

      npT,
      npA,
      npF,

      pctPA:
        pT > 0
        ? ((pA / pT) * 100).toFixed(1)
        : '0.0',

      pctPF:
        pT > 0
        ? ((pF / pT) * 100).toFixed(1)
        : '0.0',

      pctNPF:
        npT > 0
        ? ((npF / npT) * 100).toFixed(1)
        : '0.0',

      pctNaoRealizadas:
        pT > 0
        ? ((pA / pT) * 100).toFixed(1)
        : '0.0',

      nivel:
        pctFechado >= 80
        ? 3
        : pctFechado >= 50
        ? 2
        : 1,

      historico: [],
      seccoes: []

    };

  });

  /* ========================= */
  /* SORT */
  /* ========================= */

  lojas.sort((a,b) => b.pF - a.pF);

  var ids = {};

  lojas.forEach(l => {
    ids[l.loja] = true;
  });

  /* ========================= */
  /* HISTÓRICO */
  /* ========================= */

  var hpl = {};

  data.forEach(i => {

    if(
      !i["Secção"] &&
      i["Loja"] &&
      ids[String(i["Loja"]).trim()]
    ){

      var id = String(
        i["Loja"]
      ).trim();

      if(!hpl[id]){
        hpl[id] = [];
      }

      hpl[id].push({

        semana: String(
          i["Semana"] || ""
        ).trim(),

        pF: Number(
          i["P Fechado"] || 0
        )

      });

    }

  });

  lojas.forEach(l => {

    var h = hpl[l.loja] || [];

    l.historico = h.slice(-8);

    var u = h.slice(-2);

    l.diff =
      u.length === 2
      ? u[1].pF - u[0].pF
      : 0;

  });

  /* ========================= */
  /* SECÇÕES */
  /* ========================= */

  data.forEach(i => {

    if(
      i["Secção"] &&
      i["Loja"] &&
      ids[String(i["Loja"]).trim()]
    ){

      var loja = lojas.find(
        l =>
          l.loja ===
          String(i["Loja"]).trim()
      );

      if(loja){

        var nome = String(
          i["Secção"] || ""
        )
        .replace(
          /^IM\s+\d+\s+/i,
          ''
        )
        .trim();

        if(
          nome &&
          nome.toLowerCase() !== 'admin'
        ){

          var pTotal = Number(
            i["Programadas Total"] || 0
          );

          var pFechadas = Number(
            i["Programadas Fechadas"] || 0
          );

          var npTotal = Number(
            i["Não Programadas Total"] || 0
          );

          var npFechadas = Number(
            i["Não Programadas Fechadas"] || 0
          );

          loja.seccoes.push({

            nome,

            pTotal,
            pFechadas,

            npTotal,
            npFechadas,

            pctP:
              pTotal > 0
              ? (
                  (pFechadas / pTotal) * 100
                ).toFixed(1)
              : '0.0',

            pctNP:
              npTotal > 0
              ? (
                  (npFechadas / npTotal) * 100
                ).toFixed(1)
              : '0.0'

          });

        }

      }

    }

  });

  document.getElementById(
    'sub-info'
  ).textContent =
    lojas.length + ' lojas';

  document.getElementById(
    'periodo'
  ).innerHTML =
    '📅 ' + ultima;

  render(lojas, ultima);

});

</script>
