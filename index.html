<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f0f0; color: #222; font-size: 14px; }

.header {
  background: #fff; border-bottom: 3px solid #222;
  padding: 16px 28px; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.header h1 { font-size: 20px; color: #111; }
.header .sub { font-size: 12px; color: #777; margin-top: 3px; }
.periodo { padding: 5px 14px; background: #f7f7f7; border-left: 4px solid #555; border-radius: 2px; font-size: 13px; color: #333; }

.container { max-width: 1250px; margin: 24px auto; padding: 0 16px 48px; }
.loading { text-align: center; padding: 60px 20px; color: #888; font-size: 16px; }

.legenda { font-size: 12px; color: #888; margin-bottom: 16px; padding: 10px 16px; background: #fff; border-radius: 6px; border: 1px solid #e8e8e8; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

.tabela-wrap { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }

.tabela-header {
  display: grid;
  grid-template-columns: 80px 170px 230px 160px 160px 60px 60px;
  background: #222; color: #fff;
  padding: 10px 14px; gap: 8px; font-size: 13px; font-weight: 500; align-items: center;
}

.loja-bloco { border-top: 1px solid #e8e8e8; }

.loja-linha {
  display: grid;
  grid-template-columns: 80px 170px 230px 160px 160px 60px 60px;
  padding: 12px 14px; gap: 8px; align-items: center;
  background: #fff; transition: background 0.12s;
}
.loja-linha:hover { background: #fafafa; }

.cel-rank { text-align: center; }
.rank-num { font-size: 16px; font-weight: bold; }
.nivel-badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: bold; border: 1px solid; margin-top: 4px; }
.n1 { color: #27ae60; border-color: #27ae60; }
.n2 { color: #e65100; border-color: #e65100; }
.n3 { color: #b71c1c; border-color: #b71c1c; }

.cel-loja .nome { font-size: 14px; font-weight: bold; color: #111; }
.cel-loja .local { font-size: 12px; color: #666; margin-top: 2px; }

.cel-tarefas { text-align: center; }
.tarefas-val { font-size: 22px; font-weight: bold; color: #111; }
.tarefas-sub { font-size: 11px; color: #888; margin-top: 2px; }
.tarefas-np { font-size: 12px; color: #555; margin-top: 6px; }

.cel-pct { text-align: center; }
.pct-ab { font-size: 18px; font-weight: bold; }
.pct-lbl { font-size: 11px; color: #888; margin-top: 1px; }
.pct-fech { font-size: 14px; font-weight: bold; color: #27ae60; margin-top: 6px; }

.toggle-btn {
  background: none; border: 1px solid #ccc; border-radius: 5px;
  padding: 5px 10px; font-size: 12px; cursor: pointer; color: #444;
  transition: all 0.15s; white-space: nowrap; width: 100%;
}
.toggle-btn:hover { background: #f0f0f0; border-color: #999; }
.toggle-btn.open { background: #222; color: #fff; border-color: #222; }

.painel { display: none; border-top: 1px solid #e0e0e0; }
.painel.visible { display: block; }

.hist-painel { background: #f9f9f9; padding: 14px 20px; }
.hist-table { width: 100%; border-collapse: collapse; font-size: 13px; max-width: 400px; }
.hist-table th { background: #444; color: #fff; padding: 6px 12px; text-align: left; }
.hist-table td { padding: 6px 12px; border-bottom: 1px solid #ebebeb; }
.hist-atual { background: #f0f0f0; font-weight: bold; }
.tendencia { margin-top: 10px; font-size: 13px; color: #555; }
.up { color: #c0392b; font-weight: bold; }
.down { color: #27ae60; font-weight: bold; }

.sec-painel { background: #f7f7f7; }
.sec-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.sec-table thead tr { background: #444; color: #fff; }
.sec-table thead th { padding: 7px 16px; font-weight: 500; text-align: left; }
.sec-table thead th:not(:first-child) { text-align: center; }
.sec-table tbody tr { border-bottom: 1px solid #ebebeb; background: #fff; cursor: pointer; }
.sec-table tbody tr:hover { background: #f5f5f5; }
.sec-table tbody td { padding: 9px 16px; }
.sec-table tbody td:not(:first-child) { text-align: center; font-weight: bold; }

.sec-det { display: none; background: #fff; border-top: 1px solid #f0f0f0; }
.sec-det.visible { display: block; }
.sec-det-inner { padding: 14px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 560px; }
.sec-det-box { background: #f7f7f7; border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px 16px; }
.sec-det-box h4 { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.sec-det-num { font-size: 28px; font-weight: bold; color: #111; }
.sec-det-sub { font-size: 11px; color: #888; margin-top: 3px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 Análise Semanal IM</h1>
    <div class="sub" id="sub-info">A carregar dados...</div>
  </div>
  <div class="periodo" id="periodo-label">—</div>
</div>

<div class="container">
  <div id="app"><div class="loading">⏳ A carregar dados...</div></div>
</div>

<script>
var stateHist = {};
var stateSec  = {};
var stateSecDet = {};

function corPct(pct) {
  var v = parseFloat(pct);
  if (v <= 20) return '#27ae60';
  if (v <= 40) return '#e65100';
  return '#b71c1c';
}

function seta(diff) {
  if (diff === null || diff === undefined) return '—';
  if (diff > 0) return '<span class="up">▲ +' + diff + '</span>';
  if (diff < 0) return '<span class="down">▼ ' + diff + '</span>';
  return '<span style="color:#888">→</span>';
}

function toggle(painelId, btnId, stateObj) {
  var p = document.getElementById(painelId);
  var b = document.getElementById(btnId);
  if (!p || !b) return;
  if (stateObj[painelId]) {
    p.classList.remove('visible');
    b.classList.remove('open');
    b.textContent = '▶ ' + (painelId.includes('hist') ? 'Histórico' : 'Secções');
    stateObj[painelId] = false;
  } else {
    p.classList.add('visible');
    b.classList.add('open');
    b.textContent = '▼ Fechar';
    stateObj[painelId] = true;
  }
}

function toggleHist(li) { toggle('hist-' + li, 'btnhist-' + li, stateHist); }
function toggleSec(li)  { toggle('sec-'  + li, 'btnsec-'  + li, stateSec);  }
function toggleSecDet(id) {
  var p = document.getElementById('secdet-' + id);
  var r = document.getElementById('secrow-' + id);
  if (!p) return;
  if (stateSecDet[id]) {
    p.classList.remove('visible');
    if (r) r.style.background = '';
    stateSecDet[id] = false;
  } else {
    p.classList.add('visible');
    if (r) r.style.background = '#f0f7ff';
    stateSecDet[id] = true;
  }
}

fetch('dados.json?t=' + Date.now())
  .then(r => r.json())
  .then(json => {
    const data = json.data || [];

    // === ÚLTIMA SEMANA ===
    let ultimaSemana = "";
    const semanas = [...new Set(data.map(i => String(i.Semana || "").trim()).filter(s => s))];
    if (semanas.length > 0) ultimaSemana = semanas.sort().pop();

    // === LOJAS DA ÚLTIMA SEMANA + TOP 10 ===
    let lojas = data
      .filter(item => item.Loja && item['P Total'] !== undefined && !item.Secção && String(item.Semana || "").trim() === ultimaSemana)
      .map(item => {
        const pTotal = Number(item['P Total']) || 0;
        const pAberto = Number(item['P Aberto']) || 0;
        const pFechado = Number(item['P Fechado']) || 0;
        const npTotal = Number(item['NP Total']) || 0;
        const npAberto = Number(item['NP Aberto']) || 0;
        const npFechado = Number(item['NP Fechado']) || 0;

        const pctPAberto = pTotal > 0 ? (pAberto / pTotal * 100).toFixed(0) : '0';
        const pctNPAberto = npTotal > 0 ? (npAberto / npTotal * 100).toFixed(0) : '0';
        const pctPFechado = pTotal > 0 ? (pFechado / pTotal * 100).toFixed(0) : '0';
        const pctNPFechado = npTotal > 0 ? (npFechado / npTotal * 100).toFixed(0) : '0';

        const pctP = parseFloat(pctPAberto);
        const nivel = pctP <= 20 ? 1 : pctP <= 40 ? 2 : 3;

        return {
          loja: item.Loja,
          localidade: item['IM.Localidade'] || '',
          pTotal, pAberto, pFechado,
          npTotal, npAberto, npFechado,
          pctPAberto, pctNPAberto, pctPFechado, pctNPFechado,
          nivel,
          seccoes: []
        };
      });

    lojas.sort((a, b) => b.pAberto - a.pAberto);
    const topLojas = lojas.slice(0, 10);   // ← Top 10

    // === SECÇÕES ===
    data.forEach(item => {
      if (item.Secção && item.Loja) {
        const loja = topLojas.find(l => l.loja === item.Loja);
        if (loja) {
          const pAberto = Number(item['P Aberto']) || 0;
          const npAberto = Number(item['NP Aberto']) || 0;
          if (pAberto > 0 || npAberto > 0) {
            const nome = (item.Secção || '').replace(/^IM\s+\d+\s+/, '').trim();
            if (nome.toLowerCase() !== 'admin') {
              loja.seccoes.push({ nome, pAberto, npAberto });
            }
          }
        }
      }
    });

    topLojas.forEach(l => l.seccoes.sort((a,b) => b.pAberto - a.pAberto));

    // Renderizar
    document.getElementById('sub-info').textContent = 'Gerado hoje · Top 10 da última semana';
    document.getElementById('periodo-label').innerHTML = '📅 <strong>' + (ultimaSemana || 'Atual') + '</strong>';

    renderApp(topLojas);
  })
  .catch(err => {
    document.getElementById('app').innerHTML = '<div class="loading" style="color:#c0392b">❌ Erro: ' + err.message + '</div>';
  });

function renderApp(lojas) {
  // ... (o resto do teu renderApp original permanece igual)
  var legenda = '<div class="legenda">'
    + '<span>🔴 Top 3 críticas &nbsp;|&nbsp; 🟡 Em alerta</span>'
    + '<span><span style="color:#27ae60;font-weight:bold">Nível 1</span> = 0–20% aberto</span>'
    + '<span><span style="color:#e65100;font-weight:bold">Nível 2</span> = 21–40% aberto</span>'
    + '<span><span style="color:#b71c1c;font-weight:bold">Nível 3</span> = 41%+ aberto</span>'
    + '</div>';

  var header = '<div class="tabela-header">'
    + '<div># / Nível</div>'
    + '<div>Loja / Localidade</div>'
    + '<div style="text-align:center">Tarefas<br><span style="font-weight:normal;font-size:11px">P abertas · NP abertas</span></div>'
    + '<div style="text-align:center">% P<br><span style="font-weight:normal;font-size:11px">aberto · fechado</span></div>'
    + '<div style="text-align:center">% NP<br><span style="font-weight:normal;font-size:11px">aberto · fechado</span></div>'
    + '<div style="text-align:center">Histórico</div>'
    + '<div style="text-align:center">Secções</div>'
    + '</div>';

  var blocos = lojas.map(function(l, li) {
    var emoji = li < 3 ? '🔴' : '🟡';
    var nc    = l.nivel === 1 ? 'n1' : l.nivel === 2 ? 'n2' : 'n3';
    var seccoes = l.seccoes || [];

    var histPainel = '<div class="painel hist-painel" id="hist-' + li + '">'
      + '<div style="padding:20px;color:#777;text-align:center">Histórico não disponível neste ficheiro</div>'
      + '</div>';

    var secLinhas = seccoes.map(function(s, si) {
      var id = li + '-' + si;
      return '<tr id="secrow-' + id + '" onclick="toggleSecDet(\'' + id + '\')">'
        + '<td><b>' + s.nome + '</b></td>'
        + '<td>' + s.pAberto + '</td>'
        + '<td>' + s.npAberto + '</td>'
        + '</tr>'
        + '<tr style="background:#fff"><td colspan="3" style="padding:0;border:none">'
        + '<div class="sec-det" id="secdet-' + id + '">'
        + '<div class="sec-det-inner">'
        + '<div class="sec-det-box"><h4>P — Aberto</h4><div class="sec-det-num">' + s.pAberto + '</div><div class="sec-det-sub">tarefas programadas abertas</div></div>'
        + '<div class="sec-det-box"><h4>NP — Aberto</h4><div class="sec-det-num">' + s.npAberto + '</div><div class="sec-det-sub">tarefas não programadas abertas</div></div>'
        + '</div></div></td></tr>';
    }).join('');

    var secPainel = '<div class="painel sec-painel" id="sec-' + li + '">'
      + (seccoes.length > 0 ? '<table class="sec-table"><thead><tr><th>Secção</th><th>P aberto</th><th>NP aberto</th></tr></thead><tbody>' + secLinhas + '</tbody></table>' : '<div style="padding:12px 20px;font-size:13px;color:#aaa">Sem secções com tarefas abertas</div>')
      + '</div>';

    return '<div class="loja-bloco">'
      + '<div class="loja-linha">'
      + '<div class="cel-rank"><div class="rank-num">' + emoji + ' ' + (li + 1) + '</div><span class="nivel-badge ' + nc + '">Nível ' + l.nivel + '</span></div>'
      + '<div class="cel-loja"><div class="nome">' + l.loja + '</div><div class="local">' + (l.localidade || '—') + '</div></div>'
      + '<div class="cel-tarefas"><div class="tarefas-val">' + l.pAberto + '</div><div class="tarefas-sub">P abertas de ' + l.pTotal + '</div><div class="tarefas-np">NP: <b>' + l.npAberto + '</b></div></div>'
      + '<div class="cel-pct"><div class="pct-ab" style="color:' + corPct(l.pctPAberto) + '">' + l.pctPAberto + '%</div><div class="pct-lbl">P aberto</div><div class="pct-fech">' + l.pctPFechado + '%</div><div class="pct-lbl">P fechado</div></div>'
      + '<div class="cel-pct"><div class="pct-ab" style="color:' + corPct(l.pctNPAberto) + '">' + l.pctNPAberto + '%</div><div class="pct-lbl">NP aberto</div><div class="pct-fech">' + l.pctNPFechado + '%</div><div class="pct-lbl">NP fechado</div></div>'
      + '<div style="text-align:center"><button class="toggle-btn" id="btnhist-' + li + '" onclick="toggleHist(' + li + ')">▶ Histórico</button></div>'
      + '<div style="text-align:center"><button class="toggle-btn" id="btnsec-' + li + '" onclick="toggleSec(' + li + ')">▶ Secções</button><div style="font-size:11px;color:#aaa;margin-top:3px">' + seccoes.length + '</div></div>'
      + '</div>'
      + histPainel
      + secPainel
      + '</div>';
  }).join('');

  document.getElementById('app').innerHTML = legenda + '<div class="tabela-wrap">' + header + blocos + '</div>';
}
</script>
</body>
</html>
