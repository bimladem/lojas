<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.1.0/chartjs-plugin-datalabels.min.js"></script>
<style>
:root {
  --ink: #000000; /* Aumentado o contraste (mais escuro) */
  --ink-2: #1a1a1a;
  --ink-3: #333333;
  --ink-4: #555555;
  --paper: #ffffff; /* Aumentado o contraste (fundo branco puro) */
  --paper-2: #f8f9fa;
  --paper-3: #f1f3f5;
  --line: #d1d1d1; /* Linhas mais visíveis para contraste */
  --line-2: #b1b1b1;
  --n1: #d00000; --n1-bg: #fff0f0;
  --n2: #c06000; --n2-bg: #fff4e0;
  --n3: #008000; --n3-bg: #e0ffe0;
  --bar-blue: #2b2fd8;
  --bar-orange: #d8722a;
  --bar-track: #e4e4e8;
  --btn-border: #b1b1b1;
  --btn-text: #222;
  --shadow: 0 1px 6px rgba(0,0,0,.1), 0 2px 16px rgba(0,0,0,.08);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  font-size: 16px; /* Aumentado o tamanho das letras em geral (era 14px) */
  -webkit-font-smoothing: antialiased;
}

/* soften all pure-white surfaces to warm off-white */
.loja-card, .home-table, .stat-card, .level-legend,
.chart-wrap, .sec-card, .legend-bar { background: #ffffff; border: 1px solid var(--line); }
.btn-card, .btn-detail, .filter-btn { background: #fdfdfd; }
.ht-head, .dtable th, .sec-card-head { background: #f1f3f5; }
.col-rank { background: #f1f3f5; }
.panel-body { background: #f8f9fa; }
.ht-row:hover { background: #f1f3f5 !important; }
.ht-row.new-loja { background: #f0faf4; }
.ht-row.new-loja:hover { background: #e6f7ed !important; }
.dtable tbody tr:hover td { background: #f1f3f5; }

/* ── HEADER ── */
.header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(255,255,255,.98);
  backdrop-filter: blur(16px);
  border-bottom: 2px solid var(--line);
  padding: 0 32px;
  height: 70px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-icon {
  width: 40px; height: 40px; border-radius: 9px;
  background: #000;
  display: flex; align-items: center; justify-content: center;
}
.header-icon svg { width: 20px; height: 20px; fill: #fff; }
.header-title { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--ink); letter-spacing: -0.2px; white-space: nowrap; }
.header-subtitle { font-size: 13px; color: var(--ink-4); margin-top: 1px; }
.header-badge {
  padding: 6px 16px; border-radius: 99px;
  background: #f1f3f5; border: 1px solid var(--line-2);
  font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
}

/* ── MAIN ── */
.main { max-width: 1400px; margin: 0 auto; padding: 28px 24px 64px; }

/* ── LEGEND BAR ── */
.legend-bar {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 12px 20px;
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  font-size: 14px; color: var(--ink-2);
}
.legend-item { display: flex; align-items: center; gap: 7px; }
.legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.legend-label { font-weight: 700; color: var(--ink); }
.legend-sep { width: 1px; height: 18px; background: var(--line-2); }

/* ── CARD LIST ── */
.card-list { display: flex; flex-direction: column; gap: 0; }

/* ── LOJA CARD ── */
.loja-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: box-shadow 0.15s;
}
.loja-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.12); }

.card-main {
  display: grid;
  grid-template-columns: 64px 240px 1fr auto;
  align-items: center;
  padding: 0;
  min-height: 100px;
  gap: 0;
}

/* rank column */
.col-rank {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 10px;
  border-right: 1px solid var(--line);
  align-self: stretch;
  background: #f8f9fa;
  gap: 6px;
  text-align: center;
}
.rank-num {
  font-family: 'DM Serif Display', serif;
  font-size: 32px; line-height: 1;
  color: var(--ink);
}
.rank-pill {
  padding: 4px 12px; border-radius: 99px;
  font-size: 13px; font-weight: 800; letter-spacing: 0.3px;
  text-align: center;
}
.pill-n1 { background: var(--n1-bg); color: var(--n1); border: 1px solid var(--n1); }
.pill-n2 { background: var(--n2-bg); color: var(--n2); border: 1px solid var(--n2); }
.pill-n3 { background: var(--n3-bg); color: var(--n3); border: 1px solid var(--n3); }

/* identity column */
.col-id {
  padding: 20px 24px;
  border-right: 1px solid var(--line);
  align-self: stretch;
  display: flex; flex-direction: column; justify-content: center;
}
.loja-nome { font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.loja-code { font-size: 14px; color: var(--ink-3); margin-top: 4px; font-weight: 500; }

/* metrics column */
.col-metrics {
  display: flex; align-items: stretch;
  border-right: 1px solid var(--line);
  align-self: stretch;
}
.metric-group {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px 20px;
  border-right: 1px solid var(--line);
  min-width: 100px;
  flex: 1;
  gap: 4px;
}
.metric-group:last-child { border-right: none; }
.metric-group.is-total {
  background: #f0f2fb;
}
.metric-group.is-total .mg-val { color: var(--bar-blue); }
.metric-group.is-total-np {
  background: #fdf3eb;
}
.metric-group.is-total-np .mg-val { color: var(--bar-orange); }

/* bold separator between P group and NP group */
.col-metrics-sep {
  width: 2px;
  background: var(--line-2);
  align-self: stretch;
  flex-shrink: 0;
}

.metric-group-sep {
  width: 1px; background: var(--line); align-self: stretch; flex-shrink: 0;
  margin: 0 0;
}
.mg-label {
  font-size: 12px; font-weight: 800; letter-spacing: 0.5px;
  text-transform: uppercase; color: var(--ink-2); white-space: nowrap;
  margin-bottom: 3px;
}
.mg-val { font-size: 26px; font-weight: 700; color: var(--ink); line-height: 1; }
.mg-sub { font-size: 14px; color: var(--ink-3); margin-top: 2px; font-weight: 500; }

/* progress + actions column */
.col-right {
  display: flex; align-items: center;
  padding: 14px 24px;
  gap: 24px;
  align-self: stretch;
  min-width: 400px;
}

.progress-block { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.progress-row { display: flex; flex-direction: column; gap: 6px; }
.progress-label-row {
  display: flex; justify-content: space-between; align-items: center;
}
.prog-label { font-size: 11px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-3); }
.prog-pct { font-size: 14px; font-weight: 800; color: var(--ink); }
.prog-track {
  height: 8px; border-radius: 99px; background: var(--bar-track);
  overflow: hidden;
}
.prog-fill {
  height: 100%; border-radius: 99px;
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
}
.fill-blue { background: var(--bar-blue); }
.fill-orange { background: var(--bar-orange); }

.actions-col { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
.btn-card {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px;
  border: 1px solid var(--btn-border);
  border-radius: 8px;
  background: #fff;
  color: var(--btn-text);
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  white-space: nowrap;
  transition: all 0.15s;
  min-width: 120px; justify-content: flex-start;
}
.btn-card:hover { background: #f1f3f5; border-color: #888; }
.btn-card.active { background: #000; border-color: #000; color: #fff; }
.btn-card svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.8; }
.btn-card.active svg { opacity: 1; }

/* ── PANEL ── */
.panel { display: none; }
.panel.open { display: block; }
.panel-body {
  padding: 24px 32px;
  border-top: 1px solid var(--line);
  background: #f8f9fa;
}
.panel-title {
  font-family: 'DM Serif Display', serif;
  font-size: 18px; font-weight: 400; color: var(--ink);
  margin-bottom: 16px; padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

/* ── CHARTS & TABLES ── */
.chart-wrap {
  position: relative; width: 100%; background: #fff;
  border: 1px solid var(--line); border-radius: 12px;
  padding: 24px; margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.dtable {
  width: 100%; border-collapse: collapse;
  background: #fff; border: 1px solid var(--line);
  border-radius: 12px; overflow: hidden; font-size: 15px;
  box-shadow: var(--shadow);
}
.dtable th {
  padding: 14px 20px; background: #f1f3f5;
  border-bottom: 2px solid var(--line);
  font-size: 13px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--ink); text-align: center;
}
.dtable td {
  padding: 14px 20px; border-bottom: 1px solid var(--line);
  text-align: center; color: var(--ink); font-weight: 600;
}
.dtable tr:last-child td { border-bottom: none; }
.dtable tbody tr:hover td { background: #f1f3f5; }

.sec-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px; margin-top: 16px;
}
.sec-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
.sec-card-head { padding: 12px 16px; background: #f1f3f5; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 700; color: var(--ink); }
.sec-card-body { padding: 14px 16px; }

/* ── BOTTOM ── */
.bottom-bar { margin-top: 24px; display: flex; gap: 16px; flex-wrap: wrap; }
.level-legend {
  flex: 1; min-width: 280px; background: #fff;
  border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; box-shadow: var(--shadow);
}
.level-legend-title { font-size: 12px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }
.level-items { display: flex; gap: 20px; flex-wrap: wrap; }
.level-item { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink); font-weight: 500; }
.level-dot { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0; }
.action-banner {
  flex: 2; min-width: 300px; background: #fff5f0; border: 1px solid #eec0a0;
  border-radius: 12px; padding: 20px 24px; display: flex; align-items: center; gap: 16px;
}
.action-icon { width: 42px; height: 42px; border-radius: 9px; background: #d8722a; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; color: #fff; }
.action-title { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.action-desc { font-size: 14px; color: var(--ink-2); line-height: 1.5; font-weight: 500; }

/* ── HOME SCREEN ── */
.home-screen, .detail-screen { display: none; }
.home-screen.active, .detail-screen.active { display: block; }

/* back button in header */
.btn-back {
  display: none; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: 7px;
  border: 1px solid var(--line-2); background: var(--paper-3);
  font-size: 14px; font-weight: 600; color: var(--ink);
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.btn-back:hover { border-color: var(--ink); background: var(--paper-2); }
.btn-back.visible { display: flex; }
.btn-back svg { width: 16px; height: 16px; }

/* stat cards row */
.home-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.stat-card {
  background: #fff; border: 1px solid var(--line);
  border-radius: 14px; padding: 24px 20px 20px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 8px;
  align-items: center; text-align: center;
}
.stat-card-label {
  font-size: 13px; font-weight: 800; letter-spacing: 0.7px;
  text-transform: uppercase; color: var(--ink-3);
}
.stat-card-val {
  font-family: 'DM Serif Display', serif;
  font-size: 48px; line-height: 1; color: var(--ink);
}
.stat-card-sub { font-size: 14px; color: var(--ink-3); margin-top: 2px; font-weight: 500; }
.stat-card.accent-red   .stat-card-val { color: var(--n1); }
.stat-card.accent-amber .stat-card-val { color: var(--n2); }
.stat-card.accent-green .stat-card-val { color: var(--n3); }
.stat-card.accent-blue  .stat-card-val { color: var(--bar-blue); }

/* filter bar */
.filter-bar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 20px; flex-wrap: wrap;
}
.filter-label { font-size: 15px; color: var(--ink); font-weight: 700; margin-right: 6px; }
.filter-btn {
  padding: 8px 20px; border-radius: 99px;
  border: 1px solid var(--line-2); background: #fff;
  font-size: 14px; font-weight: 600; color: var(--ink-2);
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all 0.15s; white-space: nowrap;
}
.filter-btn:hover { border-color: var(--ink); color: var(--ink); }
.filter-btn.active {
  background: #000; border-color: #000; color: #fff;
}
.filter-divider { width: 1px; height: 24px; background: var(--line-2); }

/* summary table */
.home-table {
  background: #fff; border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
}
.ht-head {
  display: grid;
  /* Ajustado para acomodar títulos maiores e manter Comparação P vs NP em uma linha */
  grid-template-columns: 80px 240px 1fr 1fr 180px 120px 140px;
  background: #f1f3f5; border-bottom: 2px solid var(--line);
}
.ht-th {
  padding: 16px 12px; font-size: 14px; font-weight: 800; /* Títulos destacados e maiores */
  letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink);
  text-align: center; border-right: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  white-space: nowrap; /* Garante que fiquem na mesma linha */
}
.ht-th:last-child { border-right: none; }
.ht-th.left { justify-content: flex-start; text-align: left; padding-left: 20px; }

.ht-row {
  display: grid;
  grid-template-columns: 80px 240px 1fr 1fr 180px 120px 140px;
  border-bottom: 1px solid var(--line);
  transition: background 0.12s;
  cursor: pointer;
}
.ht-row:last-child { border-bottom: none; }
.ht-row:hover { background: #f8f9fa; }
.ht-row.new-loja { background: #f6fef9; }
.ht-row.new-loja:hover { background: #edfaf2; }

.ht-td {
  padding: 18px 12px; display: flex; align-items: center;
  justify-content: center; border-right: 1px solid var(--line);
  font-size: 16px; font-weight: 600; color: var(--ink);
}
.ht-td:last-child { border-right: none; }
.ht-td.left { justify-content: flex-start; text-align: left; padding-left: 20px; }

.rank-td { background: #f1f3f5; }
.new-badge {
  background: #e6f4ea; color: #1e7e34; border: 1px solid #1e7e34;
  padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 800;
}

.mini-prog { flex: 1; display: flex; flex-direction: column; gap: 8px; width: 100%; }
.mini-row { display: flex; align-items: center; gap: 8px; }
.mini-track { flex: 1; height: 8px; background: var(--bar-track); border-radius: 99px; overflow: hidden; }
.mini-fill { height: 100%; border-radius: 99px; }
.mini-pct { font-size: 13px; font-weight: 800; min-width: 38px; text-align: right; }

.btn-detail {
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2);
  background: #fff; font-size: 13px; font-weight: 700; color: var(--ink-2);
  cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s;
}
.btn-detail:hover { background: #000; color: #fff; border-color: #000; }
.btn-detail svg { width: 14px; height: 14px; }

.loading { padding: 60px; text-align: center; font-size: 18px; font-weight: 600; color: var(--ink-3); }

/* ── MOBILE ── */
@media (max-width: 1024px) {
  .ht-head, .ht-row { grid-template-columns: 60px 180px 1fr 1fr 140px 100px 110px; }
  .ht-th, .ht-td { font-size: 13px; padding: 12px 8px; }
  .loja-nome { font-size: 16px; }
  .mg-val { font-size: 22px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <button class="btn-back" id="btn-back" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Voltar
    </button>
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="13" width="4" height="8" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="5" width="4" height="16" rx="1"/></svg>
    </div>
    <div>
      <div class="header-title" id="header-title">Análise Semanal IM</div>
      <div class="header-subtitle" id="sub-info">A carregar…</div>
    </div>
  </div>
  <div class="header-badge" id="periodo">—</div>
</header>

<main class="main">
  <div id="home-screen" class="home-screen">
    <div class="loading">A carregar dados…</div>
  </div>
  <div id="detail-screen" class="detail-screen">
    <div id="app"></div>
  </div>
</main>

<script>
var charts = {};
var stateH = {}, stateS = {};
var _lojas = [], _ultima = '';
var _activeFilter = 'all';

/* ── Navigation ── */
function goHome() {
  document.getElementById('home-screen').classList.add('active');
  document.getElementById('detail-screen').classList.remove('active');
  document.getElementById('btn-back').classList.remove('visible');
  document.getElementById('header-title').textContent = 'Análise Semanal IM';
  document.getElementById('sub-info').textContent = _lojas.length + ' lojas · ' + _ultima;
}

function goDetail(lojaIdx) {
  document.getElementById('home-screen').classList.remove('active');
  document.getElementById('detail-screen').classList.add('active');
  document.getElementById('btn-back').classList.add('visible');
  var l = _lojas[lojaIdx];
  document.getElementById('header-title').textContent = (l.local || l.loja) + ' · ' + l.loja;
  document.getElementById('sub-info').textContent = 'Detalhe da loja · ' + _ultima;
  // render detail if not yet rendered
  if (!document.getElementById('ph-' + lojaIdx)) {
    renderDetail(_lojas, lojaIdx);
  }
  window.scrollTo(0, 0);
}

/* ── SVG helpers ── */
function svgClock() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
}
function svgFolder() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
}
function svgArrow() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
}

function toggleH(li) {
  stateH[li] = !stateH[li];
  var p = document.getElementById('ph-' + li);
  var b = document.getElementById('bh-' + li);
  if (p) p.classList.toggle('open', stateH[li]);
  if (b) { b.classList.toggle('active', stateH[li]); b.innerHTML = svgClock() + (stateH[li] ? 'Fechar' : 'Histórico'); }
  if (stateH[li]) setTimeout(function() { if (charts['pnp-' + li]) charts['pnp-' + li].resize(); }, 100);
}
function toggleS(li) {
  stateS[li] = !stateS[li];
  var p = document.getElementById('ps-' + li);
  var b = document.getElementById('bs-' + li);
  if (p) p.classList.toggle('open', stateS[li]);
  if (b) { b.classList.toggle('active', stateS[li]); b.innerHTML = svgFolder() + (stateS[li] ? 'Fechar' : 'Secções'); }
}

function setFilter(f) {
  _activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderHomeTable(_lojas);
}

fetch('dados.json?t=' + Date.now())
  .then(function(r) { return r.json(); })
  .then(function(json) {
    var data = json.data || [];
    var semanas = [];
    data.forEach(function(i) { var s = String(i.Semana||'').trim(); if (s && semanas.indexOf(s)===-1) semanas.push(s); });
    var ultima = semanas[semanas.length - 1] || '';
    var penultima = semanas[semanas.length - 2] || null;
    _ultima = ultima;

    /* IDs present in penultimate week (to detect new stores) */
    var idsPenultima = {};
    if (penultima) {
      data.filter(function(i) { return i.Loja && !i.Secção && String(i.Semana||'').trim() === penultima; })
        .forEach(function(i) { idsPenultima[String(i.Loja).trim()] = true; });
    }

    var lojas = data.filter(function(i) { return i.Loja && !i.Secção && String(i.Semana||'').trim() === ultima; })
      .map(function(i) {
        var pT=Number(i['P Total'])||0, pA=Number(i['P Aberto'])||0, pF=Number(i['P Fechado'])||0;
        var nT=Number(i['NP Total'])||0, nA=Number(i['NP Aberto'])||0, nF=Number(i['NP Fechado'])||0;
        var pctPF=pT>0?(pF/pT*100):0, pctNF=nT>0?(nF/nT*100):0;
        var nivel=pctPF>=41?3:pctPF>=21?2:1;
        var loc=String(i['Resumo contactos.Localidade']||i['IM.Localidade']||'').trim();
        var lojaId = String(i.Loja).trim();
        return { loja:lojaId, local:loc, pT:pT,pA:pA,pF:pF,nT:nT,nA:nA,nF:nF,
          pctPF:pctPF.toFixed(1), pctNF:pctNF.toFixed(1),
          pctPFInt:Math.round(pctPF), pctNFInt:Math.round(pctNF),
          nivel:nivel, historico:[], seccoes:[],
          isNew: penultima ? !idsPenultima[lojaId] : false
        };
      });

    lojas.sort(function(a,b) { return a.nivel!==b.nivel ? a.nivel-b.nivel : Number(a.pctPF)-Number(b.pctPF); });

    var ids = {};
    lojas.forEach(function(l) { ids[l.loja]=true; });

    var histMap = {};
    data.forEach(function(i) {
      if (i.Loja && !i.Secção && ids[String(i.Loja).trim()]) {
        var id=String(i.Loja).trim();
        if (!histMap[id]) histMap[id]=[];
        histMap[id].push(i);
      }
    });
    lojas.forEach(function(l) { l.historico=(histMap[l.loja]||[]).slice(-8); });

    data.forEach(function(i) {
      if (!i.Secção) return;
      var m=String(i.Secção).trim().match(/^(IM \d+)\s+(.+)$/);
      if (!m) return;
      var nome=m[2].trim();
      if (nome.toLowerCase()==='admin') return;
      if (!ids[m[1].trim()]) return;
      var loja=lojas.find(function(l){ return l.loja===m[1].trim(); });
      if (!loja) return;
      var pT=Number(i['Programadas Total'])||0, pF=Number(i['Programadas Fechadas'])||0;
      var nT=Number(i['Não Programadas Total'])||0, nF=Number(i['Não Programadas Fechadas'])||0;
      loja.seccoes.push({nome:nome, pT:pT,pA:pT-pF,pF:pF, nT:nT,nA:nT-nF,nF:nF});
    });
    lojas.forEach(function(l) { l.seccoes.sort(function(a,b){ return b.pA-a.pA; }); });

    _lojas = lojas;

    document.getElementById('sub-info').textContent = lojas.length + ' lojas · ' + ultima;
    document.getElementById('periodo').textContent = '📅 ' + ultima;

    renderHome(lojas, ultima, penultima);
  })
  .catch(function(e) {
    document.getElementById('home-screen').innerHTML = '<div class="loading" style="color:#b83232">Erro ao carregar: ' + e.message + '</div>';
  });

/* ── HOME RENDER ── */
function renderHome(lojas, ultima, penultima) {
  var n1 = lojas.filter(function(l){ return l.nivel===1; }).length;
  var n2 = lojas.filter(function(l){ return l.nivel===2; }).length;
  var n3 = lojas.filter(function(l){ return l.nivel===3; }).length;
  var novas = lojas.filter(function(l){ return l.isNew; }).length;
  var totalPT = lojas.reduce(function(s,l){ return s+l.pT; },0);
  var totalPF = lojas.reduce(function(s,l){ return s+l.pF; },0);
  var pctGlobal = totalPT>0 ? Math.round(totalPF/totalPT*100) : 0;

  var html = '';

  /* Stats row */
  html += '<div class="home-stats">';
  html += statCard('Total de Lojas', lojas.length, penultima ? 'Esta semana' : 'Todas as lojas', '');
  html += statCard('Nível 1 — Crítico', n1, '0–20% prog. fechadas', 'accent-red');
  html += statCard('Nível 2 — Atenção', n2, '21–40% prog. fechadas', 'accent-amber');
  html += statCard('Nível 3 — OK', n3, '41%+ prog. fechadas', 'accent-green');
  if (penultima) {
    html += statCard('Entradas Novas', novas, 'Não presentes em '+penultima, novas>0?'accent-blue':'');
  }
  html += '</div>';

  /* Filter bar */
  var newCount = lojas.filter(function(l){ return l.isNew; }).length;
  var oldCount = lojas.length - newCount;
  html += '<div class="filter-bar">';
  html += '<span class="filter-label">Mostrar:</span>';
  html += '<button class="filter-btn active" data-filter="all" onclick="setFilter(\'all\')">Todas ('+lojas.length+')</button>';
  html += '<button class="filter-btn" data-filter="old" onclick="setFilter(\'old\')">Lojas Anteriores ('+oldCount+')</button>';
  if (newCount > 0) {
    html += '<button class="filter-btn" data-filter="new" onclick="setFilter(\'new\')">Entradas Novas ('+newCount+')</button>';
  }
  html += '<div class="filter-divider"></div>';
  html += '<button class="filter-btn" data-filter="n1" onclick="setFilter(\'n1\')">🔴 N1 ('+n1+')</button>';
  html += '<button class="filter-btn" data-filter="n2" onclick="setFilter(\'n2\')">🟠 N2 ('+n2+')</button>';
  html += '<button class="filter-btn" data-filter="n3" onclick="setFilter(\'n3\')">🟢 N3 ('+n3+')</button>';
  html += '</div>';

  /* Table shell — rows injected by renderHomeTable */
  html += '<div class="home-table">';
  html += '<div class="ht-head">';
  html += '<div class="ht-th">#</div>';
  html += '<div class="ht-th left">Loja</div>';
  html += '<div class="ht-th">P Tarefas</div>';
  html += '<div class="ht-th">NP Tarefas</div>';
  html += '<div class="ht-th">Comparação P vs NP</div>';
  html += '<div class="ht-th">Estado</div>';
  html += '<div class="ht-th">Detalhe</div>';
  html += '</div>';
  html += '<div id="ht-body"></div>';
  html += '</div>';

  /* Bottom legend */
  html += '<div class="bottom-bar" style="margin-top:20px">';
  html += '<div class="level-legend"><div class="level-legend-title">Classificação de Nível</div><div class="level-items">';
  html += '<div class="level-item"><div class="level-dot pill-n1">N1</div><span>0–20% prog. fechadas — crítico</span></div>';
  html += '<div class="level-item"><div class="level-dot pill-n2">N2</div><span>21–40% fechadas — atenção</span></div>';
  html += '<div class="level-item"><div class="level-dot pill-n3">N3</div><span>41%+ fechadas — satisfatório</span></div>';
  html += '</div></div>';
  html += '<div class="action-banner"><div class="action-icon">⚠</div><div><div class="action-title">Ação Recomendada</div><div class="action-desc">Contactar urgentemente responsáveis das lojas N1. Clique em "Detalhe" para ver o histórico e secções.</div></div></div>';
  html += '</div>';

  document.getElementById('home-screen').innerHTML = html;
  document.getElementById('home-screen').classList.add('active');
  renderHomeTable(lojas);
}

function statCard(label, val, sub, accent) {
  return '<div class="stat-card '+(accent||'')+'">'
    +'<div class="stat-card-label">'+label+'</div>'
    +'<div class="stat-card-val">'+val+'</div>'
    +'<div class="stat-card-sub">'+sub+'</div>'
    +'</div>';
}

function renderHomeTable(lojas) {
  var f = _activeFilter;
  var filtered = lojas.filter(function(l) {
    if (f === 'new') return l.isNew;
    if (f === 'old') return !l.isNew;
    if (f === 'n1')  return l.nivel === 1;
    if (f === 'n2')  return l.nivel === 2;
    if (f === 'n3')  return l.nivel === 3;
    return true;
  });

  var html = '';
  if (filtered.length === 0) {
    html = '<div style="padding:32px;text-align:center;color:var(--ink-4);font-size:15px">Sem lojas para este filtro.</div>';
  } else {
    filtered.forEach(function(l) {
      var li = lojas.indexOf(l); /* real index for detail navigation */
      var pc = pillCls(l.nivel);
      html += '<div class="ht-row'+(l.isNew?' new-loja':'')+'" onclick="goDetail('+li+')">';

      /* rank */
      html += '<div class="ht-td rank-td" style="flex-direction:column;gap:6px;align-items:center;justify-content:center;background:#f1f3f5">';
      html += '<div style="font-family:\'DM Serif Display\',serif;font-size:30px;font-weight:400;color:var(--ink);line-height:1">'+(li+1)+'</div>';
      html += '<div class="rank-pill '+pc+'" style="font-size:13px;padding:4px 12px">N'+l.nivel+'</div>';
      html += '</div>';

      /* identity */
      html += '<div class="ht-td left id-td" style="flex-direction:column;align-items:flex-start;gap:3px">';
      html += '<div style="font-weight:700;font-size:18px">'+(l.local||l.loja)+'</div>';
      html += '<div style="font-size:14px;color:var(--ink-3)">'+l.loja+'</div>';
      html += '</div>';

      /* P metrics */
      html += '<div class="ht-td metrics-td" style="flex-direction:column;gap:4px">';
      html += '<div style="font-size:13px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;color:var(--ink-3)">Total '+fmt(l.pT)+'</div>';
      html += '<div style="font-size:14px;color:var(--ink-2);font-weight:500">'+fmt(l.pA)+' abertas · '+fmt(l.pF)+' fechadas</div>';
      html += '</div>';

      /* NP metrics */
      html += '<div class="ht-td" style="flex-direction:column;gap:4px">';
      html += '<div style="font-size:13px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;color:var(--ink-3)">Total '+fmt(l.nT)+'</div>';
      html += '<div style="font-size:14px;color:var(--ink-2);font-weight:500">'+fmt(l.nA)+' abertas · '+fmt(l.nF)+' fechadas</div>';
      html += '</div>';

      /* progress */
      html += '<div class="ht-td prog-td"><div class="mini-prog">';
      html += '<div class="mini-row">'
        +'<span style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-3);min-width:26px">P</span>'
        +'<div class="mini-track"><div class="mini-fill fill-blue" style="width:'+l.pctPFInt+'%"></div></div>'
        +'<span class="mini-pct" style="color:var(--bar-blue)">'+l.pctPFInt+'%</span>'
        +'</div>';
      html += '<div class="mini-row">'
        +'<span style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-3);min-width:26px">NP</span>'
        +'<div class="mini-track"><div class="mini-fill fill-orange" style="width:'+l.pctNFInt+'%"></div></div>'
        +'<span class="mini-pct" style="color:var(--bar-orange)">'+l.pctNFInt+'%</span>'
        +'</div>';
      html += '</div></div>';

      /* new badge */
      html += '<div class="ht-td new-td">';
      if (l.isNew) html += '<span class="new-badge">✦ Nova</span>';
      html += '</div>';

      /* detail button */
      html += '<div class="ht-td act-td" onclick="event.stopPropagation()">';
      html += '<button class="btn-detail" onclick="goDetail('+li+')">Detalhe '+svgArrow()+'</button>';
      html += '</div>';

      html += '</div>';
    });
  }
  document.getElementById('ht-body').innerHTML = html;
}

function renderDetail(lojas, li) {
  var l = lojas[li];
  var app = document.getElementById('app');
  var html = '';

  /* Main Card Info */
  html += '<div class="loja-card" style="margin-bottom:24px">';
  html += '<div class="card-main">';
  html += '<div class="col-rank"><div class="rank-num">'+(li+1)+'</div><div class="rank-pill '+pillCls(l.nivel)+'">N'+l.nivel+'</div></div>';
  html += '<div class="col-id"><div class="loja-nome">'+(l.local||l.loja)+'</div><div class="loja-code">'+l.loja+'</div></div>';
  html += '<div class="col-metrics">';
  html += '<div class="metric-group is-total"><div class="mg-label">P Total</div><div class="mg-val">'+fmt(l.pT)+'</div><div class="mg-sub">'+fmt(l.pF)+' fechadas</div></div>';
  html += '<div class="metric-group"><div class="mg-label">P Aberto</div><div class="mg-val">'+fmt(l.pA)+'</div><div class="mg-sub">'+l.pctPF+'% concluído</div></div>';
  html += '<div class="col-metrics-sep"></div>';
  html += '<div class="metric-group is-total-np"><div class="mg-label">NP Total</div><div class="mg-val">'+fmt(l.nT)+'</div><div class="mg-sub">'+fmt(l.nF)+' fechadas</div></div>';
  html += '<div class="metric-group"><div class="mg-label">NP Aberto</div><div class="mg-val">'+fmt(l.nA)+'</div><div class="mg-sub">'+l.pctNF+'% concluído</div></div>';
  html += '</div>';
  html += '<div class="col-right"><div class="progress-block">';
  html += '<div class="progress-row"><div class="progress-label-row"><span class="prog-label">Progresso P</span><span class="prog-pct">'+l.pctPF+'%</span></div><div class="prog-track"><div class="prog-fill fill-blue" style="width:'+l.pctPF+'%"></div></div></div>';
  html += '<div class="progress-row"><div class="progress-label-row"><span class="prog-label">Progresso NP</span><span class="prog-pct">'+l.pctNF+'%</span></div><div class="prog-track"><div class="prog-fill fill-orange" style="width:'+l.pctNF+'%"></div></div></div>';
  html += '</div></div>';
  html += '</div></div>';

  /* Sections & History Buttons */
  html += '<div style="display:flex;gap:12px;margin-bottom:24px">';
  html += '<button id="bs-'+li+'" class="btn-card active" onclick="toggleS('+li+')">'+svgFolder()+' Secções</button>';
  html += '<button id="bh-'+li+'" class="btn-card" onclick="toggleH('+li+')">'+svgClock()+' Histórico</button>';
  html += '</div>';

  /* Sections Panel */
  html += '<div id="ps-'+li+'" class="panel open"><div class="panel-body">';
  html += '<div class="panel-title">Distribuição por Secção</div>';
  if (!l.seccoes || l.seccoes.length===0) {
    html += '<div style="padding:20px;text-align:center;color:var(--ink-4)">Sem dados de secções disponíveis.</div>';
  } else {
    html += '<div class="sec-grid">';
    l.seccoes.forEach(function(s) {
      var pPct = s.pT>0?Math.round(s.pF/s.pT*100):0;
      var nPct = s.nT>0?Math.round(s.nF/s.nT*100):0;
      html += '<div class="sec-card"><div class="sec-card-head">'+s.nome+'</div><div class="sec-card-body">';
      html += '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:4px"><span>P: '+s.pF+'/'+s.pT+'</span><span>'+pPct+'%</span></div><div class="prog-track" style="height:4px"><div class="prog-fill fill-blue" style="width:'+pPct+'%"></div></div></div>';
      html += '<div><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:4px"><span>NP: '+s.nF+'/'+s.nT+'</span><span>'+nPct+'%</span></div><div class="prog-track" style="height:4px"><div class="prog-fill fill-orange" style="width:'+nPct+'%"></div></div></div>';
      html += '</div></div>';
    });
    html += '</div>';
  }
  html += '</div></div>';

  /* History Panel */
  html += '<div id="ph-'+li+'" class="panel"><div class="panel-body">';
  html += '<div class="panel-title">Evolução Semanal (P vs NP)</div>';
  html += '<div class="chart-wrap"><canvas id="pnp-'+li+'" height="120"></canvas></div>';
  html += '<table class="dtable"><thead><tr><th>Semana</th><th>P Total</th><th>P Aberto</th><th>P Fechado</th><th>% P</th><th>NP Total</th><th>NP Aberto</th><th>NP Fechado</th><th>% NP</th></tr></thead><tbody>';
  l.historico.forEach(function(h) {
    var pT=Number(h['P Total'])||0, pA=Number(h['P Aberto'])||0, pF=Number(h['P Fechado'])||0;
    var nT=Number(h['NP Total'])||0, nA=Number(h['NP Aberto'])||0, nF=Number(h['NP Fechado'])||0;
    var pP=pT>0?Math.round(pF/pT*100):0, nP=nT>0?Math.round(nF/nT*100):0;
    html += '<tr><td>'+h.Semana+'</td><td>'+pT+'</td><td>'+pA+'</td><td>'+pF+'</td><td>'+pP+'%</td><td>'+nT+'</td><td>'+nA+'</td><td>'+nF+'</td><td>'+nP+'%</td></tr>';
  });
  html += '</tbody></table>';
  html += '</div></div>';

  app.innerHTML = html;

  /* Init Chart */
  setTimeout(function() {
    var ctx = document.getElementById('pnp-'+li).getContext('2d');
    var labels = l.historico.map(function(h){ return h.Semana; });
    var pData = l.historico.map(function(h){ var t=Number(h['P Total'])||0; return t>0?Math.round((Number(h['P Fechado'])||0)/t*100):0; });
    var nData = l.historico.map(function(h){ var t=Number(h['NP Total'])||0; return t>0?Math.round((Number(h['NP Fechado'])||0)/t*100):0; });

    charts['pnp-'+li] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: '% P Fechado', data: pData, borderColor: '#3b3fd8', backgroundColor: '#3b3fd822', tension: 0.3, fill: true, pointRadius: 4 },
          { label: '% NP Fechado', data: nData, borderColor: '#e8924a', backgroundColor: '#e8924a22', tension: 0.3, fill: true, pointRadius: 4 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { font: { family: 'DM Sans', size: 12, weight: '600' } } } },
        scales: {
          y: { min: 0, max: 100, ticks: { callback: function(v){ return v+'%'; }, font: { size: 11 } } },
          x: { ticks: { font: { size: 11 } } }
        }
      }
    });
  }, 50);
}

function pillCls(n) { return n===1?'pill-n1':n===2?'pill-n2':'pill-n3'; }

function fmt(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}
