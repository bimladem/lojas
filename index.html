<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg-primary:#ffffff;
  --bg-secondary:#f8f9fa;
  --border:rgba(0,0,0,0.08);
  --border-hover:rgba(0,0,0,0.15);
  --text-primary:#1a1a1a;
  --text-secondary:#4a4a4a;
  --text-tertiary:#808080;
  --accent-purple:#8b5cf6;
  --accent-pink:#ec4899;
  --success:#22c55e;
  --danger:#ef4444;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text-primary);
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--grad);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.header-title h1{
  font-size:22px;
  font-weight:700;
}

.sub{
  font-size:12px;
  color:var(--text-tertiary);
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);
  color:#8b5cf6;
  padding:8px 16px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
}

.main{
  max-width:1700px;
  margin:auto;
  padding:40px;
}

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.kpi-card{
  border:1px solid var(--border);
  border-radius:14px;
  padding:24px;
}

.kpi-label{
  font-size:12px;
  text-transform:uppercase;
  color:var(--text-tertiary);
  font-weight:700;
  margin-bottom:12px;
}

.kpi-value{
  font-size:34px;
  font-weight:800;
}

.kpi-sublabel{
  margin-top:8px;
  font-size:12px;
  color:var(--text-tertiary);
}

.table-container{
  width:100%;
}

.table-header{
  display:grid;
  grid-template-columns:.8fr 1fr 2.5fr .7fr .9fr;
  gap:20px;
  padding:18px 0;
  border-bottom:1px solid var(--border);
}

.th-cell{
  font-size:12px;
  text-transform:uppercase;
  font-weight:700;
  color:var(--text-tertiary);
}

.table-row{
  display:grid;
  grid-template-columns:.8fr 1fr 2.5fr .7fr .9fr;
  gap:20px;
  padding:24px 0;
  border-bottom:1px solid var(--border);
  align-items:center;
}

.cell-rank{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.rank-number{
  font-size:20px;
  font-weight:800;
}

.rank-badge{
  padding:3px 10px;
  border-radius:6px;
  font-size:10px;
  font-weight:700;
}

.badge-n1{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

.badge-n2{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

.badge-n3{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

.cell-loja{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.loja-nome{
  font-size:15px;
  font-weight:700;
}

.loja-local{
  font-size:13px;
  color:var(--text-tertiary);
}

.cell-summary{
  width:100%;
}

.tasks-panel{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.task-section-block{
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  background:#fafafa;
}

.task-section-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:18px;
}

.task-item{
  margin-bottom:18px;
}

.task-item:last-child{
  margin-bottom:0;
}

.task-item-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.task-item-label{
  font-size:14px;
  color:var(--text-secondary);
}

.task-item-values{
  display:flex;
  align-items:center;
  gap:10px;
}

.task-item-number{
  font-size:18px;
  font-weight:800;
}

.task-item-percent{
  font-size:14px;
  font-weight:700;
}

.task-bar{
  width:100%;
  height:7px;
  background:#d1d5db;
  border-radius:999px;
  overflow:hidden;
}

.task-bar-fill{
  height:100%;
  border-radius:999px;
}

.cell-trend{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.trend-up{
  color:#ef4444;
}

.trend-down{
  color:#22c55e;
}

.trend-none{
  color:#808080;
}

.cell-actions{
  display:flex;
  gap:10px;
}

.btn-action{
  border:1px solid rgba(139,92,246,.25);
  background:transparent;
  color:#8b5cf6;
  border-radius:8px;
  padding:8px 14px;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}

.btn-action:hover{
  background:rgba(139,92,246,.08);
}

.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  padding:24px;
  background:rgba(139,92,246,.04);
  border-bottom:1px solid var(--border);
}

.panel-title{
  margin-bottom:18px;
  font-size:14px;
  font-weight:700;
}

.detail-table{
  width:100%;
  border-collapse:collapse;
}

.detail-table th,
.detail-table td{
  padding:12px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

.current{
  background:rgba(139,92,246,.08);
}

.sections-panel{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.section-block{
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
}

.section-block-title{
  font-weight:700;
  cursor:pointer;
  margin-bottom:14px;
}

.section-details{
  display:none;
  flex-direction:column;
  gap:16px;
}

.section-details.visible{
  display:flex;
}

.section-category-title{
  font-size:11px;
  text-transform:uppercase;
  color:var(--text-tertiary);
  margin-bottom:10px;
  font-weight:700;
}

.section-metric{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.loading{
  padding:100px;
  text-align:center;
  color:#808080;
}

@media(max-width:1200px){

  .table-header,
  .table-row{
    grid-template-columns:1fr;
  }

  .tasks-panel{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header class="header">

  <div class="header-brand">
    <div class="header-logo">📊</div>

    <div class="header-title">
      <h1>Análise Semanal</h1>
      <div class="sub" id="sub-info">Carregando dados...</div>
    </div>
  </div>

  <div class="header-period" id="periodo">—</div>

</header>

<main class="main">

  <div id="app">
    <div class="loading">⏳ Carregando dados...</div>
  </div>

</main>

<script>

var stateHist = {};
var stateSec = {};

function toggleHist(li){

  var p = document.getElementById('hist-' + li);
  var b = document.getElementById('btnhist-' + li);

  stateHist[li] = !stateHist[li];

  p.classList.toggle('visible', stateHist[li]);
  b.classList.toggle('open', stateHist[li]);

}

function toggleSec(li){

  var p = document.getElementById('sec-' + li);
  var b = document.getElementById('btnsec-' + li);

  stateSec[li] = !stateSec[li];

  p.classList.toggle('visible', stateSec[li]);
  b.classList.toggle('open', stateSec[li]);

}

function toggleSecDet(id){

  document
    .getElementById('secdet-' + id)
    .classList
    .toggle('visible');

}

fetch('dados.json?t=' + Date.now())

.then(r => r.json())

.then(json => {

  var data = json.data || [];

  var semanas = [];

  data.forEach(i => {

    var s = String(i.Semana || '').trim();

    if(s && semanas.indexOf(s) === -1){
      semanas.push(s);
    }

  });

  var ultima = semanas[semanas.length - 1] || '';

  var lojas = data

  .filter(i => i.Loja && !i.Secção && String(i.Semana || '').trim() === ultima)

  .map(i => {

    var pT = Number(i['P Total']) || 0;
    var pA = Number(i['P Aberto']) || 0;
    var pF = Number(i['P Fechado']) || 0;

    var nT = Number(i['NP Total']) || 0;
    var nA = Number(i['NP Aberto']) || 0;
    var nF = Number(i['NP Fechado']) || 0;

    return {

      loja:String(i.Loja).trim(),
      local:String(i['Resumo contactos.Localidade'] || '').trim(),

      pA,pF,nA,nF,

      pctPA:pT > 0 ? ((pA/pT)*100).toFixed(1) : '0.0',
      pctPF:pT > 0 ? ((pF/pT)*100).toFixed(1) : '0.0',

      pctNA:nT > 0 ? ((nA/nT)*100).toFixed(1) : '0.0',
      pctNF:nT > 0 ? ((nF/nT)*100).toFixed(1) : '0.0',

      nivel:
        ((pT > 0 ? ((pA/pT)*100) : 0) <= 20) ? 1 :
        ((pT > 0 ? ((pA/pT)*100) : 0) <= 40) ? 2 : 3,

      historico:[],
      seccoes:[]

    };

  })

  .filter(l => l.pA > 0);

  lojas.sort((a,b) => b.pA - a.pA);

  var top = lojas.slice(0,10);

  var ids = {};

  top.forEach(l => ids[l.loja] = true);

  var hist = {};

  data.forEach(i => {

    if(!i.Secção && i.Loja && ids[String(i.Loja).trim()]){

      var id = String(i.Loja).trim();

      if(!hist[id]) hist[id] = [];

      hist[id].push({

        semana:String(i.Semana).trim(),

        pA:Number(i['P Aberto']) || 0,
        pF:Number(i['P Fechado']) || 0,
        nA:Number(i['NP Aberto']) || 0,
        nF:Number(i['NP Fechado']) || 0

      });

    }

  });

  top.forEach(l => {

    l.historico = (hist[l.loja] || []).slice(-8);

    var h = hist[l.loja] || [];

    var u = h.slice(-2);

    l.diff = u.length === 2 ? u[1].pA - u[0].pA : null;

  });

  data.forEach(i => {

    if(i.Secção && ids[String(i.Loja).trim()]){

      var loja = top.find(l => l.loja === String(i.Loja).trim());

      if(loja){

        loja.seccoes.push({

          nome:String(i.Secção).replace(/^IM\s+\d+\s+/,'').trim(),

          pA:Number(i['P Aberto']) || 0,
          pF:Number(i['P Fechado']) || 0,
          nA:Number(i['NP Aberto']) || 0,
          nF:Number(i['NP Fechado']) || 0,

          pctPA:Number(i['P Total']) > 0 ? ((Number(i['P Aberto']) / Number(i['P Total'])) * 100).toFixed(1) : '0.0',

          pctPF:Number(i['P Total']) > 0 ? ((Number(i['P Fechado']) / Number(i['P Total'])) * 100).toFixed(1) : '0.0',

          pctNA:Number(i['NP Total']) > 0 ? ((Number(i['NP Aberto']) / Number(i['NP Total'])) * 100).toFixed(1) : '0.0',

          pctNF:Number(i['NP Total']) > 0 ? ((Number(i['NP Fechado']) / Number(i['NP Total'])) * 100).toFixed(1) : '0.0'

        });

      }

    }

  });

  document.getElementById('sub-info').textContent =
    'Gerado hoje · ' + top.length + ' lojas';

  document.getElementById('periodo').textContent =
    '📅 ' + ultima;

  render(top,ultima);

})

.catch(() => {

  document.getElementById('app').innerHTML =
    '<div class="loading">Erro ao carregar dados</div>';

});

function render(lojas,ultima){

  var rows = '';

  lojas.forEach((l,li) => {

    var badge =
      l.nivel === 1 ? 'badge-n1' :
      l.nivel === 2 ? 'badge-n2' :
      'badge-n3';

    var diffIcon =
      l.diff === null ? '—' :
      l.diff > 0 ? '▲' :
      l.diff < 0 ? '▼' : '→';

    var diffClass =
      l.diff === null ? 'trend-none' :
      l.diff > 0 ? 'trend-up' :
      l.diff < 0 ? 'trend-down' :
      'trend-none';

    var histHtml = `
      <div class="panel-inner">

        <div class="panel-title">
          Evolução Semanal
        </div>

        <table class="detail-table">

          <thead>
            <tr>
              <th>Semana</th>
              <th>P Aberto</th>
              <th>P Fechado</th>
              <th>NP Aberto</th>
              <th>NP Fechado</th>
            </tr>
          </thead>

          <tbody>

            ${l.historico.map(h => `
              <tr>
                <td>${h.semana}</td>
                <td>${h.pA}</td>
                <td>${h.pF}</td>
                <td>${h.nA}</td>
                <td>${h.nF}</td>
              </tr>
            `).join('')}

          </tbody>

        </table>

      </div>
    `;

    var secHtml = `
      <div class="panel-inner">

        <div class="panel-title">
          Detalhes por Secção
        </div>

        <div class="sections-panel">

          ${l.seccoes.map((s,si) => {

            var id = li + '-' + si;

            return `
              <div class="section-block">

                <div class="section-block-title"
                     onclick="toggleSecDet('${id}')">

                  ${s.nome}

                </div>

                <div class="section-details"
                     id="secdet-${id}">

                  <div>

                    <div class="section-category-title">
                      Programadas
                    </div>

                    <div class="section-metric">
                      <span>Abertas</span>
                      <span>${s.pA} (${s.pctPA}%)</span>
                    </div>

                    <div class="section-metric">
                      <span>Fechadas</span>
                      <span>${s.pF} (${s.pctPF}%)</span>
                    </div>

                  </div>

                  <div>

                    <div class="section-category-title">
                      Não Programadas
                    </div>

                    <div class="section-metric">
                      <span>Abertas</span>
                      <span>${s.nA} (${s.pctNA}%)</span>
                    </div>

                    <div class="section-metric">
                      <span>Fechadas</span>
                      <span>${s.nF} (${s.pctNF}%)</span>
                    </div>

                  </div>

                </div>

              </div>
            `;

          }).join('')}

        </div>

      </div>
    `;

    rows += `

      <div class="table-row">

        <div class="cell-rank">

          <div>🔴</div>

          <div class="rank-number">
            ${li + 1}
          </div>

          <div class="rank-badge ${badge}">
            N${l.nivel}
          </div>

        </div>

        <div class="cell-loja">

          <div class="loja-nome">
            ${l.loja}
          </div>

          <div class="loja-local">
            ${l.local || '—'}
          </div>

        </div>

        <div class="cell-summary">

          <div class="tasks-panel">

            <div class="task-section-block">

              <div class="task-section-title">
                📋 Programadas
              </div>

              <div class="task-item">

                <div class="task-item-header">

                  <span class="task-item-label">
                    Abertas
                  </span>

                  <div class="task-item-values">

                    <span class="task-item-number">
                      ${l.pA}
                    </span>

                    <span class="task-item-percent">
                      ${l.pctPA}%
                    </span>

                  </div>

                </div>

                <div class="task-bar">

                  <div class="task-bar-fill"
                       style="background:#ef4444;width:${l.pctPA}%">

                  </div>

                </div>

              </div>

              <div class="task-item">

                <div class="task-item-header">

                  <span class="task-item-label">
                    Fechadas
                  </span>

                  <div class="task-item-values">

                    <span class="task-item-number">
                      ${l.pF}
                    </span>

                    <span class="task-item-percent">
                      ${l.pctPF}%
                    </span>

                  </div>

                </div>

                <div class="task-bar">

                  <div class="task-bar-fill"
                       style="background:#22c55e;width:${l.pctPF}%">

                  </div>

                </div>

              </div>

            </div>

            <div class="task-section-block">

              <div class="task-section-title">
                📋 Não Programadas
              </div>

              <div class="task-item">

                <div class="task-item-header">

                  <span class="task-item-label">
                    Abertas
                  </span>

                  <div class="task-item-values">

                    <span class="task-item-number">
                      ${l.nA}
                    </span>

                    <span class="task-item-percent">
                      ${l.pctNA}%
                    </span>

                  </div>

                </div>

                <div class="task-bar">

                  <div class="task-bar-fill"
                       style="background:#ef4444;width:${l.pctNA}%">

                  </div>

                </div>

              </div>

              <div class="task-item">

                <div class="task-item-header">

                  <span class="task-item-label">
                    Fechadas
                  </span>

                  <div class="task-item-values">

                    <span class="task-item-number">
                      ${l.nF}
                    </span>

                    <span class="task-item-percent">
                      ${l.pctNF}%
                    </span>

                  </div>

                </div>

                <div class="task-bar">

                  <div class="task-bar-fill"
                       style="background:#22c55e;width:${l.pctNF}%">

                  </div>

                </div>

              </div>

            </div>

          </div>

        </div>

        <div class="cell-trend">

          <div class="${diffClass}">
            ${diffIcon}
          </div>

          <div class="${diffClass}">
            ${l.diff === null ? '—' : Math.abs(l.diff)}
          </div>

        </div>

        <div class="cell-actions">

          <button class="btn-action"
                  id="btnhist-${li}"
                  onclick="toggleHist(${li})">

            Histórico

          </button>

          <button class="btn-action"
                  id="btnsec-${li}"
                  onclick="toggleSec(${li})">

            Secções

          </button>

        </div>

      </div>

      <div class="panel"
           id="hist-${li}">

        ${histHtml}

      </div>

      <div class="panel"
           id="sec-${li}">

        ${secHtml}

      </div>

    `;

  });

  document.getElementById('app').innerHTML = `

    <div class="table-container">

      <div class="table-header">

        <div class="th-cell">
          Rank
        </div>

        <div class="th-cell">
          Loja
        </div>

        <div class="th-cell">
          Tarefas
        </div>

        <div class="th-cell">
          Tendência
        </div>

        <div class="th-cell">
          Ações
        </div>

      </div>

      ${rows}

    </div>

  `;

}

</script>

</body>
</html>
