<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --border:rgba(0,0,0,0.08);
  --text-primary:#1a1a1a;
  --text-secondary:#4a4a4a;
  --text-tertiary:#808080;

  --success:#22c55e;
  --danger:#ef4444;
  --warning:#fb923c;

  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text-primary);
  font-size:14px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;

  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);

  border-bottom:1px solid rgba(0,0,0,.06);

  padding:18px 40px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:42px;
  height:42px;
  border-radius:12px;

  background:var(--grad);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
}

.header-title h1{
  font-size:22px;
  font-weight:800;
}

.header-title .sub{
  color:var(--text-tertiary);
  font-size:12px;
  margin-top:3px;
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);

  padding:8px 16px;
  border-radius:10px;

  font-weight:700;
  color:#8b5cf6;
  font-size:13px;
}

/* MAIN */

.main{
  max-width:1800px;
  margin:auto;
  padding:32px 40px 60px;
}

/* LEGENDA */

.legend-row{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;

  margin-bottom:28px;

  font-size:13px;
  color:var(--text-secondary);
}

.leg{
  display:flex;
  align-items:center;
  gap:6px;
}

.leg-dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

/* TABLE */

.table-container{
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.tgrid{
  display:grid;

  grid-template-columns:
    70px
    220px
    95px
    95px
    95px
    95px
    95px
    95px
    170px
    110px
    110px;

  align-items:center;
}

.table-header{
  padding:14px 20px;

  background:#fafafa;
  border-bottom:1px solid var(--border);

  font-size:11px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:.4px;

  color:#888;
}

.table-header > div{
  text-align:center;
}

.table-header > div:nth-child(2){
  text-align:center;
}

.table-row{
  border-bottom:1px solid var(--border);
  padding:0 20px;

  transition:.15s;
}

.table-row:hover{
  background:rgba(139,92,246,.03);
}

.row-main{
  padding:18px 0;
}

/* RANK */

.c-rank{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.rank-emoji{
  font-size:18px;
}

.rank-num{
  font-size:20px;
  font-weight:800;
}

.rank-badge{
  padding:3px 8px;
  border-radius:6px;

  font-size:10px;
  font-weight:700;
}

.bn1{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

.bn2{
  background:rgba(251,146,60,.12);
  color:#fb923c;
}

.bn3{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

/* LOJA */

.c-loja{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;

  text-align:center;
}

.loja-nome{
  font-size:15px;
  font-weight:800;
}

.loja-local{
  font-size:12px;
  color:var(--text-tertiary);
}

/* NUM */

.c-num{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.num-val{
  font-size:16px;
  font-weight:800;
}

.num-pct{
  padding:2px 7px;
  border-radius:5px;

  font-size:11px;
  font-weight:700;
}

.pct-red{
  background:rgba(239,68,68,.10);
  color:#ef4444;
}

.pct-green{
  background:rgba(34,197,94,.10);
  color:#22c55e;
}

.pct-gray{
  background:rgba(0,0,0,.05);
  color:#888;
}

/* TENDENCIA */

.c-tend{
  display:flex;
  justify-content:center;
}

.tend-badge{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;

  padding:10px 14px;
  border-radius:12px;

  min-width:130px;
}

.tend-badge-up{
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.18);
}

.tend-badge-down{
  background:rgba(34,197,94,.08);
  border:1px solid rgba(34,197,94,.18);
}

.tend-badge-neu{
  background:rgba(0,0,0,.04);
  border:1px solid rgba(0,0,0,.08);
}

.t-up{
  color:#ef4444;
}

.t-down{
  color:#22c55e;
}

.t-neu{
  color:#888;
}

.tend-icon{
  font-size:18px;
  font-weight:800;
}

.tend-val{
  font-size:17px;
  font-weight:800;
}

.tend-ctx{
  font-size:10px;
  line-height:1.4;
  text-align:center;
  color:#777;
}

/* BUTTONS */

.c-btn{
  display:flex;
  justify-content:center;
}

.btn-act{
  width:90px;

  background:#fff;

  border:1px solid rgba(139,92,246,.25);

  color:#8b5cf6;

  border-radius:8px;

  padding:8px 10px;

  cursor:pointer;

  font-size:11.5px;
  font-weight:700;

  transition:.15s;
}

.btn-act:hover{
  background:rgba(139,92,246,.08);
}

.btn-act.open{
  background:var(--grad);
  color:#fff;
  border-color:transparent;
}

/* PANELS */

.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  padding:24px 20px;

  background:rgba(139,92,246,.03);

  border-top:1px solid var(--border);
}

.panel-title{
  font-size:12px;
  font-weight:700;

  color:#888;

  text-transform:uppercase;
  letter-spacing:.5px;

  margin-bottom:16px;

  text-align:center;
}

/* HIST */

.detail-table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.detail-table th{
  padding:10px 14px;

  background:#fafafa;

  border-bottom:1px solid var(--border);

  text-align:center;

  font-size:11px;
  font-weight:700;
  color:#888;
}

.detail-table td{
  padding:10px 14px;

  border-bottom:1px solid var(--border);

  text-align:center;
}

.detail-table tr.current td{
  background:rgba(139,92,246,.06);
  font-weight:800;
}

/* SECÇÕES */

.sections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;
}

.sec-block{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:#fff;
}

.sec-head{
  padding:14px 16px;

  background:#fafafa;

  border-bottom:1px solid var(--border);

  text-align:center;

  font-size:14px;
  font-weight:700;
}

.sec-body{
  padding:16px;

  display:flex;
  flex-direction:column;
  gap:14px;
}

.sec-cat-title{
  font-size:11px;
  font-weight:800;

  color:#999;

  text-transform:uppercase;

  margin-bottom:10px;

  text-align:center;
}

.sec-metric{
  display:flex;
  justify-content:space-between;
  align-items:center;

  font-size:13px;

  margin-bottom:6px;
}

.bar{
  height:6px;
  border-radius:4px;
  overflow:hidden;
  background:#eee;
}

.bar-fill{
  height:100%;
}

.bar-red{
  background:#ef4444;
}

.bar-green{
  background:#22c55e;
}

/* NOTE */

.note{
  margin-top:30px;

  padding:22px;

  border-radius:14px;

  background:#fafafa;

  border:1px solid var(--border);

  text-align:center;

  color:#666;

  line-height:1.8;
  font-size:13px;
}

.loading{
  padding:100px;
  text-align:center;
  color:#aaa;
}

@media(max-width:1300px){

  .table-header{
    display:none;
  }

  .tgrid{
    grid-template-columns:1fr;
  }

  .row-main{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-brand">

    <div class="header-logo">
      📊
    </div>

    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">A carregar...</div>
    </div>

  </div>

  <div class="header-period" id="periodo">
    —
  </div>

</header>

<main class="main">

  <div class="legend-row">

    <span class="leg">
      <span class="leg-dot" style="background:#22c55e"></span>
      N1 • Até 20%
    </span>

    <span class="leg">
      <span class="leg-dot" style="background:#fb923c"></span>
      N2 • Entre 21% e 40%
    </span>

    <span class="leg">
      <span class="leg-dot" style="background:#ef4444"></span>
      N3 • Acima de 40%
    </span>

  </div>

  <div id="app">
    <div class="loading">
      ⏳ A carregar dados...
    </div>
  </div>

</main>

<script>

var stateHist={};
var stateSec={};

function toggleHist(li){

  var p=document.getElementById('hist-'+li);
  var b=document.getElementById('btnhist-'+li);

  stateHist[li]=!stateHist[li];

  p.classList.toggle('visible',stateHist[li]);
  b.classList.toggle('open',stateHist[li]);

  b.innerHTML=
    stateHist[li]
    ? '▼ Fechar'
    : '▶ Histórico';
}

function toggleSec(li){

  var p=document.getElementById('sec-'+li);
  var b=document.getElementById('btnsec-'+li);

  stateSec[li]=!stateSec[li];

  p.classList.toggle('visible',stateSec[li]);
  b.classList.toggle('open',stateSec[li]);

  b.innerHTML=
    stateSec[li]
    ? '▼ Fechar'
    : '▶ Secções';
}

fetch('dados.json?t='+Date.now())

.then(function(r){
  return r.json();
})

.then(function(json){

  var data=json.data||[];

  var semanas=[];

  data.forEach(function(i){

    var s=String(i.Semana||'').trim();

    if(s && semanas.indexOf(s)===-1){
      semanas.push(s);
    }

  });

  var ultima=semanas[semanas.length-1]||'';

  var lojas=data

  .filter(function(i){

    return(
      i.Loja &&
      !i.Secção &&
      String(i.Semana||'').trim()===ultima
    );

  })

  .map(function(i){

    var pT=Number(i['P Total'])||0;
    var pA=Number(i['P Aberto'])||0;
    var pF=Number(i['P Fechado'])||0;

    var nT=Number(i['NP Total'])||0;
    var nA=Number(i['NP Aberto'])||0;
    var nF=Number(i['NP Fechado'])||0;

    var pctPA=pT>0?(pA/pT*100).toFixed(1):'0.0';
    var pctPF=pT>0?(pF/pT*100).toFixed(1):'0.0';

    var pctNA=nT>0?(nA/nT*100).toFixed(1):'0.0';
    var pctNF=nT>0?(nF/nT*100).toFixed(1):'0.0';

    var nivel=
      parseFloat(pctPA)<=20
      ? 1
      : parseFloat(pctPA)<=40
      ? 2
      : 3;

    return{

      loja:String(i.Loja).trim(),

      local:String(
        i['Resumo contactos.Localidade']
        || i['IM.Localidade']
        || ''
      ).trim(),

      pT,pA,pF,
      nT,nA,nF,

      pctPA,pctPF,
      pctNA,pctNF,

      nivel,

      historico:[],
      seccoes:[]

    };

  });

  lojas.sort(function(a,b){
    return b.pA-a.pA;
  });

  var ids={};

  lojas.forEach(function(l){
    ids[l.loja]=true;
  });

  var hpl={};

  data.forEach(function(i){

    if(
      !i.Secção &&
      i.Loja &&
      i.Semana &&
      ids[String(i.Loja).trim()]
    ){

      var id=String(i.Loja).trim();

      if(!hpl[id]){
        hpl[id]=[];
      }

      hpl[id].push({

        semana:String(i.Semana).trim(),

        pA:Number(i['P Aberto'])||0,
        pF:Number(i['P Fechado'])||0,

        nA:Number(i['NP Aberto'])||0,
        nF:Number(i['NP Fechado'])||0

      });

    }

  });

  lojas.forEach(function(l){

    var h=hpl[l.loja]||[];

    l.historico=
      h
      .filter(function(x){
        return x.semana!==ultima;
      })
      .slice(-8);

    var u=h.slice(-2);

    l.diff=
      u.length===2
      ? u[1].pA-u[0].pA
      : null;

  });

  data.forEach(function(i){

    if(
      i.Secção &&
      i.Loja &&
      ids[String(i.Loja).trim()]
    ){

      var loja=
        lojas.find(function(l){
          return l.loja===String(i.Loja).trim();
        });

      if(loja){

        var nome=String(i.Secção)
          .replace(/^IM\s+\d+\s+/,'')
          .trim();

        if(nome.toLowerCase()!=='admin'){

          var pA=Number(i['P Aberto'])||0;
          var pF=Number(i['P Fechado'])||0;

          var nA=Number(i['NP Aberto'])||0;
          var nF=Number(i['NP Fechado'])||0;

          var pT=Number(i['P Total'])||0;
          var nT=Number(i['NP Total'])||0;

          loja.seccoes.push({

            nome,

            pA,pF,
            nA,nF,

            pctPA:pT>0?(pA/pT*100).toFixed(1):'0.0',
            pctPF:pT>0?(pF/pT*100).toFixed(1):'0.0',

            pctNA:nT>0?(nA/nT*100).toFixed(1):'0.0',
            pctNF:nT>0?(nF/nT*100).toFixed(1):'0.0'

          });

        }

      }

    }

  });

  document.getElementById('sub-info').textContent=
    'Gerado hoje · '+lojas.length+' lojas';

  document.getElementById('periodo').innerHTML=
    '📅 <strong>'+ultima+'</strong>';

  renderApp(lojas,ultima);

});

function renderApp(lojas,ultima){

  var html='';

  html+='<div class="table-container">';

  html+='<div class="tgrid table-header">';
  html+='<div>Rank</div>';
  html+='<div>Loja</div>';
  html+='<div>P Total</div>';
  html+='<div>P Aberto</div>';
  html+='<div>P Fechado</div>';
  html+='<div>NP Total</div>';
  html+='<div>NP Aberto</div>';
  html+='<div>NP Fechado</div>';
  html+='<div>Tendência</div>';
  html+='<div>Histórico</div>';
  html+='<div>Secções</div>';
  html+='</div>';

  lojas.forEach(function(l,li){

    var emoji=
      li<3
      ? '🔴'
      : '🟡';

    var bn=
      l.nivel===1
      ? 'bn1'
      : l.nivel===2
      ? 'bn2'
      : 'bn3';

    var tendencia='';

    if(l.diff===null){

      tendencia=
      '<div class="tend-badge tend-badge-neu">'+
      '<div class="tend-icon t-neu">—</div>'+
      '<div class="tend-ctx">Sem dados</div>'+
      '</div>';

    }else if(l.diff>0){

      tendencia=
      '<div class="tend-badge tend-badge-up">'+
      '<div class="tend-icon t-up">▲</div>'+
      '<div class="tend-val t-up">+'+l.diff+'</div>'+
      '<div class="tend-ctx">A loja deixou mais tarefas abertas ao longo do tempo</div>'+
      '</div>';

    }else if(l.diff<0){

      tendencia=
      '<div class="tend-badge tend-badge-down">'+
      '<div class="tend-icon t-down">▼</div>'+
      '<div class="tend-val t-down">'+l.diff+'</div>'+
      '<div class="tend-ctx">A loja deixou menos tarefas abertas ao longo do tempo</div>'+
      '</div>';

    }else{

      tendencia=
      '<div class="tend-badge tend-badge-neu">'+
      '<div class="tend-icon t-neu">→</div>'+
      '<div class="tend-val t-neu">0</div>'+
      '<div class="tend-ctx">Sem alterações</div>'+
      '</div>';

    }

    html+='<div class="table-row">';

    html+='<div class="tgrid row-main">';

    html+='<div class="c-rank">';
    html+='<div class="rank-emoji">'+emoji+'</div>';
    html+='<div class="rank-num">'+(li+1)+'</div>';
    html+='<div class="rank-badge '+bn+'">N'+l.nivel+'</div>';
    html+='</div>';

    html+='<div class="c-loja">';
    html+='<div class="loja-nome">'+l.loja+'</div>';
    html+='<div class="loja-local">'+(l.local||'—')+'</div>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val">'+l.pT+'</div>';
    html+='<div class="num-pct pct-gray">Total</div>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val" style="color:#ef4444">'+l.pA+'</div>';
    html+='<div class="num-pct pct-red">'+l.pctPA+'%</div>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val" style="color:#22c55e">'+l.pF+'</div>';
    html+='<div class="num-pct pct-green">'+l.pctPF+'%</div>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val">'+l.nT+'</div>';
    html+='<div class="num-pct pct-gray">Total</div>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val" style="color:#ef4444">'+l.nA+'</div>';
    html+='<div class="num-pct pct-red">'+l.pctNA+'%</div>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val" style="color:#22c55e">'+l.nF+'</div>';
    html+='<div class="num-pct pct-green">'+l.pctNF+'%</div>';
    html+='</div>';

    html+='<div class="c-tend">';
    html+=tendencia;
    html+='</div>';

    html+='<div class="c-btn">';
    html+='<button class="btn-act" id="btnhist-'+li+'" onclick="toggleHist('+li+')">▶ Histórico</button>';
    html+='</div>';

    html+='<div class="c-btn">';
    html+='<button class="btn-act" id="btnsec-'+li+'" onclick="toggleSec('+li+')">▶ Secções</button>';
    html+='</div>';

    html+='</div>';

    /* HISTÓRICO */

    html+='<div class="panel" id="hist-'+li+'">';
    html+='<div class="panel-inner">';

    html+='<div class="panel-title">';
    html+='Histórico Semanal';
    html+='</div>';

    html+='<table class="detail-table">';

    html+='<thead>';
    html+='<tr>';
    html+='<th>Semana</th>';
    html+='<th>P Aberto</th>';
    html+='<th>P Fechado</th>';
    html+='<th>NP Aberto</th>';
    html+='<th>NP Fechado</th>';
    html+='</tr>';
    html+='</thead>';

    html+='<tbody>';

    l.historico.forEach(function(h){

      html+='<tr>';
      html+='<td>'+h.semana+'</td>';
      html+='<td>'+h.pA+'</td>';
      html+='<td>'+h.pF+'</td>';
      html+='<td>'+h.nA+'</td>';
      html+='<td>'+h.nF+'</td>';
      html+='</tr>';

    });

    html+='<tr class="current">';
    html+='<td>'+ultima+'</td>';
    html+='<td>'+l.pA+'</td>';
    html+='<td>'+l.pF+'</td>';
    html+='<td>'+l.nA+'</td>';
    html+='<td>'+l.nF+'</td>';
    html+='</tr>';

    html+='</tbody>';
    html+='</table>';

    html+='</div>';
    html+='</div>';

    /* SECÇÕES */

    html+='<div class="panel" id="sec-'+li+'">';
    html+='<div class="panel-inner">';

    html+='<div class="panel-title">';
    html+='Detalhe por Secções';
    html+='</div>';

    html+='<div class="sections-grid">';

    l.seccoes.forEach(function(s){

      html+='<div class="sec-block">';

      html+='<div class="sec-head">';
      html+=s.nome;
      html+='</div>';

      html+='<div class="sec-body">';

      html+='<div>';

      html+='<div class="sec-cat-title">';
      html+='Programadas';
