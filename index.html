<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --border:rgba(0,0,0,0.08);
  --text-primary:#1a1a1a;
  --text-secondary:#4a4a4a;
  --text-tertiary:#808080;
  --success:#22c55e;
  --danger:#ef4444;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{font-family:'Inter',sans-serif;background:#fff;color:var(--text-primary);font-size:14px;}

/* HEADER */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:18px 40px;
  display:flex;justify-content:space-between;align-items:center;
}
.header-brand{display:flex;align-items:center;gap:16px;}
.header-logo{
  width:42px;height:42px;border-radius:12px;
  background:var(--grad);display:flex;align-items:center;
  justify-content:center;font-size:20px;
}
.header-title h1{font-size:22px;font-weight:800;color:#1a1a1a;}
.header-title .sub{color:var(--text-tertiary);font-size:12px;margin-top:3px;}
.header-period{
  background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.15);
  padding:8px 16px;border-radius:10px;font-weight:700;color:#8b5cf6;font-size:13px;
}

/* MAIN */
.main{max-width:1800px;margin:0 auto;padding:32px 40px 60px;}

/* KPI */
.kpi-row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;
}
.kpi-card{
  border:1px solid var(--border);border-radius:14px;padding:20px 24px;
  transition:background .2s;
}
.kpi-card:hover{background:rgba(139,92,246,.03);}
.kpi-label{font-size:11px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.kpi-value{font-size:36px;font-weight:800;line-height:1;}
.kpi-sub{font-size:12px;color:var(--text-tertiary);margin-top:6px;}
.kc .kpi-value{color:#ef4444;}
.kw .kpi-value{color:#fb923c;}
.ks .kpi-value{color:#22c55e;}
.km .kpi-value{color:#94a3b8;}

/* LEGEND ROW */
.legend-row{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin-bottom:28px;font-size:12.5px;color:var(--text-secondary);
}
.leg{display:flex;align-items:center;gap:6px;}
.leg-sep{width:1px;height:14px;background:var(--border);}
.leg-dot{width:9px;height:9px;border-radius:50%;}

/* TABLE */
.table-container{
  border:1px solid var(--border);border-radius:18px;overflow:hidden;
}

/* COLUMNS: rank | loja | p-total | p-aberto | p-fechado | np-total | np-aberto | np-fechado | comp | tend | hist | sec */
.tgrid{
  display:grid;
  grid-template-columns:
    60px        /* rank   */
    170px       /* loja   */
    90px        /* P Tot  */
    90px        /* P Ab   */
    90px        /* P Fe   */
    90px        /* NP Tot */
    90px        /* NP Ab  */
    90px        /* NP Fe  */
    120px       /* Comp   */
    80px        /* Tend   */
    100px       /* Hist   */
    100px;      /* Sec    */
  align-items:center;
}

.table-header{
  padding:14px 20px;
  background:#fafafa;border-bottom:1px solid var(--border);
  font-size:11px;font-weight:700;text-transform:uppercase;
  color:#888;letter-spacing:.4px;
}
.table-header > div{padding:0 6px;text-align:center;}
.table-header > div:nth-child(1){text-align:center;}
.table-header > div:nth-child(2){text-align:left;}

.table-row{
  border-bottom:1px solid var(--border);
  transition:background .15s;
  padding:0 20px;
}
.table-row:last-of-type{border-bottom:none;}
.table-row:hover{background:rgba(139,92,246,.025);}
.row-main{padding:18px 0;}

/* CELLS */
.c-rank{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;text-align:center;
}
.rank-emoji{font-size:18px;line-height:1;}
.rank-num{font-size:20px;font-weight:800;}
.rank-badge{
  display:inline-block;padding:3px 8px;border-radius:6px;
  font-size:10px;font-weight:700;
}
.bn1{background:rgba(34,197,94,.12);color:#22c55e;}
.bn2{background:rgba(251,146,60,.12);color:#fb923c;}
.bn3{background:rgba(239,68,68,.12);color:#ef4444;}

.c-loja{display:flex;flex-direction:column;gap:4px;padding:0 6px;}
.loja-nome{font-size:14px;font-weight:700;}
.loja-local{font-size:12px;color:var(--text-tertiary);}

.c-num{
  text-align:center;padding:0 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.num-val{font-size:16px;font-weight:800;}
.num-pct{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;}
.pct-red{background:rgba(239,68,68,.1);color:#ef4444;}
.pct-green{background:rgba(34,197,94,.1);color:#22c55e;}
.pct-gray{background:rgba(0,0,0,.05);color:#888;}

.c-comp{
  text-align:center;padding:0 6px;
  font-size:11px;color:var(--text-tertiary);line-height:1.5;
}

.c-tend{
  text-align:center;padding:0 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.tend-badge{
  display:inline-flex;flex-direction:column;align-items:center;
  padding:6px 10px;border-radius:10px;gap:2px;min-width:72px;
}
.tend-badge-up{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);}
.tend-badge-down{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);}
.tend-badge-neu{background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.08);}
.tend-icon{font-size:16px;font-weight:800;line-height:1;}
.tend-val{font-size:15px;font-weight:800;line-height:1;}
.tend-ctx{font-size:10px;color:#aaa;line-height:1.3;text-align:center;}
.t-up{color:#ef4444;}
.t-down{color:#22c55e;}
.t-neu{color:#aaa;}

.c-btn{text-align:center;padding:0 6px;}
.btn-act{
  width:88px;
  background:#fff;border:1px solid rgba(139,92,246,.25);
  color:#8b5cf6;border-radius:8px;padding:8px 10px;
  cursor:pointer;font-size:11.5px;font-weight:700;
  transition:all .15s;display:block;
}
.btn-act:hover{background:rgba(139,92,246,.08);}
.btn-act.open{background:var(--grad);color:#fff;border-color:transparent;}

/* PANELS */
.panel{display:none;}
.panel.visible{display:block;}
.panel-inner{
  padding:24px 20px;background:rgba(139,92,246,.03);
  border-top:1px solid var(--border);
}
.panel-title{
  font-size:12px;font-weight:700;color:#888;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;
}

/* HISTORY TABLE */
.detail-table{width:100%;border-collapse:collapse;font-size:13px;}
.detail-table th{
  padding:10px 14px;background:#fafafa;
  border-bottom:1px solid var(--border);
  text-align:left;font-size:11px;font-weight:700;color:#888;
}
.detail-table td{
  padding:10px 14px;border-bottom:1px solid var(--border);
  color:var(--text-secondary);
}
.detail-table tr.current td{background:rgba(139,92,246,.06);font-weight:700;color:#1a1a1a;}
.detail-table tbody tr:hover td{background:rgba(139,92,246,.04);}

/* SECTIONS */
.sections-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;
}
.sec-block{
  border:1px solid var(--border);border-radius:12px;overflow:hidden;
}
.sec-head{
  padding:14px 16px;background:#fafafa;
  border-bottom:1px solid var(--border);
  font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:space-between;
}
.sec-body{padding:14px 16px;display:flex;flex-direction:column;gap:14px;}
.sec-cat-title{
  font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;color:#aaa;margin-bottom:8px;
}
.sec-metric{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px;}
.sec-metric span:first-child{color:var(--text-secondary);}
.sec-metric strong{color:#1a1a1a;}
.bar{height:5px;border-radius:3px;background:#f0f0f0;overflow:hidden;margin-bottom:10px;}
.bar-fill{height:100%;border-radius:3px;}
.bar-red{background:#ef4444;}
.bar-green{background:#22c55e;}
.pct-tag{
  display:inline-block;padding:2px 7px;border-radius:10px;
  font-size:10px;font-weight:700;margin-left:6px;
}
.tag-red{background:rgba(239,68,68,.12);color:#ef4444;}
.tag-orange{background:rgba(251,146,60,.12);color:#fb923c;}
.tag-green{background:rgba(34,197,94,.12);color:#22c55e;}

/* ACTION BOX */
.action-box{
  margin-top:28px;background:rgba(239,68,68,.05);
  border:1px solid rgba(239,68,68,.15);border-radius:12px;
  padding:20px 24px;display:flex;align-items:center;gap:14px;
}
.action-icon{font-size:24px;}
.action-content h3{font-size:14px;font-weight:700;color:#ef4444;margin-bottom:4px;}
.action-content p{font-size:13px;color:var(--text-secondary);}

.loading{padding:100px;text-align:center;color:#aaa;}

@media(max-width:1400px){
  .main{padding:24px;}
  .tgrid{
    grid-template-columns:
      55px 155px 80px 80px 80px 80px 80px 80px 110px 72px 90px 90px;
  }
}
@media(max-width:1100px){
  .main{padding:16px;}
  .table-header{display:none;}
  .tgrid{grid-template-columns:1fr;}
  .row-main{display:flex;flex-direction:column;gap:12px;}
  .kpi-row{grid-template-columns:1fr 1fr;}
  .c-num,.c-comp,.c-tend,.c-btn{padding:0;}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="header-logo">📊</div>
    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">A carregar...</div>
    </div>
  </div>
  <div class="header-period" id="periodo">—</div>
</header>

<main class="main">
  <div id="app"><div class="loading">⏳ A carregar dados...</div></div>
</main>

<script>
var stateHist={}, stateSec={};

function tagPct(v){
  v=parseFloat(v);
  if(v<=20)return'tag-green';
  if(v<=40)return'tag-orange';
  return'tag-red';
}
function pctClass(type,v){
  // type: 'ab' = aberto (vermelho se alto), 'fe' = fechado (verde se alto)
  if(type==='fe')return'pct-green';
  v=parseFloat(v);
  if(v<=20)return'pct-green';
  if(v<=40)return'pct-gray';
  return'pct-red';
}
function barColor(type){return type==='ab'?'bar-red':'bar-green';}

function toggleHist(li){
  var p=document.getElementById('hist-'+li),b=document.getElementById('btnhist-'+li);
  stateHist[li]=!stateHist[li];
  p.classList.toggle('visible',stateHist[li]);
  b.classList.toggle('open',stateHist[li]);
  b.innerHTML=stateHist[li]?'▼ Fechar':'▶ Histórico';
}
function toggleSec(li){
  var p=document.getElementById('sec-'+li),b=document.getElementById('btnsec-'+li);
  stateSec[li]=!stateSec[li];
  p.classList.toggle('visible',stateSec[li]);
  b.classList.toggle('open',stateSec[li]);
  b.innerHTML=stateSec[li]?'▼ Fechar':'▶ Secções';
}

fetch('dados.json?t='+Date.now())
  .then(function(r){return r.json();})
  .then(function(json){
    var data=json.data||[];
    var semanas=[];
    data.forEach(function(i){
      var s=String(i.Semana||'').trim();
      if(s&&semanas.indexOf(s)===-1)semanas.push(s);
    });
    var ultima=semanas[semanas.length-1]||'';

    var lojas=data
      .filter(function(i){return i.Loja&&!i.Secção&&String(i.Semana||'').trim()===ultima;})
      .map(function(i){
        var pT=Number(i['P Total'])||0,pA=Number(i['P Aberto'])||0,pF=Number(i['P Fechado'])||0;
        var nT=Number(i['NP Total'])||0,nA=Number(i['NP Aberto'])||0,nF=Number(i['NP Fechado'])||0;
        var comp=String(i['Comparação Programadas vs Não Programadas']||'').trim();
        var loc=String(i['Resumo contactos.Localidade']||i['IM.Localidade']||'').trim();
        var pctPA=pT>0?(pA/pT*100).toFixed(1):'0.0';
        var pctPF=pT>0?(pF/pT*100).toFixed(1):'0.0';
        var pctNA=nT>0?(nA/nT*100).toFixed(1):'0.0';
        var pctNF=nT>0?(nF/nT*100).toFixed(1):'0.0';
        var nivel=parseFloat(pctPA)<=20?1:parseFloat(pctPA)<=40?2:3;
        return{loja:String(i.Loja).trim(),local:loc,comp,
               pT,pA,pF,nT,nA,nF,pctPA,pctPF,pctNA,pctNF,
               nivel,historico:[],seccoes:[]};
      })
      .filter(function(l){return l.pA>0;});

    lojas.sort(function(a,b){return b.pA-a.pA;});
    var top=lojas.slice(0,10);
    var ids={};top.forEach(function(l){ids[l.loja]=true;});

    // Histórico
    var hpl={};
    data.forEach(function(i){
      if(!i.Secção&&i.Loja&&i.Semana&&ids[String(i.Loja).trim()]){
        var id=String(i.Loja).trim();
        if(!hpl[id])hpl[id]=[];
        hpl[id].push({
          semana:String(i.Semana).trim(),
          pA:Number(i['P Aberto'])||0,pF:Number(i['P Fechado'])||0,
          nA:Number(i['NP Aberto'])||0,nF:Number(i['NP Fechado'])||0
        });
      }
    });
    top.forEach(function(l){
      var h=hpl[l.loja]||[];
      l.historico=h.filter(function(x){return x.semana!==ultima;}).slice(-8);
      var u=h.slice(-2);
      l.diff=u.length===2?u[1].pA-u[0].pA:null;
    });

    // Secções
    data.forEach(function(i){
      if(i.Secção&&i.Loja&&ids[String(i.Loja).trim()]){
        var loja=top.find(function(l){return l.loja===String(i.Loja).trim();});
        if(loja){
          var pA=Number(i['P Aberto'])||0,pF=Number(i['P Fechado'])||0;
          var nA=Number(i['NP Aberto'])||0,nF=Number(i['NP Fechado'])||0;
          var pT=Number(i['P Total'])||0,nT=Number(i['NP Total'])||0;
          if(pA>0||pF>0||nA>0||nF>0){
            var nome=String(i.Secção).replace(/^IM\s+\d+\s+/,'').trim();
            if(nome.toLowerCase()!=='admin'){
              loja.seccoes.push({nome,pA,pF,nA,nF,
                pctPA:pT>0?(pA/pT*100).toFixed(1):'0.0',
                pctPF:pT>0?(pF/pT*100).toFixed(1):'0.0',
                pctNA:nT>0?(nA/nT*100).toFixed(1):'0.0',
                pctNF:nT>0?(nF/nT*100).toFixed(1):'0.0'});
            }
          }
        }
      }
    });
    top.forEach(function(l){l.seccoes.sort(function(a,b){return b.pA-a.pA;});});

    document.getElementById('sub-info').textContent='Gerado hoje · '+top.length+' lojas · '+ultima;
    document.getElementById('periodo').innerHTML='📅 <strong>'+ultima+'</strong>';
    renderApp(top,ultima);
  })
  .catch(function(err){
    document.getElementById('app').innerHTML='<div class="loading" style="color:#ef4444">❌ Erro: '+err.message+'</div>';
  });

function renderApp(lojas,ultima){
  var criticas=lojas.filter(function(l,i){return i<3;}).length;
  var alertas=lojas.filter(function(l,i){return i>=3;}).length;
  var piorando=lojas.filter(function(l){return l.diff>0;}).length;
  var melhorando=lojas.filter(function(l){return l.diff<0;}).length;

  var kpi='<div class="kpi-row">'
    +'<div class="kpi-card kc"><div class="kpi-label">🔴 Críticas</div><div class="kpi-value">'+criticas+'</div><div class="kpi-sub">Top 3 lojas</div></div>'
    +'<div class="kpi-card kw"><div class="kpi-label">🟡 Em alerta</div><div class="kpi-value">'+alertas+'</div><div class="kpi-sub">Em observação</div></div>'
    +'<div class="kpi-card km"><div class="kpi-label">▲ A piorar</div><div class="kpi-value">'+piorando+'</div><div class="kpi-sub">vs semana anterior</div></div>'
    +'<div class="kpi-card ks"><div class="kpi-label">▼ A melhorar</div><div class="kpi-value">'+melhorando+'</div><div class="kpi-sub">vs semana anterior</div></div>'
    +'</div>';

  var leg='<div class="legend-row">'
    +'<span class="leg"><span class="leg-dot" style="background:#ef4444"></span>🔴 Top 3 críticas</span>'
    +'<div class="leg-sep"></div>'
    +'<span class="leg"><span class="leg-dot" style="background:#fb923c"></span>🟡 Em alerta</span>'
    +'<div class="leg-sep"></div>'
    +'<span class="leg"><span style="color:#22c55e;font-weight:700">N1</span> = 0–20%</span>'
    +'<span class="leg"><span style="color:#fb923c;font-weight:700">N2</span> = 21–40%</span>'
    +'<span class="leg"><span style="color:#ef4444;font-weight:700">N3</span> = 41%+</span>'
    +'<div class="leg-sep"></div>'
    +'<span class="leg" style="color:#ef4444">▲ A piorar</span>'
    +'<span class="leg" style="color:#22c55e">▼ A melhorar</span>'
    +'<div class="leg-sep"></div>'
    +'<span style="color:#aaa;font-size:12px">P = Programadas · NP = Não Programadas · Ab = Abertas · Fe = Fechadas</span>'
    +'</div>';

  var theader='<div class="tgrid table-header">'
    +'<div>Rank</div>'
    +'<div style="text-align:left">Loja / Localidade</div>'
    +'<div>P Total</div>'
    +'<div>P Aberto</div>'
    +'<div>P Fechado</div>'
    +'<div>NP Total</div>'
    +'<div>NP Aberto</div>'
    +'<div>NP Fechado</div>'
    +'<div>Comparação</div>'
    +'<div>Tendência</div>'
    +'<div>Histórico</div>'
    +'<div>Secções</div>'
    +'</div>';

  var rows='';
  lojas.forEach(function(l,li){
    var emoji=li<3?'🔴':'🟡';
    var bn=l.nivel===1?'bn1':l.nivel===2?'bn2':'bn3';
    var diffIcon=l.diff===null?'—':l.diff>0?'▲':l.diff<0?'▼':'→';
    var diffClass=l.diff===null?'t-neu':l.diff>0?'t-up':l.diff<0?'t-down':'t-neu';
    var diffVal=l.diff===null?'':Math.abs(l.diff);

    // Histórico panel
    var histHtml='<div class="panel-inner"><div class="panel-title">Evolução Semanal — P Aberto</div>';
    if(l.historico&&l.historico.length>0){
      var hRows=l.historico.map(function(h){
        return'<tr><td>'+h.semana+'</td><td>'+h.pA+'</td><td>'+h.pF+'</td><td>'+h.nA+'</td><td>'+h.nF+'</td></tr>';
      }).join('');
      histHtml+='<table class="detail-table"><thead><tr><th>Semana</th><th>P Ab</th><th>P Fe</th><th>NP Ab</th><th>NP Fe</th></tr></thead>'
        +'<tbody>'+hRows+'<tr class="current"><td>'+ultima+' (atual)</td><td>'+l.pA+'</td><td>'+l.pF+'</td><td>'+l.nA+'</td><td>'+l.nF+'</td></tr></tbody></table>';
    }else{
      histHtml+='<p style="color:#aaa;font-size:13px">Sem semanas anteriores. Atual: P Ab='+l.pA+'</p>';
    }
    histHtml+='</div>';

    // Secções panel
    var secHtml='';
    if(l.seccoes.length>0){
      var sCards=l.seccoes.map(function(s){
        return'<div class="sec-block">'
          +'<div class="sec-head">'
          +'<span>'+s.nome+'</span>'
          +'<span class="pct-tag '+tagPct(s.pctPA)+'">'+s.pctPA+'% ab</span>'
          +'</div>'
          +'<div class="sec-body">'
          // Programadas
          +'<div>'
          +'<div class="sec-cat-title">Programadas</div>'
          +'<div class="sec-metric"><span>Abertas</span><strong>'+s.pA+' <span style="color:#ef4444">('+s.pctPA+'%)</span></strong></div>'
          +'<div class="bar"><div class="bar-fill bar-red" style="width:'+Math.min(100,s.pctPA)+'%"></div></div>'
          +'<div class="sec-metric"><span>Fechadas</span><strong>'+s.pF+' <span style="color:#22c55e">('+s.pctPF+'%)</span></strong></div>'
          +'<div class="bar"><div class="bar-fill bar-green" style="width:'+Math.min(100,s.pctPF)+'%"></div></div>'
          +'</div>'
          // Não Programadas
          +'<div>'
          +'<div class="sec-cat-title">Não Programadas</div>'
          +'<div class="sec-metric"><span>Abertas</span><strong>'+s.nA+' <span style="color:#ef4444">('+s.pctNA+'%)</span></strong></div>'
          +'<div class="bar"><div class="bar-fill bar-red" style="width:'+Math.min(100,s.pctNA)+'%"></div></div>'
          +'<div class="sec-metric"><span>Fechadas</span><strong>'+s.nF+' <span style="color:#22c55e">('+s.pctNF+'%)</span></strong></div>'
          +'<div class="bar"><div class="bar-fill bar-green" style="width:'+Math.min(100,s.pctNF)+'%"></div></div>'
          +'</div>'
          +'</div>'
          +'</div>';
      }).join('');
      secHtml='<div class="panel-inner"><div class="panel-title">Detalhe por Secção</div>'
        +'<div class="sections-grid">'+sCards+'</div></div>';
    }else{
      secHtml='<div class="panel-inner"><p style="color:#aaa;font-size:13px">Sem secções com tarefas.</p></div>';
    }

    rows+='<div class="table-row">'
      +'<div class="tgrid row-main">'

      // Rank
      +'<div class="c-rank">'
      +'<div class="rank-emoji">'+emoji+'</div>'
      +'<div class="rank-num">'+(li+1)+'</div>'
      +'<span class="rank-badge '+bn+'">N'+l.nivel+'</span>'
      +'</div>'

      // Loja + localidade
      +'<div class="c-loja">'
      +'<div class="loja-nome">'+l.loja+'</div>'
      +'<div class="loja-local">'+(l.local||'—')+'</div>'
      +'</div>'

      // P Total
      +'<div class="c-num">'
      +'<div class="num-val">'+l.pT+'</div>'
      +'<span class="num-pct pct-gray">Total</span>'
      +'</div>'

      // P Aberto
      +'<div class="c-num">'
      +'<div class="num-val" style="color:#ef4444">'+l.pA+'</div>'
      +'<span class="num-pct pct-red">'+l.pctPA+'%</span>'
      +'</div>'

      // P Fechado
      +'<div class="c-num">'
      +'<div class="num-val" style="color:#22c55e">'+l.pF+'</div>'
      +'<span class="num-pct pct-green">'+l.pctPF+'%</span>'
      +'</div>'

      // NP Total
      +'<div class="c-num">'
      +'<div class="num-val">'+l.nT+'</div>'
      +'<span class="num-pct pct-gray">Total</span>'
      +'</div>'

      // NP Aberto
      +'<div class="c-num">'
      +'<div class="num-val" style="color:#ef4444">'+l.nA+'</div>'
      +'<span class="num-pct pct-red">'+l.pctNA+'%</span>'
      +'</div>'

      // NP Fechado
      +'<div class="c-num">'
      +'<div class="num-val" style="color:#22c55e">'+l.nF+'</div>'
      +'<span class="num-pct pct-green">'+l.pctNF+'%</span>'
      +'</div>'

      // Comparação
      +'<div class="c-comp">'+(l.comp||'—')+'</div>'

      // Tendência
      +(function(){
        if(l.diff===null){
          return '<div class="c-tend"><div class="tend-badge tend-badge-neu"><div class="tend-icon t-neu">—</div><div class="tend-ctx">sem dados</div></div></div>';
        }
        if(l.diff===0){
          return '<div class="c-tend"><div class="tend-badge tend-badge-neu"><div class="tend-icon t-neu">→</div><div class="tend-val t-neu">0</div><div class="tend-ctx">P abertas<br>sem alteração</div></div></div>';
        }
        var badgeClass = l.diff>0 ? 'tend-badge-up' : 'tend-badge-down';
        var iconClass  = l.diff>0 ? 't-up' : 't-down';
        var icon       = l.diff>0 ? '▲' : '▼';
        var sinal      = l.diff>0 ? '+' : '';
        var msg        = l.diff>0 ? 'P abertas<br>a piorar' : 'P abertas<br>a melhorar';
        return '<div class="c-tend"><div class="tend-badge '+badgeClass+'">'
          +'<div class="tend-icon '+iconClass+'">'+icon+'</div>'
          +'<div class="tend-val '+iconClass+'">'+sinal+l.diff+'</div>'
          +'<div class="tend-ctx">'+msg+'</div>'
          +'</div></div>';
      })()

      // Histórico btn
      +'<div class="c-btn">'
      +'<button class="btn-act" id="btnhist-'+li+'" onclick="toggleHist('+li+')">▶ Histórico</button>'
      +'</div>'

      // Secções btn
      +'<div class="c-btn">'
      +'<button class="btn-act" id="btnsec-'+li+'" onclick="toggleSec('+li+')">▶ Secções</button>'
      +'</div>'

      +'</div>'
      +'<div class="panel" id="hist-'+li+'">'+histHtml+'</div>'
      +'<div class="panel" id="sec-'+li+'">'+secHtml+'</div>'
      +'</div>';
  });

  var acao='<div class="action-box">'
    +'<div class="action-icon">⚠️</div>'
    +'<div class="action-content">'
    +'<h3>Ação Recomendada</h3>'
    +'<p>Contactar urgentemente os responsáveis das lojas críticas.</p>'
    +'</div></div>';

  document.getElementById('app').innerHTML=kpi+leg
    +'<div class="table-container">'+theader+rows+'</div>'
    +acao;
}
</script>
</body>
</html>
