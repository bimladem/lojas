<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --border:rgba(0,0,0,.08);
  --text:#1a1a1a;
  --muted:#808080;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#fb923c;
  --purple:#8b5cf6;
  --pink:#ec4899;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text);
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:52px;
  height:52px;
  border-radius:14px;
  background:var(--grad);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.header-title h1{
  font-size:30px;
  font-weight:800;
}

.header-title .sub{
  margin-top:4px;
  color:var(--muted);
  font-size:15px;
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);
  padding:10px 18px;
  border-radius:12px;
  font-weight:800;
  color:var(--purple);
  font-size:15px;
}

.main{
  max-width:1800px;
  margin:auto;
  padding:28px;
}

.table-container{
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
}

.table-header{
  display:grid;
  grid-template-columns:
    90px
    1.7fr
    120px
    120px
    120px
    120px
    120px
    120px
    180px
    120px
    120px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  font-size:14px;
  font-weight:800;
  color:#666;
  text-transform:uppercase;
}

.table-header div{
  padding:22px 10px;
  text-align:center;
}

.table-row{
  border-bottom:1px solid var(--border);
}

.row-main{
  display:grid;
  grid-template-columns:
    90px
    1.7fr
    120px
    120px
    120px
    120px
    120px
    120px
    180px
    120px
    120px;
  align-items:center;
  padding:20px 10px;
}

.row-main:hover{
  background:rgba(139,92,246,.03);
}

.cell{
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.rank{
  flex-direction:column;
  gap:8px;
}

.rank-num{
  font-size:32px;
  font-weight:800;
}

.rank-badge{
  padding:5px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.n1{
  background:rgba(239,68,68,.12);
  color:var(--red);
}

.n2{
  background:rgba(251,146,60,.12);
  color:var(--orange);
}

.n3{
  background:rgba(34,197,94,.12);
  color:var(--green);
}

.loja{
  flex-direction:column;
  gap:8px;
}

.loja strong{
  font-size:22px;
}

.loja span{
  color:var(--muted);
  font-size:15px;
}

.metric{
  flex-direction:column;
  gap:4px;
}

.metric strong{
  font-size:22px;
}

.metric span{
  font-size:14px;
  color:#777;
}

.red{
  color:var(--red);
}

.green{
  color:var(--green);
}

.trend-box{
  padding:12px;
  border-radius:14px;
  min-width:140px;
  text-align:center;
}

.trend-positive{
  background:rgba(34,197,94,.12);
}

.trend-negative{
  background:rgba(239,68,68,.12);
}

.trend-neutral{
  background:rgba(0,0,0,.04);
}

.trend-icon{
  font-size:24px;
  font-weight:800;
}

.trend-value{
  font-size:22px;
  font-weight:800;
}

.btn{
  background:#fff;
  border:1px solid rgba(139,92,246,.25);
  color:var(--purple);
  border-radius:12px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:800;
  transition:.2s;
}

.btn:hover{
  background:rgba(139,92,246,.08);
}

.panel{
  display:none;
  width:100%;
}

.panel-inner{
  padding:24px;
  background:rgba(139,92,246,.03);
  border-top:1px solid var(--border);
}

.section-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

.section-table th{
  background:#fafafa;
  padding:16px;
  font-size:13px;
  text-transform:uppercase;
  color:#666;
  border-bottom:1px solid var(--border);
}

.section-table td{
  padding:16px;
  text-align:center;
  border-bottom:1px solid var(--border);
  font-size:14px;
}

.section-table tr:hover{
  background:rgba(139,92,246,.03);
}

</style>

</head>

<body>

<header class="header">

  <div class="header-brand">

    <div class="header-logo">📊</div>

    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">A carregar...</div>
    </div>

  </div>

  <div class="header-period" id="periodo">—</div>

</header>

<main class="main">

  <div id="app">

    <div style="padding:80px;text-align:center;color:#999;">
      ⏳ A carregar dados...
    </div>

  </div>

</main>

<script>

var stateSec = {};

function toggleSec(li){

  var p = document.getElementById('sec-'+li);

  if(!p) return;

  if(stateSec[li]){
    p.style.display='none';
    stateSec[li]=false;
  }else{
    p.style.display='block';
    stateSec[li]=true;
  }

}

/* ===========================================
   COLOCA AQUI O LINK RAW DO GITHUB
=========================================== */

const DATA_URL =
'https://raw.githubusercontent.com/SEUUSER/SEUREPO/main/dados.json';

/* =========================================== */

fetch(DATA_URL + '?t=' + Date.now())

.then(r=>r.json())

.then(json=>{

  const data = json.data || [];

  const semanas = [];

  data.forEach(i=>{

    const s = String(i.Semana || '').trim();

    if(s && !semanas.includes(s)){
      semanas.push(s);
    }

  });

  const ultima = semanas[semanas.length-1];

  const lojas = [];

  data.forEach(i=>{

    if(
      !i.Secção &&
      !i.Seccao &&
      i.Loja &&
      String(i.Semana).trim() === ultima
    ){

      const pT = Number(i['P Total']) || 0;
      const pA = Number(i['P Aberto']) || 0;
      const pF = Number(i['P Fechado']) || 0;

      const nT = Number(i['NP Total']) || 0;
      const nA = Number(i['NP Aberto']) || 0;
      const nF = Number(i['NP Fechado']) || 0;

      lojas.push({

        loja: String(i.Loja).trim(),

        local: String(
          i['Resumo contactos.Localidade'] || ''
        ).trim(),

        pT,
        pA,
        pF,

        nT,
        nA,
        nF,

        pctPF:
          pT > 0
          ? ((pF/pT)*100).toFixed(1)
          : '0.0',

        seccoes: []

      });

    }

  });

  lojas.sort((a,b)=>b.pF-a.pF);

  data.forEach(i=>{

    const secao =
      i.Secção ||
      i.Seccao ||
      i['Secção'] ||
      i['Seccao'];

    if(secao && i.Loja){

      const lojaNome = String(i.Loja).trim();

      const loja = lojas.find(
        l => l.loja === lojaNome
      );

      if(loja){

        loja.seccoes.push({

          nome: String(secao)
            .replace(/^IM\s+\d+\s+/,'')
            .trim(),

          programadasAbertas:
            Number(
              i['Programadas Abertas'] ||
              i['P Aberto'] ||
              0
            ),

          programadasFechadas:
            Number(
              i['Programadas Fechadas'] ||
              i['P Fechado'] ||
              0
            ),

          naoProgramadasAbertas:
            Number(
              i['Não Programadas Abertas'] ||
              i['NP Aberto'] ||
              0
            ),

          naoProgramadasFechadas:
            Number(
              i['Não Programadas Fechadas'] ||
              i['NP Fechado'] ||
              0
            )

        });

      }

    }

  });

  document.getElementById('sub-info').textContent =
    lojas.length + ' lojas';

  document.getElementById('periodo').innerHTML =
    '📅 ' + ultima;

  render(lojas);

});

function render(lojas){

  let html='';

  html += '<div class="table-container">';

  html += '<div class="table-header">';
  html += '<div>Rank</div>';
  html += '<div>Loja</div>';
  html += '<div>P Total</div>';
  html += '<div>P Aberto</div>';
  html += '<div>P Fechado</div>';
  html += '<div>NP Total</div>';
  html += '<div>NP Aberto</div>';
  html += '<div>NP Fechado</div>';
  html += '<div>Tendência</div>';
  html += '<div>Secções</div>';
  html += '<div>Detalhes</div>';
  html += '</div>';

  lojas.forEach((l,li)=>{

    let nivel = 1;

    if(l.pctPF >= 80){
      nivel = 3;
    }else if(l.pctPF >= 50){
      nivel = 2;
    }

    const badge =
      nivel===1?'n1':
      nivel===2?'n2':'n3';

    html += '<div class="table-row">';

    html += '<div class="row-main">';

    html += '<div class="cell rank">';
    html += '<div class="rank-num">'+(li+1)+'</div>';
    html += '<div class="rank-badge '+badge+'">N'+nivel+'</div>';
    html += '</div>';

    html += '<div class="cell loja">';
    html += '<strong>'+l.loja+'</strong>';
    html += '<span>'+l.local+'</span>';
    html += '</div>';

    html += '<div class="cell metric">';
    html += '<strong>'+l.pT+'</strong>';
    html += '</div>';

    html += '<div class="cell metric">';
    html += '<strong class="red">'+l.pA+'</strong>';
    html += '</div>';

    html += '<div class="cell metric">';
    html += '<strong class="green">'+l.pF+'</strong>';
    html += '</div>';

    html += '<div class="cell metric">';
    html += '<strong>'+l.nT+'</strong>';
    html += '</div>';

    html += '<div class="cell metric">';
    html += '<strong class="red">'+l.nA+'</strong>';
    html += '</div>';

    html += '<div class="cell metric">';
    html += '<strong class="green">'+l.nF+'</strong>';
    html += '</div>';

    html += '<div class="cell">';
    html += '<div class="trend-box trend-neutral">';
    html += '<div class="trend-value">'+l.pctPF+'%</div>';
    html += '</div>';
    html += '</div>';

    html += '<div class="cell">';
    html += '<strong>'+l.seccoes.length+'</strong>';
    html += '</div>';

    html += '<div class="cell">';
    html += '<button class="btn" onclick="toggleSec('+li+')">';
    html += 'Abrir';
    html += '</button>';
    html += '</div>';

    html += '</div>';

    /* SECÇÕES */

    html += '<div class="panel" id="sec-'+li+'">';
    html += '<div class="panel-inner">';

    html += '<table class="section-table">';

    html += '<thead>';
    html += '<tr>';
    html += '<th>Secção</th>';
    html += '<th>P Abertas</th>';
    html += '<th>P Fechadas</th>';
    html += '<th>NP Abertas</th>';
    html += '<th>NP Fechadas</th>';
    html += '</tr>';
    html += '</thead>';

    html += '<tbody>';

    l.seccoes.forEach(s=>{

      html += '<tr>';

      html += '<td><strong>'+s.nome+'</strong></td>';

      html += '<td class="red">';
      html += s.programadasAbertas;
      html += '</td>';

      html += '<td class="green">';
      html += s.programadasFechadas;
      html += '</td>';

      html += '<td class="red">';
      html += s.naoProgramadasAbertas;
      html += '</td>';

      html += '<td class="green">';
      html += s.naoProgramadasFechadas;
      html += '</td>';

      html += '</tr>';

    });

    html += '</tbody>';

    html += '</table>';

    html += '</div>';
    html += '</div>';

    html += '</div>';

  });

  html += '</div>';

  document.getElementById('app').innerHTML = html;

}

</script>

</body>
</html>
