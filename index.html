<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --border:rgba(0,0,0,0.08);
  --text-primary:#1a1a1a;
  --text-secondary:#4a4a4a;
  --text-tertiary:#808080;
  --success:#22c55e;
  --danger:#ef4444;
  --warning:#fb923c;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text-primary);
  font-size:14px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:18px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--grad);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.header-title h1{
  font-size:22px;
  font-weight:800;
}

.header-title .sub{
  color:var(--text-tertiary);
  font-size:12px;
  margin-top:3px;
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);
  padding:8px 16px;
  border-radius:10px;
  font-weight:700;
  color:#8b5cf6;
  font-size:13px;
}

/* MAIN */

.main{
  max-width:1800px;
  margin:auto;
  padding:32px 40px 60px;
}

/* KPI */

.kpi-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:32px;
}

.kpi-card{
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px 24px;
  text-align:center;
}

.kpi-label{
  font-size:11px;
  font-weight:700;
  color:var(--text-tertiary);
  text-transform:uppercase;
  margin-bottom:10px;
}

.kpi-value{
  font-size:36px;
  font-weight:800;
}

.kpi-sub{
  font-size:12px;
  color:var(--text-tertiary);
  margin-top:6px;
}

/* TABLE */

.table-container{
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.tgrid{
  display:grid;
  grid-template-columns:
    80px
    220px
    90px
    90px
    90px
    90px
    90px
    90px
    180px
    120px
    120px;
  align-items:center;
}

.table-header{
  background:#fafafa;
  border-bottom:1px solid var(--border);
  padding:16px 20px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  color:#888;
}

.table-header div{
  text-align:center;
}

.table-row{
  border-bottom:1px solid var(--border);
  padding:0 20px;
}

.row-main{
  padding:20px 0;
}

/* RANK */

.c-rank{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.rank-num{
  font-size:22px;
  font-weight:800;
}

.rank-badge{
  padding:4px 8px;
  border-radius:8px;
  font-size:10px;
  font-weight:700;
}

.bn1{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

.bn2{
  background:rgba(251,146,60,.12);
  color:#fb923c;
}

.bn3{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

/* LOJA */

.c-loja{
  text-align:center;
}

.loja-nome{
  font-size:15px;
  font-weight:700;
}

.loja-local{
  font-size:12px;
  color:var(--text-tertiary);
  margin-top:4px;
}

/* NUM */

.c-num{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}

.num-val{
  font-size:18px;
  font-weight:800;
}

.num-pct{
  font-size:11px;
  padding:2px 8px;
  border-radius:6px;
  font-weight:700;
}

.pct-red{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

.pct-green{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

.pct-gray{
  background:rgba(0,0,0,.05);
  color:#777;
}

/* TENDÊNCIA */

.c-tend{
  display:flex;
  justify-content:center;
  align-items:center;
}

.tend-badge{
  padding:10px 14px;
  border-radius:12px;
  text-align:center;
  min-width:150px;
}

.tend-up{
  background:rgba(239,68,68,.10);
  border:1px solid rgba(239,68,68,.2);
}

.tend-down{
  background:rgba(34,197,94,.10);
  border:1px solid rgba(34,197,94,.2);
}

.tend-neutral{
  background:rgba(0,0,0,.04);
  border:1px solid rgba(0,0,0,.08);
}

.tend-icon{
  font-size:18px;
  font-weight:800;
}

.tend-value{
  font-size:18px;
  font-weight:800;
  margin-top:4px;
}

.tend-text{
  margin-top:6px;
  font-size:11px;
  line-height:1.4;
  color:#666;
}

/* BUTTONS */

.c-btn{
  text-align:center;
}

.btn-act{
  width:100px;
  background:#fff;
  border:1px solid rgba(139,92,246,.25);
  color:#8b5cf6;
  border-radius:10px;
  padding:9px 10px;
  cursor:pointer;
  font-size:11px;
  font-weight:700;
}

.btn-act:hover{
  background:rgba(139,92,246,.08);
}

/* PANELS */

.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  padding:24px;
  background:rgba(139,92,246,.03);
  border-top:1px solid var(--border);
}

/* HISTORY */

.detail-table{
  width:100%;
  border-collapse:collapse;
}

.detail-table th{
  background:#fafafa;
  padding:12px;
  border-bottom:1px solid var(--border);
  text-align:center;
  font-size:11px;
  color:#888;
}

.detail-table td{
  padding:12px;
  border-bottom:1px solid var(--border);
  text-align:center;
}

.current{
  background:rgba(139,92,246,.06);
  font-weight:700;
}

/* SECÇÕES */

.sections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:18px;
}

.sec-block{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.sec-head{
  padding:14px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  font-weight:700;
  text-align:center;
}

.sec-body{
  padding:16px;
}

.sec-line{
  margin-bottom:16px;
}

.sec-line-title{
  font-size:12px;
  margin-bottom:6px;
  color:#777;
  text-align:center;
}

.bar{
  height:6px;
  background:#eee;
  border-radius:999px;
  overflow:hidden;
  margin-top:6px;
}

.bar-fill{
  height:100%;
}

.red{
  background:#ef4444;
}

.green{
  background:#22c55e;
}

/* NOTE */

.note{
  margin-top:30px;
  padding:22px;
  border-radius:16px;
  background:#fafafa;
  border:1px solid rgba(0,0,0,.08);
  text-align:center;
  line-height:1.8;
  color:#555;
  font-size:13px;
}

.loading{
  padding:100px;
  text-align:center;
}

/* RESPONSIVE */

@media(max-width:1300px){

  .table-header{
    display:none;
  }

  .tgrid{
    grid-template-columns:1fr;
    gap:16px;
  }

  .row-main{
    text-align:center;
  }

  .kpi-row{
    grid-template-columns:1fr 1fr;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-brand">

    <div class="header-logo">
      📊
    </div>

    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">A carregar...</div>
    </div>

  </div>

  <div class="header-period" id="periodo">
    —
  </div>

</header>

<main class="main">

  <div id="app">

    <div class="loading">
      ⏳ A carregar dados...
    </div>

  </div>

</main>

<script>

var stateHist = {};
var stateSec = {};

function toggleHist(li){

  var p = document.getElementById('hist-'+li);
  p.classList.toggle('visible');

}

function toggleSec(li){

  var p = document.getElementById('sec-'+li);
  p.classList.toggle('visible');

}

fetch('dados.json?t=' + Date.now())

.then(r => r.json())

.then(json => {

  var data = json.data || [];

  var semanas = [];

  data.forEach(i => {

    var s = String(i.Semana || '').trim();

    if(s && semanas.indexOf(s) === -1){
      semanas.push(s);
    }

  });

  var ultima = semanas[semanas.length - 1] || '';

  var lojas = data

  .filter(i =>
    i.Loja &&
    !i.Secção &&
    String(i.Semana || '').trim() === ultima
  )

  .map(i => {

    var pT = Number(i['P Total']) || 0;
    var pA = Number(i['P Aberto']) || 0;
    var pF = Number(i['P Fechado']) || 0;

    var nT = Number(i['NP Total']) || 0;
    var nA = Number(i['NP Aberto']) || 0;
    var nF = Number(i['NP Fechado']) || 0;

    var pctPA = pT > 0 ? (pA/pT*100).toFixed(1) : '0.0';
    var pctPF = pT > 0 ? (pF/pT*100).toFixed(1) : '0.0';

    var pctNA = nT > 0 ? (nA/nT*100).toFixed(1) : '0.0';
    var pctNF = nT > 0 ? (nF/nT*100).toFixed(1) : '0.0';

    return {

      loja:String(i.Loja).trim(),

      local:String(
        i['Resumo contactos.Localidade'] ||
        i['IM.Localidade'] || ''
      ).trim(),

      pT,pA,pF,
      nT,nA,nF,

      pctPA,pctPF,pctNA,pctNF,

      nivel:
        parseFloat(pctPA) <= 20
        ? 1
        : parseFloat(pctPA) <= 40
        ? 2
        : 3,

      historico:[],
      seccoes:[]

    };

  });

  lojas.sort((a,b)=>b.pA-a.pA);

  var ids = {};

  lojas.forEach(l => {
    ids[l.loja] = true;
  });

  var hpl = {};

  data.forEach(i => {

    if(
      !i.Secção &&
      i.Loja &&
      i.Semana &&
      ids[String(i.Loja).trim()]
    ){

      var id = String(i.Loja).trim();

      if(!hpl[id]){
        hpl[id] = [];
      }

      hpl[id].push({

        semana:String(i.Semana).trim(),

        pA:Number(i['P Aberto']) || 0,
        pF:Number(i['P Fechado']) || 0,

        nA:Number(i['NP Aberto']) || 0,
        nF:Number(i['NP Fechado']) || 0

      });

    }

  });

  lojas.forEach(l => {

    var h = hpl[l.loja] || [];

    l.historico = h
      .filter(x => x.semana !== ultima)
      .slice(-8);

    var u = h.slice(-2);

    l.diff =
      u.length === 2
      ? u[1].pA - u[0].pA
      : 0;

  });

  data.forEach(i => {

    if(
      i.Secção &&
      i.Loja &&
      ids[String(i.Loja).trim()]
    ){

      var loja = lojas.find(
        l => l.loja === String(i.Loja).trim()
      );

      if(loja){

        var nome = String(i.Secção)
          .replace(/^IM\s+\d+\s+/,'')
          .trim();

        if(nome.toLowerCase() !== 'admin'){

          var pA = Number(i['P Aberto']) || 0;
          var pF = Number(i['P Fechado']) || 0;

          var nA = Number(i['NP Aberto']) || 0;
          var nF = Number(i['NP Fechado']) || 0;

          var pT = Number(i['P Total']) || 0;
          var nT = Number(i['NP Total']) || 0;

          loja.seccoes.push({

            nome,

            pA,pF,nA,nF,

            pctPA:pT>0?(pA/pT*100).toFixed(1):'0.0',
            pctPF:pT>0?(pF/pT*100).toFixed(1):'0.0',

            pctNA:nT>0?(nA/nT*100).toFixed(1):'0.0',
            pctNF:nT>0?(nF/nT*100).toFixed(1):'0.0'

          });

        }

      }

    }

  });

  document.getElementById('sub-info').textContent =
    'Gerado hoje · ' + lojas.length + ' lojas';

  document.getElementById('periodo').textContent =
    '📅 ' + ultima;

  renderApp(lojas,ultima);

});

function renderApp(lojas,ultima){

  var html = '';

  html += '<div class="kpi-row">';

  html += `
    <div class="kpi-card">
      <div class="kpi-label">🔴 Críticas</div>
      <div class="kpi-value">
        ${lojas.filter(l=>l.nivel===3).length}
      </div>
      <div class="kpi-sub">Nível 3</div>
    </div>
  `;

  html += `
    <div class="kpi-card">
      <div class="kpi-label">🟡 Alerta</div>
      <div class="kpi-value">
        ${lojas.filter(l=>l.nivel===2).length}
      </div>
      <div class="kpi-sub">Nível 2</div>
    </div>
  `;

  html += `
    <div class="kpi-card">
      <div class="kpi-label">🟢 Estáveis</div>
      <div class="kpi-value">
        ${lojas.filter(l=>l.nivel===1).length}
      </div>
      <div class="kpi-sub">Nível 1</div>
    </div>
  `;

  html += `
    <div class="kpi-card">
      <div class="kpi-label">🏪 Total</div>
      <div class="kpi-value">
        ${lojas.length}
      </div>
      <div class="kpi-sub">Lojas analisadas</div>
    </div>
  `;

  html += '</div>';

  html += `
  <div class="table-container">

    <div class="tgrid table-header">

      <div>Rank</div>
      <div>Loja</div>

      <div>P Total</div>
      <div>P Aberto</div>
      <div>P Fechado</div>

      <div>NP Total</div>
      <div>NP Aberto</div>
      <div>NP Fechado</div>

      <div>Tendência</div>

      <div>Histórico</div>
      <div>Secções</div>

    </div>
  `;

  lojas.forEach((l,li)=>{

    var badge =
      l.nivel === 1
      ? 'bn1'
      : l.nivel === 2
      ? 'bn2'
      : 'bn3';

    var trend =
      l.diff > 0
      ? '▲'
      : l.diff < 0
      ? '▼'
      : '→';

    var trendClass =
      l.diff > 0
      ? 'tend-up'
      : l.diff < 0
      ? 'tend-down'
      : 'tend-neutral';

    var trendText =
      l.diff > 0
      ? 'A loja deixou mais tarefas abertas ao longo do tempo'
      : l.diff < 0
      ? 'A loja deixou menos tarefas abertas ao longo do tempo'
      : 'Sem alterações';

    html += `

    <div class="table-row">

      <div class="tgrid row-main">

        <div class="c-rank">

          <div class="rank-num">
            ${li+1}
          </div>

          <div class="rank-badge ${badge}">
            N${l.nivel}
          </div>

        </div>

        <div class="c-loja">

          <div class="loja-nome">
            ${l.loja}
          </div>

          <div class="loja-local">
            ${l.local}
          </div>

        </div>

        <div class="c-num">
          <div class="num-val">${l.pT}</div>
          <div class="num-pct pct-gray">Total</div>
        </div>

        <div class="c-num">
          <div class="num-val" style="color:#ef4444">${l.pA}</div>
          <div class="num-pct pct-red">${l.pctPA}%</div>
        </div>

        <div class="c-num">
          <div class="num-val" style="color:#22c55e">${l.pF}</div>
          <div class="num-pct pct-green">${l.pctPF}%</div>
        </div>

        <div class="c-num">
          <div class="num-val">${l.nT}</div>
          <div class="num-pct pct-gray">Total</div>
        </div>

        <div class="c-num">
          <div class="num-val" style="color:#ef4444">${l.nA}</div>
          <div class="num-pct pct-red">${l.pctNA}%</div>
        </div>

        <div class="c-num">
          <div class="num-val" style="color:#22c55e">${l.nF}</div>
          <div class="num-pct pct-green">${l.pctNF}%</div>
        </div>

        <div class="c-tend">

          <div class="tend-badge ${trendClass}">

            <div class="tend-icon">
              ${trend}
            </div>

            <div class="tend-value">
              ${Math.abs(l.diff)}
            </div>

            <div class="tend-text">
              ${trendText}
            </div>

          </div>

        </div>

        <div class="c-btn">

          <button
            class="btn-act"
            onclick="toggleHist(${li})">
            Histórico
          </button>

        </div>

        <div class="c-btn">

          <button
            class="btn-act"
            onclick="toggleSec(${li})">
            Secções
          </button>

        </div>

      </div>

      <div class="panel" id="hist-${li}">

        <div class="panel-inner">

          <table class="detail-table">

            <thead>

              <tr>

                <th>Semana</th>
                <th>P Aberto</th>
                <th>P Fechado</th>
                <th>NP Aberto</th>
                <th>NP Fechado</th>

              </tr>

            </thead>

            <tbody>

              ${l.historico.map(h=>`

                <tr>

                  <td>${h.semana}</td>
                  <td>${h.pA}</td>
                  <td>${h.pF}</td>
                  <td>${h.nA}</td>
                  <td>${h.nF}</td>

                </tr>

              `).join('')}

              <tr class="current">

                <td>${ultima}</td>
                <td>${l.pA}</td>
                <td>${l.pF}</td>
                <td>${l.nA}</td>
                <td>${l.nF}</td>

              </tr>

            </tbody>

          </table>

        </div>

      </div>

      <div class="panel" id="sec-${li}">

        <div class="panel-inner">

          <div class="sections-grid">

            ${l.seccoes.map(s=>`

              <div class="sec-block">

                <div class="sec-head">
                  ${s.nome}
                </div>

                <div class="sec-body">

                  <div class="sec-line">

                    <div class="sec-line-title">
                      Programadas Abertas
                    </div>

                    <strong>
                      ${s.pA} (${s.pctPA}%)
                    </strong>

                    <div class="bar">

                      <div
                        class="bar-fill red"
                        style="width:${s.pctPA}%">
                      </div>

                    </div>

                  </div>

                  <div class="sec-line">

                    <div class="sec-line-title">
                      Programadas Fechadas
                    </div>

                    <strong>
                      ${s.pF} (${s.pctPF}%)
                    </strong>

                    <div class="bar">

                      <div
                        class="bar-fill green"
                        style="width:${s.pctPF}%">
                      </div>

                    </div>

                  </div>

                </div>

              </div>

            `).join('')}

          </div>

        </div>

      </div>

    </div>

    `;

  });

  html += '</div>';

  html += `

  <div class="note">

    <strong style="font-size:15px;color:#111;">
      📌 Legenda dos Níveis e Tendências
    </strong>

    <br><br>

    <span style="color:#22c55e;font-weight:700;">
      N1
    </span>
    — Até 20% de tarefas programadas abertas
    <br>

    <span style="color:#fb923c;font-weight:700;">
      N2
    </span>
    — Entre 21% e 40% de tarefas programadas abertas
    <br>

    <span style="color:#ef4444;font-weight:700;">
      N3
    </span>
    — Mais de 40% de tarefas programadas abertas

    <br><br>

    <span style="color:#ef4444;font-weight:700;">
      ▲ Vermelho
    </span>
    — A loja tem deixado mais tarefas abertas ao longo do tempo

    <br>

    <span style="color:#22c55e;font-weight:700;">
      ▼ Verde
    </span>
    — A loja tem deixado menos tarefas abertas ao longo do tempo

  </div>

  `;

  document.getElementById('app').innerHTML = html;

}

</script>

</body>
</html>
