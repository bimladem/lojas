<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.1.0/chartjs-plugin-datalabels.min.js"></script>
<style>
:root {
  --ink: #0f0e0d;
  --ink-2: #3a3835;
  --ink-3: #6b6860;
  --ink-4: #9c9a95;
  --paper: #faf9f7;
  --paper-2: #f3f1ed;
  --paper-3: #ece9e3;
  --line: #e2ded6;
  --line-2: #cec9bf;
  --accent: #c4703a;
  --accent-2: #e8925e;
  --accent-pale: #f9ede4;
  --n1: #b83232;
  --n1-bg: #fdf0f0;
  --n2: #b87a32;
  --n2-bg: #fdf6ee;
  --n3: #2e7d52;
  --n3-bg: #eef6f2;
  --blue: #2d5fa0;
  --blue-pale: #eef2f9;
  --green: #2e7d52;
  --green-pale: #eef6f2;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-xl: 22px;

  --shadow-sm: 0 1px 3px rgba(15,14,13,.06), 0 1px 2px rgba(15,14,13,.04);
  --shadow-md: 0 4px 12px rgba(15,14,13,.08), 0 2px 4px rgba(15,14,13,.04);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ─────────────────────────────────────────── */
.header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(250,249,247,.96);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-icon {
  width: 38px; height: 38px;
  border-radius: var(--r-md);
  background: var(--ink);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.header-icon svg { width: 20px; height: 20px; fill: var(--paper); }

.header-title {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--ink);
  letter-spacing: -0.3px;
  white-space: nowrap;
}

.header-subtitle {
  font-size: 12px;
  color: var(--ink-4);
  font-weight: 400;
  letter-spacing: 0.2px;
}

.header-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--paper-2);
  border: 1px solid var(--line-2);
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
  letter-spacing: 0.1px;
}

.header-badge::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* ── MAIN ────────────────────────────────────────────── */
.main {
  max-width: 1480px;
  margin: 0 auto;
  padding: 28px 28px 60px;
}

/* ── LEGEND ──────────────────────────────────────────── */
.legend-bar {
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 14px 20px;
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--ink-3);
}

.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.legend-label { font-weight: 600; color: var(--ink); }
.legend-desc { color: var(--ink-4); }

.legend-sep { width: 1px; height: 18px; background: var(--line-2); flex-shrink: 0; }

/* ── TABLE ───────────────────────────────────────────── */
.table-scroll {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.table-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  min-width: 1100px;
}

/* ── TABLE HEADER ────────────────────────────────────── */
.table-head {
  display: grid;
  grid-template-columns: 72px 160px 140px repeat(6, 100px) 150px 120px 120px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
}

.th {
  padding: 13px 14px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--ink-3);
  text-align: center;
  border-right: 1px solid var(--line);
}
.th:last-child { border-right: none; }
.th-left { text-align: left; }

/* ── TABLE ROW ───────────────────────────────────────── */
.table-row {
  border-bottom: 1px solid var(--line);
  background: #fff;
  transition: background 0.15s ease;
}
.table-row:last-of-type > .row-grid { border-bottom: none; }
.table-row:hover > .row-grid { background: var(--paper); }

.row-grid {
  display: grid;
  grid-template-columns: 72px 160px 140px repeat(6, 100px) 150px 120px 120px;
  border-bottom: 1px solid var(--line);
  transition: background 0.15s ease;
}
.table-row:last-of-type > .row-grid { border-bottom: none; }

.td {
  padding: 16px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--line);
  min-height: 80px;
}
.td:last-child { border-right: none; }
.td-left { justify-content: flex-start; }

/* ── RANK ────────────────────────────────────────────── */
.rank-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.rank-num { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--ink-2); line-height: 1; }
.rank-pill {
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.4px;
}
.pill-n1 { background: var(--n1-bg); color: var(--n1); }
.pill-n2 { background: var(--n2-bg); color: var(--n2); }
.pill-n3 { background: var(--n3-bg); color: var(--n3); }

/* ── LOCATION ────────────────────────────────────────── */
.loc-name { font-size: 13px; font-weight: 500; color: var(--ink); }
.loja-code { font-size: 12px; font-weight: 500; color: var(--ink); white-space: nowrap; }

/* ── METRIC ──────────────────────────────────────────── */
.metric-num { font-size: 18px; font-weight: 600; color: var(--ink); }
.metric-sub { font-size: 11px; color: var(--ink-4); margin-top: 2px; }

/* ── COMP P VS NP ────────────────────────────────────── */
.comp-cell { display: flex; gap: 10px; }
.comp-item { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
.comp-badge {
  padding: 5px 10px;
  border-radius: var(--r-md);
  font-size: 15px;
  font-weight: 600;
  min-width: 56px;
  text-align: center;
}
.comp-p { background: var(--blue-pale); color: var(--blue); }
.comp-np { background: var(--green-pale); color: var(--green); }
.comp-label { font-size: 10px; font-weight: 600; letter-spacing: 0.4px; color: var(--ink-4); text-transform: uppercase; }

/* ── ACTION BUTTONS ──────────────────────────────────── */
.btn-act {
  width: 100%;
  padding: 8px 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-2);
  background: var(--paper-2);
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s ease;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.btn-act:hover {
  border-color: var(--ink-2);
  background: var(--paper-3);
  color: var(--ink);
}
.btn-act.active {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}

/* ── PANEL ───────────────────────────────────────────── */
.panel { display: none; }
.panel.open { display: block; }

.panel-body {
  padding: 24px 28px;
  background: var(--paper);
  border-top: 1px solid var(--line);
}

.panel-section-title {
  font-family: 'DM Serif Display', serif;
  font-size: 17px;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

/* ── DETAIL TABLE ────────────────────────────────────── */
.dtable {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  font-size: 13px;
  box-shadow: var(--shadow-sm);
}
.dtable th {
  padding: 11px 16px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--ink-3);
  text-align: center;
}
.dtable td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  text-align: center;
  color: var(--ink);
  font-weight: 500;
}
.dtable tr:last-child td { border-bottom: none; }
.dtable tbody tr:hover td { background: var(--paper); }

.chart-wrap {
  position: relative;
  width: 100%;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
}

/* ── SECTIONS GRID ───────────────────────────────────── */
.sec-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-top: 16px;
}

.sec-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.sec-card-head {
  padding: 12px 16px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}

.sec-card-body { padding: 12px 16px; }

/* ── BOTTOM NOTES ────────────────────────────────────── */
.bottom-bar {
  margin-top: 24px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: stretch;
}

.level-legend {
  flex: 1;
  min-width: 260px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
}

.level-legend-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 12px;
}

.level-items { display: flex; gap: 12px; flex-wrap: wrap; }

.level-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--ink-2);
}

.level-dot {
  width: 28px; height: 28px;
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.action-banner {
  flex: 2;
  min-width: 280px;
  background: var(--accent-pale);
  border: 1px solid rgba(196,112,58,.2);
  border-radius: var(--r-lg);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.action-icon {
  width: 40px; height: 40px;
  border-radius: var(--r-md);
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 18px;
}

.action-title { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
.action-desc { font-size: 12.5px; color: var(--ink-3); line-height: 1.4; }

/* ── MOBILE LIST ─────────────────────────────────────── */
.mobile-list { display: none; }
.m-card-wrap { margin-bottom: 12px; }

.loading {
  text-align: center;
  padding: 80px 20px;
  color: var(--ink-4);
  font-size: 14px;
}

/* ── MOBILE ──────────────────────────────────────────── */
@media (max-width: 768px) {
  .table-scroll { display: none; }
  .mobile-list { display: block; }
  .header { padding: 0 20px; }
  .header-title { font-size: 18px; }
  .main { padding: 20px 16px 48px; }

  .m-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--r-xl);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  .m-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border-bottom: 1px solid var(--line);
    background: var(--paper-2);
  }

  .m-rank-num { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--ink-2); line-height: 1; }

  .m-info { flex: 1; }
  .m-loja { font-size: 15px; font-weight: 600; color: var(--ink); }
  .m-local { font-size: 12px; color: var(--ink-4); margin-top: 2px; }

  .m-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border-bottom: 1px solid var(--line);
  }

  .m-metric {
    background: #fff;
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .m-metric-label { font-size: 10px; font-weight: 600; letter-spacing: 0.4px; color: var(--ink-4); text-transform: uppercase; }
  .m-metric-num { font-size: 16px; font-weight: 600; color: var(--ink); }
  .m-metric-pct { font-size: 11px; color: var(--ink-3); }

  .m-comp {
    display: flex;
    gap: 12px;
    padding: 12px 16px;
    background: var(--paper-2);
    border-bottom: 1px solid var(--line);
    justify-content: center;
  }

  .m-comp-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .m-comp-label { font-size: 10px; font-weight: 600; letter-spacing: 0.4px; color: var(--ink-4); text-transform: uppercase; }
  .m-comp-val { font-size: 20px; font-weight: 600; }

  .m-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 12px 16px;
  }

  .panel-body { padding: 16px; }
  .bottom-bar { flex-direction: column; }
  .level-items { flex-direction: column; gap: 8px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="13" width="4" height="8" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="5" width="4" height="16" rx="1"/></svg>
    </div>
    <div>
      <div class="header-title">Análise Semanal IM</div>
      <div class="header-subtitle" id="sub-info">A carregar…</div>
    </div>
  </div>
  <div class="header-badge" id="periodo">—</div>
</header>

<main class="main">
  <div id="app"><div class="loading">A carregar dados…</div></div>
</main>

<script>
var stateHist = {};
var stateSec  = {};
var charts    = {};

function toggleHist(li) {
  stateHist[li] = !stateHist[li];
  var p = document.getElementById('hist-' + li);
  var b = document.getElementById('btnhist-' + li);
  if (p) p.classList.toggle('open', stateHist[li]);
  if (b) { b.classList.toggle('active', stateHist[li]); b.textContent = stateHist[li] ? '▾ Fechar' : '↗ Histórico'; }
  if (stateHist[li]) setTimeout(function() { if (charts['pnp-' + li]) charts['pnp-' + li].resize(); }, 100);
}

function toggleSec(li) {
  stateSec[li] = !stateSec[li];
  var p = document.getElementById('sec-' + li);
  var b = document.getElementById('btnsec-' + li);
  if (p) p.classList.toggle('open', stateSec[li]);
  if (b) { b.classList.toggle('active', stateSec[li]); b.textContent = stateSec[li] ? '▾ Fechar' : '↗ Secções'; }
}

var mstateHist = {};
var mstateSec  = {};

function mtoggleHist(li) {
  mstateHist[li] = !mstateHist[li];
  var p = document.getElementById('mhist-' + li);
  var b = document.getElementById('mbtnhist-' + li);
  if (p) p.classList.toggle('open', mstateHist[li]);
  if (b) { b.classList.toggle('active', mstateHist[li]); b.textContent = mstateHist[li] ? '▾ Fechar' : '↗ Histórico'; }
  if (mstateHist[li]) setTimeout(function() { if (charts['mpnp-' + li]) charts['mpnp-' + li].resize(); }, 100);
}

function mtoggleSec(li) {
  mstateSec[li] = !mstateSec[li];
  var p = document.getElementById('msec-' + li);
  var b = document.getElementById('mbtnsec-' + li);
  if (p) p.classList.toggle('open', mstateSec[li]);
  if (b) { b.classList.toggle('active', mstateSec[li]); b.textContent = mstateSec[li] ? '▾ Fechar' : '↗ Secções'; }
}

fetch('dados.json?t=' + Date.now())
  .then(function(r) { return r.json(); })
  .then(function(json) {
    var data = json.data || [];

    var semanas = [];
    data.forEach(function(i) {
      var s = String(i.Semana || '').trim();
      if (s && semanas.indexOf(s) === -1) semanas.push(s);
    });
    var ultimaSemana = semanas[semanas.length - 1] || '';

    var lojas = data
      .filter(function(i) { return i.Loja && !i.Secção && String(i.Semana || '').trim() === ultimaSemana; })
      .map(function(i) {
        var pT = Number(i['P Total'])   || 0;
        var pA = Number(i['P Aberto'])  || 0;
        var pF = Number(i['P Fechado']) || 0;
        var nT = Number(i['NP Total'])  || 0;
        var nA = Number(i['NP Aberto']) || 0;
        var nF = Number(i['NP Fechado'])|| 0;
        var pctPF = pT > 0 ? (pF/pT*100) : 0;
        var pctNF = nT > 0 ? (nF/nT*100) : 0;
        var nivel = pctPF >= 41 ? 3 : pctPF >= 21 ? 2 : 1;
        var loc = String(i['Resumo contactos.Localidade'] || i['IM.Localidade'] || '').trim();
        return {
          loja: String(i.Loja).trim(), local: loc,
          pT:pT, pA:pA, pF:pF, nT:nT, nA:nA, nF:nF,
          pctPF: pctPF.toFixed(1), pctNF: pctNF.toFixed(1),
          pctPFInt: Math.round(pctPF), pctNFInt: Math.round(pctNF),
          nivel: nivel, historico: [], seccoes: [], diff: null
        };
      });

    lojas.sort(function(a,b) {
      if (a.nivel !== b.nivel) return a.nivel - b.nivel;
      return Number(a.pctPF) - Number(b.pctPF);
    });

    var ids = {};
    lojas.forEach(function(l) { ids[l.loja] = true; });

    var histPorLoja = {};
    data.forEach(function(i) {
      if (i.Loja && !i.Secção && ids[String(i.Loja).trim()]) {
        var id = String(i.Loja).trim();
        if (!histPorLoja[id]) histPorLoja[id] = [];
        histPorLoja[id].push(i);
      }
    });

    lojas.forEach(function(l) {
      var hist = histPorLoja[l.loja] || [];
      l.historico = hist.slice(-8);
      var u = hist.slice(-2);
      l.diff = u.length === 2 ? (Number(u[1]['P Fechado'])||0) - (Number(u[0]['P Fechado'])||0) : null;
    });

    data.forEach(function(i) {
      if (!i.Secção) return;
      var seccaoStr = String(i.Secção).trim();
      var m = seccaoStr.match(/^(IM \d+)\s+(.+)$/);
      if (!m) return;
      var lojaCode = m[1].trim();
      var nomeSecção = m[2].trim();
      if (nomeSecção.toLowerCase() === 'admin') return;
      if (!ids[lojaCode]) return;
      var loja = lojas.find(function(l) { return l.loja === lojaCode; });
      if (!loja) return;
      var pT = Number(i['Programadas Total'])    || 0;
      var pF = Number(i['Programadas Fechadas']) || 0;
      var nT = Number(i['Não Programadas Total'])    || 0;
      var nF = Number(i['Não Programadas Fechadas']) || 0;
      loja.seccoes.push({ nome: nomeSecção, pT:pT, pA:pT-pF, pF:pF, nT:nT, nA:nT-nF, nF:nF });
    });

    lojas.forEach(function(l) { l.seccoes.sort(function(a,b){ return b.pA - a.pA; }); });

    document.getElementById('sub-info').textContent = lojas.length + ' lojas · ' + ultimaSemana;
    document.getElementById('periodo').textContent = '📅 ' + ultimaSemana;

    render(lojas, ultimaSemana);
  })
  .catch(function(err) {
    document.getElementById('app').innerHTML = '<div class="loading" style="color:var(--n1)">Erro ao carregar dados: ' + err.message + '</div>';
  });

function pillClass(nivel) {
  return nivel === 1 ? 'pill-n1' : nivel === 2 ? 'pill-n2' : 'pill-n3';
}

function render(lojas, ultimaSemana) {
  var html = '';

  /* LEGEND BAR */
  html += '<div class="legend-bar">';
  html += '<div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div><span class="legend-label">P</span><span class="legend-desc">= Tarefas Programadas</span></div>';
  html += '<div class="legend-sep"></div>';
  html += '<div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div><span class="legend-label">NP</span><span class="legend-desc">= Tarefas Não Programadas</span></div>';
  html += '</div>';

  /* ── DESKTOP TABLE (hidden on mobile) ── */
  html += '<div class="table-scroll">';
  html += '<div class="table-card">';
  html += '<div class="table-head">';
  ['Rank','Localização','Loja','P Total','P Abertas','P Fechadas','NP Total','NP Abertas','NP Fechadas','P vs NP','Histórico','Secções'].forEach(function(t,i) {
    html += '<div class="th' + (i <= 2 ? ' th-left' : '') + '">' + t + '</div>';
  });
  html += '</div>';

  lojas.forEach(function(l, li) {
    var pc = pillClass(l.nivel);
    var histRows = l.historico.map(function(h) {
      var hpT = Number(h['P Total'])||0, hpF = Number(h['P Fechado'])||0;
      var hnT = Number(h['NP Total'])||0, hnF = Number(h['NP Fechado'])||0;
      return '<tr><td>' + (h.Semana||'—') + '</td>'
        + '<td>' + (hpT-hpF) + '</td><td>' + hpF + '</td>'
        + '<td>' + (hnT-hnF) + '</td><td>' + hnF + '</td></tr>';
    }).join('');
    var pnpId = 'pnp-' + li;
    var chartH = Math.max(200, l.historico.length * 60 + 80);
    var histHtml = l.historico.length > 0
      ? '<div class="chart-wrap" style="height:' + chartH + 'px; margin-bottom: 20px;"><canvas id="' + pnpId + '" role="img" aria-label="Gráfico histórico"></canvas></div>'
        + '<table class="dtable"><thead><tr><th>Semana</th><th>P Abertas</th><th>P Fechadas</th><th>NP Abertas</th><th>NP Fechadas</th></tr></thead>'
        + '<tbody>' + histRows + '</tbody></table>'
      : '<p style="color:var(--ink-4);font-size:13px;">Sem dados históricos disponíveis.</p>';
    var secHtml = l.seccoes.length > 0
      ? '<div class="sec-grid">' + l.seccoes.map(function(s, si) {
          var sid = 'secchart-' + li + '-' + si;
          return '<div class="sec-card"><div class="sec-card-head">' + s.nome + '</div>'
            + '<div class="sec-card-body"><div style="height:80px;position:relative;"><canvas id="' + sid + '" role="img" aria-label="Secção ' + s.nome + '"></canvas></div></div></div>';
        }).join('') + '</div>'
      : '<p style="color:var(--ink-4);font-size:13px;">Sem secções disponíveis.</p>';

    html += '<div class="table-row">';
    html += '<div class="row-grid">';
    html += '<div class="td td-left"><div class="rank-wrap"><div class="rank-num">' + (li+1) + '</div><div class="rank-pill ' + pc + '">N' + l.nivel + '</div></div></div>';
    html += '<div class="td td-left"><div class="loc-name">' + (l.local||'—') + '</div></div>';
    html += '<div class="td td-left"><div class="loja-code">' + l.loja + '</div></div>';
    html += '<div class="td"><div class="metric-num">' + l.pT + '</div></div>';
    html += '<div class="td"><div class="metric-num">' + l.pA + '</div></div>';
    html += '<div class="td"><div class="metric-num">' + l.pF + '</div></div>';
    html += '<div class="td"><div class="metric-num">' + l.nT + '</div></div>';
    html += '<div class="td"><div class="metric-num">' + l.nA + '</div></div>';
    html += '<div class="td"><div class="metric-num">' + l.nF + '</div></div>';
    html += '<div class="td"><div class="comp-cell"><div class="comp-item"><div class="comp-badge comp-p">' + l.pctPFInt + '%</div><div class="comp-label">Prog.</div></div><div class="comp-item"><div class="comp-badge comp-np">' + l.pctNFInt + '%</div><div class="comp-label">Não Prog.</div></div></div></div>';
    html += '<div class="td"><button class="btn-act" id="btnhist-' + li + '" onclick="toggleHist(' + li + ')">↗ Histórico</button></div>';
    html += '<div class="td"><button class="btn-act" id="btnsec-' + li + '" onclick="toggleSec(' + li + ')">↗ Secções</button></div>';
    html += '</div>';
    html += '<div class="panel" id="hist-' + li + '"><div class="panel-body"><div class="panel-section-title">Evolução Histórica · ' + l.loja + '</div>' + histHtml + '</div></div>';
    html += '<div class="panel" id="sec-' + li + '"><div class="panel-body"><div class="panel-section-title">Detalhe por Secção · ' + l.seccoes.length + ' secções</div>' + secHtml + '</div></div>';
    html += '</div>';
  });
  html += '</div></div>';

  /* ── MOBILE CARDS (hidden on desktop) ── */
  html += '<div class="mobile-list">';
  lojas.forEach(function(l, li) {
    var pc = pillClass(l.nivel);
    var histRows = l.historico.map(function(h) {
      var hpT = Number(h['P Total'])||0, hpF = Number(h['P Fechado'])||0;
      var hnT = Number(h['NP Total'])||0, hnF = Number(h['NP Fechado'])||0;
      return '<tr><td>' + (h.Semana||'—') + '</td>'
        + '<td>' + (hpT-hpF) + '</td><td>' + hpF + '</td>'
        + '<td>' + (hnT-hnF) + '</td><td>' + hnF + '</td></tr>';
    }).join('');
    var mpnpId = 'mpnp-' + li;
    var mchartH = Math.max(200, l.historico.length * 60 + 80);
    var mhistHtml = l.historico.length > 0
      ? '<div class="chart-wrap" style="height:' + mchartH + 'px; margin-bottom: 20px;"><canvas id="' + mpnpId + '" role="img" aria-label="Gráfico histórico"></canvas></div>'
        + '<div style="overflow-x:auto;"><table class="dtable" style="min-width:320px;"><thead><tr><th>Semana</th><th>P Ab.</th><th>P Fec.</th><th>NP Ab.</th><th>NP Fec.</th></tr></thead>'
        + '<tbody>' + histRows + '</tbody></table></div>'
      : '<p style="color:var(--ink-4);font-size:13px;">Sem dados históricos.</p>';
    var msecHtml = l.seccoes.length > 0
      ? '<div class="sec-grid" style="grid-template-columns:1fr;">' + l.seccoes.map(function(s, si) {
          var msid = 'msecchart-' + li + '-' + si;
          return '<div class="sec-card"><div class="sec-card-head">' + s.nome + '</div>'
            + '<div class="sec-card-body"><div style="height:70px;position:relative;"><canvas id="' + msid + '" role="img" aria-label="Secção ' + s.nome + '"></canvas></div></div></div>';
        }).join('') + '</div>'
      : '<p style="color:var(--ink-4);font-size:13px;">Sem secções disponíveis.</p>';

    html += '<div class="m-card-wrap">';
    html += '<div class="m-card">';
    html += '<div class="m-head"><div class="m-rank-num">' + (li+1) + '</div><div class="rank-pill ' + pc + '" style="align-self:flex-start;margin-top:4px">N' + l.nivel + '</div><div class="m-info"><div class="m-loja">' + l.loja + '</div><div class="m-local">' + (l.local||'—') + '</div></div></div>';
    html += '<div class="m-metrics">';
    [{l:'P Total',v:l.pT,p:null},{l:'P Abertas',v:l.pA,p:l.pT>0?((l.pA/l.pT*100).toFixed(1))+'%':null},{l:'P Fechadas',v:l.pF,p:l.pT>0?((l.pF/l.pT*100).toFixed(1))+'%':null},
     {l:'NP Total',v:l.nT,p:null},{l:'NP Abertas',v:l.nA,p:l.nT>0?((l.nA/l.nT*100).toFixed(1))+'%':null},{l:'NP Fechadas',v:l.nF,p:l.nT>0?((l.nF/l.nT*100).toFixed(1))+'%':null}
    ].forEach(function(m) {
      html += '<div class="m-metric"><div class="m-metric-label">' + m.l + '</div><div class="m-metric-num">' + m.v + '</div>' + (m.p ? '<div class="m-metric-pct">' + m.p + '</div>' : '') + '</div>';
    });
    html += '</div>';
    html += '<div class="m-comp"><div class="m-comp-item"><div class="m-comp-label">Prog. Fechadas</div><div class="m-comp-val" style="color:var(--blue)">' + l.pctPFInt + '%</div></div><div class="m-comp-item"><div class="m-comp-label">Não Prog. Fechadas</div><div class="m-comp-val" style="color:var(--green)">' + l.pctNFInt + '%</div></div></div>';
    html += '<div class="m-actions"><button class="btn-act" id="mbtnhist-' + li + '" onclick="mtoggleHist(' + li + ')">↗ Histórico</button><button class="btn-act" id="mbtnsec-' + li + '" onclick="mtoggleSec(' + li + ')">↗ Secções</button></div>';
    html += '</div>';
    html += '<div class="panel" id="mhist-' + li + '"><div class="panel-body"><div class="panel-section-title">Evolução Histórica · ' + l.loja + '</div>' + mhistHtml + '</div></div>';
    html += '<div class="panel" id="msec-' + li + '"><div class="panel-body"><div class="panel-section-title">Detalhe por Secção · ' + l.seccoes.length + ' secções</div>' + msecHtml + '</div></div>';
    html += '</div>';
  });
  html += '</div>';

  /* BOTTOM */
  html += '<div class="bottom-bar">';
  html += '<div class="level-legend"><div class="level-legend-title">Classificação de Nível</div><div class="level-items">';
  html += '<div class="level-item"><div class="level-dot pill-n1">N1</div><span>0–20% tarefas programadas fechadas — crítico</span></div>';
  html += '<div class="level-item"><div class="level-dot pill-n2">N2</div><span>21–40% fechadas — em atenção</span></div>';
  html += '<div class="level-item"><div class="level-dot pill-n3">N3</div><span>41%+ fechadas — satisfatório</span></div>';
  html += '</div></div>';
  html += '<div class="action-banner"><div class="action-icon">⚠</div><div><div class="action-title">Ação Recomendada</div><div class="action-desc">Contactar urgentemente os responsáveis das lojas classificadas como N1. Verificar causa das tarefas não programadas em aberto.</div></div></div>';
  html += '</div>';

  document.getElementById('app').innerHTML = html;

  /* CHARTS */
  lojas.forEach(function(l, li) {
    var pnpEl = document.getElementById('pnp-' + li);
    if (pnpEl && l.historico.length > 0) {
      var semanas = [], pPcts = [], nPcts = [];
      l.historico.forEach(function(h) {
        semanas.push(h.Semana || '');
        var pT = Number(h['P Total'])||0, pF = Number(h['P Fechado'])||0;
        var nT = Number(h['NP Total'])||0, nF = Number(h['NP Fechado'])||0;
        pPcts.push(pT > 0 ? parseFloat((pF/pT*100).toFixed(1)) : 0);
        nPcts.push(nT > 0 ? parseFloat((nF/nT*100).toFixed(1)) : 0);
      });
      charts['pnp-' + li] = new Chart(pnpEl.getContext('2d'), {
        type: 'bar',
        plugins: [ChartDataLabels],
        data: {
          labels: semanas,
          datasets: [
            { label: 'Programadas (%)', data: pPcts, backgroundColor: 'rgba(45,95,160,.75)', borderColor: 'rgba(45,95,160,1)', borderWidth: 1, borderRadius: 3 },
            { label: 'Não Programadas (%)', data: nPcts, backgroundColor: 'rgba(46,125,82,.75)', borderColor: 'rgba(46,125,82,1)', borderWidth: 1, borderRadius: 3 }
          ]
        },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          layout: { padding: { right: 55 } },
          plugins: {
            datalabels: { anchor:'end', align:'right', formatter: function(v){ return v+'%'; }, font:{ size:12, weight:'600' }, color:'#3a3835' },
            legend: { position:'top', labels:{ font:{size:12}, color:'#3a3835', padding:12, usePointStyle:true } },
            tooltip: { callbacks: { label: function(c){ return c.dataset.label + ': ' + c.parsed.x + '%'; } } }
          },
          scales: {
            x: { beginAtZero:true, max:100, ticks:{ color:'#6b6860', font:{size:11} }, grid:{ color:'rgba(0,0,0,.04)' } },
            y: { ticks:{ color:'#3a3835', font:{size:11, weight:'500'} }, grid:{ display:false } }
          }
        }
      });
    }

    l.seccoes.forEach(function(s, si) {
      var sEl = document.getElementById('secchart-' + li + '-' + si);
      if (!sEl) return;
      var pctP = s.pT > 0 ? parseFloat((s.pF/s.pT*100).toFixed(1)) : 0;
      var pctN = s.nT > 0 ? parseFloat((s.nF/s.nT*100).toFixed(1)) : 0;
      charts['secchart-' + li + '-' + si] = new Chart(sEl.getContext('2d'), {
        type: 'bar', plugins: [ChartDataLabels],
        data: { labels: ['Programadas', 'Não Prog.'], datasets: [{ data: [pctP, pctN], backgroundColor: ['rgba(45,95,160,.75)', 'rgba(46,125,82,.75)'], borderRadius: 3, borderWidth: 0 }] },
        options: { indexAxis:'y', responsive:true, maintainAspectRatio:false, layout:{ padding:{ right:45 } },
          plugins: { datalabels:{ anchor:'end', align:'right', formatter:function(v){ return v+'%'; }, font:{size:11,weight:'600'}, color:'#3a3835' }, legend:{ display:false } },
          scales: { x:{ beginAtZero:true, max:100, display:false }, y:{ ticks:{ font:{size:11,weight:'500'}, color:'#3a3835' }, grid:{ display:false } } }
        }
      });
    });

    /* Mobile charts (rendered but lazy — only visible when panel opens) */
    var mpnpEl = document.getElementById('mpnp-' + li);
    if (mpnpEl && l.historico.length > 0) {
      var msemanas = [], mpPcts = [], mnPcts = [];
      l.historico.forEach(function(h) {
        msemanas.push(h.Semana || '');
        var pT2 = Number(h['P Total'])||0, pF2 = Number(h['P Fechado'])||0;
        var nT2 = Number(h['NP Total'])||0, nF2 = Number(h['NP Fechado'])||0;
        mpPcts.push(pT2 > 0 ? parseFloat((pF2/pT2*100).toFixed(1)) : 0);
        mnPcts.push(nT2 > 0 ? parseFloat((nF2/nT2*100).toFixed(1)) : 0);
      });
      charts['mpnp-' + li] = new Chart(mpnpEl.getContext('2d'), {
        type: 'bar', plugins: [ChartDataLabels],
        data: { labels: msemanas, datasets: [
          { label: 'Programadas (%)', data: mpPcts, backgroundColor: 'rgba(45,95,160,.75)', borderRadius: 3, borderWidth: 1 },
          { label: 'Não Prog. (%)', data: mnPcts, backgroundColor: 'rgba(46,125,82,.75)', borderRadius: 3, borderWidth: 1 }
        ]},
        options: { indexAxis:'y', responsive:true, maintainAspectRatio:false, layout:{ padding:{ right:50 } },
          plugins: { datalabels:{ anchor:'end', align:'right', formatter:function(v){ return v+'%'; }, font:{size:11,weight:'600'}, color:'#3a3835' }, legend:{ position:'top', labels:{ font:{size:11}, color:'#3a3835', padding:10, usePointStyle:true } } },
          scales: { x:{ beginAtZero:true, max:100, ticks:{ color:'#6b6860', font:{size:10} } }, y:{ ticks:{ color:'#3a3835', font:{size:10,weight:'500'} }, grid:{ display:false } } }
        }
      });
    }
    l.seccoes.forEach(function(s, si) {
      var msEl = document.getElementById('msecchart-' + li + '-' + si);
      if (!msEl) return;
      var pctP2 = s.pT > 0 ? parseFloat((s.pF/s.pT*100).toFixed(1)) : 0;
      var pctN2 = s.nT > 0 ? parseFloat((s.nF/s.nT*100).toFixed(1)) : 0;
      charts['msecchart-' + li + '-' + si] = new Chart(msEl.getContext('2d'), {
        type: 'bar', plugins: [ChartDataLabels],
        data: { labels: ['Prog.', 'Não Prog.'], datasets: [{ data: [pctP2, pctN2], backgroundColor: ['rgba(45,95,160,.75)', 'rgba(46,125,82,.75)'], borderRadius: 3, borderWidth: 0 }] },
        options: { indexAxis:'y', responsive:true, maintainAspectRatio:false, layout:{ padding:{ right:40 } },
          plugins: { datalabels:{ anchor:'end', align:'right', formatter:function(v){ return v+'%'; }, font:{size:11,weight:'600'}, color:'#3a3835' }, legend:{ display:false } },
          scales: { x:{ beginAtZero:true, max:100, display:false }, y:{ ticks:{ font:{size:11,weight:'500'}, color:'#3a3835' }, grid:{ display:false } } }
        }
      });
    });
  });
}
</script>
</body>
</html>
