<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f2f2f2; color: #222; }

  .header {
    background: #fff;
    border-bottom: 3px solid #222;
    padding: 18px 28px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .header h1 { font-size: 20px; color: #111; }
  .header .sub { font-size: 13px; color: #666; margin-top: 3px; }
  .periodo {
    display: inline-block; padding: 5px 14px;
    background: #f7f7f7; border-left: 4px solid #555;
    border-radius: 2px; font-size: 13px; color: #333;
  }

  .loading {
    text-align: center; padding: 60px 20px; color: #888; font-size: 16px;
  }

  .container { max-width: 1150px; margin: 24px auto; padding: 0 16px 40px; }

  .legenda {
    font-size: 12px; color: #888; margin-bottom: 16px; padding: 10px 14px;
    background: #fff; border-radius: 6px; border: 1px solid #e8e8e8;
  }

  .loja-card {
    background: #fff; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    margin-bottom: 20px; overflow: hidden;
  }
  .loja-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; background: #fafafa;
    border-bottom: 1px solid #e8e8e8; flex-wrap: wrap; gap: 10px;
  }
  .loja-info { display: flex; align-items: center; gap: 12px; }
  .rank { font-size: 18px; font-weight: bold; min-width: 32px; }
  .loja-nome { font-size: 16px; font-weight: bold; color: #111; }
  .loja-local { font-size: 13px; color: #666; margin-top: 2px; }
  .nivel-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 12px; font-weight: bold; border: 1px solid; margin-top: 3px;
  }
  .n1 { color: #27ae60; border-color: #27ae60; }
  .n2 { color: #e65100; border-color: #e65100; }
  .n3 { color: #b71c1c; border-color: #b71c1c; }

  .loja-stats {
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .stat-box {
    text-align: center; background: #f7f7f7;
    border: 1px solid #e0e0e0; border-radius: 6px;
    padding: 8px 16px; min-width: 120px;
  }
  .stat-val { font-size: 22px; font-weight: bold; color: #111; }
  .stat-lbl { font-size: 11px; color: #888; margin-top: 2px; }
  .stat-sub { font-size: 12px; color: #555; margin-top: 4px; }

  .seccoes-wrap { padding: 0; }
  .seccoes-header {
    display: grid; grid-template-columns: 1fr 130px 130px 120px;
    padding: 8px 20px; background: #222; color: #fff;
    font-size: 13px; font-weight: 500; gap: 8px;
  }
  .seccao-row {
    display: grid; grid-template-columns: 1fr 130px 130px 120px;
    padding: 0; border-top: 1px solid #f0f0f0; gap: 8px;
  }
  .seccao-summary {
    display: contents; cursor: pointer;
  }
  .seccao-summary > div {
    padding: 10px 20px; font-size: 13px;
    transition: background 0.12s;
  }
  .seccao-row:hover .seccao-summary > div { background: #f9f9f9; }
  .seccao-nome { font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .seccao-arrow { font-size: 12px; color: #aaa; transition: transform 0.2s; }
  .seccao-arrow.open { transform: rotate(90deg); }
  .seccao-val { text-align: center; font-weight: bold; }
  .seccao-btn {
    display: flex; align-items: center; justify-content: center;
  }
  .btn-ver {
    background: none; border: 1px solid #ccc; border-radius: 5px;
    padding: 4px 12px; font-size: 12px; color: #444; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .btn-ver:hover { background: #f0f0f0; border-color: #999; }
  .btn-ver.open { background: #222; color: #fff; border-color: #222; }

  .detalhe {
    display: none; background: #f7f7f7;
    border-top: 1px solid #e8e8e8;
    padding: 12px 20px 16px;
    grid-column: 1 / -1;
  }
  .detalhe.visible { display: block; }
  .detalhe-titulo {
    font-size: 13px; font-weight: bold; color: #333; margin-bottom: 8px;
  }
  .tarefas-table {
    width: 100%; border-collapse: collapse; font-size: 12px;
  }
  .tarefas-table thead tr { background: #444; color: #fff; }
  .tarefas-table thead th { padding: 6px 10px; font-weight: 500; text-align: left; }
  .tarefas-table tbody tr { border-bottom: 1px solid #e8e8e8; background: #fff; }
  .tarefas-table tbody td { padding: 6px 10px; color: #333; }
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 11px; font-weight: 600;
  }
  .badge-p   { background: #e8f5e9; color: #2e7d32; }
  .badge-np  { background: #fff8e1; color: #c67c00; }
  .badge-a1  { background: #f0f0f0; color: #555; }
  .badge-a2  { background: #fff8e1; color: #c67c00; }
  .badge-a3  { background: #fce8e6; color: #b71c1c; }

  .tendencia { font-size: 13px; margin-top: 6px; }
  .up   { color: #c0392b; font-weight: bold; }
  .down { color: #27ae60; font-weight: bold; }

  .hist-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 8px; }
  .hist-table th { background: #444; color: #fff; padding: 4px 8px; text-align: left; }
  .hist-table td { padding: 4px 8px; border-bottom: 1px solid #e8e8e8; }
  .hist-atual { background: #f0f0f0; font-weight: bold; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 Análise Semanal IM</h1>
    <div class="sub" id="sub-gerado">A carregar dados...</div>
  </div>
  <div class="periodo" id="periodo-label">—</div>
</div>

<div class="container">
  <div id="app"><div class="loading">⏳ A carregar dados do ficheiro...</div></div>
</div>

<script>
// -------------------------------------------------------
// Tarefas HACCP de teste por secção
// (Em produção, estas viriam do dados.json gerado pelo n8n)
// -------------------------------------------------------
const TAREFAS_TESTE = {
  'Frescos LS': [
    {c:'HACCP-FL-001',d:'Verificação temperatura câmara frio (+2°C a +4°C)',t:'P',a:3},
    {c:'HACCP-FL-002',d:'Registo temperaturas — entrada de mercadoria',t:'P',a:2},
    {c:'HACCP-FL-003',d:'Inspeção visual de datas de validade',t:'P',a:5},
    {c:'HACCP-FL-004',d:'Limpeza e desinfeção de superfícies de corte',t:'NP',a:4},
    {c:'HACCP-FL-005',d:'Controlo de pragas — verificação armadilhas',t:'NP',a:7},
  ],
  'Talho': [
    {c:'HACCP-TL-001',d:'Verificação temperatura câmara carne (0°C a +2°C)',t:'P',a:4},
    {c:'HACCP-TL-002',d:'Registo limpeza de equipamentos de corte',t:'P',a:3},
    {c:'HACCP-TL-003',d:'Controlo de pH da carne fresca',t:'NP',a:5},
    {c:'HACCP-TL-004',d:'Verificação integridade embalagens a vácuo',t:'P',a:2},
  ],
  'Charcutaria e queijo': [
    {c:'HACCP-CQ-001',d:'Controlo temperatura de exposição (+2°C a +6°C)',t:'P',a:5},
    {c:'HACCP-CQ-002',d:'Verificação datas de validade após abertura',t:'P',a:3},
    {c:'HACCP-CQ-003',d:'Registo de limpeza de fatiadora',t:'NP',a:6},
    {c:'HACCP-CQ-004',d:'Rotação de stocks — FIFO',t:'NP',a:4},
  ],
  'Frutas e legumes': [
    {c:'HACCP-FV-001',d:'Inspeção visual à receção — estado e higiene',t:'P',a:3},
    {c:'HACCP-FV-002',d:'Verificação temperatura armazenagem (+8°C a +12°C)',t:'P',a:2},
    {c:'HACCP-FV-003',d:'Registo de desperdício e produto não conforme',t:'NP',a:4},
  ],
  'Peixaria': [
    {c:'HACCP-PX-001',d:'Controlo temperatura câmara peixe fresco (0°C a +2°C)',t:'P',a:4},
    {c:'HACCP-PX-002',d:'Verificação temperatura do gelo expositores',t:'P',a:5},
    {c:'HACCP-PX-003',d:'Registo origem e rastreabilidade do produto',t:'P',a:3},
    {c:'HACCP-PX-004',d:'Limpeza e desinfeção de bancadas e utensílios',t:'NP',a:6},
  ],
  'Padaria': [
    {c:'HACCP-PD-001',d:'Controlo temperatura de fermentação (24°C a 28°C)',t:'P',a:2},
    {c:'HACCP-PD-002',d:'Verificação temperatura forno (mín. 220°C)',t:'P',a:3},
    {c:'HACCP-PD-003',d:'Registo limpeza equipamentos de fabrico',t:'NP',a:4},
  ],
  'Bar e cafetaria': [
    {c:'HACCP-BC-001',d:'Temperatura máquina de café (92°C a 96°C)',t:'P',a:3},
    {c:'HACCP-BC-002',d:'Verificação temperatura vitrine fria (+2°C a +5°C)',t:'P',a:5},
    {c:'HACCP-BC-003',d:'Limpeza e desinfeção de superfícies de trabalho',t:'NP',a:2},
  ],
  'Pronto a comer': [
    {c:'HACCP-PC-001',d:'Temperatura serviço alimentos quentes (>63°C)',t:'P',a:4},
    {c:'HACCP-PC-002',d:'Temperatura serviço alimentos frios (<5°C)',t:'P',a:3},
    {c:'HACCP-PC-003',d:'Registo limpeza de utensílios de serviço',t:'NP',a:2},
  ],
  'Armazém': [
    {c:'HACCP-AZ-001',d:'Verificação temperatura armazém seco (18°C a 22°C)',t:'P',a:2},
    {c:'HACCP-AZ-002',d:'Controlo de pragas — inspeção visual',t:'NP',a:7},
  ],
};

function badgeAtraso(a) {
  const cls = a >= 5 ? 'badge-a3' : a >= 3 ? 'badge-a2' : 'badge-a1';
  return '<span class="badge ' + cls + '">' + a + 'd atraso</span>';
}

function renderTarefas(seccaoNome, pAberto, npAberto) {
  const tarefas = TAREFAS_TESTE[seccaoNome] || [];
  if (!tarefas.length) {
    return '<p style="color:#aaa;font-size:13px">Sem detalhe de tarefas disponível (dados de teste).</p>';
  }
  const rows = tarefas.map(function(t) {
    const tbadge = t.t === 'P'
      ? '<span class="badge badge-p">Programada</span>'
      : '<span class="badge badge-np">Não Prog.</span>';
    return '<tr>'
      + '<td style="font-family:monospace;color:#888">' + t.c + '</td>'
      + '<td>' + t.d + '</td>'
      + '<td style="text-align:center">' + tbadge + '</td>'
      + '<td style="text-align:center">' + badgeAtraso(t.a) + '</td>'
      + '</tr>';
  }).join('');
  return '<div class="detalhe-titulo">Tarefas não cumpridas em ' + seccaoNome
    + ' — P em aberto: <b>' + pAberto + '</b> · NP em aberto: <b>' + npAberto + '</b></div>'
    + '<table class="tarefas-table">'
    + '<thead><tr><th style="width:110px">Código</th><th>Tarefa HACCP</th><th style="width:120px;text-align:center">Tipo</th><th style="width:100px;text-align:center">Atraso</th></tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table>'
    + '<p style="font-size:11px;color:#bbb;margin-top:8px;text-align:right">⚠️ Tarefas de teste — não correspondem a dados reais</p>';
}

const openState = {};

function toggleSeccao(lojaIdx, secIdx, seccaoNome, pAberto, npAberto) {
  const key = lojaIdx + '-' + secIdx;
  const det  = document.getElementById('det-' + key);
  const btn  = document.getElementById('btn-' + key);
  const arr  = document.getElementById('arr-' + key);
  if (!det) return;
  if (openState[key]) {
    det.classList.remove('visible');
    btn.classList.remove('open');
    btn.textContent = '▶ Ver tarefas';
    if (arr) arr.classList.remove('open');
    openState[key] = false;
  } else {
    if (!det.dataset.loaded) {
      det.innerHTML = renderTarefas(seccaoNome, pAberto, npAberto);
      det.dataset.loaded = '1';
    }
    det.classList.add('visible');
    btn.classList.add('open');
    btn.textContent = '▼ Fechar';
    if (arr) arr.classList.add('open');
    openState[key] = true;
  }
}

function nivelClass(n) {
  return n === 1 ? 'n1' : n === 2 ? 'n2' : 'n3';
}

function corPct(pct) {
  const v = parseFloat(pct);
  if (v <= 20) return '#27ae60';
  if (v <= 40) return '#e65100';
  return '#b71c1c';
}

function renderApp(dados) {
  const lojas = dados.lojas || [];
  const semana = dados.semana || '—';
  const gerado = dados.gerado || '—';

  document.getElementById('sub-gerado').textContent = 'Gerado em: ' + gerado;
  document.getElementById('periodo-label').innerHTML = '📅 Período: <strong>' + semana + '</strong>';

  const app = document.getElementById('app');

  const legenda = '<div class="legenda">'
    + '🔴 Top 3 críticas &nbsp;|&nbsp; 🟡 Em alerta &nbsp;|&nbsp; '
    + '<span style="color:#27ae60;font-weight:bold">Nível 1</span> = 0–20% P não cumpridas &nbsp;|&nbsp; '
    + '<span style="color:#e65100;font-weight:bold">Nível 2</span> = 21–40% &nbsp;|&nbsp; '
    + '<span style="color:#b71c1c;font-weight:bold">Nível 3</span> = 41%+ &nbsp;|&nbsp; '
    + 'Clique em "Ver tarefas" para expandir o detalhe de cada secção'
    + '</div>';

  const cards = lojas.map(function(l, li) {
    const emoji = li < 3 ? '🔴' : '🟡';

    // Histórico
    let histHtml = '';
    if (l.historico && l.historico.length > 0) {
      const hRows = l.historico.map(function(h) {
        return '<tr><td>' + h.semana + '</td><td style="text-align:center;font-weight:bold">' + h.pAberto + '</td></tr>';
      }).join('');
      const diffTxt = l.diff === null ? '—'
        : l.diff > 0 ? '<span class="up">▲ +' + l.diff + '</span>'
        : l.diff < 0 ? '<span class="down">▼ ' + l.diff + '</span>'
        : '→';
      histHtml = '<table class="hist-table">'
        + '<tr><th>Semana</th><th>P em aberto</th></tr>'
        + hRows
        + '<tr class="hist-atual"><td>' + semana + ' (atual)</td><td style="text-align:center">' + l.pAberto + '</td></tr>'
        + '</table>'
        + '<div class="tendencia">Tendência: ' + diffTxt + '</div>';
    } else {
      histHtml = '<span style="font-size:12px;color:#aaa">Sem histórico anterior</span>';
    }

    // Secções
    const seccoes = l.seccoes || [];
    const secRows = seccoes.map(function(s, si) {
      const key = li + '-' + si;
      return '<div class="seccao-row">'
        + '<div class="seccao-summary" onclick="toggleSeccao(' + li + ',' + si + ',\'' + s.nome.replace(/'/g, "\\'") + '\',' + s.pAberto + ',' + s.npAberto + ')">'
        + '<div class="seccao-nome"><span class="seccao-arrow" id="arr-' + key + '">▶</span>' + s.nome + '</div>'
        + '<div class="seccao-val" style="color:#111">' + (s.pAberto > 0 ? s.pAberto : '<span style="color:#bbb">—</span>') + '</div>'
        + '<div class="seccao-val" style="color:#555">' + (s.npAberto > 0 ? s.npAberto : '<span style="color:#bbb">—</span>') + '</div>'
        + '<div class="seccao-btn"><button class="btn-ver" id="btn-' + key + '" onclick="event.stopPropagation();toggleSeccao(' + li + ',' + si + ',\'' + s.nome.replace(/'/g, "\\'") + '\',' + s.pAberto + ',' + s.npAberto + ')">▶ Ver tarefas</button></div>'
        + '</div>'
        + '<div class="detalhe" id="det-' + key + '" style="grid-column:1/-1"></div>'
        + '</div>';
    }).join('');

    return '<div class="loja-card">'
      + '<div class="loja-header">'
      + '<div class="loja-info">'
      + '<span class="rank">' + emoji + ' ' + (li + 1) + '</span>'
      + '<div>'
      + '<div class="loja-nome">' + l.loja + '</div>'
      + '<div class="loja-local">' + (l.localidade || '—') + '</div>'
      + '<span class="nivel-badge ' + nivelClass(l.nivel) + '">Nível ' + l.nivel + '</span>'
      + '</div>'
      + '</div>'
      + '<div class="loja-stats">'
      + '<div class="stat-box">'
      + '<div class="stat-val">' + l.pAberto + '</div>'
      + '<div class="stat-lbl">P em aberto</div>'
      + '<div class="stat-sub" style="color:' + corPct(l.pctPNaoCumpridas) + ';font-weight:bold">' + l.pctPNaoCumpridas + '% não cumpridas</div>'
      + '<div class="stat-sub" style="color:#27ae60">' + l.pctPCumpridas + '% cumpridas</div>'
      + '</div>'
      + '<div class="stat-box">'
      + '<div class="stat-val">' + l.npAberto + '</div>'
      + '<div class="stat-lbl">NP em aberto</div>'
      + '<div class="stat-sub" style="color:' + corPct(l.pctNPNaoCumpridas) + ';font-weight:bold">' + l.pctNPNaoCumpridas + '% não cumpridas</div>'
      + '<div class="stat-sub" style="color:#27ae60">' + l.pctNPCumpridas + '% cumpridas</div>'
      + '</div>'
      + '<div class="stat-box" style="min-width:160px">' + histHtml + '</div>'
      + '</div>'
      + '</div>'
      + '<div class="seccoes-wrap">'
      + '<div class="seccoes-header"><span>Secção</span><span style="text-align:center">P em aberto</span><span style="text-align:center">NP em aberto</span><span style="text-align:center">Detalhe</span></div>'
      + secRows
      + '</div>'
      + '</div>';
  }).join('');

  app.innerHTML = legenda + cards;
}

// -------------------------------------------------------
// Carregar dados.json do GitHub Pages
// -------------------------------------------------------
fetch('dados.json?t=' + Date.now())
  .then(function(r) {
    if (!r.ok) throw new Error('Ficheiro dados.json não encontrado');
    return r.json();
  })
  .then(function(dados) {
    renderApp(dados);
  })
  .catch(function(err) {
    document.getElementById('app').innerHTML =
      '<div class="loading" style="color:#c0392b">❌ Erro ao carregar dados: ' + err.message + '<br><br>'
      + '<span style="font-size:13px;color:#888">Certifica-te que o ficheiro <b>dados.json</b> existe no repositório GitHub.</span></div>';
  });
</script>
</body>
</html>
