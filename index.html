<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f2f2f2; color: #222; }
  .header { background: #fff; border-bottom: 3px solid #222; padding: 18px 28px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,.08); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .header h1 { font-size: 22px; color: #111; }
  .container { max-width: 1180px; margin: 24px auto; padding: 0 16px 40px; }
  .loading { text-align: center; padding: 100px 20px; color: #666; font-size: 17px; }
  .error { color: #c0392b; background: #fff; padding: 20px; border-radius: 8px; margin: 20px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 Análise Semanal IM</h1>
    <div id="sub-gerado">A carregar...</div>
  </div>
  <div id="periodo-label">Período: —</div>
</div>

<div class="container">
  <div id="app"><div class="loading">⏳ A processar o ficheiro Excel...</div></div>
</div>

<script>
const EXCEL_FILE = 'analise-im.xlsx';   // ← ALTERA AQUI se usares outro nome

async function carregarExcel() {
  const app = document.getElementById('app');
  
  try {
    console.log('Tentando carregar:', EXCEL_FILE);
    
    const resp = await fetch(EXCEL_FILE + '?t=' + Date.now());
    if (!resp.ok) throw new Error(`Ficheiro não encontrado (${resp.status})`);

    const arrayBuffer = await resp.arrayBuffer();
    const wb = XLSX.read(arrayBuffer, { type: 'array' });

    console.log('Sheets encontradas:', wb.SheetNames);

    const sheetAnalise = wb.Sheets['Análise'] || wb.Sheets[wb.SheetNames[0]];
    const sheetHistorico = wb.Sheets['Por Loja Histórico'] || wb.Sheets[wb.SheetNames[1]];

    if (!sheetHistorico) throw new Error('Sheet "Por Loja Histórico" não encontrada');

    const analiseData = XLSX.utils.sheet_to_json(sheetAnalise);
    const historicoData = XLSX.utils.sheet_to_json(sheetHistorico);

    // ... (resto da lógica igual à anterior - vou resumir por brevidade)
    const semanas = historicoData.map(r => String(r['Semana'] || '').trim()).filter(Boolean);
    const ultimaSemana = semanas[semanas.length - 1];

    if (!ultimaSemana) throw new Error('Não foi possível encontrar a última semana');

    // Processamento das lojas (mesma lógica do n8n)
    let lojas = historicoData
      .filter(r => String(r['Semana'] || '').trim() === ultimaSemana && r['Loja'])
      .map(r => {
        const pTotal = Number(r['P Total']) || 0;
        const pAberto = Number(r['P Aberto']) || 0;
        // ... (mantém o resto igual ao teu código)
        const pctPAberto = pTotal > 0 ? (pAberto / pTotal * 100).toFixed(1) : '0.0';
        const pctP = parseFloat(pctPAberto);
        const nivel = pctP <= 20 ? 1 : pctP <= 40 ? 2 : 3;

        return {
          loja: String(r['Loja']).trim(),
          localidade: String(r['Resumo contactos.Localidade'] || r['IM.Localidade'] || '').trim(),
          pAberto, pTotal, npAberto: Number(r['NP Aberto']) || 0,
          pctPAberto, nivel,
          historico: [], seccoes: []
        };
      })
      .filter(r => r.pAberto > 0);

    lojas.sort((a, b) => b.pAberto - a.pAberto);
    const topLojas = lojas.slice(0, 10);

    // Atualiza cabeçalho
    document.getElementById('sub-gerado').innerHTML = `Gerado em: ${new Date().toLocaleDateString('pt-PT')}`;
    document.getElementById('periodo-label').innerHTML = `Período: <strong>${ultimaSemana}</strong>`;

    // Render simples (podes melhorar depois)
    let html = `<p style="margin:15px 0; color:#555">Encontradas ${topLojas.length} lojas com tarefas em aberto</p>`;
    topLojas.forEach(l => {
      html += `<div style="background:white;padding:15px;margin:10px 0;border-radius:6px;">
        <strong>${l.loja}</strong> - ${l.localidade} <br>
        <span style="color:#c0392b">P Aberto: ${l.pAberto} (${l.pctPAberto}%)</span>
      </div>`;
    });

    app.innerHTML = html;

  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="error">
      <strong>❌ Erro ao carregar os dados:</strong><br><br>
      ${err.message}<br><br>
      <small>Verifica se o ficheiro <b>${EXCEL_FILE}</b> está na raiz do repositório.</small>
    </div>`;
  }
}

carregarExcel();
</script>
</body>
</html>
