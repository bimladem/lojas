<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f0f0; color: #222; font-size: 14px; }

.header {
  background: #fff; border-bottom: 3px solid #222;
  padding: 16px 28px; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.header h1 { font-size: 20px; color: #111; }
.header .sub { font-size: 12px; color: #777; margin-top: 3px; }
.periodo { padding: 5px 14px; background: #f7f7f7; border-left: 4px solid #555; border-radius: 2px; font-size: 13px; color: #333; }

.container { max-width: 1250px; margin: 24px auto; padding: 0 16px 48px; }
.loading { text-align: center; padding: 80px 20px; color: #888; font-size: 16px; }

.legenda { font-size: 12px; color: #888; margin-bottom: 16px; padding: 10px 16px; background: #fff; border-radius: 6px; border: 1px solid #e8e8e8; }

.tabela-wrap { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }

.tabela-header {
  display: grid;
  grid-template-columns: 80px 170px 230px 160px 160px 80px 80px;
  background: #222; color: #fff;
  padding: 10px 14px; gap: 8px; font-size: 13px; font-weight: 500;
}

.loja-linha {
  display: grid;
  grid-template-columns: 80px 170px 230px 160px 160px 80px 80px;
  padding: 12px 14px; gap: 8px; align-items: center;
  border-top: 1px solid #e8e8e8;
}
.loja-linha:hover { background: #fafafa; }

.nivel-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; border: 1px solid; }
.n1 { color: #27ae60; border-color: #27ae60; }
.n2 { color: #e65100; border-color: #e65100; }
.n3 { color: #b71c1c; border-color: #b71c1c; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 Análise Semanal IM</h1>
    <div class="sub" id="sub-info">A carregar...</div>
  </div>
  <div class="periodo" id="periodo-label">—</div>
</div>

<div class="container">
  <div id="app"><div class="loading">⏳ A carregar dados...</div></div>
</div>

<script>
fetch('dados.json?t=' + Date.now())
  .then(r => r.json())
  .then(json => {
    const data = json.data || [];
    
    // Separar lojas principais (as que têm "P Total")
    let lojas = data
      .filter(item => item.Loja && item['P Total'] !== undefined)
      .map(item => ({
        loja: item.Loja,
        localidade: item['IM.Localidade'] || '',
        pTotal: Number(item['P Total']) || 0,
        pAberto: Number(item['P Aberto']) || 0,
        pFechado: Number(item['P Fechado']) || 0,
        npTotal: Number(item['NP Total']) || 0,
        npAberto: Number(item['NP Aberto']) || 0,
        npFechado: Number(item['NP Fechado']) || 0,
        pctPAberto: item['Verificação Programadas']?.replace('%','') || '0',
        pctNPAberto: item['Verificação Não Programadas']?.replace('%','') || '0',
        nivel: 0,
        seccoes: []
      }));

    // Calcular nível
    lojas.forEach(l => {
      const pct = parseFloat(l.pctPAberto);
      l.nivel = pct <= 20 ? 1 : pct <= 40 ? 2 : 3;
    });

    // Ordenar por P Aberto
    lojas.sort((a, b) => b.pAberto - a.pAberto);
    const topLojas = lojas.slice(0, 10);

    // Adicionar secções (para as lojas do top 10)
    const seccoesPorLoja = {};
    data.forEach(item => {
      if (item.Secção && item.Loja) {
        const lojaId = item.Loja;
        if (!seccoesPorLoja[lojaId]) seccoesPorLoja[lojaId] = [];
        if (item['P Aberto'] > 0 || item['NP Aberto'] > 0) {
          seccoesPorLoja[lojaId].push({
            nome: item.Secção.replace(/^IM\s+\d+\s+/, ''),
            pAberto: Number(item['P Aberto']) || 0,
            npAberto: Number(item['NP Aberto']) || 0
          });
        }
      }
    });

    topLojas.forEach(l => {
      l.seccoes = seccoesPorLoja[l.loja] || [];
      l.seccoes.sort((a,b) => b.pAberto - a.pAberto);
    });

    // Renderizar
    document.getElementById('sub-info').textContent = `Gerado em hoje · ${topLojas.length} lojas`;
    document.getElementById('periodo-label').innerHTML = `📅 Período atual`;

    let html = `<div class="legenda">🔴 Top 3 críticas | 🟡 Em alerta</div>`;

    topLojas.forEach((l, i) => {
      const emoji = i < 3 ? '🔴' : '🟡';
      html += `
      <div class="loja-linha">
        <div><strong>${emoji} ${i+1}</strong><br><span class="nivel-badge n${l.nivel}">Nível ${l.nivel}</span></div>
        <div><strong>${l.loja}</strong><br><small>${l.localidade}</small></div>
        <div style="text-align:center">
          <strong style="font-size:18px">${l.pAberto}</strong><br>
          <small>de ${l.pTotal}</small><br>
          <small>NP: ${l.npAberto}</small>
        </div>
        <div style="text-align:center">
          <strong style="color:#c0392b">${l.pctPAberto}%</strong><br>aberto
        </div>
        <div style="text-align:center">
          <strong style="color:#c0392b">${l.pctNPAberto}%</strong><br>aberto
        </div>
        <div style="text-align:center">
          <strong>${l.seccoes.length}</strong><br>secções
        </div>
      </div>`;
    });

    document.getElementById('app').innerHTML = html;
  })
  .catch(err => {
    document.getElementById('app').innerHTML = `<div class="loading" style="color:red">Erro: ${err.message}</div>`;
  });
</script>
</body>
</html>
