<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --border:rgba(0,0,0,0.08);
  --text-primary:#1a1a1a;
  --text-secondary:#4a4a4a;
  --text-tertiary:#808080;
  --success:#22c55e;
  --danger:#ef4444;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{font-family:'Inter',sans-serif;background:#fff;color:var(--text-primary);font-size:14px;}

/* HEADER - Mais centralizado */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:18px 40px;
  display:flex;justify-content:center;align-items:center;
  gap:30px;
}
.header-brand{display:flex;align-items:center;gap:16px;}
.header-logo{
  width:42px;height:42px;border-radius:12px;
  background:var(--grad);display:flex;align-items:center;
  justify-content:center;font-size:20px;
}
.header-title h1{font-size:22px;font-weight:800;color:#1a1a1a;}
.header-title .sub{color:var(--text-tertiary);font-size:12px;margin-top:3px;}
.header-period{
  background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.15);
  padding:8px 20px;border-radius:10px;font-weight:700;color:#8b5cf6;font-size:13px;
}

/* MAIN */
.main{max-width:1850px;margin:0 auto;padding:32px 40px 80px;}

/* KPI */
.kpi-row{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-bottom:32px;
  justify-content:center;
}

/* LEGENDA */
.legend-row{
  display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;
  margin-bottom:28px;font-size:12.5px;color:var(--text-secondary);
  text-align:center;
}

/* TABELA - Centralizada e Alinhada */
.table-container{
  border:1px solid var(--border);border-radius:18px;overflow:hidden;
  margin:0 auto;
  max-width:100%;
}
.tgrid{
  display:grid;
  grid-template-columns:
    70px   /* rank */
    220px  /* loja */
    95px   /* P Total */
    95px   /* P Aberto */
    95px   /* P Fechado */
    95px   /* NP Total */
    95px   /* NP Aberto */
    95px   /* NP Fechado */
    130px  /* Comparação */
    100px  /* Tendência */
    110px  /* Histórico */
    110px; /* Secções */
  align-items:center;
}
.table-header{
  padding:16px 24px;
  background:#fafafa;border-bottom:1px solid var(--border);
  font-size:11.5px;font-weight:700;text-transform:uppercase;
  color:#666;letter-spacing:.5px;
  display:grid;
  grid-template-columns:inherit;
}
.table-header > div{
  text-align:center;
  padding:0 4px;
}
.table-header > div:nth-child(2){text-align:left;} /* Loja */

.table-row{
  border-bottom:1px solid var(--border);
  transition:background .15s;
  padding:0 24px;
}
.table-row:last-of-type{border-bottom:none;}
.table-row:hover{background:rgba(139,92,246,.025);}

.row-main{
  padding:20px 0;
  display:grid;
  grid-template-columns:inherit;
  align-items:center;
}

/* CELLS - Melhor alinhamento */
.c-rank{text-align:center;}
.c-loja{text-align:left;}
.c-num, .c-comp, .c-tend, .c-btn{text-align:center;}

.num-val{font-size:17px;font-weight:800;}
.loja-nome{font-size:15px;font-weight:700;}
.loja-local{font-size:12.5px;color:var(--text-tertiary);}

/* Botões */
.btn-act{
  width:100%; max-width:100px;
  background:#fff;border:1px solid rgba(139,92,246,.25);
  color:#8b5cf6;border-radius:8px;padding:9px 12px;
  cursor:pointer;font-size:11.5px;font-weight:700;
  transition:all .15s;
}
.btn-act:hover{background:rgba(139,92,246,.08);}
.btn-act.open{background:var(--grad);color:#fff;border-color:transparent;}

/* Painéis */
.panel{display:none;}
.panel.visible{display:block;}
.panel-inner{padding:24px 28px;background:rgba(139,92,246,.03);border-top:1px solid var(--border);}

/* Responsivo */
@media(max-width:1600px){
  .tgrid{
    grid-template-columns: 65px 200px 85px 85px 85px 85px 85px 85px 120px 90px 100px 100px;
  }
}
@media(max-width:1200px){
  .main{padding:20px;}
  .header{padding:16px 20px;}
}
</style>
</head>

</body>
</html>
