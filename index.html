<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.1.0/chartjs-plugin-datalabels.min.js"></script>
<style>
:root {
  --ink: #0f0e0d;
  --ink-2: #3a3835;
  --ink-3: #6b6860;
  --ink-4: #9c9a95;
  --paper: #f5f5f7;
  --paper-2: #ffffff;
  --paper-3: #f0f0f2;
  --line: #e8e8ec;
  --line-2: #d8d8de;
  --n1: #b83232; --n1-bg: #fdf0f0;
  --n2: #b87a32; --n2-bg: #fdf6ee;
  --n3: #2e7d52; --n3-bg: #eef6f2;
  --bar-blue: #3b3fd8;
  --bar-orange: #e8924a;
  --bar-track: #e4e4e8;
  --btn-border: #d8d8de;
  --btn-text: #444;
  --shadow: 0 1px 4px rgba(0,0,0,.06), 0 2px 12px rgba(0,0,0,.04);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  height: 62px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-icon {
  width: 36px; height: 36px; border-radius: 9px;
  background: #1c1c2e;
  display: flex; align-items: center; justify-content: center;
}
.header-icon svg { width: 18px; height: 18px; fill: #fff; }
.header-title { font-family: 'DM Serif Display', serif; font-size: 19px; color: var(--ink); letter-spacing: -0.2px; white-space: nowrap; }
.header-subtitle { font-size: 11.5px; color: var(--ink-4); margin-top: 1px; }
.header-badge {
  padding: 5px 14px; border-radius: 99px;
  background: #f0f0f5; border: 1px solid var(--line-2);
  font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap;
}

/* ── MAIN ── */
.main { max-width: 1320px; margin: 0 auto; padding: 28px 24px 64px; }

/* ── LEGEND BAR ── */
.legend-bar {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 10px 16px;
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  font-size: 12.5px; color: var(--ink-3);
}
.legend-item { display: flex; align-items: center; gap: 7px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.legend-label { font-weight: 600; color: var(--ink-2); }
.legend-sep { width: 1px; height: 16px; background: var(--line-2); }

/* ── CARD LIST ── */
.card-list { display: flex; flex-direction: column; gap: 0; }

/* ── LOJA CARD ── */
.loja-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: box-shadow 0.15s;
}
.loja-card:hover { box-shadow: 0 2px 16px rgba(0,0,0,.09); }

.card-main {
  display: grid;
  grid-template-columns: 56px 200px 1fr auto;
  align-items: center;
  padding: 0;
  min-height: 88px;
  gap: 0;
}

/* rank column */
.col-rank {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 12px;
  border-right: 1px solid var(--line);
  align-self: stretch;
  background: #fafafa;
  gap: 5px;
}
.rank-num {
  font-family: 'DM Serif Display', serif;
  font-size: 22px; line-height: 1;
  color: var(--ink-2);
}
.rank-pill {
  padding: 2px 7px; border-radius: 99px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
}
.pill-n1 { background: var(--n1-bg); color: var(--n1); }
.pill-n2 { background: var(--n2-bg); color: var(--n2); }
.pill-n3 { background: var(--n3-bg); color: var(--n3); }

/* identity column */
.col-id {
  padding: 20px 20px;
  border-right: 1px solid var(--line);
  align-self: stretch;
  display: flex; flex-direction: column; justify-content: center;
}
.loja-nome { font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.loja-code { font-size: 12px; color: var(--ink-4); margin-top: 4px; font-weight: 400; }

/* metrics column */
.col-metrics {
  display: flex; align-items: stretch;
  border-right: 1px solid var(--line);
  align-self: stretch;
}
.metric-group {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 14px 16px;
  border-right: 1px solid var(--line);
  min-width: 80px;
  flex: 1;
  gap: 2px;
}
.metric-group:last-child { border-right: none; }
.metric-group.is-total {
  background: #f0f2fb;
}
.metric-group.is-total .mg-val { color: var(--bar-blue); }
.metric-group.is-total-np {
  background: #fdf3eb;
}
.metric-group.is-total-np .mg-val { color: var(--bar-orange); }

/* bold separator between P group and NP group */
.col-metrics-sep {
  width: 2px;
  background: var(--line-2);
  align-self: stretch;
  flex-shrink: 0;
  position: relative;
}
.col-metrics-sep::before {
  content: 'NP';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--line-2);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.4px;
  color: var(--ink-4);
  padding: 3px 4px;
  border-radius: 3px;
  white-space: nowrap;
}

.metric-group-sep {
  width: 1px; background: var(--line); align-self: stretch; flex-shrink: 0;
  margin: 0 0;
}
.mg-label {
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--ink-4); white-space: nowrap;
  margin-bottom: 2px;
}
.mg-val { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1; }
.mg-sub { font-size: 11px; color: var(--ink-4); margin-top: 1px; }

/* progress + actions column */
.col-right {
  display: flex; align-items: center;
  padding: 14px 22px;
  gap: 22px;
  align-self: stretch;
  min-width: 360px;
}

.progress-block { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.progress-row { display: flex; flex-direction: column; gap: 4px; }
.progress-label-row {
  display: flex; justify-content: space-between; align-items: center;
}
.prog-label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-4); }
.prog-pct { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.prog-track {
  height: 6px; border-radius: 99px; background: var(--bar-track);
  overflow: hidden;
}
.prog-fill {
  height: 100%; border-radius: 99px;
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
}
.fill-blue { background: var(--bar-blue); }
.fill-orange { background: var(--bar-orange); }

.actions-col { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.btn-card {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 16px;
  border: 1px solid var(--btn-border);
  border-radius: 8px;
  background: #fff;
  color: var(--btn-text);
  font-size: 12.5px; font-weight: 500;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  white-space: nowrap;
  transition: all 0.15s;
  min-width: 110px; justify-content: flex-start;
}
.btn-card:hover { background: #f5f5f7; border-color: #bbb; }
.btn-card.active { background: #1c1c2e; border-color: #1c1c2e; color: #fff; }
.btn-card svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.6; }
.btn-card.active svg { opacity: 1; }

/* ── PANEL ── */
.panel { display: none; }
.panel.open { display: block; }
.panel-body {
  padding: 24px 28px;
  border-top: 1px solid var(--line);
  background: #fafafa;
}
.panel-title {
  font-family: 'DM Serif Display', serif;
  font-size: 16px; font-weight: 400; color: var(--ink);
  margin-bottom: 16px; padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

/* ── CHARTS & TABLES ── */
.chart-wrap {
  position: relative; width: 100%; background: #fff;
  border: 1px solid var(--line); border-radius: 12px;
  padding: 20px; margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.dtable {
  width: 100%; border-collapse: collapse;
  background: #fff; border: 1px solid var(--line);
  border-radius: 12px; overflow: hidden; font-size: 13px;
  box-shadow: var(--shadow);
}
.dtable th {
  padding: 10px 16px; background: #f8f8fa;
  border-bottom: 1px solid var(--line);
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.6px; color: var(--ink-4); text-align: center;
}
.dtable td {
  padding: 11px 16px; border-bottom: 1px solid var(--line);
  text-align: center; color: var(--ink); font-weight: 500;
}
.dtable tr:last-child td { border-bottom: none; }
.dtable tbody tr:hover td { background: #f8f8fa; }

.sec-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px; margin-top: 16px;
}
.sec-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
.sec-card-head { padding: 11px 14px; background: #f8f8fa; border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--ink); }
.sec-card-body { padding: 12px 14px; }

/* ── BOTTOM ── */
.bottom-bar { margin-top: 24px; display: flex; gap: 14px; flex-wrap: wrap; }
.level-legend {
  flex: 1; min-width: 240px; background: #fff;
  border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; box-shadow: var(--shadow);
}
.level-legend-title { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-4); margin-bottom: 12px; }
.level-items { display: flex; gap: 16px; flex-wrap: wrap; }
.level-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.level-dot { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
.action-banner {
  flex: 2; min-width: 260px; background: #fff8f4; border: 1px solid #f0d8c8;
  border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 14px;
}
.action-icon { width: 38px; height: 38px; border-radius: 9px; background: #e8924a; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.action-title { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
.action-desc { font-size: 12px; color: var(--ink-3); line-height: 1.4; }

.loading { text-align: center; padding: 80px 20px; color: var(--ink-4); font-size: 14px; }

/* ── MOBILE ── */
@media (max-width: 800px) {
  .header { padding: 0 16px; }
  .main { padding: 16px 12px 48px; }

  .card-main {
    grid-template-columns: 48px 1fr;
    grid-template-rows: auto auto auto;
  }
  .col-rank {
    grid-row: 1 / 4; border-right: 1px solid var(--line);
    align-self: stretch;
  }
  .col-id {
    grid-column: 2; grid-row: 1;
    border-right: none; border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  .col-metrics {
    grid-column: 2; grid-row: 2;
    border-right: none; border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .metric-group { min-width: 60px; padding: 10px 10px; }
  .mg-val { font-size: 16px; }
  .col-right {
    grid-column: 2; grid-row: 3;
    min-width: 0; padding: 12px 14px;
    flex-direction: column; align-items: stretch; gap: 12px;
  }
  .actions-col { flex-direction: row; }
  .btn-card { flex: 1; justify-content: center; }
  .panel-body { padding: 16px; }
  .sec-grid { grid-template-columns: 1fr; }
  .bottom-bar { flex-direction: column; }
  .level-items { flex-direction: column; gap: 8px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="13" width="4" height="8" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="5" width="4" height="16" rx="1"/></svg>
    </div>
    <div>
      <div class="header-title">Análise Semanal IM</div>
      <div class="header-subtitle" id="sub-info">A carregar…</div>
    </div>
  </div>
  <div class="header-badge" id="periodo">—</div>
</header>

<main class="main">
  <div id="app"><div class="loading">A carregar dados…</div></div>
</main>

<script>
var charts = {};
var stateH = {}, stateS = {};

function svgClock() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
}
function svgFolder() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
}

function toggleH(li) {
  stateH[li] = !stateH[li];
  var p = document.getElementById('ph-' + li);
  var b = document.getElementById('bh-' + li);
  if (p) p.classList.toggle('open', stateH[li]);
  if (b) { b.classList.toggle('active', stateH[li]); b.innerHTML = svgClock() + (stateH[li] ? 'Fechar' : 'Histórico'); }
  if (stateH[li]) setTimeout(function() { if (charts['pnp-' + li]) charts['pnp-' + li].resize(); }, 100);
}
function toggleS(li) {
  stateS[li] = !stateS[li];
  var p = document.getElementById('ps-' + li);
  var b = document.getElementById('bs-' + li);
  if (p) p.classList.toggle('open', stateS[li]);
  if (b) { b.classList.toggle('active', stateS[li]); b.innerHTML = svgFolder() + (stateS[li] ? 'Fechar' : 'Secções'); }
}

fetch('dados.json?t=' + Date.now())
  .then(function(r) { return r.json(); })
  .then(function(json) {
    var data = json.data || [];
    var semanas = [];
    data.forEach(function(i) { var s = String(i.Semana||'').trim(); if (s && semanas.indexOf(s)===-1) semanas.push(s); });
    var ultima = semanas[semanas.length - 1] || '';

    var lojas = data.filter(function(i) { return i.Loja && !i.Secção && String(i.Semana||'').trim() === ultima; })
      .map(function(i) {
        var pT=Number(i['P Total'])||0, pA=Number(i['P Aberto'])||0, pF=Number(i['P Fechado'])||0;
        var nT=Number(i['NP Total'])||0, nA=Number(i['NP Aberto'])||0, nF=Number(i['NP Fechado'])||0;
        var pctPF=pT>0?(pF/pT*100):0, pctNF=nT>0?(nF/nT*100):0;
        var nivel=pctPF>=41?3:pctPF>=21?2:1;
        var loc=String(i['Resumo contactos.Localidade']||i['IM.Localidade']||'').trim();
        return { loja:String(i.Loja).trim(), local:loc, pT:pT,pA:pA,pF:pF,nT:nT,nA:nA,nF:nF,
          pctPF:pctPF.toFixed(1), pctNF:pctNF.toFixed(1),
          pctPFInt:Math.round(pctPF), pctNFInt:Math.round(pctNF),
          nivel:nivel, historico:[], seccoes:[] };
      });

    lojas.sort(function(a,b) { return a.nivel!==b.nivel ? a.nivel-b.nivel : Number(a.pctPF)-Number(b.pctPF); });

    var ids = {};
    lojas.forEach(function(l) { ids[l.loja]=true; });

    var histMap = {};
    data.forEach(function(i) {
      if (i.Loja && !i.Secção && ids[String(i.Loja).trim()]) {
        var id=String(i.Loja).trim();
        if (!histMap[id]) histMap[id]=[];
        histMap[id].push(i);
      }
    });
    lojas.forEach(function(l) { l.historico=(histMap[l.loja]||[]).slice(-8); });

    data.forEach(function(i) {
      if (!i.Secção) return;
      var m=String(i.Secção).trim().match(/^(IM \d+)\s+(.+)$/);
      if (!m) return;
      var nome=m[2].trim();
      if (nome.toLowerCase()==='admin') return;
      if (!ids[m[1].trim()]) return;
      var loja=lojas.find(function(l){ return l.loja===m[1].trim(); });
      if (!loja) return;
      var pT=Number(i['Programadas Total'])||0, pF=Number(i['Programadas Fechadas'])||0;
      var nT=Number(i['Não Programadas Total'])||0, nF=Number(i['Não Programadas Fechadas'])||0;
      loja.seccoes.push({nome:nome, pT:pT,pA:pT-pF,pF:pF, nT:nT,nA:nT-nF,nF:nF});
    });
    lojas.forEach(function(l) { l.seccoes.sort(function(a,b){ return b.pA-a.pA; }); });

    document.getElementById('sub-info').textContent = lojas.length + ' lojas · ' + ultima;
    document.getElementById('periodo').textContent = '📅 ' + ultima;

    render(lojas);
  })
  .catch(function(e) {
    document.getElementById('app').innerHTML = '<div class="loading" style="color:#b83232">Erro ao carregar: ' + e.message + '</div>';
  });

function pillCls(n) { return n===1?'pill-n1':n===2?'pill-n2':'pill-n3'; }

function fmt(n) {
  /* format number with thousands dot separator */
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function render(lojas) {
  var html = '';

  html += '<div class="card-list">';

  lojas.forEach(function(l, li) {
    var pc = pillCls(l.nivel);

    /* History panel */
    var histRows = l.historico.map(function(h) {
      var hpT=Number(h['P Total'])||0,hpF=Number(h['P Fechado'])||0;
      var hnT=Number(h['NP Total'])||0,hnF=Number(h['NP Fechado'])||0;
      var hpPct = hpT>0 ? (hpF/hpT*100).toFixed(1) : '0.0';
      var hnPct = hnT>0 ? (hnF/hnT*100).toFixed(1) : '0.0';
      return '<tr>'
        +'<td>'+(h.Semana||'—')+'</td>'
        +'<td>'+fmt(hpT)+'</td>'
        +'<td>'+fmt(hpT-hpF)+'</td>'
        +'<td>'+fmt(hpF)+'</td>'
        +'<td style="color:var(--bar-blue);font-weight:700">'+hpPct+'%</td>'
        +'<td>'+fmt(hnT)+'</td>'
        +'<td>'+fmt(hnT-hnF)+'</td>'
        +'<td>'+fmt(hnF)+'</td>'
        +'<td style="color:var(--bar-orange);font-weight:700">'+hnPct+'%</td>'
        +'</tr>';
    }).join('');
    var chartH = Math.max(180, l.historico.length*58+80);

    var histHtml = l.historico.length>0
      ? '<div style="margin-bottom:8px">'
        + '<div style="font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:#9c9a95;margin-bottom:6px">Gráfico — % de tarefas fechadas por semana (Programadas vs Não Programadas)</div>'
        + '<div class="chart-wrap" style="height:'+chartH+'px;margin-bottom:20px"><canvas id="pnp-'+li+'"></canvas></div>'
        + '</div>'
        + '<div style="font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:#9c9a95;margin-bottom:8px">Tabela de valores — Programadas (P) e Não Programadas (NP)</div>'
        + '<div style="overflow-x:auto"><table class="dtable">'
        + '<thead><tr>'
        + '<th>Semana</th>'
        + '<th style="background:#f0f2fb;color:var(--bar-blue)">P Total</th>'
        + '<th>P Abertas</th>'
        + '<th>P Fechadas</th>'
        + '<th style="color:var(--bar-blue)">% P Fechadas</th>'
        + '<th style="background:#fdf3eb;color:var(--bar-orange)">NP Total</th>'
        + '<th>NP Abertas</th>'
        + '<th>NP Fechadas</th>'
        + '<th style="color:var(--bar-orange)">% NP Fechadas</th>'
        + '</tr></thead>'
        + '<tbody>'+histRows+'</tbody>'
        + '</table></div>'
      : '<p style="color:#9c9a95;font-size:13px">Sem dados históricos.</p>';

    /* Sections panel */
    var secHtml = l.seccoes.length>0
      ? '<div class="sec-grid">'+l.seccoes.map(function(s,si) {
          return '<div class="sec-card"><div class="sec-card-head">'+s.nome+'</div>'
            +'<div class="sec-card-body"><div style="height:72px;position:relative"><canvas id="sc-'+li+'-'+si+'"></canvas></div></div></div>';
        }).join('')+'</div>'
      : '<p style="color:#9c9a95;font-size:13px">Sem secções disponíveis.</p>';

    html += '<div class="loja-card">';
    html += '<div class="card-main">';

    /* Rank */
    html += '<div class="col-rank"><div class="rank-num">'+(li+1)+'</div><div class="rank-pill '+pc+'">N'+l.nivel+'</div></div>';

    /* Identity */
    html += '<div class="col-id"><div class="loja-nome">'+(l.local||l.loja)+'</div><div class="loja-code">'+l.loja+'</div></div>';

    /* Metrics */
    html += '<div class="col-metrics">';
    var groups = [
      {label:'P Total',    val:fmt(l.pT), cls:'is-total'},
      {label:'P Abertas',  val:fmt(l.pA), cls:''},
      {label:'P Fechadas', val:fmt(l.pF), cls:''}
    ];
    groups.forEach(function(g) {
      html += '<div class="metric-group '+g.cls+'"><div class="mg-label">'+g.label+'</div><div class="mg-val">'+g.val+'</div></div>';
    });
    /* Bold separator P | NP */
    html += '<div class="col-metrics-sep"></div>';
    var groupsNP = [
      {label:'NP Total',    val:fmt(l.nT), cls:'is-total-np'},
      {label:'NP Abertas',  val:fmt(l.nA), cls:''},
      {label:'NP Fechadas', val:fmt(l.nF), cls:''}
    ];
    groupsNP.forEach(function(g) {
      html += '<div class="metric-group '+g.cls+'"><div class="mg-label">'+g.label+'</div><div class="mg-val">'+g.val+'</div></div>';
    });
    html += '</div>';

    /* Right: progress + buttons */
    html += '<div class="col-right">';
    html += '<div class="progress-block">';
    html += '<div class="progress-row">'
      +'<div class="progress-label-row"><span class="prog-label">Programadas</span><span class="prog-pct">'+l.pctPFInt+'%</span></div>'
      +'<div class="prog-track"><div class="prog-fill fill-blue" style="width:'+l.pctPFInt+'%"></div></div>'
      +'</div>';
    html += '<div class="progress-row">'
      +'<div class="progress-label-row"><span class="prog-label">Não Prog.</span><span class="prog-pct">'+l.pctNFInt+'%</span></div>'
      +'<div class="prog-track"><div class="prog-fill fill-orange" style="width:'+l.pctNFInt+'%"></div></div>'
      +'</div>';
    html += '</div>';

    html += '<div class="actions-col">';
    html += '<button class="btn-card" id="bh-'+li+'" onclick="toggleH('+li+')">'+svgClock()+'Histórico</button>';
    html += '<button class="btn-card" id="bs-'+li+'" onclick="toggleS('+li+')">'+svgFolder()+'Secções</button>';
    html += '</div>';
    html += '</div>'; /* col-right */

    html += '</div>'; /* card-main */

    /* Panels */
    html += '<div class="panel" id="ph-'+li+'"><div class="panel-body"><div class="panel-title">Evolução Histórica · '+l.loja+'</div>'+histHtml+'</div></div>';
    html += '<div class="panel" id="ps-'+li+'"><div class="panel-body"><div class="panel-title">Secções · '+l.seccoes.length+'</div>'+secHtml+'</div></div>';

    html += '</div>'; /* loja-card */
  });

  html += '</div>'; /* card-list */

  /* Legend note below cards */
  html += '<div class="legend-bar" style="margin-top:14px;margin-bottom:0">';
  html += '<div class="legend-item"><div class="legend-dot" style="background:var(--bar-blue)"></div><span class="legend-label">P</span> = Tarefas Programadas</div>';
  html += '<div class="legend-sep"></div>';
  html += '<div class="legend-item"><div class="legend-dot" style="background:var(--bar-orange)"></div><span class="legend-label">NP</span> = Tarefas Não Programadas</div>';
  html += '</div>';

  /* Bottom */
  html += '<div class="bottom-bar">';
  html += '<div class="level-legend"><div class="level-legend-title">Classificação de Nível</div><div class="level-items">';
  html += '<div class="level-item"><div class="level-dot pill-n1">N1</div><span>0–20% programadas fechadas</span></div>';
  html += '<div class="level-item"><div class="level-dot pill-n2">N2</div><span>21–40% fechadas</span></div>';
  html += '<div class="level-item"><div class="level-dot pill-n3">N3</div><span>41%+ fechadas</span></div>';
  html += '</div></div>';
  html += '<div class="action-banner"><div class="action-icon">⚠</div><div><div class="action-title">Ação Recomendada</div><div class="action-desc">Contactar urgentemente responsáveis das lojas N1.</div></div></div>';
  html += '</div>';

  document.getElementById('app').innerHTML = html;

  /* Charts */
  lojas.forEach(function(l, li) {
    var el = document.getElementById('pnp-'+li);
    if (el && l.historico.length>0) {
      var sems=[], pp=[], np=[];
      l.historico.forEach(function(h) {
        sems.push(h.Semana||'');
        var pT=Number(h['P Total'])||0, pF=Number(h['P Fechado'])||0;
        var nT=Number(h['NP Total'])||0, nF=Number(h['NP Fechado'])||0;
        pp.push(pT>0?parseFloat((pF/pT*100).toFixed(1)):0);
        np.push(nT>0?parseFloat((nF/nT*100).toFixed(1)):0);
      });
      charts['pnp-'+li] = new Chart(el.getContext('2d'), {
        type:'bar', plugins:[ChartDataLabels],
        data:{ labels:sems, datasets:[
          {
            label:'% de Programadas Fechadas',
            data:pp,
            backgroundColor:'rgba(59,63,216,.75)',
            borderRadius:3,borderWidth:0
          },
          {
            label:'% de Não Programadas Fechadas',
            data:np,
            backgroundColor:'rgba(232,146,74,.8)',
            borderRadius:3,borderWidth:0
          }
        ]},
        options:{
          indexAxis:'y',responsive:true,maintainAspectRatio:false,
          layout:{padding:{right:56}},
          plugins:{
            datalabels:{
              anchor:'end',align:'right',
              formatter:function(v){ return v+'%'; },
              font:{size:11,weight:'700'},
              color:'#3a3835'
            },
            legend:{
              position:'top',
              labels:{
                font:{size:12,weight:'500'},
                color:'#3a3835',
                padding:16,
                usePointStyle:true,
                pointStyleWidth:10
              }
            },
            tooltip:{
              callbacks:{
                title:function(items){ return 'Semana: '+items[0].label; },
                label:function(c){
                  var name = c.dataset.label;
                  return ' '+name+': '+c.parsed.x+'%';
                }
              },
              titleFont:{size:12,weight:'600'},
              bodyFont:{size:12},
              padding:10
            }
          },
          scales:{
            x:{
              beginAtZero:true,max:100,
              title:{display:true,text:'Percentagem de tarefas fechadas (%)',color:'#9c9a95',font:{size:10,weight:'600'}},
              ticks:{color:'#9c9a95',font:{size:10},callback:function(v){return v+'%';}},
              grid:{color:'rgba(0,0,0,.04)'}
            },
            y:{ticks:{color:'#3a3835',font:{size:10,weight:'500'}},grid:{display:false}}
          }
        }
      });
    }
    l.seccoes.forEach(function(s,si) {
      var sel=document.getElementById('sc-'+li+'-'+si);
      if (!sel) return;
      var pP=s.pT>0?parseFloat((s.pF/s.pT*100).toFixed(1)):0;
      var pN=s.nT>0?parseFloat((s.nF/s.nT*100).toFixed(1)):0;
      charts['sc-'+li+'-'+si]=new Chart(sel.getContext('2d'),{
        type:'bar',plugins:[ChartDataLabels],
        data:{labels:['Programadas','Não Prog.'],datasets:[{data:[pP,pN],backgroundColor:['rgba(59,63,216,.75)','rgba(232,146,74,.8)'],borderRadius:3,borderWidth:0}]},
        options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,layout:{padding:{right:42}},
          plugins:{datalabels:{anchor:'end',align:'right',formatter:function(v){return v+'%';},font:{size:11,weight:'600'},color:'#3a3835'},legend:{display:false}},
          scales:{x:{beginAtZero:true,max:100,display:false},y:{ticks:{font:{size:11,weight:'500'},color:'#3a3835'},grid:{display:false}}}
        }
      });
    });
  });
}

function svgClock() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
}
function svgFolder() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
}
</script>
</body>
</html>
