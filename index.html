<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.1.0/chartjs-plugin-datalabels.min.js"></script>
<style>
:root {
  --ink: #0f0e0d;
  --ink-2: #3a3835;
  --ink-3: #6b6860;
  --ink-4: #9c9a95;
  --paper: #f5f5f7;
  --paper-2: #ffffff;
  --paper-3: #f0f0f2;
  --line: #e8e8ec;
  --line-2: #d8d8de;
  /* Intensified colors: Red, Orange, Yellow */
  --n1: #ff0000; --n1-bg: #fff0f0;
  --n2: #ff8c00; --n2-bg: #fff7e6;
  --n3: #ffd700; --n3-bg: #fffdf0;
  --bar-blue: #3b3fd8;
  --bar-orange: #ff8c00;
  --bar-track: #e4e4e8;
  --btn-border: #d8d8de;
  --btn-text: #444;
  --shadow: 0 1px 4px rgba(0,0,0,.06), 0 2px 12px rgba(0,0,0,.04);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  font-size: 18px; /* Increased from 16px */
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  height: 62px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-icon {
  width: 36px; height: 36px; border-radius: 9px;
  background: #1c1c2e;
  display: flex; align-items: center; justify-content: center;
}
.header-icon svg { width: 18px; height: 18px; fill: #fff; }
.header-title { font-family: 'DM Serif Display', serif; font-size: 19px; color: var(--ink); letter-spacing: -0.2px; white-space: nowrap; }
.header-subtitle { font-size: 11.5px; color: var(--ink-4); margin-top: 1px; }
.header-badge {
  padding: 5px 14px; border-radius: 99px;
  background: #f0f0f5; border: 1px solid var(--line-2);
  font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap;
}

/* ── MAIN ── */
.main { max-width: 1320px; margin: 0 auto; padding: 28px 24px 64px; }

/* ── LEGEND BAR ── */
.legend-bar {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 10px 16px;
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  font-size: 12.5px; color: var(--ink-3);
}
.legend-item { display: flex; align-items: center; gap: 7px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.legend-label { font-weight: 600; color: var(--ink-2); }
.legend-sep { width: 1px; height: 16px; background: var(--line-2); }

/* ── CARD LIST ── */
.card-list { display: flex; flex-direction: column; gap: 0; }

/* ── LOJA CARD ── */
.loja-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: box-shadow 0.15s;
}
.loja-card:hover { box-shadow: 0 2px 16px rgba(0,0,0,.09); }

.card-main {
  display: grid;
  grid-template-columns: 56px 200px 1fr auto;
  align-items: center;
  padding: 0;
  min-height: 88px;
  gap: 0;
}

/* rank column */
.col-rank {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 12px;
  border-right: 1px solid var(--line);
  align-self: stretch;
  background: #fafafa;
  gap: 5px;
}
.rank-num {
  font-family: 'DM Serif Display', serif;
  font-size: 26px; line-height: 1;
  color: var(--ink-2);
  margin-bottom: 8px;
}
.rank-pill {
  padding: 4px 12px; border-radius: 99px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.3px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 40px;
}
.pill-n1 { background: var(--n1-bg); color: var(--n1); border: 2px solid var(--n1); }
.pill-n2 { background: var(--n2-bg); color: var(--n2); border: 2px solid var(--n2); }
.pill-n3 { background: var(--n3-bg); color: var(--n3); border: 2px solid var(--n3); }

/* identity column */
.col-id {
  padding: 20px 20px;
  border-right: 1px solid var(--line);
  align-self: stretch;
  display: flex; flex-direction: column; justify-content: center;
}
.loja-nome { font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.loja-code { font-size: 12px; color: var(--ink-4); margin-top: 4px; font-weight: 400; }

/* metrics column */
.col-metrics {
  display: flex; align-items: stretch;
  border-right: 1px solid var(--line);
  align-self: stretch;
}
.metric-group {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 14px 16px;
  border-right: 1px solid var(--line);
  min-width: 80px;
  flex: 1;
  gap: 2px;
}
.metric-group:last-child { border-right: none; }
.metric-group.is-total {
  background: #f0f2fb;
}
.metric-group.is-total .mg-val { color: var(--bar-blue); }
.metric-group.is-total-np {
  background: #fdf3eb;
}
.metric-group.is-total-np .mg-val { color: var(--bar-orange); }

/* bold separator between P group and NP group */
.col-metrics-sep {
  width: 2px;
  background: var(--line-2);
  align-self: stretch;
  flex-shrink: 0;
  position: relative;
}
.col-metrics-sep::before {
  content: 'NP';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--line-2);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.4px;
  color: var(--ink-4);
  padding: 3px 4px;
  border-radius: 3px;
  white-space: nowrap;
}

.metric-group-sep {
  width: 1px; background: var(--line); align-self: stretch; flex-shrink: 0;
  margin: 0 0;
}
.mg-label {
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--ink-4); white-space: nowrap;
  margin-bottom: 2px;
}
.mg-val { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1; }
.mg-sub { font-size: 11px; color: var(--ink-4); margin-top: 1px; }

/* progress + actions column */
.col-right {
  display: flex; align-items: center;
  padding: 14px 22px;
  gap: 22px;
  align-self: stretch;
  min-width: 360px;
}

.progress-block { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.progress-row { display: flex; flex-direction: column; gap: 4px; }
.progress-label-row {
  display: flex; justify-content: space-between; align-items: center;
}
.prog-label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-4); }
.prog-pct { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.prog-track {
  height: 6px; border-radius: 99px; background: var(--bar-track);
  overflow: hidden;
}
.prog-fill {
  height: 100%; border-radius: 99px;
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
}
.fill-blue { background: var(--bar-blue); }
.fill-orange { background: var(--bar-orange); }

.actions-col { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.btn-card {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 16px;
  border: 1px solid var(--btn-border);
  border-radius: 8px;
  background: #fff;
  color: var(--btn-text);
  font-size: 12.5px; font-weight: 500;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  white-space: nowrap;
  transition: all 0.15s;
  min-width: 110px; justify-content: flex-start;
}
.btn-card:hover { background: #f5f5f7; border-color: #bbb; }
.btn-card.active { background: #1c1c2e; border-color: #1c1c2e; color: #fff; }
.btn-card svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.6; }
.btn-card.active svg { opacity: 1; }

/* ── PANEL ── */
.panel { display: none; }
.panel.open { display: block; }
.panel-body {
  padding: 24px 28px;
  border-top: 1px solid var(--line);
  background: #fafafa;
}
.panel-title {
  font-family: 'DM Serif Display', serif;
  font-size: 16px; font-weight: 400; color: var(--ink);
  margin-bottom: 16px; padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

/* ── CHARTS & TABLES ── */
.chart-wrap {
  position: relative; width: 100%; background: #fff;
  border: 1px solid var(--line); border-radius: 12px;
  padding: 20px; margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.dtable {
  width: 100%; border-collapse: collapse;
  background: #fff; border: 1px solid var(--line);
  border-radius: 12px; overflow: hidden; font-size: 13px;
  box-shadow: var(--shadow);
}
.dtable th {
  padding: 10px 16px; background: #f8f8fa;
  border-bottom: 1px solid var(--line);
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.6px; color: var(--ink-4); text-align: center;
}
.dtable td {
  padding: 11px 16px; border-bottom: 1px solid var(--line);
  text-align: center; color: var(--ink); font-weight: 500;
}
.dtable tr:last-child td { border-bottom: none; }
.dtable tbody tr:hover td { background: #f8f8fa; }

.sec-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px; margin-top: 16px;
}
.sec-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
.sec-card-head { padding: 11px 14px; background: #f8f8fa; border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--ink); }
.sec-card-body { padding: 12px 14px; }

/* ── BOTTOM ── */
.bottom-bar { margin-top: 24px; display: flex; gap: 14px; flex-wrap: wrap; }
.level-legend {
  flex: 1; min-width: 240px; background: #fff;
  border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; box-shadow: var(--shadow);
}
.level-legend-title { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-4); margin-bottom: 12px; }
.level-items { display: flex; gap: 16px; flex-wrap: wrap; }
.level-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.level-dot { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
.action-banner {
  flex: 2; min-width: 260px; background: #fff8f4; border: 1px solid #f0d8c8;
  border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 14px;
}
.action-icon { width: 38px; height: 38px; border-radius: 9px; background: #e8924a; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.action-title { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
.action-desc { font-size: 12px; color: var(--ink-3); line-height: 1.4; }

/* ── HOME SCREEN ── */
.home-screen, .detail-screen { display: none; }
.home-screen.active, .detail-screen.active { display: block; }

/* back button in header */
.btn-back {
  display: none; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 7px;
  border: 1px solid var(--line-2); background: var(--paper-3);
  font-size: 12.5px; font-weight: 500; color: var(--ink-2);
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.btn-back:hover { border-color: var(--ink-2); background: var(--paper); }
.btn-back.visible { display: flex; }
.btn-back svg { width: 14px; height: 14px; }

/* stat cards row */
.home-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: #fff; border: 1px solid var(--line);
  border-radius: 14px; padding: 20px 20px 16px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 6px;
  align-items: center;
  text-align: center;
}
.stat-card-label {
  font-size: 14px; font-weight: 700; letter-spacing: 0.7px;
  text-transform: uppercase; color: var(--ink-4);
}
.stat-card-val {
  font-family: 'DM Serif Display', serif;
  font-size: 48px; line-height: 1; color: var(--ink);
}
.stat-card-sub { font-size: 16px; color: var(--ink-4); margin-top: 2px; }
.stat-card.accent-red   .stat-card-val { color: var(--n1); }
.stat-card.accent-amber .stat-card-val { color: var(--n2); }
.stat-card.accent-green .stat-card-val { color: var(--n3); }
.stat-card.accent-blue  .stat-card-val { color: var(--bar-blue); }

/* filter bar */
.filter-bar {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.filter-label { font-size: 12px; color: var(--ink-4); font-weight: 500; margin-right: 4px; }
.filter-btn {
  padding: 5px 14px; border-radius: 99px;
  border: 1px solid var(--line-2); background: #fff;
  font-size: 12px; font-weight: 500; color: var(--ink-3);
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all 0.15s; white-space: nowrap;
}
.filter-btn:hover { border-color: var(--ink-2); color: var(--ink); }
.filter-btn.active {
  background: var(--ink); border-color: var(--ink); color: #fff;
}
.filter-divider { width: 1px; height: 20px; background: var(--line-2); }

/* summary table */
.home-table {
  background: #fff; border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
}
.ht-head {
  display: grid;
  /* Removed 56px column for "Nível" */
  grid-template-columns: 52px 190px 1fr 1fr 130px 100px 120px;
  background: #f8f8fa; border-bottom: 1px solid var(--line);
}
.ht-th {
  padding: 11px 14px; font-size: 13px; font-weight: 700;
  letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-4);
  text-align: center; border-right: 1px solid var(--line);
}
.ht-th:last-child { border-right: none; }
.ht-th.left { text-align: left; }

.ht-row {
  display: grid;
  /* Removed 56px column for "Nível" */
  grid-template-columns: 52px 190px 1fr 1fr 130px 100px 120px;
  border-bottom: 1px solid var(--line);
  transition: background 0.12s;
  cursor: pointer;
}
.ht-row:last-child { border-bottom: none; }
.ht-row:hover { background: var(--paper); }
.ht-row.new-loja { background: #f6fef9; }
.ht-row.new-loja:hover { background: #edfaf2; }

.ht-td {
  padding: 14px 14px; display: flex; align-items: center;
  justify-content: center; border-right: 1px solid var(--line);
  font-size: 19px; color: var(--ink); min-height: 64px;
}
.ht-td:last-child { border-right: none; }
.ht-td.left { justify-content: flex-start; }

.new-badge {
  display: inline-flex; align-items: center;
  padding: 2px 7px; border-radius: 99px;
  background: #dcfce7; color: #16a34a;
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.3px;
  white-space: nowrap;
}

/* mini progress in home table */
.mini-prog { width: 100%; display: flex; flex-direction: column; gap: 5px; }
.mini-row { display: flex; align-items: center; gap: 6px; }
.mini-track { flex: 1; height: 5px; background: var(--bar-track); border-radius: 99px; overflow: hidden; }
.mini-fill { height: 100%; border-radius: 99px; }
.mini-pct { font-size: 11px; font-weight: 700; min-width: 32px; text-align: right; }

/* detalhe button in home table */
.btn-detail {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 14px; border-radius: 7px;
  border: 1px solid var(--line-2); background: #fff;
  font-size: 12px; font-weight: 500; color: var(--ink-2);
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all 0.15s; white-space: nowrap;
}
.btn-detail:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn-detail svg { width: 12px; height: 12px; }

@media (max-width: 800px) {
  .ht-head { display: none; }
  .ht-row {
    grid-template-columns: 44px 1fr;
    grid-template-rows: auto auto auto;
    gap: 0;
  }
  .ht-td { min-height: auto; padding: 10px 12px; }
  .ht-td.rank-td { grid-row: 1/4; border-right: 1px solid var(--line); flex-direction: column; gap: 8px; }
  .ht-td.id-td   { grid-column: 2; grid-row: 1; border-right: none; border-bottom: 1px solid var(--line); justify-content: flex-start; }
  .ht-td.metrics-td { grid-column: 2; grid-row: 2; border-right: none; border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap; }
  .ht-td.prog-td  { grid-column: 2; grid-row: 3; border-right: none; }
  .ht-td.level-td, .ht-td.new-td, .ht-td.act-td { display: none; }
  .home-stats { grid-template-columns: repeat(2, 1fr); }
}


/* ── MOBILE ── */
@media (max-width: 800px) {
  .header { padding: 0 16px; }
  .main { padding: 16px 12px 48px; }

  .card-main {
    grid-template-columns: 48px 1fr;
    grid-template-rows: auto auto auto;
  }
  .col-rank {
    grid-row: 1 / 4; border-right: 1px solid var(--line);
    align-self: stretch;
  }
  .col-id {
    grid-column: 2; grid-row: 1;
    border-right: none; border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  .col-metrics {
    grid-column: 2; grid-row: 2;
    border-right: none; border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .metric-group { min-width: 60px; padding: 10px 10px; }
  .mg-val { font-size: 16px; }
  .col-right {
    grid-column: 2; grid-row: 3;
    min-width: 0; padding: 12px 14px;
    flex-direction: column; align-items: stretch; gap: 12px;
  }
  .actions-col { flex-direction: row; }
  .btn-card { flex: 1; justify-content: center; }
  .panel-body { padding: 16px; }
  .sec-grid { grid-template-columns: 1fr; }
  .bottom-bar { flex-direction: column; }
  .level-items { flex-direction: column; gap: 8px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <button class="btn-back" id="btn-back" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar
    </button>
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="13" width="4" height="8" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="5" width="4" height="16" rx="1"/></svg>
    </div>
    <div>
      <div class="header-title" id="header-title">Análise Semanal IM</div>
      <div class="header-subtitle" id="sub-info">A carregar…</div>
    </div>
  </div>
  <div class="header-badge" id="periodo">—</div>
</header>

<main class="main">
  <div id="home-screen" class="home-screen">
    <div class="loading">A carregar dados…</div>
  </div>
  <div id="detail-screen" class="detail-screen">
    <div id="app"></div>
  </div>
</main>

<script>
var charts = {};
var stateH = {}, stateS = {};
var _lojas = [], _ultima = '';
var _activeFilter = 'all';

/* ── Navigation ── */
function goHome() {
  document.getElementById('home-screen').classList.add('active');
  document.getElementById('detail-screen').classList.remove('active');
  document.getElementById('btn-back').classList.remove('visible');
  document.getElementById('header-title').textContent = 'Análise Semanal IM';
  document.getElementById('sub-info').textContent = _lojas.length + ' lojas · ' + _ultima;
}

function goDetail(lojaIdx) {
  document.getElementById('home-screen').classList.remove('active');
  document.getElementById('detail-screen').classList.add('active');
  document.getElementById('btn-back').classList.add('visible');
  var l = _lojas[lojaIdx];
  document.getElementById('header-title').textContent = (l.local || l.loja) + ' · ' + l.loja;
  document.getElementById('sub-info').textContent = 'Detalhe da loja · ' + _ultima;
  // render detail if not yet rendered
  if (!document.getElementById('ph-' + lojaIdx)) {
    renderDetail(_lojas, lojaIdx);
  }
  window.scrollTo(0, 0);
}

/* ── SVG helpers ── */
function svgClock() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
}
function svgFolder() {

function toggleH(li) {
  stateH[li] = !stateH[li];
  var p = document.getElementById('ph-' + li);
  var b = document.getElementById('bh-' + li);
  if (p) p.classList.toggle('open', stateH[li]);
  if (b) { b.classList.toggle('active', stateH[li]); b.innerHTML = svgClock() + (stateH[li] ? 'Fechar' : 'Histórico'); }
  if (stateH[li]) setTimeout(function() { if (charts['pnp-' + li]) charts['pnp-' + li].resize(); }, 100);

function toggleS(li) {
  stateS[li] = !stateS[li];
  var p = document.getElementById('ps-' + li);
  var b = document.getElementById('bs-' + li);
  if (p) p.classList.toggle('open', stateS[li]);

function setFilter(f) {
  _activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderHomeTable(_lojas);
}

fetch('dados.json?t=' + Date.now())
  .then(function(r) { return r.json(); })
  .then(function(json) {
    var data = json.data || [];
    var semanas = [];
    data.forEach(function(i) { var s = String(i.Semana||'').trim(); if (s && semanas.indexOf(s)===-1) semanas.push(s); });
    var ultima = semanas[semanas.length - 1] || '';
    var penultima = semanas[semanas.length - 2] || null;
    _ultima = ultima;

    /* IDs present in penultimate week (to detect new stores) */
    var idsPenultima = {};
    if (penultima) {
      data.filter(function(i) { return i.Loja && !i.Secção && String(i.Semana||'').trim() === penultima; })
        .forEach(function(i) { idsPenultima[String(i.Loja).trim()] = true; });
    }

    var lojas = data.filter(function(i) { return i.Loja && !i.Secção && String(i.Semana||'').trim() === ultima; })
      .map(function(i) {
        var pT=Number(i['P Total'])||0, pA=Number(i['P Aberto'])||0, pF=Number(i['P Fechado'])||0;
        var nT=Number(i['NP Total'])||0, nA=Number(i['NP Aberto'])||0, nF=Number(i['NP Fechado'])||0;
        var pctPF=pT>0?(pF/pT*100):0, pctNF=nT>0?(nF/nT*100):0;
        var nivel=pctPF>=41?3:pctPF>=21?2:1;
        var loc=String(i['Resumo contactos.Localidade']||i['IM.Localidade']||'').trim();
        var lojaId = String(i.Loja).trim();
        return { loja:lojaId, local:loc, pT:pT,pA:pA,pF:pF,nT:nT,nA:nA,nF:nF,
          pctPF:pctPF.toFixed(1), pctNF:pctNF.toFixed(1),
          pctPFInt:Math.round(pctPF), pctNFInt:Math.round(pctNF),
          nivel:nivel, historico:[], seccoes:[],
          isNew: penultima ? !idsPenultima[lojaId] : false
        };
      });

    lojas.sort(function(a,b) { return a.nivel!==b.nivel ? a.nivel-b.nivel : Number(a.pctPF)-Number(b.pctPF); });

    var ids = {};
    lojas.forEach(function(l) { ids[l.loja]=true; });

    var histMap = {};
    data.forEach(function(i) {
      if (i.Loja && !i.Secção && ids[String(i.Loja).trim()]) {
        var id=String(i.Loja).trim();
        if (!histMap[id]) histMap[id]=[];
        histMap[id].push(i);
      }
    });
    lojas.forEach(function(l) { l.historico=(histMap[l.loja]||[]).slice(-8); });

    data.forEach(function(i) {
      if (!i.Secção) return;
      var m=String(i.Secção).trim().match(/^(IM \d+)\s+(.+)$/);
      if (!m) return;
      var nome=m[2].trim();
      if (nome.toLowerCase()==='admin') return;
      if (!ids[m[1].trim()]) return;
      var loja=lojas.find(function(l){ return l.loja===m[1].trim(); });
      if (!loja) return;
      var pT=Number(i['Programadas Total'])||0, pF=Number(i['Programadas Fechadas'])||0;
      var nT=Number(i['Não Programadas Total'])||0, nF=Number(i['Não Programadas Fechadas'])||0;
      loja.seccoes.push({nome:nome, pT:pT,pA:pT-pF,pF:pF, nT:nT,nA:nT-nF,nF:nF});
    });
    lojas.forEach(function(l) { l.seccoes.sort(function(a,b){ return b.pA-a.pA; }); });

    _lojas = lojas;

    document.getElementById('sub-info').textContent = lojas.length + ' lojas · ' + ultima;
    document.getElementById('periodo').textContent = '📅 ' + ultima;

    renderHome(lojas, ultima, penultima);
  })
  .catch(function(e) {
    document.getElementById('home-screen').innerHTML = '<div class="loading" style="color:#b83232">Erro ao carregar: ' + e.message + '</div>';
  });

/* ── HOME RENDER ── */
function renderHome(lojas, ultima, penultima) {
  var n1 = lojas.filter(function(l){ return l.nivel===1; }).length;
  var n2 = lojas.filter(function(l){ return l.nivel===2; }).length;
  var n3 = lojas.filter(function(l){ return l.nivel===3; }).length;
  var novas = lojas.filter(function(l){ return l.isNew; }).length;
  var totalPT = lojas.reduce(function(s,l){ return s+l.pT; },0);
  var totalPF = lojas.reduce(function(s,l){ return s+l.pF; },0);
  var pctGlobal = totalPT>0 ? Math.round(totalPF/totalPT*100) : 0;

  var html = '';

  /* Stats row */
  html += '<div class="home-stats">';
  html += statCard('Total de Lojas', lojas.length, penultima ? 'Esta semana' : 'Todas as lojas', '');
  html += statCard('Nível 1 — Crítico', n1, '0–20% prog. fechadas', 'accent-red');
  html += statCard('Nível 2 — Atenção', n2, '21–40% prog. fechadas', 'accent-amber');
  html += statCard('Nível 3 — OK', n3, '41%+ prog. fechadas', 'accent-green');
  if (penultima) {
    html += statCard('Entradas Novas', novas, 'Não presentes em '+penultima, novas>0?'accent-blue':'');
  }

  html += '</div>';

  /* Filter bar */
  var newCount = lojas.filter(function(l){ return l.isNew; }).length;
  var oldCount = lojas.length - newCount;
  html += '<div class="filter-bar">';
  html += '<span class="filter-label">Mostrar:</span>';
  html += '<button class="filter-btn active" data-filter="all" onclick="setFilter(\'all\')">Todas ('+lojas.length+')</button>';
  html += '<button class="filter-btn" data-filter="old" onclick="setFilter(\'old\')">Lojas Anteriores ('+oldCount+')</button>';
  if (newCount > 0) {
    html += '<button class="filter-btn" data-filter="new" onclick="setFilter(\'new\')">Entradas Novas ('+newCount+')</button>';
  }
  html += '<div class="filter-divider"></div>';
  html += '<button class="filter-btn" data-filter="n1" onclick="setFilter(\'n1\')">🔴 N1 ('+n1+')</button>';
  html += '<button class="filter-btn" data-filter="n2" onclick="setFilter(\'n2\')">🟠 N2 ('+n2+')</button>';
  html += '<button class="filter-btn" data-filter="n3" onclick="setFilter(\'n3\')">🟡 N3 ('+n3+')</button>';
  html += '</div>';

  /* Table shell — rows injected by renderHomeTable */
  html += '<div class="home-table">';
  html += '<div class="ht-head">';
  html += '<div class="ht-th">#</div>';
  /* Removed ht-th for "Nível" */
  html += '<div class="ht-th left">Loja</div>';
  html += '<div class="ht-th">Tarefas Programadas</div>';
  html += '<div class="ht-th">Tarefas Não Programadas</div>';
  html += '<div class="ht-th">Comparação de P vs NP</div>';
  html += '<div class="ht-th">Estado</div>';
  html += '<div class="ht-th">Detalhe</div>';
  html += '</div>';
  html += '<div id="ht-body"></div>';
  html += '</div>';

  /* Bottom legend */
  html += '<div class="bottom-bar" style="margin-top:20px">';
  html += '<div class="level-legend"><div class="level-legend-title">Classificação de Nível</div><div class="level-items">';
  html += '<div class="level-item"><div class="level-dot pill-n1">N1</div><span>0–20% prog. fechadas — crítico</span></div>';
  html += '<div class="level-item"><div class="level-dot pill-n2">N2</div><span>21–40% fechadas — atenção</span></div>';
  html += '<div class="level-item"><div class="level-dot pill-n3">N3</div><span>41%+ fechadas — satisfatório</span></div>';
  html += '</div></div>';
  html += '<div class="action-banner"><div class="action-icon">⚠</div><div><div class="action-title">Ação Recomendada</div><div class="action-desc">Contactar urgentemente responsáveis das lojas N1. Clique em "Detalhe" para ver o histórico e secções.</div></div></div>';
  html += '</div>';

  document.getElementById('home-screen').innerHTML = html;
  document.getElementById('home-screen').classList.add('active');
  renderHomeTable(lojas);
}

function statCard(label, val, sub, accent) {
  return '<div class="stat-card '+(accent||'')+'">'
    +'<div class="stat-card-label">'+label+'</div>'
    +'<div class="stat-card-val">'+val+'</div>'
    +'<div class="stat-card-sub">'+sub+'</div>'
    +'</div>';
}

function renderHomeTable(lojas) {
  var f = _activeFilter;
  var filtered = lojas.filter(function(l) {
    if (f === 'new') return l.isNew;
    if (f === 'old') return !l.isNew;
    if (f === 'n1')  return l.nivel === 1;
    if (f === 'n2')  return l.nivel === 2;
    if (f === 'n3')  return l.nivel === 3;
    return true;
  });

  var html = '';
  if (filtered.length === 0) {
    html = '<div style="padding:32px;text-align:center;color:var(--ink-4);font-size:13px">Sem lojas para este filtro.</div>';
  } else {
    filtered.forEach(function(l) {
      var li = lojas.indexOf(l); /* real index for detail navigation */
      var pc = pillCls(l.nivel);
      html += '<div class="ht-row'+(l.isNew?' new-loja':'')+'" onclick="goDetail('+li+')">';

      /* rank */
      html += '<div class="ht-td rank-td">';
      html += '<div class="rank-num">'+(li+1)+'</div>';
      html += '<div class="rank-pill '+pc+'">N'+l.nivel+'</div>';
      html += '</div>';

      /* Removed ht-td level-td */

      /* identity */
      html += '<div class="ht-td left id-td" style="flex-direction:column;align-items:flex-start;gap:2px">';
      html += '<div style="font-weight:600;font-size:13.5px">'+(l.local||l.loja)+'</div>';
      html += '<div style="font-size:11.5px;color:var(--ink-4)">'+l.loja+'</div>';
      html += '</div>';

      /* P metrics */
      html += '<div class="ht-td metrics-td" style="flex-direction:column;gap:2px">';
      html += '<div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--ink-4)">Total '+fmt(l.pT)+'</div>';
      html += '<div style="font-size:12px;color:var(--ink-3)">'+fmt(l.pA)+' abertas · '+fmt(l.pF)+' fechadas</div>';
      html += '</div>';

      /* NP metrics */
      html += '<div class="ht-td" style="flex-direction:column;gap:2px">';
      html += '<div style="font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--ink-4)">Total '+fmt(l.nT)+'</div>';
      html += '<div style="font-size:12px;color:var(--ink-3)">'+fmt(l.nA)+' abertas · '+fmt(l.nF)+' fechadas</div>';
      html += '</div>';

      /* progress */
      html += '<div class="ht-td prog-td"><div class="mini-prog">';
      html += '<div class="mini-row">'
        +'<span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-4);min-width:20px">P</span>'
        +'<div class="mini-track"><div class="mini-fill fill-blue" style="width:'+l.pctPFInt+'%"></div></div>'
        +'<span class="mini-pct" style="color:var(--bar-blue)">'+l.pctPFInt+'%</span>'
        +'</div>';
      html += '<div class="mini-row">'
        +'<span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-4);min-width:20px">NP</span>'
        +'<div class="mini-track"><div class="mini-fill fill-orange" style="width:'+l.pctNFInt+'%"></div></div>'
        +'<span class="mini-pct" style="color:var(--bar-orange)">'+l.pctNFInt+'%</span>'
        +'</div>';
      html += '</div></div>';

      /* new badge */
      html += '<div class="ht-td new-td">';
      if (l.isNew) html += '<span class="new-badge">✦ Nova</span>';
      html += '</div>';

      /* detail button */
      html += '<div class="ht-td act-td" onclick="event.stopPropagation()">';
      html += '<button class="btn-detail" onclick="goDetail('+li+')">Detalhe '+svgArrow()+'</button>';
      html += '</div>';

      html += '</div>';
    });
  }
  document.getElementById('ht-body').innerHTML = html;
}



function pillCls(n) { return n===1?'pill-n1':n===2?'pill-n2':'pill-n3'; }

function fmt(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

    var sel=document.getElementById('sc-'+li+'-'+si);
    if (!sel) return;
    var pP=s.pT>0?parseFloat((s.pF/s.pT*100).toFixed(1)):0;
    var pN=s.nT>0?parseFloat((s.nF/s.nT*100).toFixed(1)):0;
    charts['sc-'+li+'-'+si]=new Chart(sel.getContext('2d'),{
      type:'bar', plugins:[ChartDataLabels],
      data:{labels:['Programadas','Não Prog.'],datasets:[{data:[pP,pN],backgroundColor:['rgba(59,63,216,.75)','rgba(255,140,0,.8)'],borderRadius:3,borderWidth:0}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,layout:{padding:{right:42}},
        plugins:{datalabels:{anchor:'end',align:'right',formatter:function(v){return v+'%';},font:{size:11,weight:'600'},color:'#3a3835'},legend:{display:false}},
        scales:{x:{beginAtZero:true,max:100,display:false},y:{ticks:{font:{size:11,weight:'500'},color:'#3a3835'},grid:{display:false}}}
      }
    });
  });
}
