<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg-primary:#ffffff;
  --bg-secondary:#f8f9fa;
  --bg-tertiary:#f0f2f5;
  --border:rgba(0,0,0,0.08);
  --text-primary:#1a1a1a;
  --text-secondary:#4a4a4a;
  --text-tertiary:#808080;
  --accent-purple:#8b5cf6;
  --accent-pink:#ec4899;
  --success:#22c55e;
  --warning:#ef4444;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text-primary);
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:44px;
  height:44px;
  border-radius:12px;
  background:var(--grad);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:22px;
}

.header-title h1{
  font-size:24px;
  font-weight:800;
}

.header-title .sub{
  color:#777;
  margin-top:4px;
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);
  padding:10px 16px;
  border-radius:10px;
  font-weight:700;
  color:#8b5cf6;
}

/* MAIN */

.main{
  padding:30px;
  max-width:1800px;
  margin:auto;
}

/* KPI */

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.kpi-card{
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px;
  background:#fff;
}

.kpi-label{
  font-size:13px;
  font-weight:800;
  margin-bottom:16px;
}

.kpi-value{
  font-size:42px;
  font-weight:800;
}

.kpi-sublabel{
  margin-top:10px;
  color:#777;
}

/* TABLE */

.table-container{
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.table-header{
  display:grid;
  grid-template-columns:
  0.6fr
  1fr
  0.9fr
  0.9fr
  0.9fr
  0.9fr
  1fr
  1fr
  0.8fr
  1fr;

  background:#fafafa;
  border-bottom:1px solid var(--border);
}

.table-header div{
  padding:20px 12px;
  font-size:13px;
  font-weight:800;
  color:#666;
  text-transform:uppercase;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
}

.table-row{
  display:grid;
  grid-template-columns:
  0.6fr
  1fr
  0.9fr
  0.9fr
  0.9fr
  0.9fr
  1fr
  1fr
  0.8fr
  1fr;

  border-bottom:1px solid var(--border);
  transition:.2s;
}

.table-row:hover{
  background:rgba(139,92,246,.03);
}

.cell{
  padding:20px 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* RANK */

.rank-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.rank-number{
  font-size:30px;
  font-weight:800;
}

.rank-badge{
  padding:4px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
}

.badge-n1{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

.badge-n2{
  background:rgba(251,146,60,.12);
  color:#fb923c;
}

.badge-n3{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

/* LOJA */

.loja-box{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
}

.loja-nome{
  font-size:18px;
  font-weight:800;
}

.loja-local{
  color:#777;
}

/* NUMBERS */

.metric-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.metric-number{
  font-size:28px;
  font-weight:800;
}

.metric-label{
  font-size:12px;
  color:#777;
}

/* TREND */

.trend{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.trend-arrow{
  font-size:30px;
  font-weight:800;
}

.trend-value{
  font-size:22px;
  font-weight:800;
}

.up{
  color:#ef4444;
}

.down{
  color:#22c55e;
}

/* BUTTONS */

.actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:center;
}

.btn{
  background:#fff;
  border:1px solid rgba(139,92,246,.25);
  color:#8b5cf6;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  background:rgba(139,92,246,.08);
}

/* PANELS */

.panel{
  border-bottom:1px solid var(--border);
  background:rgba(139,92,246,.03);
}

.panel-inner{
  padding:30px;
}

/* HISTORY */

.history-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:20px;
}

.detail-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

.detail-table th{
  background:#fafafa;
  padding:14px;
  font-size:13px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

.detail-table td{
  padding:14px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

.reason-up{
  color:#ef4444;
  font-weight:700;
}

.reason-down{
  color:#22c55e;
  font-weight:700;
}

/* SECTION */

.sections-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:20px;
}

.sections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
}

.section-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}

.section-name{
  font-size:18px;
  font-weight:800;
  margin-bottom:20px;
}

.sec-line{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:14px;
}

.bar{
  height:8px;
  border-radius:999px;
  overflow:hidden;
  background:#e5e7eb;
  margin-bottom:18px;
}

.fill{
  height:100%;
}

.red{
  background:#ef4444;
}

.green{
  background:#22c55e;
}

/* DETAIL */

.detail-grid{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.detail-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}

.detail-label{
  font-size:13px;
  color:#777;
  font-weight:700;
  margin-bottom:14px;
}

.detail-value{
  font-size:32px;
  font-weight:800;
}

.detail-percent{
  margin-top:8px;
  color:#666;
}

/* RESPONSIVE */

@media(max-width:1400px){

  .table-header{
    display:none;
  }

  .table-row{
    grid-template-columns:1fr;
  }

  .detail-grid{
    grid-template-columns:1fr 1fr;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-brand">

    <div class="header-logo">
      📊
    </div>

    <div class="header-title">
      <h1>Análise Semanal</h1>
      <div class="sub" id="sub-info">
        Carregando...
      </div>
    </div>

  </div>

  <div class="header-period" id="periodo">
    —
  </div>

</header>

<main class="main">

  <div id="app">
    Carregando...
  </div>

</main>

<script>

fetch('dados.json?t=' + Date.now())

.then(r => r.json())

.then(json => {

  const data = json.data || [];

  const semanas = [];

  data.forEach(i => {

    const s = String(i.Semana || '').trim();

    if(s && !semanas.includes(s)){
      semanas.push(s);
    }

  });

  const ultima = semanas[semanas.length - 1] || '';

  const lojas = data

  .filter(i =>
    i.Loja &&
    !i.Secção &&
    String(i.Semana || '').trim() === ultima
  )

  .map(i => {

    const pTotal = Number(i['P Total']) || 0;
    const pAberto = Number(i['P Aberto']) || 0;
    const pFechado = Number(i['P Fechado']) || 0;

    const npTotal = Number(i['NP Total']) || 0;
    const npAberto = Number(i['NP Aberto']) || 0;
    const npFechado = Number(i['NP Fechado']) || 0;

    return {

      loja:String(i.Loja).trim(),

      local:String(
        i['Resumo contactos.Localidade']
        ||
        i['IM.Localidade']
        ||
        ''
      ).trim(),

      pTotal,
      pAberto,
      pFechado,

      npTotal,
      npAberto,
      npFechado,

      nivel:
      pAberto <= 20
      ? 1
      : pAberto <= 40
      ? 2
      : 3,

      historico:[],
      seccoes:[]

    };

  })

  .filter(l => l.pAberto > 0);

  lojas.sort((a,b)=>b.pAberto-a.pAberto);

  const top = lojas.slice(0,10);

  const ids = {};

  top.forEach(l => {
    ids[l.loja] = true;
  });

  const historicoMap = {};

  data.forEach(i => {

    if(
      !i.Secção &&
      i.Loja &&
      ids[String(i.Loja).trim()]
    ){

      const id = String(i.Loja).trim();

      if(!historicoMap[id]){
        historicoMap[id] = [];
      }

      historicoMap[id].push({

        semana:String(i.Semana).trim(),

        pAberto:Number(i['P Aberto']) || 0,
        pFechado:Number(i['P Fechado']) || 0,

        npAberto:Number(i['NP Aberto']) || 0,
        npFechado:Number(i['NP Fechado']) || 0

      });

    }

  });

  top.forEach(l => {

    const hist = historicoMap[l.loja] || [];

    l.historico = hist;

    const ultimas = hist.slice(-2);

    l.diff = ultimas.length === 2
    ? ultimas[1].pAberto - ultimas[0].pAberto
    : 0;

  });

  data.forEach(i => {

    if(
      i.Secção &&
      i.Loja &&
      ids[String(i.Loja).trim()]
    ){

      const loja = top.find(
        l => l.loja === String(i.Loja).trim()
      );

      if(loja){

        const nome = String(i.Secção)
        .replace(/^IM\s+\d+\s+/,'')
        .trim();

        if(nome.toLowerCase() !== 'admin'){

          loja.seccoes.push({

            nome,

            pAberto:Number(i['P Aberto']) || 0,
            pFechado:Number(i['P Fechado']) || 0,

            npAberto:Number(i['NP Aberto']) || 0,
            npFechado:Number(i['NP Fechado']) || 0,

            pTotal:Number(i['P Total']) || 0,
            npTotal:Number(i['NP Total']) || 0

          });

        }

      }

    }

  });

  document.getElementById('sub-info').textContent =
  'Gerado hoje · ' + top.length + ' lojas';

  document.getElementById('periodo').textContent =
  '📅 ' + ultima;

  render(top);

});

function render(lojas){

  let html = `

  <div class="kpi-grid">

    <div class="kpi-card">
      <div class="kpi-label">🔴 Críticas</div>
      <div class="kpi-value">
        ${lojas.slice(0,3).length}
      </div>
      <div class="kpi-sublabel">
        Top 3 lojas
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-label">🔴 Alertas</div>
      <div class="kpi-value">
        ${lojas.slice(3).length}
      </div>
      <div class="kpi-sublabel">
        Em observação
      </div>
    </div>

  </div>

  <div class="table-container">

    <div class="table-header">

      <div>Rank</div>
      <div>Loja</div>

      <div>Programadas Totais</div>
      <div>Programadas Abertas</div>
      <div>Programadas Fechadas</div>

      <div>Não Programadas Totais</div>
      <div>Não Programadas Abertas</div>
      <div>Não Programadas Fechadas</div>

      <div>Tendência</div>

      <div>Ações</div>

    </div>

  `;

  lojas.forEach((l,index)=>{

    const badge =
    l.nivel === 1
    ? 'badge-n1'
    : l.nivel === 2
    ? 'badge-n2'
    : 'badge-n3';

    const trend =
    l.diff > 0
    ? '▲'
    : l.diff < 0
    ? '▼'
    : '→';

    const trendClass =
    l.diff > 0
    ? 'up'
    : 'down';

    html += `

    <div class="table-row">

      <div class="cell">

        <div class="rank-wrap">

          <div class="rank-number">
            ${index + 1}
          </div>

          <div class="rank-badge ${badge}">
            N${l.nivel}
          </div>

        </div>

      </div>

      <div class="cell">

        <div class="loja-box">

          <div class="loja-nome">
            ${l.loja}
          </div>

          <div class="loja-local">
            ${l.local}
          </div>

        </div>

      </div>

      <div class="cell">
        <div class="metric-box">
          <div class="metric-number">${l.pTotal}</div>
        </div>
      </div>

      <div class="cell">
        <div class="metric-box">
          <div class="metric-number">${l.pAberto}</div>
        </div>
      </div>

      <div class="cell">
        <div class="metric-box">
          <div class="metric-number">${l.pFechado}</div>
        </div>
      </div>

      <div class="cell">
        <div class="metric-box">
          <div class="metric-number">${l.npTotal}</div>
        </div>
      </div>

      <div class="cell">
        <div class="metric-box">
          <div class="metric-number">${l.npAberto}</div>
        </div>
      </div>

      <div class="cell">
        <div class="metric-box">
          <div class="metric-number">${l.npFechado}</div>
        </div>
      </div>

      <div class="cell">

        <div class="trend ${trendClass}">

          <div class="trend-arrow">
            ${trend}
          </div>

          <div class="trend-value">
            ${Math.abs(l.diff)}
          </div>

        </div>

      </div>

      <div class="cell">

        <div class="actions">

          <button class="btn">
            Histórico
          </button>

          <button class="btn">
            Secções
          </button>

        </div>

      </div>

    </div>

    <div class="panel">

      <div class="panel-inner">

        <div class="history-title">
          Histórico e Motivo da Tendência
        </div>

        <table class="detail-table">

          <thead>

            <tr>

              <th>Semana</th>

              <th>Programadas Abertas</th>
              <th>Programadas Fechadas</th>

              <th>Não Programadas Abertas</th>
              <th>Não Programadas Fechadas</th>

              <th>Tendência</th>

            </tr>

          </thead>

          <tbody>

            ${l.historico.map((h,i)=>{

              let motivo = 'Sem alteração';

              if(i > 0){

                const anterior = l.historico[i-1];

                if(h.pAberto > anterior.pAberto){

                  motivo =
                  '<span class="reason-up">Aumentou porque existem mais tarefas programadas abertas do que na semana anterior</span>';

                }

                else if(h.pAberto < anterior.pAberto){

                  motivo =
                  '<span class="reason-down">Diminuiu porque existem menos tarefas programadas abertas do que na semana anterior</span>';

                }

              }

              return `

              <tr>

                <td>${h.semana}</td>

                <td>${h.pAberto}</td>
                <td>${h.pFechado}</td>

                <td>${h.npAberto}</td>
                <td>${h.npFechado}</td>

                <td>${motivo}</td>

              </tr>

              `;

            }).join('')}

          </tbody>

        </table>

        <div class="sections-title" style="margin-top:40px">
          Secções
        </div>

        <div class="sections-grid">

          ${l.seccoes.map(s=>`

            <div class="section-card">

              <div class="section-name">
                ${s.nome}
              </div>

              <div class="sec-line">
                <span>Programadas Abertas</span>
                <strong>${s.pAberto}</strong>
              </div>

              <div class="bar">
                <div 
                  class="fill red"
                  style="width:${s.pTotal > 0 ? (s.pAberto / s.pTotal * 100) : 0}%">
                </div>
              </div>

              <div class="sec-line">
                <span>Programadas Fechadas</span>
                <strong>${s.pFechado}</strong>
              </div>

              <div class="bar">
                <div 
                  class="fill green"
                  style="width:${s.pTotal > 0 ? (s.pFechado / s.pTotal * 100) : 0}%">
                </div>
              </div>

              <div class="sec-line">
                <span>Não Programadas Abertas</span>
                <strong>${s.npAberto}</strong>
              </div>

              <div class="bar">
                <div 
                  class="fill red"
                  style="width:${s.npTotal > 0 ? (s.npAberto / s.npTotal * 100) : 0}%">
                </div>
              </div>

              <div class="sec-line">
                <span>Não Programadas Fechadas</span>
                <strong>${s.npFechado}</strong>
              </div>

              <div class="bar">
                <div 
                  class="fill green"
                  style="width:${s.npTotal > 0 ? (s.npFechado / s.npTotal * 100) : 0}%">
                </div>
              </div>

            </div>

          `).join('')}

        </div>

        <div class="detail-grid">

          <div class="detail-box">

            <div class="detail-label">
              Programadas Abertas
            </div>

            <div class="detail-value">
              ${l.pAberto}
            </div>

            <div class="detail-percent">
              Total Programadas: ${l.pTotal}
            </div>

          </div>

          <div class="detail-box">

            <div class="detail-label">
              Programadas Fechadas
            </div>

            <div class="detail-value">
              ${l.pFechado}
            </div>

            <div class="detail-percent">
              Total Programadas: ${l.pTotal}
            </div>

          </div>

          <div class="detail-box">

            <div class="detail-label">
              Não Programadas Abertas
            </div>

            <div class="detail-value">
              ${l.npAberto}
            </div>

            <div class="detail-percent">
              Total Não Programadas: ${l.npTotal}
            </div>

          </div>

          <div class="detail-box">

            <div class="detail-label">
              Não Programadas Fechadas
            </div>

            <div class="detail-value">
              ${l.npFechado}
            </div>

            <div class="detail-percent">
              Total Não Programadas: ${l.npTotal}
            </div>

          </div>

        </div>

      </div>

    </div>

    `;

  });

  html += `</div>`;

  document.getElementById('app').innerHTML = html;

}

</script>

</body>
</html>
