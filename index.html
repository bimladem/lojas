<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --border:rgba(0,0,0,0.08);
  --text-primary:#1a1a1a;
  --text-secondary:#4a4a4a;
  --text-tertiary:#808080;
  --success:#22c55e;
  --danger:#ef4444;
  --warning:#fb923c;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text-primary);
  font-size:17px;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:24px 50px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:20px;
}

.header-logo{
  width:58px;
  height:58px;
  border-radius:16px;
  background:var(--grad);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.header-title{
  text-align:center;
}

.header-title h1{
  font-size:36px;
  font-weight:800;
}

.header-title .sub{
  color:var(--text-tertiary);
  font-size:15px;
  margin-top:6px;
}

.header-period{
  margin-left:30px;
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);
  padding:12px 20px;
  border-radius:12px;
  font-weight:700;
  color:#8b5cf6;
  font-size:16px;
}

.main{
  max-width:1900px;
  margin:0 auto;
  padding:40px 60px 80px;
}

.legend-row{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:18px;
  margin-bottom:35px;
  font-size:16px;
  color:var(--text-secondary);
}

.leg{
  display:flex;
  align-items:center;
  gap:8px;
}

.leg-sep{
  width:1px;
  height:18px;
  background:var(--border);
}

.leg-dot{
  width:12px;
  height:12px;
  border-radius:50%;
}

.table-container{
  border:1px solid var(--border);
  border-radius:24px;
  overflow:hidden;
}

.tgrid{
  display:grid;
  grid-template-columns:
    100px
    260px
    120px
    120px
    120px
    120px
    120px
    120px
    170px
    130px
    130px;
  align-items:center;
  justify-items:center;
}

.table-header{
  padding:22px 30px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  font-size:14px;
  font-weight:800;
  text-transform:uppercase;
  color:#777;
}

.table-row{
  border-bottom:1px solid var(--border);
  transition:.2s;
  padding:0 30px;
}

.table-row:hover{
  background:rgba(139,92,246,.03);
}

.row-main{
  padding:28px 0;
}

.c-rank{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.rank-emoji{
  font-size:28px;
}

.rank-num{
  font-size:34px;
  font-weight:800;
}

.rank-badge{
  padding:5px 10px;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
}

.bn1{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

.bn2{
  background:rgba(251,146,60,.12);
  color:#fb923c;
}

.bn3{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

.c-loja{
  text-align:center;
}

.loja-nome{
  font-size:23px;
  font-weight:800;
  margin-bottom:8px;
}

.loja-local{
  font-size:15px;
  color:var(--text-tertiary);
}

.c-num{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.num-val{
  font-size:28px;
  font-weight:800;
}

.num-pct{
  padding:4px 10px;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
}

.pct-red{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

.pct-green{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

.pct-gray{
  background:rgba(0,0,0,.05);
  color:#777;
}

.c-tend{
  display:flex;
  justify-content:center;
}

.tend-badge{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:14px 18px;
  border-radius:16px;
  min-width:140px;
}

.tend-badge-up{
  background:rgba(239,68,68,.10);
  border:1px solid rgba(239,68,68,.18);
}

.tend-badge-down{
  background:rgba(34,197,94,.10);
  border:1px solid rgba(34,197,94,.18);
}

.tend-badge-neu{
  background:rgba(0,0,0,.04);
  border:1px solid rgba(0,0,0,.08);
}

.tend-icon{
  font-size:28px;
  font-weight:800;
}

.tend-val{
  font-size:24px;
  font-weight:800;
}

.tend-ctx{
  font-size:13px;
  line-height:1.5;
  text-align:center;
  color:#666;
}

.t-up{
  color:#ef4444;
}

.t-down{
  color:#22c55e;
}

.t-neu{
  color:#777;
}

.c-btn{
  text-align:center;
}

.btn-act{
  width:110px;
  background:#fff;
  border:1px solid rgba(139,92,246,.25);
  color:#8b5cf6;
  border-radius:10px;
  padding:12px 14px;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
  transition:.2s;
}

.btn-act:hover{
  background:rgba(139,92,246,.08);
}

.btn-act.open{
  background:var(--grad);
  color:#fff;
  border-color:transparent;
}

.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  padding:30px;
  background:rgba(139,92,246,.03);
  border-top:1px solid var(--border);
}

.panel-title{
  text-align:center;
  font-size:16px;
  font-weight:800;
  color:#777;
  margin-bottom:20px;
}

.detail-table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

.detail-table th{
  padding:16px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  text-align:center;
  font-size:14px;
  color:#777;
}

.detail-table td{
  padding:16px;
  border-bottom:1px solid var(--border);
  text-align:center;
}

.detail-table tr.current td{
  background:rgba(139,92,246,.06);
  font-weight:800;
}

.sections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:22px;
}

.sec-block{
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  background:#fff;
}

.sec-head{
  padding:18px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  text-align:center;
  font-size:18px;
  font-weight:800;
}

.sec-body{
  padding:20px;
}

.sec-cat-title{
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  color:#999;
  margin-bottom:12px;
  text-align:center;
}

.sec-metric{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:15px;
}

.bar{
  height:8px;
  border-radius:999px;
  background:#ececec;
  overflow:hidden;
  margin-bottom:16px;
}

.bar-fill{
  height:100%;
}

.bar-red{
  background:#ef4444;
}

.bar-green{
  background:#22c55e;
}

.note{
  margin-top:40px;
  padding:28px;
  border-radius:18px;
  background:#fafafa;
  border:1px solid var(--border);
  text-align:center;
  font-size:16px;
  line-height:2;
  color:#555;
}

.loading{
  padding:100px;
  text-align:center;
  font-size:22px;
  color:#888;
}

@media(max-width:1400px){

  .tgrid{
    grid-template-columns:1fr;
    gap:18px;
  }

  .table-header{
    display:none;
  }

  .row-main{
    padding:30px 0;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-brand">

    <div class="header-logo">
      📊
    </div>

    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">A carregar...</div>
    </div>

    <div class="header-period" id="periodo">
      —
    </div>

  </div>

</header>

<main class="main">

  <div class="legend-row">

    <span class="leg">
      <span class="leg-dot" style="background:#22c55e"></span>
      N1 • Até 20%
    </span>

    <div class="leg-sep"></div>

    <span class="leg">
      <span class="leg-dot" style="background:#fb923c"></span>
      N2 • 21% até 40%
    </span>

    <div class="leg-sep"></div>

    <span class="leg">
      <span class="leg-dot" style="background:#ef4444"></span>
      N3 • Mais de 40%
    </span>

  </div>

  <div id="app">
    <div class="loading">
      ⏳ A carregar dados...
    </div>
  </div>

</main>

<script>

var stateHist = {};
var stateSec = {};

function toggleHist(li){

  var p=document.getElementById('hist-'+li);
  var b=document.getElementById('btnhist-'+li);

  stateHist[li]=!stateHist[li];

  p.classList.toggle('visible',stateHist[li]);
  b.classList.toggle('open',stateHist[li]);

  b.innerHTML=stateHist[li]
    ? '▼ Fechar'
    : '▶ Histórico';
}

function toggleSec(li){

  var p=document.getElementById('sec-'+li);
  var b=document.getElementById('btnsec-'+li);

  stateSec[li]=!stateSec[li];

  p.classList.toggle('visible',stateSec[li]);
  b.classList.toggle('open',stateSec[li]);

  b.innerHTML=stateSec[li]
    ? '▼ Fechar'
    : '▶ Secções';
}

fetch('dados.json?t='+Date.now())

.then(r=>r.json())

.then(json=>{

  var data=json.data||[];

  var semanas=[];

  data.forEach(i=>{

    var s=String(i.Semana||'').trim();

    if(s && semanas.indexOf(s)===-1){
      semanas.push(s);
    }

  });

  var ultima=semanas[semanas.length-1]||'';

  var lojas=data

  .filter(i=>
    i.Loja &&
    !i.Secção &&
    String(i.Semana||'').trim()===ultima
  )

  .map(i=>{

    var pT=Number(i['P Total'])||0;
    var pA=Number(i['P Aberto'])||0;
    var pF=Number(i['P Fechado'])||0;

    var nT=Number(i['NP Total'])||0;
    var nA=Number(i['NP Aberto'])||0;
    var nF=Number(i['NP Fechado'])||0;

    var pctPA=pT>0?(pA/pT*100).toFixed(1):'0.0';
    var pctPF=pT>0?(pF/pT*100).toFixed(1):'0.0';

    var pctNA=nT>0?(nA/nT*100).toFixed(1):'0.0';
    var pctNF=nT>0?(nF/nT*100).toFixed(1):'0.0';

    return{

      loja:String(i.Loja).trim(),

      local:String(
        i['Resumo contactos.Localidade'] ||
        i['IM.Localidade'] ||
        ''
      ).trim(),

      pT,pA,pF,
      nT,nA,nF,

      pctPA,pctPF,
      pctNA,pctNF,

      nivel:
        parseFloat(pctPA)<=20
        ? 1
        : parseFloat(pctPA)<=40
        ? 2
        : 3,

      historico:[],
      seccoes:[]

    };

  });

  lojas.sort((a,b)=>b.pA-a.pA);

  var ids={};

  lojas.forEach(l=>{
    ids[l.loja]=true;
  });

  var hpl={};

  data.forEach(i=>{

    if(
      !i.Secção &&
      i.Loja &&
      i.Semana &&
      ids[String(i.Loja).trim()]
    ){

      var id=String(i.Loja).trim();

      if(!hpl[id]){
        hpl[id]=[];
      }

      hpl[id].push({

        semana:String(i.Semana).trim(),

        pA:Number(i['P Aberto'])||0,
        pF:Number(i['P Fechado'])||0,

        nA:Number(i['NP Aberto'])||0,
        nF:Number(i['NP Fechado'])||0

      });

    }

  });

  lojas.forEach(l=>{

    var h=hpl[l.loja]||[];

    l.historico=h
      .filter(x=>x.semana!==ultima)
      .slice(-8);

    var u=h.slice(-2);

    l.diff=
      u.length===2
      ? u[1].pA-u[0].pA
      : null;

  });

  data.forEach(i=>{

    if(
      i.Secção &&
      i.Loja &&
      ids[String(i.Loja).trim()]
    ){

      var loja=lojas.find(
        l=>l.loja===String(i.Loja).trim()
      );

      if(loja){

        var nome=String(i.Secção)
          .replace(/^IM\s+\d+\s+/,'')
          .trim();

        if(nome.toLowerCase()!=='admin'){

          var pA=Number(i['P Aberto'])||0;
          var pF=Number(i['P Fechado'])||0;

          var nA=Number(i['NP Aberto'])||0;
          var nF=Number(i['NP Fechado'])||0;

          var pT=Number(i['P Total'])||0;
          var nT=Number(i['NP Total'])||0;

          loja.seccoes.push({

            nome,

            pA,pF,nA,nF,

            pctPA:pT>0?(pA/pT*100).toFixed(1):'0.0',
            pctPF:pT>0?(pF/pT*100).toFixed(1):'0.0',

            pctNA:nT>0?(nA/nT*100).toFixed(1):'0.0',
            pctNF:nT>0?(nF/nT*100).toFixed(1):'0.0'

          });

        }

      }

    }

  });

  document.getElementById('sub-info').textContent=
    'Gerado hoje • '+lojas.length+' lojas';

  document.getElementById('periodo').innerHTML=
    '📅 <strong>'+ultima+'</strong>';

  renderApp(lojas,ultima);

});

function renderApp(lojas,ultima){

  var header=''

  +'<div class="table-container">'

  +'<div class="tgrid table-header">'

  +'<div>Rank</div>'
  +'<div>Loja</div>'
  +'<div>P Total</div>'
  +'<div>P Aberto</div>'
  +'<div>P Fechado</div>'
  +'<div>NP Total</div>'
  +'<div>NP Aberto</div>'
  +'<div>NP Fechado</div>'
  +'<div>Tendência</div>'
  +'<div>Histórico</div>'
  +'<div>Secções</div>'

  +'</div>';

  var rows='';

  lojas.forEach((l,li)=>{

    var emoji=l.nivel===3
      ? '🔴'
      : l.nivel===2
      ? '🟡'
      : '🟢';

    var bn=l.nivel===1
      ? 'bn1'
      : l.nivel===2
      ? 'bn2'
      : 'bn3';

    var tendencia='';

    if(l.diff===null){

      tendencia=''

      +'<div class="c-tend">'
      +'<div class="tend-badge tend-badge-neu">'
      +'<div class="tend-icon t-neu">—</div>'
      +'<div class="tend-ctx">Sem dados</div>'
      +'</div>'
      +'</div>';

    }else if(l.diff>0){

      tendencia=''

      +'<div class="c-tend">'
      +'<div class="tend-badge tend-badge-up">'
      +'<div class="tend-icon t-up">▲</div>'
      +'<div class="tend-val t-up">+'+l.diff+'</div>'
      +'<div class="tend-ctx">Mais tarefas abertas<br>ao longo do tempo</div>'
      +'</div>'
      +'</div>';

    }else if(l.diff<0){

      tendencia=''

      +'<div class="c-tend">'
      +'<div class="tend-badge tend-badge-down">'
      +'<div class="tend-icon t-down">▼</div>'
      +'<div class="tend-val t-down">'+l.diff+'</div>'
      +'<div class="tend-ctx">Menos tarefas abertas<br>ao longo do tempo</div>'
      +'</div>'
      +'</div>';

    }else{

      tendencia=''

      +'<div class="c-tend">'
      +'<div class="tend-badge tend-badge-neu">'
      +'<div class="tend-icon t-neu">→</div>'
      +'<div class="tend-val t-neu">0</div>'
      +'<div class="tend-ctx">Sem alterações</div>'
      +'</div>'
      +'</div>';

    }

    rows+=''

    +'<div class="table-row">'

    +'<div class="tgrid row-main">'

    +'<div class="c-rank">'
    +'<div class="rank-emoji">'+emoji+'</div>'
    +'<div class="rank-num">'+(li+1)+'</div>'
    +'<span class="rank-badge '+bn+'">N'+l.nivel+'</span>'
    +'</div>'

    +'<div class="c-loja">'
    +'<div class="loja-nome">'+l.loja+'</div>'
    +'<div class="loja-local">'+(l.local||'—')+'</div>'
    +'</div>'

    +'<div class="c-num">'
    +'<div class="num-val">'+l.pT+'</div>'
    +'<span class="num-pct pct-gray">Total</span>'
    +'</div>'

    +'<div class="c-num">'
    +'<div class="num-val" style="color:#ef4444">'+l.pA+'</div>'
    +'<span class="num-pct pct-red">'+l.pctPA+'%</span>'
    +'</div>'

    +'<div class="c-num">'
    +'<div class="num-val" style="color:#22c55e">'+l.pF+'</div>'
    +'<span class="num-pct pct-green">'+l.pctPF+'%</span>'
    +'</div>'

    +'<div class="c-num">'
    +'<div class="num-val">'+l.nT+'</div>'
    +'<span class="num-pct pct-gray">Total</span>'
    +'</div>'

    +'<div class="c-num">'
    +'<div class="num-val" style="color:#ef4444">'+l.nA+'</div>'
    +'<span class="num-pct pct-red">'+l.pctNA+'%</span>'
    +'</div>'

    +'<div class="c-num">'
    +'<div class="num-val" style="color:#22c55e">'+l.nF+'</div>'
    +'<span class="num-pct pct-green">'+l.pctNF+'%</span>'
    +'</div>'

    +tendencia

    +'<div class="c-btn">'
    +'<button class="btn-act" id="btnhist-'+li+'" onclick="toggleHist('+li+')">▶ Histórico</button>'
    +'</div>'

    +'<div class="c-btn">'
    +'<button class="btn-act" id="btnsec-'+li+'" onclick="toggleSec('+li+')">▶ Secções</button>'
    +'</div>'

    +'</div>'

    +'<div class="panel" id="hist-'+li+'">'

    +'<div class="panel-inner">'

    +'<div class="panel-title">'
    +'Histórico Semanal'
    +'</div>'

    +'<table class="detail-table">'

    +'<thead>'

    +'<tr>'
    +'<th>Semana</th>'
    +'<th>P Aberto</th>'
    +'<th>P Fechado</th>'
    +'<th>NP Aberto</th>'
    +'<th>NP Fechado</th>'
    +'</tr>'

    +'</thead>'

    +'<tbody>'

    +l.historico.map(h=>''

      +'<tr>'
      +'<td>'+h.semana+'</td>'
      +'<td>'+h.pA+'</td>'
      +'<td>'+h.pF+'</td>'
      +'<td>'+h.nA+'</td>'
      +'<td>'+h.nF+'</td>'
      +'</tr>'

    ).join('')

    +'<tr class="current">'
    +'<td>'+ultima+' (Atual)</td>'
    +'<td>'+l.pA+'</td>'
    +'<td>'+l.pF+'</td>'
    +'<td>'+l.nA+'</td>'
    +'<td>'+l.nF+'</td>'
    +'</tr>'

    +'</tbody>'

    +'</table>'

    +'</div>'

    +'</div>'

    +'<div class="panel" id="sec-'+li+'">'

    +'<div class="panel-inner">'

    +'<div class="panel-title">'
    +'Detalhe por Secções'
    +'</div>'

    +'<div class="sections-grid">'

    +l.seccoes.map(s=>''

      +'<div class="sec-block">'

      +'<div class="sec-head">'
      +s.nome
      +'</div>'

      +'<div class="sec-body">'

      +'<div class="sec-cat-title">'
      +'Programadas'
      +'</div>'

      +'<div class="sec-metric">'
      +'<span>Abertas</span>'
      +'<strong>'+s.pA+' ('+s.pctPA+'%)</strong>'
      +'</div>'

      +'<div class="bar">'
      +'<div class="bar-fill bar-red" style="width:'+s.pctPA+'%"></div>'
      +'</div>'

      +'<div class="sec-metric">'
      +'<span>Fechadas</span>'
      +'<strong>'+s.pF+' ('+s.pctPF+'%)</strong>'
      +'</div>'

      +'<div class="bar">'
      +'<div class="bar-fill bar-green" style="width:'+s.pctPF+'%"></div>'
      +'</div>'

      +'<div class="sec-cat-title">'
      +'Não Programadas'
      +'</div>'

      +'<div class="sec-metric">'
      +'<span>Abertas</span>'
      +'<strong>'+s.nA+' ('+s.pctNA+'%)</strong>'
      +'</div>'

      +'<div class="bar">'
      +'<div class="bar-fill bar-red" style="width:'+s.pctNA+'%"></div>'
      +'</div>'

      +'<div class="sec-metric">'
      +'<span>Fechadas</span>'
      +'<strong>'+s.nF+' ('+s.pctNF+'%)</strong>'
      +'</div>'

      +'<div class="bar">'
      +'<div class="bar-fill bar-green" style="width:'+s.pctNF+'%"></div>'
      +'</div>'

      +'</div>'

      +'</div>'

    ).join('')

    +'</div>'

    +'</div>'

    +'</div>'

    +'</div>';

  });

  var nota=''

  +'<div class="note">'

  +'<strong>Legenda dos Níveis</strong><br><br>'

  +'🟢 <strong>N1</strong> → Até 20% de tarefas programadas abertas.<br>'
  +'🟡 <strong>N2</strong> → Entre 21% e 40% de tarefas programadas abertas.<br>'
  +'🔴 <strong>N3</strong> → Mais de 40% de tarefas programadas abertas.<br><br>'

  +'▲ Vermelho = A loja tem deixado mais tarefas abertas ao longo do tempo.<br>'
  +'▼ Verde = A loja tem deixado menos tarefas abertas ao longo do tempo.<br><br>'

  +'<strong>Legenda das Siglas</strong><br><br>'

  +'<strong>P</strong> = Programadas<br>'
  +'<strong>NP</strong> = Não Programadas'

  +'</div>';

  document.getElementById('app').innerHTML=
    header+
    rows+
    '</div>'+
    nota;

}

</script>

</body>
</html>
