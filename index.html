<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --border:rgba(0,0,0,0.08);
  --text-primary:#1a1a1a;
  --text-secondary:#4a4a4a;
  --text-tertiary:#808080;
  --success:#22c55e;
  --danger:#ef4444;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text-primary);
  font-size:14px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:18px 40px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:40px;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--grad);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.header-title{
  text-align:center;
}

.header-title h1{
  font-size:22px;
  font-weight:800;
  color:#1a1a1a;
}

.header-title .sub{
  color:var(--text-tertiary);
  font-size:12px;
  margin-top:3px;
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);
  padding:8px 16px;
  border-radius:10px;
  font-weight:700;
  color:#8b5cf6;
  font-size:13px;
}

/* MAIN */

.main{
  max-width:1800px;
  margin:0 auto;
  padding:32px 40px 60px;
}

/* KPI */

.kpi-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:32px;
}

.kpi-card{
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px 24px;
  transition:background .2s;
  text-align:center;
}

.kpi-card:hover{
  background:rgba(139,92,246,.03);
}

.kpi-label{
  font-size:11px;
  font-weight:700;
  color:var(--text-tertiary);
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:10px;
}

.kpi-value{
  font-size:36px;
  font-weight:800;
  line-height:1;
}

.kpi-sub{
  font-size:12px;
  color:var(--text-tertiary);
  margin-top:6px;
}

.kc .kpi-value{color:#ef4444;}
.kw .kpi-value{color:#fb923c;}
.ks .kpi-value{color:#22c55e;}
.km .kpi-value{color:#94a3b8;}

/* LEGEND */

.legend-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:center;
  margin-bottom:28px;
  font-size:12.5px;
  color:var(--text-secondary);
  text-align:center;
}

.leg{
  display:flex;
  align-items:center;
  gap:6px;
}

.leg-sep{
  width:1px;
  height:14px;
  background:var(--border);
}

.leg-dot{
  width:9px;
  height:9px;
  border-radius:50%;
}

/* TABLE */

.table-container{
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.tgrid{
  display:grid;
  grid-template-columns:
    70px
    200px
    90px
    90px
    90px
    90px
    90px
    90px
    140px
    180px
    100px
    100px;
  align-items:center;
}

.table-header{
  padding:14px 20px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  color:#888;
  letter-spacing:.4px;
  text-align:center;
}

.table-header > div{
  padding:0 6px;
  text-align:center;
}

.table-row{
  border-bottom:1px solid var(--border);
  transition:background .15s;
  padding:0 20px;
}

.table-row:hover{
  background:rgba(139,92,246,.025);
}

.row-main{
  padding:18px 0;
}

/* CELLS */

.c-rank,
.c-num,
.c-comp,
.c-tend,
.c-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.c-rank{
  gap:6px;
}

.rank-emoji{
  font-size:18px;
}

.rank-num{
  font-size:20px;
  font-weight:800;
}

.rank-badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:6px;
  font-size:10px;
  font-weight:700;
}

.bn1{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

.bn2{
  background:rgba(251,146,60,.12);
  color:#fb923c;
}

.bn3{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

.c-loja{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:4px;
}

.loja-nome{
  font-size:14px;
  font-weight:700;
}

.loja-local{
  font-size:12px;
  color:var(--text-tertiary);
}

.c-num{
  gap:3px;
}

.num-val{
  font-size:16px;
  font-weight:800;
}

.num-pct{
  font-size:11px;
  font-weight:600;
  padding:1px 6px;
  border-radius:4px;
}

.pct-red{
  background:rgba(239,68,68,.1);
  color:#ef4444;
}

.pct-green{
  background:rgba(34,197,94,.1);
  color:#22c55e;
}

.pct-gray{
  background:rgba(0,0,0,.05);
  color:#888;
}

.c-comp{
  font-size:11px;
  color:var(--text-tertiary);
  line-height:1.5;
  padding:0 10px;
}

.c-tend{
  padding:0 6px;
}

.tend-badge{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px;
  border-radius:12px;
  gap:4px;
  width:100%;
  min-height:100px;
  text-align:center;
}

.tend-badge-up{
  background:rgba(239,68,68,.1);
  border:1px solid rgba(239,68,68,.2);
}

.tend-badge-down{
  background:rgba(34,197,94,.1);
  border:1px solid rgba(34,197,94,.2);
}

.tend-badge-neu{
  background:rgba(0,0,0,.04);
  border:1px solid rgba(0,0,0,.08);
}

.tend-icon{
  font-size:18px;
  font-weight:800;
}

.tend-val{
  font-size:18px;
  font-weight:800;
}

.tend-ctx{
  font-size:10px;
  line-height:1.4;
  color:#777;
}

.t-up{color:#ef4444;}
.t-down{color:#22c55e;}
.t-neu{color:#999;}

.c-btn{
  padding:0 6px;
}

.btn-act{
  width:88px;
  background:#fff;
  border:1px solid rgba(139,92,246,.25);
  color:#8b5cf6;
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
  font-size:11.5px;
  font-weight:700;
  transition:all .15s;
}

.btn-act:hover{
  background:rgba(139,92,246,.08);
}

.btn-act.open{
  background:var(--grad);
  color:#fff;
  border-color:transparent;
}

/* PANELS */

.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  padding:24px 20px;
  background:rgba(139,92,246,.03);
  border-top:1px solid var(--border);
}

.panel-title{
  font-size:12px;
  font-weight:700;
  color:#888;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:16px;
  text-align:center;
}

/* HISTORY TABLE */

.detail-table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.detail-table th{
  padding:10px 14px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  text-align:center;
  font-size:11px;
  font-weight:700;
  color:#888;
}

.detail-table td{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  color:var(--text-secondary);
  text-align:center;
}

.detail-table tr.current td{
  background:rgba(139,92,246,.06);
  font-weight:700;
  color:#1a1a1a;
}

.detail-table tbody tr:hover td{
  background:rgba(139,92,246,.04);
}

/* SECTIONS */

.sections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;
}

.sec-block{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.sec-head{
  padding:14px 16px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  font-size:14px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:8px;
  text-align:center;
}

.sec-body{
  padding:14px 16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.sec-cat-title{
  font-size:10.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:#aaa;
  margin-bottom:8px;
  text-align:center;
}

.sec-metric{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  margin-bottom:6px;
}

.bar{
  height:5px;
  border-radius:3px;
  background:#f0f0f0;
  overflow:hidden;
  margin-bottom:10px;
}

.bar-fill{
  height:100%;
  border-radius:3px;
}

.bar-red{
  background:#ef4444;
}

.bar-green{
  background:#22c55e;
}

.pct-tag{
  display:inline-block;
  padding:2px 7px;
  border-radius:10px;
  font-size:10px;
  font-weight:700;
}

.tag-red{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

.tag-orange{
  background:rgba(251,146,60,.12);
  color:#fb923c;
}

.tag-green{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

/* ACTION BOX */

.action-box{
  margin-top:28px;
  background:rgba(239,68,68,.05);
  border:1px solid rgba(239,68,68,.15);
  border-radius:12px;
  padding:20px 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  text-align:center;
}

.action-icon{
  font-size:24px;
}

.action-content h3{
  font-size:14px;
  font-weight:700;
  color:#ef4444;
  margin-bottom:4px;
}

.action-content p{
  font-size:13px;
  color:var(--text-secondary);
}

.loading{
  padding:100px;
  text-align:center;
  color:#aaa;
}

/* RESPONSIVE */

@media(max-width:1400px){

  .main{
    padding:24px;
  }

  .tgrid{
    grid-template-columns:
      60px
      170px
      80px
      80px
      80px
      80px
      80px
      80px
      120px
      170px
      90px
      90px;
  }

}

@media(max-width:1100px){

  .header{
    flex-direction:column;
  }

  .main{
    padding:16px;
  }

  .table-header{
    display:none;
  }

  .tgrid{
    grid-template-columns:1fr;
  }

  .row-main{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .kpi-row{
    grid-template-columns:1fr 1fr;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-brand">

    <div class="header-logo">📊</div>

    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">A carregar...</div>
    </div>

  </div>

  <div class="header-period" id="periodo">—</div>

</header>

<main class="main">

  <div id="app">

    <div class="loading">
      ⏳ A carregar dados...
    </div>

  </div>

</main>

<script>

var stateHist={}, stateSec={};

function tagPct(v){
  v=parseFloat(v);
  if(v<=20)return'tag-green';
  if(v<=40)return'tag-orange';
  return'tag-red';
}

function toggleHist(li){
  var p=document.getElementById('hist-'+li);
  var b=document.getElementById('btnhist-'+li);

  stateHist[li]=!stateHist[li];

  p.classList.toggle('visible',stateHist[li]);
  b.classList.toggle('open',stateHist[li]);

  b.innerHTML=stateHist[li]
    ? '▼ Fechar'
    : '▶ Histórico';
}

function toggleSec(li){
  var p=document.getElementById('sec-'+li);
  var b=document.getElementById('btnsec-'+li);

  stateSec[li]=!stateSec[li];

  p.classList.toggle('visible',stateSec[li]);
  b.classList.toggle('open',stateSec[li]);

  b.innerHTML=stateSec[li]
    ? '▼ Fechar'
    : '▶ Secções';
}

fetch('dados.json?t='+Date.now())

.then(function(r){
  return r.json();
})

.then(function(json){

  var data=json.data||[];
  var semanas=[];

  data.forEach(function(i){

    var s=String(i.Semana||'').trim();

    if(s && semanas.indexOf(s)===-1){
      semanas.push(s);
    }

  });

  var ultima=semanas[semanas.length-1]||'';

  var lojas=data

  .filter(function(i){
    return i.Loja &&
    !i.Secção &&
    String(i.Semana||'').trim()===ultima;
  })

  .map(function(i){

    var pT=Number(i['P Total'])||0;
    var pA=Number(i['P Aberto'])||0;
    var pF=Number(i['P Fechado'])||0;

    var nT=Number(i['NP Total'])||0;
    var nA=Number(i['NP Aberto'])||0;
    var nF=Number(i['NP Fechado'])||0;

    var pctPA=pT>0?(pA/pT*100).toFixed(1):'0.0';
    var pctPF=pT>0?(pF/pT*100).toFixed(1):'0.0';

    var pctNA=nT>0?(nA/nT*100).toFixed(1):'0.0';
    var pctNF=nT>0?(nF/nT*100).toFixed(1):'0.0';

    return{
      loja:String(i.Loja).trim(),
      local:String(i['IM.Localidade']||'').trim(),

      pT,pA,pF,
      nT,nA,nF,

      pctPA,pctPF,
      pctNA,pctNF,

      nivel:
        parseFloat(pctPA)<=20
        ? 1
        : parseFloat(pctPA)<=40
        ? 2
        : 3,

      historico:[],
      seccoes:[]
    };

  });

  lojas.sort(function(a,b){
    return b.pA-a.pA;
  });

  var ids={};

  lojas.forEach(function(l){
    ids[l.loja]=true;
  });

  var hpl={};

  data.forEach(function(i){

    if(
      !i.Secção &&
      i.Loja &&
      i.Semana &&
      ids[String(i.Loja).trim()]
    ){

      var id=String(i.Loja).trim();

      if(!hpl[id]){
        hpl[id]=[];
      }

      hpl[id].push({

        semana:String(i.Semana).trim(),

        pA:Number(i['P Aberto'])||0,
        pF:Number(i['P Fechado'])||0,

        nA:Number(i['NP Aberto'])||0,
        nF:Number(i['NP Fechado'])||0

      });

    }

  });

  lojas.forEach(function(l){

    var h=hpl[l.loja]||[];

    l.historico=h
      .filter(function(x){
        return x.semana!==ultima;
      })
      .slice(-8);

    var u=h.slice(-2);

    l.diff=u.length===2
      ? u[1].pF-u[0].pF
      : null;

  });

  document.getElementById('sub-info').textContent=
    'Gerado hoje · '+lojas.length+' lojas';

  document.getElementById('periodo').innerHTML=
    '📅 <strong>'+ultima+'</strong>';

  renderApp(lojas,ultima);

});

function renderApp(lojas,ultima){

  var html='';

  html+='<div class="table-container">';

  html+='<div class="tgrid table-header">';

  html+='<div>Rank</div>';
  html+='<div>Loja</div>';
  html+='<div>P Total</div>';
  html+='<div>P Aberto</div>';
  html+='<div>P Fechado</div>';
  html+='<div>NP Total</div>';
  html+='<div>NP Aberto</div>';
  html+='<div>NP Fechado</div>';
  html+='<div>Comparação</div>';
  html+='<div>Tendência</div>';
  html+='<div>Histórico</div>';
  html+='<div>Secções</div>';

  html+='</div>';

  lojas.forEach(function(l,li){

    var bn=l.nivel===1
      ? 'bn1'
      : l.nivel===2
      ? 'bn2'
      : 'bn3';

    var trendClass=
      l.diff>0
      ? 'tend-badge-up'
      : l.diff<0
      ? 'tend-badge-down'
      : 'tend-badge-neu';

    var trendIcon=
      l.diff>0
      ? '▲'
      : l.diff<0
      ? '▼'
      : '→';

    var trendColor=
      l.diff>0
      ? 't-up'
      : l.diff<0
      ? 't-down'
      : 't-neu';

    var trendText='';

    if(l.diff>0){
      trendText='A loja fechou mais tarefas que nas semanas anteriores';
    }
    else if(l.diff<0){
      trendText='A loja fechou menos tarefas que nas semanas anteriores';
    }
    else{
      trendText='Sem alterações nas tarefas fechadas';
    }

    html+='<div class="table-row">';

    html+='<div class="tgrid row-main">';

    html+='<div class="c-rank">';
    html+='<div class="rank-emoji">📍</div>';
    html+='<div class="rank-num">'+(li+1)+'</div>';
    html+='<span class="rank-badge '+bn+'">N'+l.nivel+'</span>';
    html+='</div>';

    html+='<div class="c-loja">';
    html+='<div class="loja-nome">'+l.loja+'</div>';
    html+='<div class="loja-local">'+l.local+'</div>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val">'+l.pT+'</div>';
    html+='<span class="num-pct pct-gray">Total</span>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val" style="color:#ef4444">'+l.pA+'</div>';
    html+='<span class="num-pct pct-red">'+l.pctPA+'%</span>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val" style="color:#22c55e">'+l.pF+'</div>';
    html+='<span class="num-pct pct-green">'+l.pctPF+'%</span>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val">'+l.nT+'</div>';
    html+='<span class="num-pct pct-gray">Total</span>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val" style="color:#ef4444">'+l.nA+'</div>';
    html+='<span class="num-pct pct-red">'+l.pctNA+'%</span>';
    html+='</div>';

    html+='<div class="c-num">';
    html+='<div class="num-val" style="color:#22c55e">'+l.nF+'</div>';
    html+='<span class="num-pct pct-green">'+l.pctNF+'%</span>';
    html+='</div>';

    html+='<div class="c-comp">—</div>';

    html+='<div class="c-tend">';
    html+='<div class="tend-badge '+trendClass+'">';
    html+='<div class="tend-icon '+trendColor+'">'+trendIcon+'</div>';
    html+='<div class="tend-val '+trendColor+'">'+(l.diff>0?'+':'')+(l.diff||0)+'</div>';
    html+='<div class="tend-ctx">'+trendText+'</div>';
    html+='</div>';
    html+='</div>';

    html+='<div class="c-btn">';
    html+='<button class="btn-act" id="btnhist-'+li+'" onclick="toggleHist('+li+')">▶ Histórico</button>';
    html+='</div>';

    html+='<div class="c-btn">';
    html+='<button class="btn-act" id="btnsec-'+li+'" onclick="toggleSec('+li+')">▶ Secções</button>';
    html+='</div>';

    html+='</div>';

    html+='<div class="panel" id="hist-'+li+'">';
    html+='<div class="panel-inner">';

    html+='<div class="panel-title">Histórico Semanal</div>';

    html+='<table class="detail-table">';

    html+='<thead>';
    html+='<tr>';
    html+='<th>Semana</th>';
    html+='<th>P Aberto</th>';
    html+='<th>P Fechado</th>';
    html+='<th>NP Aberto</th>';
    html+='<th>NP Fechado</th>';
    html+='</tr>';
    html+='</thead>';

    html+='<tbody>';

    l.historico.forEach(function(h){

      html+='<tr>';
      html+='<td>'+h.semana+'</td>';
      html+='<td>'+h.pA+'</td>';
      html+='<td>'+h.pF+'</td>';

    });

    html+='</div>';

    l.seccoes.forEach(function(s){

      html+='</div>';

      html+='</div>';

    });

    html+='</div>';
    html+='</div>';
    html+='</div>';

  });

  html+='</div>';

  document.getElementById('app').innerHTML=html;

}
