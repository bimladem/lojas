<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --border:rgba(0,0,0,.08);
  --text:#1a1a1a;
  --muted:#808080;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#fb923c;
  --purple:#8b5cf6;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#f9f9f9;color:var(--text);}

.header{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.98);backdrop-filter:blur(20px);
  border-bottom:2px solid rgba(139,92,246,.1);
  padding:20px 32px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}
.header-brand{display:flex;align-items:center;gap:18px;}
.header-logo{width:56px;height:56px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(139,92,246,.2);}
.header-title h1{font-size:32px;font-weight:800;color:#000;}
.header-title .sub{margin-top:6px;color:#666;font-size:14px;font-weight:600;}
.header-period{background:rgba(139,92,246,.08);border:2px solid rgba(139,92,246,.2);padding:12px 20px;border-radius:14px;font-weight:800;color:#8b5cf6;font-size:15px;}

.main{max-width:100%;margin:auto;padding:32px 40px;}

.legend-top{
  background:#fff;
  border:2px solid var(--border);
  border-radius:18px;
  padding:24px;
  margin-bottom:32px;
  text-align:center;
  font-size:15px;
  line-height:1.8;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.legend-top strong{color:#000;font-weight:800;}

.table-container{border:2px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06);background:#fff;}

.table-header{
  display:grid;
  grid-template-columns:80px 180px 200px 110px 110px 110px 110px 110px 110px 180px 110px 110px;
  background:linear-gradient(135deg,#f8f8f8 0%,#fafafa 100%);
  border-bottom:2px solid var(--border);
  font-size:12px;font-weight:800;text-transform:uppercase;color:#333;
  padding:0;
}
.table-header div{padding:20px 12px;text-align:center;color:#333;font-weight:800;letter-spacing:.5px;}

.table-row{border-bottom:2px solid var(--border);}
.table-row:last-of-type{border-bottom:none;}

.row-main{
  display:grid;
  grid-template-columns:80px 180px 200px 110px 110px 110px 110px 110px 110px 180px 110px 110px;
  align-items:center;padding:20px 12px;transition:.3s;
  background:#fff;
}
.row-main:hover{background:rgba(139,92,246,.04);transform:scale(1.01);box-shadow:inset 0 0 0 2px rgba(139,92,246,.08);}

.cell{display:flex;justify-content:center;align-items:center;text-align:center;flex-direction:column;min-height:80px;}

.rank{flex-direction:column;gap:8px;}
.rank-num{font-size:32px;font-weight:800;color:#000;}
.rank-badge{padding:6px 14px;border-radius:10px;font-size:11px;font-weight:800;}
.n1{background:rgba(239,68,68,.15);color:#ef4444;}
.n2{background:rgba(251,146,60,.15);color:#fb923c;}
.n3{background:rgba(34,197,94,.15);color:#22c55e;}

.localizacao{flex-direction:column;gap:6px;}
.localizacao strong{font-size:18px;color:#000;font-weight:800;}

.loja{flex-direction:column;gap:6px;}
.loja strong{font-size:16px;color:#000;font-weight:800;}

.metric{flex-direction:column;gap:8px;padding:12px 8px;}
.metric .pct{font-size:14px;font-weight:700;}
.metric .num{font-size:26px;font-weight:800;}
.red{color:#ef4444;}
.green{color:#22c55e;}
.gray{color:#999;}

.comparison{
  flex-direction:column;
  gap:10px;
  padding:14px;
  background:linear-gradient(135deg,rgba(139,92,246,.08) 0%,rgba(236,72,153,.08) 100%);
  border-radius:14px;
  border:2px solid rgba(139,92,246,.15);
  min-height:80px;
  justify-content:center;
}
.comparison-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.comparison-label{font-size:10px;font-weight:800;color:#000;text-transform:uppercase;letter-spacing:.3px;}
.comparison-value{font-size:24px;font-weight:800;color:#000;}

.trend{flex-direction:column;}
.trend-box{padding:12px;border-radius:14px;width:100%;}
.trend-positive{background:rgba(34,197,94,.12);border:2px solid rgba(34,197,94,.2);}
.trend-negative{background:rgba(239,68,68,.12);border:2px solid rgba(239,68,68,.2);}
.trend-neutral{background:rgba(0,0,0,.04);border:2px solid rgba(0,0,0,.08);}
.trend-icon{font-size:24px;font-weight:800;}
.trend-value{font-size:22px;font-weight:800;margin-top:6px;color:#000;}
.trend-text{margin-top:8px;font-size:11px;line-height:1.4;font-weight:700;color:#333;}

.btn{
  background:#fff;border:2px solid rgba(139,92,246,.2);
  color:#8b5cf6;border-radius:12px;padding:12px 16px;
  cursor:pointer;font-weight:800;transition:.3s;font-size:13px;
  min-width:100px;box-shadow:0 2px 6px rgba(139,92,246,.1);
}
.btn:hover{background:rgba(139,92,246,.08);border-color:rgba(139,92,246,.4);transform:translateY(-2px);box-shadow:0 4px 10px rgba(139,92,246,.15);}
.btn.open{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(139,92,246,.3);}

/* PANELS */
.panel{display:none;}
.panel.visible{display:block;}
.panel-inner{padding:28px;background:linear-gradient(135deg,rgba(139,92,246,.03) 0%,rgba(236,72,153,.03) 100%);border-top:2px solid var(--border);}
.panel-title{font-size:13px;font-weight:800;color:#333;text-transform:uppercase;letter-spacing:.5px;margin-bottom:18px;color:#8b5cf6;}

.detail-table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.detail-table th,.detail-table td{padding:16px;border-bottom:1px solid var(--border);text-align:center;font-size:14px;color:#000;}
.detail-table th{background:linear-gradient(135deg,#f8f8f8 0%,#fafafa 100%);font-size:13px;font-weight:800;color:#333;}
.detail-table tbody tr:hover td{background:rgba(139,92,246,.04);}
.detail-table tr.atual td{background:rgba(139,92,246,.1);font-weight:800;color:#000;}

.sections-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:20px;}
.section-card{border:2px solid var(--border);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:.3s;}
.section-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-2px);border-color:rgba(139,92,246,.2);}
.section-head{padding:18px;background:linear-gradient(135deg,#f8f8f8 0%,#fafafa 100%);border-bottom:2px solid var(--border);font-size:16px;font-weight:800;text-align:center;color:#000;}
.section-body{padding:20px;}
.sec-cat{font-size:11px;font-weight:800;color:#333;text-transform:uppercase;letter-spacing:.3px;margin:14px 0 10px;}
.sec-cat:first-child{margin-top:0;}
.sec-line{display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;color:#333;font-weight:600;}
.bar{height:8px;border-radius:6px;overflow:hidden;background:#eee;margin-bottom:16px;}
.fill-red{height:100%;background:linear-gradient(90deg,#ef4444 0%,#ff6b6b 100%);}
.fill-green{height:100%;background:linear-gradient(90deg,#22c55e 0%,#34d399 100%);}

.note{margin-top:32px;padding:24px;border-radius:18px;background:#fff;border:2px solid var(--border);text-align:center;line-height:2;color:#333;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.note strong{color:#000;font-weight:800;}

.acao{margin-top:20px;padding:24px;border-radius:18px;background:linear-gradient(135deg,rgba(239,68,68,.08) 0%,rgba(239,68,68,.04) 100%);border:2px solid rgba(239,68,68,.15);display:flex;align-items:center;gap:18px;box-shadow:0 2px 8px rgba(239,68,68,.08);}
.acao-icon{font-size:28px;min-width:40px;}
.acao h3{font-size:15px;font-weight:800;color:#ef4444;margin-bottom:6px;}
.acao p{font-size:14px;color:#333;font-weight:600;}

.loading{padding:100px;text-align:center;color:#aaa;font-size:18px;}

.mobile-card{display:none;}

/* MOBILE */
@media(max-width:768px){
  .table-header{display:none;}
  .row-main{display:none;}
  body{overflow-x:hidden;}
  .table-row{display:block;border:none;margin-bottom:16px;}
  .table-row:last-of-type{margin-bottom:0;}
  .mobile-card{
    display:block;
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    overflow:hidden;
  }
  .card-header{
    display:grid;
    grid-template-columns:60px 1fr;
    gap:12px;
    align-items:start;
    padding-bottom:14px;
    border-bottom:1px solid var(--border);
    margin-bottom:14px;
  }
  .card-rank{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .card-rank-num{font-size:24px;font-weight:800;color:#000;}
  .card-rank-badge{padding:3px 8px;border-radius:8px;font-size:10px;font-weight:800;}
  .card-info{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .card-local{font-size:14px;color:#000;font-weight:700;}
  .card-loja{font-size:16px;font-weight:800;color:#000;}
  .card-metrics{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
    gap:10px;
    margin-bottom:14px;
  }
  .metric-item{
    background:#f8f9fa;
    padding:10px;
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    word-wrap:break-word;
  }
  .metric-label{font-size:11px;font-weight:700;color:#000;text-transform:uppercase;text-align:center;}
  .metric-value{font-size:18px;font-weight:800;color:#000;}
  .metric-percent{font-size:12px;font-weight:700;color:#000;}
  .card-trend{
    background:#f8f9fa;
    padding:12px;
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-bottom:14px;
  }
  .card-trend .trend-icon{font-size:20px;font-weight:800;}
  .card-trend .trend-value{font-size:18px;font-weight:800;color:#000;}
  .card-trend .trend-text{font-size:10px;font-weight:700;text-align:center;line-height:1.3;color:#000;}
  .card-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .btn{
    padding:10px 12px;
    font-size:12px;
    min-height:44px;
    border-radius:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .panel-inner{
    padding:14px;
    border-radius:12px 12px 0 0;
    margin:0 -16px -16px -16px;
  }
  .panel-title{
    font-size:12px;
    margin-bottom:12px;
    color:#000;
  }
  .detail-table{
    font-size:12px;
    border-radius:10px;
  }
  .detail-table th,.detail-table td{
    padding:10px 6px;
    font-size:11px;
    color:#000;
  }
  .detail-table th{font-size:10px;color:#000;}
  .sections-grid{
    grid-template-columns:1fr;
    gap:12px;
  }
  .section-card{
    border-radius:12px;
  }
  .section-head{
    padding:12px;
    font-size:14px;
    color:#000;
  }
  .section-body{
    padding:12px;
  }
  .sec-cat{
    font-size:10px;
    margin:8px 0 6px;
    color:#000;
  }
  .sec-line{
    font-size:12px;
    margin-bottom:6px;
    color:#000;
  }
  .bar{
    height:5px;
    margin-bottom:10px;
    max-width:100%;
  }
  .note{
    padding:14px;
    font-size:12px;
    line-height:1.6;
    margin-top:20px;
    border-radius:12px;
    color:#000;
  }
  .acao{
    padding:12px 14px;
    gap:10px;
    margin-top:12px;
    border-radius:12px;
  }
  .acao-icon{font-size:20px;}
  .acao h3{font-size:12px;}
  .acao p{font-size:11px;color:#000;}
  .header{
    padding:12px 16px;
    flex-direction:column;
    gap:8px;
    text-align:center;
  }
  .header-brand{justify-content:center;}
  .header-logo{width:44px;height:44px;font-size:20px;}
  .header-title h1{font-size:20px;}
  .header-title .sub{font-size:12px;}
  .header-period{font-size:12px;padding:6px 12px;}
  .main{
    padding:12px;
    max-width:100%;
  }
  .legend-top{
    padding:12px;
    font-size:12px;
    margin-bottom:16px;
    line-height:1.6;
    border-radius:12px;
  }
  .table-container{
    border:none;
    border-radius:0;
    padding:0;
  }
  .metric .num{font-size:18px;}
}

@media(max-width:480px){
  .card-metrics{
    grid-template-columns:repeat(2,1fr);
  }
  .metric-item{
    padding:8px;
  }
  .metric-value{font-size:16px;color:#000;}
  .btn{
    padding:9px 10px;
    font-size:11px;
    min-height:40px;
  }
  .header-logo{width:40px;height:40px;font-size:18px;}
  .header-title h1{font-size:18px;}
  .section-head{font-size:13px;color:#000;}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="header-logo">📊</div>
    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">A carregar...</div>
    </div>
  </div>
  <div class="header-period" id="periodo">—</div>
</header>

<main class="main">
  <div id="app"><div class="loading">⏳ A carregar dados...</div></div>
</main>

<script>
var stateHist = {};
var stateSec  = {};

function toggleHist(li) {
  var p = document.getElementById('hist-' + li);
  var b = document.getElementById('btnhist-' + li);
  stateHist[li] = !stateHist[li];
  p.classList.toggle('visible', stateHist[li]);
  b.classList.toggle('open', stateHist[li]);
  b.textContent = stateHist[li] ? '▼ Fechar' : 'Histórico';
}

function toggleSec(li) {
  var p = document.getElementById('sec-' + li);
  var b = document.getElementById('btnsec-' + li);
  stateSec[li] = !stateSec[li];
  p.classList.toggle('visible', stateSec[li]);
  b.classList.toggle('open', stateSec[li]);
  b.textContent = stateSec[li] ? '▼ Fechar' : 'Secções';
}

fetch('dados.json?t=' + Date.now())
  .then(function(r) { return r.json(); })
  .then(function(json) {

    var data = json.data || [];

    /* ÚLTIMA SEMANA */
    var semanas = [];
    data.forEach(function(i) {
      var s = String(i.Semana || '').trim();
      if (s && semanas.indexOf(s) === -1) semanas.push(s);
    });
    var ultimaSemana = semanas[semanas.length - 1] || '';

    /* LOJAS DA ÚLTIMA SEMANA */
    var lojas = data
      .filter(function(i) {
        return i.Loja &&
          !i.Secção &&
          String(i.Semana || '').trim() === ultimaSemana;
      })
      .map(function(i) {
        var pT = Number(i['P Total'])    || 0;
        var pA = Number(i['P Aberto'])   || 0;
        var pF = Number(i['P Fechado'])  || 0;
        var nT = Number(i['NP Total'])   || 0;
        var nA = Number(i['NP Aberto'])  || 0;
        var nF = Number(i['NP Fechado']) || 0;

        var pctPA  = pT > 0 ? (pA / pT * 100) : 0;
        var pctPF  = pT > 0 ? (pF / pT * 100) : 0;
        var pctNA  = nT > 0 ? (nA / nT * 100) : 0;
        var pctNF  = nT > 0 ? (nF / nT * 100) : 0;

        /* Nível baseado em % P fechadas:
           N1: 0-20%, N2: 21-40%, N3: 41-50% */
        var nivel = pctPF >= 41 ? 3 : pctPF >= 21 ? 2 : 1;

        var loc = String(
          i['Resumo contactos.Localidade'] ||
          i['IM.Localidade'] || ''
        ).trim();

        return {
          loja: String(i.Loja).trim(),
          local: loc,
          pT, pA, pF, nT, nA, nF,
          pctPA:  pctPA.toFixed(1),
          pctPF:  pctPF.toFixed(1),
          pctNA:  pctNA.toFixed(1),
          pctNF:  pctNF.toFixed(1),
          pctPFInt: Math.round(pctPF),
          pctNFInt: Math.round(pctNF),
          nivel,
          historico: [],
          seccoes: []
        };
      });

    /* Ordenar por NÍVEL (N1, N2, N3) e depois por P fechadas dentro de cada nível */
    lojas.sort(function(a, b) {
      if (a.nivel !== b.nivel) return a.nivel - b.nivel;
      return b.pF - a.pF;
    });

    var ids = {};
    lojas.forEach(function(l) { ids[l.loja] = true; });

    /* HISTÓRICO */
    var histPorLoja = {};
    data.forEach(function(i) {
      if (i.Loja && !i.Secção && ids[String(i.Loja).trim()]) {
        var id = String(i.Loja).trim();
        if (!histPorLoja[id]) histPorLoja[id] = [];
        histPorLoja[id].push(i);
      }
    });

    lojas.forEach(function(l) {
      var hist = histPorLoja[l.loja] || [];
      /* Ordenar por semana */
      hist.sort(function(a, b) {
        return String(a.Semana || '').localeCompare(String(b.Semana || ''));
      });
      /* Excluir semana actual do histórico */
      l.historico = hist.filter(function(h) {
        return String(h.Semana || '').trim() !== ultimaSemana;
      }).slice(-8);

      /* Tendência: diferença de P fechadas vs semana anterior */
      var u = hist.slice(-2);
      l.diff = u.length === 2
        ? (Number(u[1]['P Fechado']) || 0) - (Number(u[0]['P Fechado']) || 0)
        : null;
    });

    /* SECÇÕES */
    data.forEach(function(i) {
      if (!i.Secção) return;

      var seccaoStr = String(i.Secção).trim();

      /* Extrair código loja do campo Secção */
      var m = seccaoStr.match(/^(IM \d+)\s+(.+)$/);
      if (!m) return;

      var lojaCode = m[1].trim();
      var nomeSecção = m[2].trim();

      if (nomeSecção.toLowerCase() === 'admin') return;
      if (!ids[lojaCode]) return;

      var loja = lojas.find(function(l) { return l.loja === lojaCode; });
      if (!loja) return;

      var pT = Number(i['Programadas Total'])    || 0;
      var pF = Number(i['Programadas Fechadas']) || 0;
      var nT = Number(i['Não Programadas Total'])    || 0;
      var nF = Number(i['Não Programadas Fechadas']) || 0;
      var pA = pT - pF;
      var nA = nT - nF;

      loja.seccoes.push({
        nome: nomeSecção,
        pT: pT, pA: pA, pF: pF,
        nT: nT, nA: nA, nF: nF,
      });
    });
    lojas.forEach(function(l) {
      l.seccoes.sort(function(a, b) { return b.pA - a.pA; });
    });

    document.getElementById('sub-info').textContent =
      lojas.length + ' lojas · ' + ultimaSemana;
    document.getElementById('periodo').innerHTML =
      '📅 <strong>' + ultimaSemana + '</strong>';

    render(lojas, ultimaSemana);
  })
  .catch(function(err) {
    document.getElementById('app').innerHTML =
      '<div class="loading" style="color:#ef4444">❌ Erro ao carregar dados: ' + err.message + '</div>';
  });

function render(lojas, ultimaSemana) {
  var html = '';

  html += '<div class="table-container">';

  /* HEADER (DESKTOP ONLY) */
  html += '<div class="table-header">';
  html += '<div>Rank</div><div>Localização</div><div>Loja</div>';
  html += '<div>P Total</div><div>P Abertas</div><div>P Fechadas</div>';
  html += '<div>NP Total</div><div>NP Abertas</div><div>NP Fechadas</div>';
  html += '<div>Comparação P vs NP</div><div>Histórico</div><div>Secções</div>';
  html += '</div>';

  lojas.forEach(function(l, li) {
    var badge = l.nivel === 1 ? 'n1' : l.nivel === 2 ? 'n2' : 'n3';
    var tClass = l.diff > 0 ? 'trend-positive' : l.diff < 0 ? 'trend-negative' : 'trend-neutral';
    var icon  = l.diff > 0 ? '▲' : l.diff < 0 ? '▼' : '→';
    var texto = l.diff > 0 ? 'Fechou mais tarefas'
              : l.diff < 0 ? 'Fechou menos tarefas'
              : 'Sem alterações';
    var diffVal = l.diff !== null ? (l.diff > 0 ? '+' + l.diff : l.diff) : '—';

    /* HISTÓRICO PANEL */
    var histRows = l.historico.map(function(h) {
      var hpT = Number(h['P Total'])   || 0;
      var hpF = Number(h['P Fechado']) || 0;
      var hpA = hpT - hpF;
      var hnT = Number(h['NP Total'])   || 0;
      var hnF = Number(h['NP Fechado']) || 0;
      var hnA = hnT - hnF;
      return '<tr>'
        + '<td style="color:#000;">' + (h.Semana || '—') + '</td>'
        + '<td class="red" style="color:#ef4444;">' + hpA + '</td>'
        + '<td class="green" style="color:#22c55e;">' + hpF + '</td>'
        + '<td class="red" style="color:#ef4444;">'  + hnA + '</td>'
        + '<td class="green" style="color:#22c55e;">' + hnF + '</td>'
        + '</tr>';
    }).join('');
    var histHtml = l.historico.length > 0
      ? '<table class="detail-table">'
        + '<thead><tr><th>Semana</th><th>P Abertas</th><th>P Fechadas</th><th>NP Abertas</th><th>NP Fechadas</th></tr></thead>'
        + '<tbody>' + histRows
        + '<tr class="atual"><td style="color:#000;">' + ultimaSemana + ' (atual)</td>'
        + '<td class="red" style="color:#ef4444;">' + l.pA + '</td>'
        + '<td class="green" style="color:#22c55e;">' + l.pF + '</td>'
        + '<td class="red" style="color:#ef4444;">'   + l.nA + '</td>'
        + '<td class="green" style="color:#22c55e;">' + l.nF + '</td>'
        + '</tr></tbody></table>'
      : '<p style="color:#000;font-size:13px;font-weight:600;">Sem semanas anteriores disponíveis.</p>';

    /* SECÇÕES PANEL */
    var secCards = l.seccoes.length > 0
      ? l.seccoes.map(function(s) {
          var pctPA_s = s.pT > 0 ? (s.pA / s.pT * 100).toFixed(1) : '0.0';
          var pctPF_s = s.pT > 0 ? (s.pF / s.pT * 100).toFixed(1) : '0.0';
          var pctNA_s = s.nT > 0 ? (s.nA / s.nT * 100).toFixed(1) : '0.0';
          var pctNF_s = s.nT > 0 ? (s.nF / s.nT * 100).toFixed(1) : '0.0';
          return '<div class="section-card">'
            + '<div class="section-head" style="color:#000;">' + s.nome + '</div>'
            + '<div class="section-body">'
            + '<div class="sec-cat" style="color:#000;">Programadas</div>'
            + '<div class="sec-line" style="color:#000;"><span>Abertas</span><strong class="red" style="color:#ef4444;">' + s.pA + ' (' + pctPA_s + '%)</strong></div>'
            + '<div class="bar"><div class="fill-red" style="width:' + Math.min(100, pctPA_s) + '%"></div></div>'
            + '<div class="sec-line" style="color:#000;"><span>Fechadas</span><strong class="green" style="color:#22c55e;">' + s.pF + ' (' + pctPF_s + '%)</strong></div>'
            + '<div class="bar"><div class="fill-green" style="width:' + Math.min(100, pctPF_s) + '%"></div></div>'
            + '<div class="sec-cat" style="color:#000;">Não Programadas</div>'
            + '<div class="sec-line" style="color:#000;"><span>Abertas</span><strong class="red" style="color:#ef4444;">' + s.nA + ' (' + pctNA_s + '%)</strong></div>'
            + '<div class="bar"><div class="fill-red" style="width:' + Math.min(100, pctNA_s) + '%"></div></div>'
            + '<div class="sec-line" style="color:#000;"><span>Fechadas</span><strong class="green" style="color:#22c55e;">' + s.nF + ' (' + pctNF_s + '%)</strong></div>'
            + '<div class="bar"><div class="fill-green" style="width:' + Math.min(100, pctNF_s) + '%"></div></div>'
            + '</div></div>';
        }).join('')
      : '<p style="color:#000;font-size:13px;font-weight:600;">Sem secções disponíveis.</p>';

    /* DESKTOP ROW */
    var desktopRow = '<div class="row-main">';
    desktopRow += '<div class="cell rank"><div class="rank-num" style="color:#000;">' + (li+1) + '</div><div class="rank-badge ' + badge + '">N' + l.nivel + '</div></div>';
    desktopRow += '<div class="cell localizacao"><strong style="color:#000;">' + (l.local || '—') + '</strong></div>';
    desktopRow += '<div class="cell loja"><strong style="color:#000;">' + l.loja + '</strong></div>';
    desktopRow += '<div class="cell metric"><div class="num" style="color:#000;">' + l.pT + '</div></div>';
    desktopRow += '<div class="cell metric"><div class="num red" style="color:#ef4444;">' + l.pA + '</div></div>';
    desktopRow += '<div class="cell metric"><div class="num green" style="color:#22c55e;">' + l.pF + '</div></div>';
    desktopRow += '<div class="cell metric"><div class="num" style="color:#000;">' + l.nT + '</div></div>';
    desktopRow += '<div class="cell metric"><div class="num red" style="color:#ef4444;">' + l.nA + '</div></div>';
    desktopRow += '<div class="cell metric"><div class="num green" style="color:#22c55e;">' + l.nF + '</div></div>';
    desktopRow += '<div class="cell comparison"><div class="comparison-item"><div class="comparison-label">Programadas</div><div class="comparison-value" style="color:#000;">' + l.pctPFInt + '%</div></div><div class="comparison-item"><div class="comparison-label">Não Programadas</div><div class="comparison-value" style="color:#000;">' + l.pctNFInt + '%</div></div></div>';
    desktopRow += '<div class="cell"><button class="btn" id="btnhist-' + li + '" onclick="toggleHist(' + li + ')">Histórico</button></div>';
    desktopRow += '<div class="cell"><button class="btn" id="btnsec-' + li + '" onclick="toggleSec(' + li + ')">Secções</button></div>';
    desktopRow += '</div>';

    /* MOBILE CARD */
    var mobileCard = '<div class="mobile-card">'
      + '<div class="card-header">'
      + '<div class="card-rank"><div class="card-rank-num" style="color:#000;">' + (li+1) + '</div><div class="card-rank-badge ' + badge + '" style="color:#000;">N' + l.nivel + '</div></div>'
      + '<div class="card-info"><div class="card-local" style="color:#000;">' + (l.local || '—') + '</div><div class="card-loja" style="color:#000;">' + l.loja + '</div></div>'
      + '</div>'
      + '<div class="card-metrics">'
      + '<div class="metric-item"><div class="metric-label" style="color:#000;">P Total</div><div class="metric-value" style="color:#000;">' + l.pT + '</div></div>'
      + '<div class="metric-item"><div class="metric-label" style="color:#000;">P Abertas</div><div class="metric-value red" style="color:#ef4444;">' + l.pA + '</div></div>'
      + '<div class="metric-item"><div class="metric-label" style="color:#000;">P Fechadas</div><div class="metric-value green" style="color:#22c55e;">' + l.pF + '</div></div>'
      + '<div class="metric-item"><div class="metric-label" style="color:#000;">NP Total</div><div class="metric-value" style="color:#000;">' + l.nT + '</div></div>'
      + '<div class="metric-item"><div class="metric-label" style="color:#000;">NP Abertas</div><div class="metric-value red" style="color:#ef4444;">' + l.nA + '</div></div>'
      + '<div class="metric-item"><div class="metric-label" style="color:#000;">NP Fechadas</div><div class="metric-value green" style="color:#22c55e;">' + l.nF + '</div></div>'
      + '</div>'
      + '<div class="card-trend"><div class="trend-icon">' + icon + '</div><div class="trend-value" style="color:#000;">' + diffVal + '</div><div class="trend-text" style="color:#000;">P Fechadas<br>' + texto + '</div></div>'
      + '<div class="card-actions">'
      + '<button class="btn" id="btnhist-' + li + '" onclick="toggleHist(' + li + ')">Histórico</button>'
      + '<button class="btn" id="btnsec-' + li + '" onclick="toggleSec(' + li + ')">Secções</button>'
      + '</div>'
      + '</div>';

    html += '<div class="table-row">';
    html += desktopRow;
    html += mobileCard;

    /* PAINÉIS */
    html += '<div class="panel" id="hist-' + li + '">'
      + '<div class="panel-inner"><div class="panel-title" style="color:#8b5cf6;">Evolução Semanal</div>'
      + histHtml + '</div></div>';

    html += '<div class="panel" id="sec-' + li + '">'
      + '<div class="panel-inner"><div class="panel-title" style="color:#8b5cf6;">Detalhe por Secção (' + l.seccoes.length + ')</div>'
      + '<div class="sections-grid">' + secCards + '</div></div></div>';

    html += '</div>';
  });

  html += '</div>';

  html += '<div class="legend-top" style="margin-top:32px;margin-bottom:0;">'
    + '<strong>P</strong> = Tarefas Programadas &nbsp;&nbsp; | &nbsp;&nbsp; '
    + '<strong>NP</strong> = Tarefas Não Programadas'
    + '</div>';

  html += '<div class="note">'
    + '<strong style="color:#000;">Níveis das lojas — baseados em % de tarefas programadas fechadas</strong><br>'
    + '<span style="color:#ef4444;font-weight:800;">N1</span> · 0-20% fechadas &nbsp;&nbsp;'
    + '<span style="color:#fb923c;font-weight:800;">N2</span> · 21-40% fechadas &nbsp;&nbsp;'
    + '<span style="color:#22c55e;font-weight:800;">N3</span> · 41%+ fechadas'
    + '</div>';

  html += '<div class="acao">'
    + '<div class="acao-icon">⚠️</div>'
    + '<div><h3>Ação Recomendada</h3>'
    + '<p style="color:#333;">Contactar urgentemente os responsáveis das lojas críticas.</p>'
    + '</div></div>';

  document.getElementById('app').innerHTML = html;
}
</script>
</body>
</html>
