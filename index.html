<script>
var stateHist = {};
var stateSec  = {};
var stateSecDet = {};

function corPct(pct) {
  var v = parseFloat(pct);
  if (v <= 20) return '#16a34a';
  if (v <= 40) return '#ea580c';
  return '#dc2626';
}

function toggle(painelId, btnId, stateObj) {
  var p = document.getElementById(painelId);
  var b = document.getElementById(btnId);
  if (!p || !b) return;

  if (stateObj[painelId]) {
    p.classList.remove('visible');
    b.classList.remove('open');
    b.textContent = '▶ ' + (painelId.includes('hist') ? 'Histórico' : 'Secções');
    stateObj[painelId] = false;
  } else {
    p.classList.add('visible');
    b.classList.add('open');
    b.textContent = '▼ Fechar';
    stateObj[painelId] = true;
  }
}

function toggleHist(li) { toggle('hist-' + li, 'btnhist-' + li, stateHist); }
function toggleSec(li)  { toggle('sec-' + li,  'btnsec-' + li,  stateSec); }

function toggleSecDet(id) {
  var p = document.getElementById('secdet-' + id);
  var r = document.getElementById('secrow-' + id);
  if (!p) return;

  if (stateSecDet[id]) {
    p.classList.remove('visible');
    if (r) r.style.background = '';
    stateSecDet[id] = false;
  } else {
    p.classList.add('visible');
    if (r) r.style.background = '#f3f4f6';
    stateSecDet[id] = true;
  }
}

fetch('dados.json?t=' + Date.now())
  .then(r => r.json())
  .then(json => {
    // Aceita:
    // 1) { data: [...] }
    // 2) [ ... ]
    const data = Array.isArray(json) ? json : (json.data || []);

    // Última semana disponível
    let ultimaSemana = "";
    const semanas = [...new Set(
      data
        .map(i => String(i.Semana || "").trim())
        .filter(s => s)
    )];

    if (semanas.length > 0) {
      ultimaSemana = semanas
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
        .pop();
    }

    // Registos principais (linhas de loja)
    let lojas = data
      .filter(item =>
        item.Loja &&
        item['P Total'] !== undefined &&
        !item.Secção &&
        (!ultimaSemana || String(item.Semana || "").trim() === ultimaSemana)
      )
      .map(item => {
        const pTotal = Number(item['P Total']) || 0;
        const pAberto = Number(item['P Aberto']) || 0;
        const pFechado = Number(item['P Fechado']) || 0;

        const npTotal = Number(item['NP Total']) || 0;
        const npAberto = Number(item['NP Aberto']) || 0;
        const npFechado = Number(item['NP Fechado']) || 0;

        const pctPAberto = pTotal > 0
          ? (pAberto / pTotal * 100).toFixed(0)
          : '0';

        const pctNPAberto = npTotal > 0
          ? (npAberto / npTotal * 100).toFixed(0)
          : '0';

        const pctPFechado = pTotal > 0
          ? (pFechado / pTotal * 100).toFixed(0)
          : '0';

        const pctNPFechado = npTotal > 0
          ? (npFechado / npTotal * 100).toFixed(0)
          : '0';

        const pctP = parseFloat(pctPAberto);
        const nivel = pctP <= 20 ? 1 : pctP <= 40 ? 2 : 3;

        return {
          loja: item.Loja,
          localidade:
            item['IM.Localidade'] ||
            item['Localidade'] ||
            item['IM Localidade'] ||
            '',

          semana: item.Semana || '',

          pTotal,
          pAberto,
          pFechado,

          npTotal,
          npAberto,
          npFechado,

          pctPAberto,
          pctNPAberto,
          pctPFechado,
          pctNPFechado,

          nivel,
          seccoes: []
        };
      });

    // Ordena e seleciona Top 10
    lojas.sort((a, b) => b.pAberto - a.pAberto);
    const topLojas = lojas.slice(0, 10);

    // Associa secções
    data.forEach(item => {
      if (
        item.Secção &&
        item.Loja &&
        (!ultimaSemana || String(item.Semana || "").trim() === ultimaSemana)
      ) {
        const loja = topLojas.find(l => l.loja === item.Loja);
        if (!loja) return;

        const pAberto = Number(item['P Aberto']) || 0;
        const npAberto = Number(item['NP Aberto']) || 0;

        if (pAberto > 0 || npAberto > 0) {
          const nome = String(item.Secção || '')
            .replace(/^IM\s+\d+\s+/, '')
            .trim();

          if (nome && nome.toLowerCase() !== 'admin') {
            loja.seccoes.push({
              nome,
              pAberto,
              npAberto
            });
          }
        }
      }
    });

    // Ordena secções
    topLojas.forEach(l => {
      l.seccoes.sort((a, b) => b.pAberto - a.pAberto);
    });

    // Atualiza cabeçalho
    document.getElementById('sub-info').textContent =
      'Gerado hoje · Top ' + topLojas.length + ' da última semana';

    document.getElementById('periodo-label').innerHTML =
      '📅 <strong>' + (ultimaSemana || 'Atual') + '</strong>';

    renderApp(topLojas);
  })
  .catch(err => {
    document.getElementById('app').innerHTML =
      '<div class="loading" style="color:#dc2626">❌ Erro: ' +
      err.message +
      '</div>';
  });

function renderApp(lojas) {

  var legenda = `
    <div class="legenda">
      <span class="tag">🔴 Top 3 críticas</span>
      <span class="tag">🟡 Restantes</span>
      <span class="tag"><b style="color:#16a34a">Nível 1</b> · 0–20%</span>
      <span class="tag"><b style="color:#ea580c">Nível 2</b> · 21–40%</span>
      <span class="tag"><b style="color:#dc2626">Nível 3</b> · 41%+</span>
    </div>
  `;

  var header = `
    <div class="tabela-header">
      <div># / Nível</div>
      <div>Loja</div>
      <div style="text-align:center">Tarefas em Aberto</div>
      <div style="text-align:center">% P</div>
      <div style="text-align:center">% NP</div>
      <div style="text-align:center">Histórico</div>
      <div style="text-align:center">Secções</div>
    </div>
  `;

  var blocos = lojas.map(function(l, li) {
    var emoji = li < 3 ? '🔴' : '🟡';
    var nc = l.nivel === 1 ? 'n1' : l.nivel === 2 ? 'n2' : 'n3';
    var seccoes = l.seccoes || [];

    // Painel Histórico (resumo básico)
    var histPainel = `
      <div class="painel hist-painel" id="hist-${li}">
        <div style="text-align:center; line-height:1.8">
          Loja: <b>${l.loja}</b><br>
          Localidade: <b>${l.localidade || '—'}</b><br>
          Semana: <b>${l.semana || '—'}</b><br>
          P abertas: <b>${l.pAberto}</b><br>
          NP abertas: <b>${l.npAberto}</b><br>
          P fechadas: <b>${l.pFechado}</b><br>
          NP fechadas: <b>${l.npFechado}</b>
        </div>
      </div>
    `;

    var secLinhas = seccoes.map(function(s, si) {
      var id = li + '-' + si;

      return `
        <tr id="secrow-${id}" onclick="toggleSecDet('${id}')">
          <td><b>${s.nome}</b></td>
          <td>${s.pAberto}</td>
          <td>${s.npAberto}</td>
        </tr>
        <tr>
          <td colspan="3" style="padding:0;border:none;background:white">
            <div class="sec-det" id="secdet-${id}">
              <div class="sec-det-inner">
                <div class="sec-det-box">
                  <h4>P — Aberto</h4>
                  <div class="sec-det-num">${s.pAberto}</div>
                  <div class="sec-det-sub">tarefas programadas abertas</div>
                </div>
                <div class="sec-det-box">
                  <h4>NP — Aberto</h4>
                  <div class="sec-det-num">${s.npAberto}</div>
                  <div class="sec-det-sub">tarefas não programadas abertas</div>
                </div>
              </div>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    var secPainel = `
      <div class="painel sec-painel" id="sec-${li}">
        ${
          seccoes.length > 0
            ? `
              <table class="sec-table">
                <thead>
                  <tr>
                    <th>Secção</th>
                    <th>P aberto</th>
                    <th>NP aberto</th>
                  </tr>
                </thead>
                <tbody>${secLinhas}</tbody>
              </table>
            `
            : `
              <div style="padding:18px 20px;color:#9ca3af;text-align:center">
                Sem secções com tarefas abertas
              </div>
            `
        }
      </div>
    `;

    return `
      <div class="loja-bloco">
        <div class="loja-linha">

          <div class="cel-rank">
            <div class="rank-num">${emoji} ${li + 1}</div>
            <span class="nivel-badge ${nc}">Nível ${l.nivel}</span>
          </div>

          <div class="cel-loja">
            <div class="nome">${l.loja}</div>
            <div class="local">${l.localidade || '—'}</div>
          </div>

          <div class="cel-tarefas">
            <div class="tarefas-val">${l.pAberto}</div>
            <div class="tarefas-sub">P abertas de ${l.pTotal}</div>
            <div class="tarefas-np">NP: <b>${l.npAberto}</b></div>
          </div>

          <div class="cel-pct">
            <div class="pct-ab" style="color:${corPct(l.pctPAberto)}">
              ${l.pctPAberto}%
            </div>
            <div class="pct-lbl">P aberto</div>
            <div class="pct-fech">${l.pctPFechado}%</div>
            <div class="pct-lbl">P fechado</div>
          </div>

          <div class="cel-pct">
            <div class="pct-ab" style="color:${corPct(l.pctNPAberto)}">
              ${l.pctNPAberto}%
            </div>
            <div class="pct-lbl">NP aberto</div>
            <div class="pct-fech">${l.pctNPFechado}%</div>
            <div class="pct-lbl">NP fechado</div>
          </div>

          <div style="text-align:center">
            <button class="toggle-btn"
                    id="btnhist-${li}"
                    onclick="toggleHist(${li})">
              ▶ Histórico
            </button>
          </div>

          <div style="text-align:center">
            <button class="toggle-btn"
                    id="btnsec-${li}"
                    onclick="toggleSec(${li})">
              ▶ Secções
            </button>
            <div class="btn-subcount">${seccoes.length} secções</div>
          </div>

        </div>

        ${histPainel}
        ${secPainel}
      </div>
    `;
  }).join('');

  document.getElementById('app').innerHTML =
    legenda +
    '<div class="tabela-wrap">' +
    header +
    blocos +
    '</div>';
}
</script>
