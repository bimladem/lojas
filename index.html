<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --border:rgba(0,0,0,.08);
  --text:#1a1a1a;
  --muted:#808080;

  --green:#22c55e;
  --red:#ef4444;
  --orange:#fb923c;

  --purple:#8b5cf6;
  --pink:#ec4899;

  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text);
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:18px 24px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:52px;
  height:52px;
  border-radius:14px;
  background:var(--grad);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;
}

.header-title h1{
  font-size:30px;
  font-weight:800;
}

.header-title .sub{
  margin-top:4px;
  color:var(--muted);
  font-size:15px;
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);

  padding:10px 18px;
  border-radius:12px;

  font-weight:800;
  color:var(--purple);
  font-size:15px;
}

/* MAIN */

.main{
  max-width:2200px;
  margin:auto;
  padding:28px;
}

/* TOP NOTE */

.top-note{
  text-align:center;
  margin-bottom:24px;

  font-size:16px;
  color:#555;
  font-weight:600;
}

/* TABLE */

.table-container{
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
}

.table-header{
  display:grid;

  grid-template-columns:
    90px
    1.3fr
    1.2fr
    120px
    120px
    120px
    120px
    120px
    120px
    180px
    120px
    120px;

  background:#fafafa;
  border-bottom:1px solid var(--border);

  font-size:13px;
  font-weight:800;
  color:#666;

  text-transform:uppercase;
}

.table-header div{
  padding:22px 10px;
  text-align:center;
}

.table-row{
  border-bottom:1px solid var(--border);
}

.row-main{

  display:grid;

  grid-template-columns:
    90px
    1.3fr
    1.2fr
    120px
    120px
    120px
    120px
    120px
    120px
    180px
    120px
    120px;

  align-items:center;

  padding:20px 10px;

  transition:.2s;
}

.row-main:hover{
  background:rgba(139,92,246,.03);
}

/* CELL */

.cell{
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* RANK */

.rank{
  flex-direction:column;
  gap:8px;
}

.rank-num{
  font-size:32px;
  font-weight:800;
}

.rank-badge{
  padding:6px 12px;
  border-radius:10px;

  font-size:12px;
  font-weight:800;
}

/* NÍVEIS */

.n1{
  background:rgba(239,68,68,.12);
  color:var(--red);
}

.n2{
  background:rgba(251,146,60,.12);
  color:var(--orange);
}

.n3{
  background:rgba(34,197,94,.12);
  color:var(--green);
}

/* LOJA */

.loja{
  flex-direction:column;
  gap:8px;
}

.loja strong{
  font-size:21px;
}

.loja span{
  color:var(--muted);
  font-size:14px;
}

/* LOCAL */

.local{
  font-size:15px;
  font-weight:700;
  color:#444;
}

/* MÉTRICAS */

.metric{
  flex-direction:column;
  gap:6px;
}

.metric .percent{
  font-size:15px;
  font-weight:800;
}

.metric .number{
  font-size:24px;
  font-weight:800;
}

.red{
  color:var(--red);
}

.green{
  color:var(--green);
}

.gray{
  color:#777;
}

/* TENDÊNCIA */

.trend{
  flex-direction:column;
  gap:8px;
}

.trend-box{
  padding:12px;
  border-radius:14px;
  min-width:140px;
}

.trend-positive{
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.2);
}

.trend-negative{
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.2);
}

.trend-neutral{
  background:rgba(0,0,0,.04);
  border:1px solid rgba(0,0,0,.08);
}

.trend-icon{
  font-size:26px;
  font-weight:800;
}

.trend-value{
  font-size:24px;
  font-weight:800;
  margin-top:4px;
}

.trend-text{
  margin-top:8px;
  font-size:12px;
  line-height:1.5;
  font-weight:700;
}

/* BUTTON */

.btn{
  background:#fff;
  border:1px solid rgba(139,92,246,.25);

  color:var(--purple);

  border-radius:12px;

  padding:12px 16px;

  cursor:pointer;

  font-weight:800;
  transition:.2s;
  font-size:14px;
}

.btn:hover{
  background:rgba(139,92,246,.08);
}

/* PANELS */

.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  padding:24px;
  background:rgba(139,92,246,.03);
  border-top:1px solid var(--border);
}

/* HISTORY */

.detail-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

.detail-table th,
.detail-table td{
  padding:16px;
  border-bottom:1px solid var(--border);
  text-align:center;
  font-size:15px;
}

.detail-table th{
  background:#fafafa;
  font-size:14px;
  font-weight:800;
}

.current{
  background:rgba(139,92,246,.06);
  font-weight:800;
}

/* NOTE */

.note{
  margin-top:26px;

  padding:22px;

  border-radius:18px;

  background:#fafafa;
  border:1px solid var(--border);

  text-align:center;
  line-height:2;

  font-size:16px;
  color:#555;
}

/* RESPONSIVE */

@media(max-width:1500px){

  .table-header{
    display:none;
  }

  .row-main{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    padding:20px;
  }

  .cell{
    background:#fafafa;
    border-radius:14px;
    padding:14px;
    flex-direction:column;
  }

  .loja{
    grid-column:1/3;
  }

  .trend{
    grid-column:1/3;
  }

}

@media(max-width:700px){

  .header{
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .header-brand{
    flex-direction:column;
  }

  .header-title h1{
    font-size:24px;
  }

  .main{
    padding:14px;
  }

  .row-main{
    grid-template-columns:1fr;
  }

  .loja,
  .trend{
    grid-column:auto;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-brand">

    <div class="header-logo">
      📊
    </div>

    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">
        A carregar...
      </div>
    </div>

  </div>

  <div class="header-period" id="periodo">
    —
  </div>

</header>

<main class="main">

  <div class="top-note">

    <strong>P</strong> = Programadas
    &nbsp;&nbsp;•&nbsp;&nbsp;
    <strong>NP</strong> = Não Programadas

  </div>

  <div id="app">

    <div style="padding:80px;text-align:center;color:#999;">
      ⏳ A carregar dados...
    </div>

  </div>

</main>

<script>

var stateHist = {};

function toggleHist(li){

  var p=document.getElementById('hist-'+li);

  stateHist[li]=!stateHist[li];

  p.classList.toggle('visible');

}

/* FETCH */

fetch('dados.json?t='+Date.now())

.then(r=>r.json())

.then(json=>{

  var data=json.data||[];

  /* SEMANAS */

  var semanas=[];

  data.forEach(i=>{

    var s=String(i.Semana||'').trim();

    if(s && semanas.indexOf(s)===-1){
      semanas.push(s);
    }

  });

  var ultima=semanas[semanas.length-1]||'Sem semana';

  /* LOJAS */

  var lojas=data

  .filter(i=>

    i.Loja &&

    !String(i.Secção || '').trim()

  )

  .map(i=>{

    var pT=Number(i['P Total'])||0;
    var pA=Number(i['P Aberto'])||0;
    var pF=Number(i['P Fechado'])||0;

    var nT=Number(i['NP Total'])||0;
    var nA=Number(i['NP Aberto'])||0;
    var nF=Number(i['NP Fechado'])||0;

    var pctPA =
      pT>0 ? (pA/pT*100) : 0;

    var pctPF =
      pT>0 ? (pF/pT*100) : 0;

    var pctNA =
      nT>0 ? (nA/nT*100) : 0;

    var pctNF =
      nT>0 ? (nF/nT*100) : 0;

    /* NÍVEL BASEADO EM FECHADAS */

    var nivel = 1;

    if(pctPF >= 70){

      nivel = 3;

    }else if(pctPF >= 40){

      nivel = 2;

    }

    return{

      loja:String(i.Loja).trim(),

      local:String(
        i["IM.Localidade"] ||
        "Sem localização"
      ).trim(),

      pT,pA,pF,
      nT,nA,nF,

      pctPA:pctPA.toFixed(1),
      pctPF:pctPF.toFixed(1),

      pctNA:pctNA.toFixed(1),
      pctNF:pctNF.toFixed(1),

      nivel,

      historico:[],

      diff:0

    };

  });

  /* HISTÓRICO */

  var hpl={};

  data.forEach(i=>{

    if(
      i.Loja &&
      !String(i.Secção || '').trim()
    ){

      var id=String(i.Loja).trim();

      if(!hpl[id]){
        hpl[id]=[];
      }

      hpl[id].push({

        semana:String(i.Semana || '').trim(),

        pA:Number(i['P Aberto']) || 0,
        pF:Number(i['P Fechado']) || 0,

        nA:Number(i['NP Aberto']) || 0,
        nF:Number(i['NP Fechado']) || 0

      });

    }

  });

  /* TENDÊNCIA */

  lojas.forEach(l=>{

    var h=hpl[l.loja] || [];

    l.historico = h.slice(-8);

    var u = h.slice(-2);

    l.diff =

      u.length===2

      ? u[1].pF - u[0].pF

      : 0;

  });

  /* ORDENAÇÃO */

  lojas.sort((a,b)=>b.pF-a.pF);

  /* INFO HEADER */

  document.getElementById('sub-info').textContent =
    lojas.length+' lojas';

  document.getElementById('periodo').innerHTML =
    '📅 Atualizado agora';

  render(lojas,ultima);

});

/* RENDER */

function render(lojas,ultima){

  var html='';

  html+='<div class="table-container">';

  /* HEADER */

  html+='<div class="table-header">';

  html+='<div>Rank</div>';
  html+='<div>Loja</div>';
  html+='<div>Localização</div>';

  html+='<div>P Total</div>';
  html+='<div>P Aberto</div>';
  html+='<div>P Fechado</div>';

  html+='<div>NP Total</div>';
  html+='<div>NP Aberto</div>';
  html+='<div>NP Fechado</div>';

  html+='<div>Tendência</div>';

  html+='<div>Histórico</div>';
  html+='<div>Nível</div>';

  html+='</div>';

  /* ROWS */

  lojas.forEach((l,li)=>{

    var badge=
      l.nivel===1 ? 'n1' :
      l.nivel===2 ? 'n2' :
      'n3';

    /* TENDÊNCIA */

    var trendClass='trend-neutral';
    var icon='→';
    var texto='Sem alterações';

    if(l.diff>0){

      trendClass='trend-positive';
      icon='▲';

      texto='Fechou MAIS tarefas que na semana anterior';

    }

    if(l.diff<0){

      trendClass='trend-negative';
      icon='▼';

      texto='Fechou MENOS tarefas que na semana anterior';

    }

    html+='<div class="table-row">';

    html+='<div class="row-main">';

    /* RANK */

    html+='<div class="cell rank">';
    html+='<div class="rank-num">'+(li+1)+'</div>';
    html+='</div>';

    /* LOJA */

    html+='<div class="cell loja">';
    html+='<strong>'+l.loja+'</strong>';
    html+='</div>';

    /* LOCAL */

    html+='<div class="cell local">';
    html+=l.local;
    html+='</div>';

    /* P TOTAL */

    html+='<div class="cell metric">';
    html+='<div class="percent gray">100%</div>';
    html+='<div class="number">'+l.pT+'</div>';
    html+='</div>';

    /* P ABERTO */

    html+='<div class="cell metric">';
    html+='<div class="percent red">'+l.pctPA+'%</div>';
    html+='<div class="number red">'+l.pA+'</div>';
    html+='</div>';

    /* P FECHADO */

    html+='<div class="cell metric">';
    html+='<div class="percent green">'+l.pctPF+'%</div>';
    html+='<div class="number green">'+l.pF+'</div>';
    html+='</div>';

    /* NP TOTAL */

    html+='<div class="cell metric">';
    html+='<div class="percent gray">100%</div>';
    html+='<div class="number">'+l.nT+'</div>';
    html+='</div>';

    /* NP ABERTO */

    html+='<div class="cell metric">';
    html+='<div class="percent red">'+l.pctNA+'%</div>';
    html+='<div class="number red">'+l.nA+'</div>';
    html+='</div>';

    /* NP FECHADO */

    html+='<div class="cell metric">';
    html+='<div class="percent green">'+l.pctNF+'%</div>';
    html+='<div class="number green">'+l.nF+'</div>';
    html+='</div>';

    /* TENDÊNCIA */

    html+='<div class="cell trend">';

    html+='<div class="trend-box '+trendClass+'">';

    html+='<div class="trend-icon">';
    html+=icon;
    html+='</div>';

    html+='<div class="trend-value">';
    html+=(l.diff>0?'+':'')+l.diff;
    html+='</div>';

    html+='<div class="trend-text">';
    html+=texto;
    html+='</div>';

    html+='</div>';

    html+='</div>';

    /* HIST */

    html+='<div class="cell">';
    html+='<button class="btn" onclick="toggleHist('+li+')">';
    html+='Histórico';
    html+='</button>';
    html+='</div>';

    /* NÍVEL */

    html+='<div class="cell">';
    html+='<div class="rank-badge '+badge+'">';
    html+='N'+l.nivel;
    html+='</div>';
    html+='</div>';

    html+='</div>';

    /* HISTÓRICO */

    html+='<div class="panel" id="hist-'+li+'">';

    html+='<div class="panel-inner">';

    html+='<table class="detail-table">';

    html+='<thead>';

    html+='<tr>';

    html+='<th>Semana</th>';
    html+='<th>P Aberto</th>';
    html+='<th>P Fechado</th>';
    html+='<th>NP Aberto</th>';
    html+='<th>NP Fechado</th>';

    html+='</tr>';

    html+='</thead>';

    html+='<tbody>';

    l.historico.forEach(h=>{

      html+='<tr>';

      html+='<td>'+(h.semana || '-')+'</td>';
      html+='<td>'+h.pA+'</td>';
      html+='<td>'+h.pF+'</td>';
      html+='<td>'+h.nA+'</td>';
      html+='<td>'+h.nF+'</td>';

      html+='</tr>';

    });

    html+='</tbody>';

    html+='</table>';

    html+='</div>';

    html+='</div>';

    html+='</div>';

  });

  html+='</div>';

  /* NOTE */

  html+='<div class="note">';

  html+='<strong>Níveis por tarefas fechadas</strong><br><br>';

  html+='<span style="color:#ef4444;font-weight:800">';
  html+='N1';
  html+='</span> • Poucas tarefas fechadas<br>';

  html+='<span style="color:#fb923c;font-weight:800">';
  html+='N2';
  html+='</span> • Desempenho médio<br>';

  html+='<span style="color:#22c55e;font-weight:800">';
  html+='N3';
  html+='</span> • Muitas tarefas fechadas';

  html+='</div>';

  document.getElementById('app').innerHTML=html;

}

</script>

</body>
</html>
