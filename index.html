<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --border:rgba(0,0,0,0.08);
  --text:#1a1a1a;
  --muted:#808080;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#fb923c;
  --purple:#8b5cf6;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text);
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-title h1{
  font-size:24px;
  font-weight:800;
}

.header-title .sub{
  color:var(--muted);
  font-size:14px;
}

.header-period{
  color:var(--purple);
  font-weight:800;
}

/* MAIN */
.main{
  max-width:1800px;
  margin:auto;
  padding:20px;
}

/* TABLE */
.table-container{
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}

.table-row{
  display:grid;
  grid-template-columns: 60px 1.5fr 2.5fr 120px 160px;
  border-bottom:1px solid var(--border);
}

.table-row:hover{
  background:rgba(139,92,246,.04);
}

.cell{
  padding:14px;
  text-align:center;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* LOJA */
.loja{
  flex-direction:column;
}

.loja strong{
  font-size:16px;
}

.loja span{
  font-size:12px;
  color:var(--muted);
}

/* TASKS */
.tasks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  width:100%;
}

.box{
  background:#fafafa;
  border:1px solid var(--border);
  padding:10px;
  border-radius:10px;
}

.bar{
  height:6px;
  background:#eee;
  border-radius:999px;
  overflow:hidden;
  margin-top:6px;
}

.red{background:var(--red);height:100%}
.green{background:var(--green);height:100%}

/* TREND */
.trend-up{color:var(--red)}
.trend-down{color:var(--green)}
.trend-neutral{color:#666}

/* BUTTON */
button{
  border:1px solid rgba(139,92,246,.3);
  background:#fff;
  color:var(--purple);
  padding:8px 10px;
  border-radius:8px;
  cursor:pointer;
  margin:2px;
}

/* PANEL */
.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  padding:16px;
  background:#fafafa;
  border-top:1px solid var(--border);
}

</style>
</head>

<body>

<header class="header">
  <div>
    <h1>Análise Semanal IM</h1>
    <div class="sub" id="sub">Carregando...</div>
  </div>
  <div class="header-period" id="periodo">—</div>
</header>

<main class="main">
  <div id="app">A carregar dados...</div>
</main>

<script>

let histState = {};
let secState = {};

function toggleHist(i){
  document.getElementById("hist-"+i).classList.toggle("visible");
}

function toggleSec(i){
  document.getElementById("sec-"+i).classList.toggle("visible");
}

fetch("dados.json?t="+Date.now())
.then(r=>r.json())
.then(json=>{

  const data = json.data || [];

  const semanas = [...new Set(data.map(i=>i.Semana).filter(Boolean))];
  const ultima = semanas[semanas.length-1] || "";

  let lojas = data
    .filter(i=>i.Loja && !i.Secção && i.Semana===ultima)
    .map(i=>{

      const pT = +i["P Total"]||0;
      const pA = +i["P Aberto"]||0;
      const pF = +i["P Fechado"]||0;

      const pct = pT ? (pA/pT*100) : 0;

      return {
        loja:i.Loja,
        local:i["IM.Localidade"]||"",
        pA,pF,pT,
        pct:pct.toFixed(1),
        nivel:pct<=20?1:pct<=40?2:3,
        historico:[],
        diff:0
      };

    });

  lojas.sort((a,b)=>b.pA-a.pA);

  const hist = {};

  data.forEach(i=>{
    if(!i.Secção && i.Loja){
      hist[i.Loja] = hist[i.Loja] || [];
      hist[i.Loja].push(i);
    }
  });

  lojas.forEach(l=>{
    const h = hist[l.loja] || [];
    l.historico = h.slice(-6);
    const u = h.slice(-2);
    l.diff = u.length===2 ? u[1]["P Aberto"]-u[0]["P Aberto"] : 0;
  });

  document.getElementById("sub").innerText =
    "Gerado hoje · "+lojas.length+" lojas";

  document.getElementById("periodo").innerText =
    "📅 "+ultima;

  render(lojas,ultima);

});

function render(lojas,ultima){

let html = `<div class="table-container">`;

lojas.forEach((l,i)=>{

html += `
<div class="table-row">

  <div class="cell">${i+1}</div>

  <div class="cell loja">
    <strong>${l.loja}</strong>
    <span>${l.local}</span>
  </div>

  <div class="cell">
    <div class="tasks">

      <div class="box">
        Programadas<br>
        Abertas ${l.pct}%<div class="bar"><div class="red" style="width:${l.pct}%"></div></div>
      </div>

      <div class="box">
        Fechadas<br>
        ${100-l.pct}%<div class="bar"><div class="green" style="width:${100-l.pct}%"></div></div>
      </div>

    </div>
  </div>

  <div class="cell ${l.diff>0?'trend-up':l.diff<0?'trend-down':'trend-neutral'}">
    ${l.diff>0?'▲':l.diff<0?'▼':'→'} ${Math.abs(l.diff)}
  </div>

  <div class="cell">
    <button onclick="toggleHist(${i})">Histórico</button>
    <button onclick="toggleSec(${i})">Secções</button>
  </div>

</div>

<div class="panel" id="hist-${i}">
  <div class="panel-inner">Histórico aqui</div>
</div>

<div class="panel" id="sec-${i}">
  <div class="panel-inner">Secções aqui</div>
</div>
`;

});

html += `</div>`;

document.getElementById("app").innerHTML = html;

}

</script>

</body>
</html>
