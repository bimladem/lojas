<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#ffffff;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
  --purple:#8b5cf6;
  --red:#ef4444;
  --green:#22c55e;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text);
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:999;
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:20px 30px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-left{
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  width:46px;
  height:46px;
  border-radius:14px;
  background:linear-gradient(135deg,#8b5cf6,#ec4899);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  font-size:20px;
}

.header-title h1{
  font-size:26px;
  font-weight:800;
}

.header-title p{
  margin-top:4px;
  color:var(--muted);
}

.periodo{
  padding:10px 16px;
  border-radius:12px;
  background:rgba(139,92,246,.08);
  color:var(--purple);
  font-weight:700;
  border:1px solid rgba(139,92,246,.15);
}

/* MAIN */

.main{
  padding:30px;
  max-width:1800px;
  margin:auto;
}

/* TABLE */

.table-container{
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
}

.table-header{
  display:grid;
  grid-template-columns:
  120px
  260px
  1fr
  220px;

  background:#fafafa;
  border-bottom:1px solid var(--border);

  font-size:13px;
  font-weight:800;
  color:#555;
  text-transform:uppercase;
}

.table-header div{
  padding:20px;
  text-align:center;
}

.table-row{
  display:grid;
  grid-template-columns:
  120px
  260px
  1fr
  220px;

  border-bottom:1px solid var(--border);
}

.cell{
  padding:24px;
}

/* RANK */

.rank-cell{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.rank-number{
  font-size:34px;
  font-weight:800;
}

.rank-badge{
  padding:5px 10px;
  border-radius:10px;
  font-size:11px;
  font-weight:800;
}

.n1{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

.n2{
  background:rgba(251,146,60,.12);
  color:#fb923c;
}

.n3{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

/* LOJA */

.loja-cell{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:8px;
}

.loja{
  font-size:28px;
  font-weight:800;
}

.local{
  color:var(--muted);
  font-size:14px;
}

/* TAREFAS */

.tasks-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:14px;
}

.task-card{
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  background:#fafafa;
}

.task-title{
  font-size:12px;
  font-weight:800;
  color:#666;
  margin-bottom:16px;
  text-transform:uppercase;
}

.task-value{
  font-size:30px;
  font-weight:800;
  margin-bottom:10px;
}

.task-bar{
  height:8px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
}

.task-fill{
  height:100%;
}

.red{
  background:#ef4444;
}

.green{
  background:#22c55e;
}

.gray{
  background:#8b5cf6;
}

/* ACTIONS */

.actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.btn{
  border:1px solid rgba(139,92,246,.25);
  background:#fff;
  color:#8b5cf6;
  border-radius:12px;
  padding:12px 18px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  background:rgba(139,92,246,.08);
}

/* PANELS */

.panel{
  display:none;
}

.panel.show{
  display:block;
}

.panel-inner{
  padding:28px;
  background:#fafafa;
  border-top:1px solid var(--border);
}

/* HISTORICO */

.hist-info{
  margin-bottom:22px;
  padding:18px;
  border-radius:14px;
  background:#fff;
  border:1px solid var(--border);
}

.hist-info strong{
  display:block;
  margin-bottom:10px;
  font-size:15px;
}

.hist-info p{
  color:#555;
  line-height:1.6;
}

.hist-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

.hist-table th{
  background:#f3f4f6;
  padding:16px;
  text-align:center;
  font-size:12px;
  text-transform:uppercase;
}

.hist-table td{
  padding:16px;
  text-align:center;
  border-top:1px solid var(--border);
  font-weight:600;
}

/* SECCOES */

.sections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:18px;
}

.section-card{
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  background:#fff;
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:20px;
}

.metric{
  margin-bottom:18px;
}

.metric-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:13px;
  font-weight:700;
}

@media(max-width:1400px){

  .tasks-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:1000px){

  .table-header{
    display:none;
  }

  .table-row{
    grid-template-columns:1fr;
  }

  .tasks-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-left">

    <div class="logo">
      📊
    </div>

    <div class="header-title">
      <h1>Análise Semanal</h1>
      <p id="subinfo">Carregando...</p>
    </div>

  </div>

  <div class="periodo" id="periodo">
    —
  </div>

</header>

<main class="main">

  <div id="app">

    <div style="padding:100px;text-align:center">
      ⏳ Carregando dados...
    </div>

  </div>

</main>

<script>

var stateHist = {};
var stateSec = {};

function toggleHist(i){

  var panel = document.getElementById('hist-' + i);

  stateHist[i] = !stateHist[i];

  panel.classList.toggle('show',stateHist[i]);

}

function toggleSec(i){

  var panel = document.getElementById('sec-' + i);

  stateSec[i] = !stateSec[i];

  panel.classList.toggle('show',stateSec[i]);

}

fetch('dados.json?t=' + Date.now())

.then(r=>r.json())

.then(json=>{

  var data = json.data || [];

  var semanas = [];

  data.forEach(i=>{

    var s = String(i.Semana || '').trim();

    if(s && !semanas.includes(s)){
      semanas.push(s);
    }

  });

  var ultima = semanas[semanas.length-1] || '';

  var lojas = data

  .filter(i=>
    i.Loja &&
    !i.Secção &&
    String(i.Semana || '').trim() === ultima
  )

  .map(i=>{

    var pTotal = Number(i['P Total']) || 0;
    var pAberto = Number(i['P Aberto']) || 0;
    var pFechado = Number(i['P Fechado']) || 0;

    var npTotal = Number(i['NP Total']) || 0;
    var npAberto = Number(i['NP Aberto']) || 0;
    var npFechado = Number(i['NP Fechado']) || 0;

    return{

      loja:String(i.Loja).trim(),

      local:String(
        i['Resumo contactos.Localidade']
        ||
        i['IM.Localidade']
        ||
        ''
      ).trim(),

      pTotal,
      pAberto,
      pFechado,

      npTotal,
      npAberto,
      npFechado,

      historico:[],
      seccoes:[],

      nivel:
      pAberto <= 20 ? 1 :
      pAberto <= 40 ? 2 : 3

    };

  })

  .filter(l=>l.pAberto > 0);

  lojas.sort((a,b)=>b.pAberto-a.pAberto);

  var top = lojas.slice(0,10);

  var ids = {};

  top.forEach(l=>{
    ids[l.loja] = true;
  });

  data.forEach(i=>{

    if(
      !i.Secção &&
      i.Loja &&
      ids[String(i.Loja).trim()]
    ){

      var loja = top.find(
        l=>l.loja === String(i.Loja).trim()
      );

      if(loja){

        loja.historico.push({

          semana:String(i.Semana).trim(),

          pAberto:Number(i['P Aberto']) || 0,
          pFechado:Number(i['P Fechado']) || 0,

          npAberto:Number(i['NP Aberto']) || 0,
          npFechado:Number(i['NP Fechado']) || 0

        });

      }

    }

  });

  data.forEach(i=>{

    if(
      i.Secção &&
      i.Loja &&
      ids[String(i.Loja).trim()]
    ){

      var loja = top.find(
        l=>l.loja === String(i.Loja).trim()
      );

      if(loja){

        var nome = String(i.Secção)
        .replace(/^IM\s+\d+\s+/,'')
        .trim();

        if(nome.toLowerCase() !== 'admin'){

          loja.seccoes.push({

            nome,

            pAberto:Number(i['P Aberto']) || 0,
            pFechado:Number(i['P Fechado']) || 0,

            npAberto:Number(i['NP Aberto']) || 0,
            npFechado:Number(i['NP Fechado']) || 0

          });

        }

      }

    }

  });

  document.getElementById('subinfo').innerHTML =
  'Gerado hoje · ' + top.length + ' lojas';

  document.getElementById('periodo').innerHTML =
  '📅 ' + ultima;

  render(top);

});

function render(lojas){

  var html = `

  <div class="table-container">

    <div class="table-header">

      <div>Rank</div>

      <div>Loja</div>

      <div>Tarefas</div>

      <div>Ações</div>

    </div>

  `;

  lojas.forEach((l,i)=>{

    var badge =
    l.nivel === 1 ? 'n1' :
    l.nivel === 2 ? 'n2' : 'n3';

    var explicacao = '';

    if(l.historico.length >= 2){

      var ult = l.historico[l.historico.length-1].pAberto;
      var pen = l.historico[l.historico.length-2].pAberto;

      var dif = ult - pen;

      if(dif > 0){

        explicacao =
        'As tarefas programadas abertas aumentaram em ' +
        dif +
        ' em comparação com a semana anterior.';

      }else if(dif < 0){

        explicacao =
        'As tarefas programadas abertas diminuíram em ' +
        Math.abs(dif) +
        ' em comparação com a semana anterior.';

      }else{

        explicacao =
        'Não houve alteração nas tarefas programadas abertas em comparação com a semana anterior.';

      }

    }

    html += `

    <div class="table-row">

      <div class="cell rank-cell">

        <div class="rank-number">
          ${i+1}
        </div>

        <div class="rank-badge ${badge}">
          N${l.nivel}
        </div>

      </div>

      <div class="cell loja-cell">

        <div class="loja">
          ${l.loja}
        </div>

        <div class="local">
          ${l.local}
        </div>

      </div>

      <div class="cell">

        <div class="tasks-grid">

          <div class="task-card">

            <div class="task-title">
              Programadas Total
            </div>

            <div class="task-value">
              ${l.pTotal}
            </div>

            <div class="task-bar">
              <div class="task-fill gray" style="width:100%"></div>
            </div>

          </div>

          <div class="task-card">

            <div class="task-title">
              Programadas Abertas
            </div>

            <div class="task-value">
              ${l.pAberto}
            </div>

            <div class="task-bar">
              <div class="task-fill red" style="width:${l.pTotal ? (l.pAberto/l.pTotal*100) : 0}%"></div>
            </div>

          </div>

          <div class="task-card">

            <div class="task-title">
              Programadas Fechadas
            </div>

            <div class="task-value">
              ${l.pFechado}
            </div>

            <div class="task-bar">
              <div class="task-fill green" style="width:${l.pTotal ? (l.pFechado/l.pTotal*100) : 0}%"></div>
            </div>

          </div>

          <div class="task-card">

            <div class="task-title">
              Não Programadas Total
            </div>

            <div class="task-value">
              ${l.npTotal}
            </div>

            <div class="task-bar">
              <div class="task-fill gray" style="width:100%"></div>
            </div>

          </div>

          <div class="task-card">

            <div class="task-title">
              Não Programadas Abertas
            </div>

            <div class="task-value">
              ${l.npAberto}
            </div>

            <div class="task-bar">
              <div class="task-fill red" style="width:${l.npTotal ? (l.npAberto/l.npTotal*100) : 0}%"></div>
            </div>

          </div>

          <div class="task-card">

            <div class="task-title">
              Não Programadas Fechadas
            </div>

            <div class="task-value">
              ${l.npFechado}
            </div>

            <div class="task-bar">
              <div class="task-fill green" style="width:${l.npTotal ? (l.npFechado/l.npTotal*100) : 0}%"></div>
            </div>

          </div>

        </div>

      </div>

      <div class="cell actions">

        <button
        class="btn"
        onclick="toggleHist(${i})">
          Histórico
        </button>

        <button
        class="btn"
        onclick="toggleSec(${i})">
          Secções
        </button>

      </div>

    </div>

    <div class="panel" id="hist-${i}">

      <div class="panel-inner">

        <div class="hist-info">

          <strong>
            Evolução das tarefas
          </strong>

          <p>
            ${explicacao}
          </p>

        </div>

        <table class="hist-table">

          <thead>

            <tr>

              <th>Semana</th>

              <th>Programadas Abertas</th>

              <th>Programadas Fechadas</th>

              <th>Não Programadas Abertas</th>

              <th>Não Programadas Fechadas</th>

            </tr>

          </thead>

          <tbody>

            ${l.historico.map(h=>`

              <tr>

                <td>${h.semana}</td>

                <td>${h.pAberto}</td>

                <td>${h.pFechado}</td>

                <td>${h.npAberto}</td>

                <td>${h.npFechado}</td>

              </tr>

            `).join('')}

          </tbody>

        </table>

      </div>

    </div>

    <div class="panel" id="sec-${i}">

      <div class="panel-inner">

        <div class="sections-grid">

          ${l.seccoes.map(s=>`

            <div class="section-card">

              <div class="section-title">
                ${s.nome}
              </div>

              <div class="metric">

                <div class="metric-top">
                  <span>Programadas Abertas</span>
                  <strong>${s.pAberto}</strong>
                </div>

                <div class="task-bar">
                  <div class="task-fill red" style="width:100%"></div>
                </div>

              </div>

              <div class="metric">

                <div class="metric-top">
                  <span>Programadas Fechadas</span>
                  <strong>${s.pFechado}</strong>
                </div>

                <div class="task-bar">
                  <div class="task-fill green" style="width:100%"></div>
                </div>

              </div>

              <div class="metric">

                <div class="metric-top">
                  <span>Não Programadas Abertas</span>
                  <strong>${s.npAberto}</strong>
                </div>

                <div class="task-bar">
                  <div class="task-fill red" style="width:100%"></div>
                </div>

              </div>

              <div class="metric">

                <div class="metric-top">
                  <span>Não Programadas Fechadas</span>
                  <strong>${s.npFechado}</strong>
                </div>

                <div class="task-bar">
                  <div class="task-fill green" style="width:100%"></div>
                </div>

              </div>

            </div>

          `).join('')}

        </div>

      </div>

    </div>

    `;

  });

  html += `</div>`;

  document.getElementById('app').innerHTML = html;

}

</script>

</body>
</html>
