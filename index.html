<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --card:#ffffff;
  --border:#e9e9ee;
  --border-hover:#d7d7e0;

  --text:#111827;
  --text-2:#4b5563;
  --text-3:#8b95a7;

  --purple:#8b5cf6;
  --pink:#ec4899;

  --green:#22c55e;
  --red:#ef4444;
  --orange:#f59e0b;

  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  background:linear-gradient(to bottom,#fafafa,#ffffff);
  font-family:'Inter',sans-serif;
  color:var(--text);
  min-height:100vh;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(0,0,0,.06);

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;

  padding:20px 34px;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:52px;
  height:52px;
  border-radius:16px;
  background:var(--grad);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;
  box-shadow:0 12px 30px rgba(139,92,246,.25);
}

.header-title h1{
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
}

.header-title .sub{
  color:var(--text-3);
  font-size:13px;
  margin-top:3px;
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);

  color:var(--purple);
  font-weight:700;

  border-radius:12px;

  padding:10px 16px;
  white-space:nowrap;
}

/* MAIN */

.main{
  max-width:1650px;
  margin:auto;
  padding:36px;
}

/* KPI */

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:22px;
  margin-bottom:34px;
}

.kpi-card{
  background:var(--card);
  border:1px solid var(--border);

  border-radius:22px;
  padding:26px;

  position:relative;
  overflow:hidden;

  transition:.25s ease;
}

.kpi-card:hover{
  transform:translateY(-4px);
  border-color:var(--border-hover);
  box-shadow:0 18px 40px rgba(0,0,0,.06);
}

.kpi-card::before{
  content:'';
  position:absolute;
  left:0;
  top:0;
  width:5px;
  height:100%;
  background:var(--grad);
}

.kpi-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.6px;
  color:var(--text-3);
  font-weight:700;
}

.kpi-value{
  font-size:42px;
  font-weight:800;
  margin-top:12px;
  line-height:1;
}

.kpi-sublabel{
  margin-top:10px;
  color:var(--text-3);
  font-size:13px;
}

/* TOP INFO */

.top-layout{
  display:grid;
  grid-template-columns:1fr 420px;
  gap:26px;
  margin-bottom:30px;
}

.legend-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:22px;
  padding:26px;
}

.legend-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:20px;
}

.legend-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:12px;

  color:var(--text-2);
  font-size:14px;
}

.legend-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#f6f5ff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:16px;
}

/* LEVELS */

.levels-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
}

.levels-head{
  padding:20px 24px;
  border-bottom:1px solid var(--border);
  font-weight:800;
  font-size:14px;
}

.levels-content{
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.level-row{
  display:grid;
  grid-template-columns:48px 1fr auto;
  gap:16px;

  align-items:center;

  background:#fafafa;
  border-radius:14px;
  padding:14px;
}

.level-badge{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;
}

.level-name{
  font-weight:800;
  font-size:15px;
}

.level-range{
  font-size:13px;
  color:var(--text-3);
  margin-top:2px;
}

.level-right{
  text-align:right;
}

.level-right span{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:var(--text-3);
}

.level-right strong{
  display:block;
  margin-top:3px;
  font-size:14px;
}

/* TABLE */

.table-wrapper{
  background:#fff;
  border:1px solid var(--border);
  border-radius:24px;
  overflow:hidden;
}

.table-header{
  display:grid;
  grid-template-columns:
  110px
  1.5fr
  1fr
  120px
  120px
  200px;

  gap:0;

  padding:18px 22px;

  border-bottom:1px solid var(--border);

  background:#fafafa;
}

.th{
  font-size:12px;
  font-weight:800;
  color:var(--text-3);
  text-transform:uppercase;
  letter-spacing:.5px;
}

.row{
  display:grid;
  grid-template-columns:
  110px
  1.5fr
  1fr
  120px
  120px
  200px;

  align-items:center;

  padding:24px 22px;

  border-bottom:1px solid #f1f1f4;

  transition:.2s ease;
}

.row:hover{
  background:#fcfbff;
}

.row:last-child{
  border-bottom:none;
}

/* RANK */

.rank{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.rank-emoji{
  font-size:25px;
}

.rank-number{
  font-size:22px;
  font-weight:800;
}

.rank-badge{
  padding:5px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.badge-n1{
  background:rgba(34,197,94,.12);
  color:var(--green);
}

.badge-n2{
  background:rgba(245,158,11,.12);
  color:var(--orange);
}

.badge-n3{
  background:rgba(239,68,68,.12);
  color:var(--red);
}

/* LOJA */

.loja{
  min-width:0;
}

.loja h3{
  font-size:17px;
  font-weight:800;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.loja p{
  margin-top:5px;
  font-size:13px;
  color:var(--text-3);

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* SUMMARY */

.summary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
}

.summary-box{
  text-align:center;
}

.summary-box strong{
  display:block;
  font-size:24px;
  font-weight:800;
}

.summary-box span{
  color:var(--text-3);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.4px;
}

/* TREND */

.trend{
  text-align:center;
}

.trend-icon{
  font-size:22px;
  font-weight:800;
}

.trend-value{
  margin-top:5px;
  font-size:14px;
  font-weight:800;
}

.up{
  color:var(--red);
}

.down{
  color:var(--green);
}

.none{
  color:var(--text-3);
}

/* BUTTONS */

.actions{
  display:flex;
  gap:10px;
  justify-content:center;
}

.btn{
  border:none;
  background:#f7f5ff;
  color:var(--purple);

  font-weight:700;
  font-size:12px;

  border-radius:12px;

  padding:11px 14px;

  cursor:pointer;

  transition:.2s ease;
}

.btn:hover{
  transform:translateY(-1px);
  background:#ede9fe;
}

.btn.active{
  background:var(--grad);
  color:#fff;
}

/* PANELS */

.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  background:#fafafa;
  padding:30px;
  border-top:1px solid var(--border);
  animation:fade .25s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(-6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.panel-title{
  font-size:15px;
  font-weight:800;
  margin-bottom:22px;
}

/* TASKS */

.tasks-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}

.task-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.task-head{
  font-weight:800;
  font-size:14px;
  margin-bottom:20px;
}

.task-item{
  margin-bottom:18px;
}

.task-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.task-left{
  font-size:13px;
  font-weight:700;
  color:var(--text-2);
}

.task-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.task-number{
  font-size:17px;
  font-weight:800;
}

.task-percent{
  font-size:12px;
  font-weight:800;
  color:var(--text-3);
}

.bar{
  width:100%;
  height:8px;
  background:#f1f1f4;
  border-radius:999px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  border-radius:999px;
  transition:.6s ease;
}

/* HIST */

.hist-table{
  width:100%;
  border-collapse:collapse;
}

.hist-table th{
  text-align:left;
  padding:14px;
  font-size:11px;
  text-transform:uppercase;
  color:var(--text-3);
  border-bottom:1px solid var(--border);
}

.hist-table td{
  padding:16px 14px;
  border-bottom:1px solid #f0f0f0;
  font-size:14px;
}

.hist-table tr:hover td{
  background:#fff;
}

.current-row td{
  background:#f5f3ff;
  font-weight:700;
}

/* SECÇÕES */

.sec-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

.sec-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.sec-head{
  padding:18px;
  cursor:pointer;
  font-weight:800;
  border-bottom:1px solid transparent;
}

.sec-head:hover{
  background:#fafafa;
}

.sec-content{
  display:none;
  padding:18px;
  border-top:1px solid var(--border);
}

.sec-content.visible{
  display:block;
}

.metric-group{
  margin-bottom:20px;
}

.metric-group:last-child{
  margin-bottom:0;
}

.metric-title{
  font-size:11px;
  color:var(--text-3);
  text-transform:uppercase;
  letter-spacing:.4px;
  margin-bottom:12px;
  font-weight:800;
}

.metric{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:13px;
}

.metric span:last-child{
  font-weight:800;
}

/* ALERT */

.alert-box{
  margin-top:28px;

  background:rgba(239,68,68,.06);
  border:1px solid rgba(239,68,68,.14);

  border-radius:24px;
  padding:26px;

  display:flex;
  gap:18px;
}

.alert-icon{
  font-size:28px;
}

.alert-box h3{
  font-size:15px;
  color:var(--red);
  margin-bottom:8px;
}

.alert-box p{
  color:var(--text-2);
  line-height:1.7;
}

/* RESPONSIVE */

@media(max-width:1200px){

  .top-layout{
    grid-template-columns:1fr;
  }

  .table-header,
  .row{
    grid-template-columns:
    100px
    1.2fr
    .9fr
    110px
    100px
    180px;
  }
}

@media(max-width:950px){

  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .main{
    padding:20px;
  }

  .tasks-grid{
    grid-template-columns:1fr;
  }

  .table-header{
    display:none;
  }

  .row{
    grid-template-columns:1fr;
    gap:20px;
  }

  .rank{
    flex-direction:row;
    justify-content:flex-start;
  }

  .summary{
    justify-content:flex-start;
  }

  .actions{
    justify-content:flex-start;
    flex-wrap:wrap;
  }
}

@media(max-width:600px){

  .main{
    padding:16px;
  }

  .header{
    padding:18px;
  }

  .kpi-grid{
    grid-template-columns:1fr;
  }

  .detail-grid{
    grid-template-columns:1fr;
  }
}

.loading{
  text-align:center;
  padding:100px 20px;
  color:var(--text-3);
  font-size:15px;
}
</style>
</head>

<body>

<header class="header">

  <div class="header-brand">

    <div class="header-logo">
      📊
    </div>

    <div class="header-title">
      <h1>Análise Semanal</h1>
      <div class="sub" id="sub-info">Carregando dados...</div>
    </div>

  </div>

  <div class="header-period" id="periodo">
    —
  </div>

</header>

<main class="main">

  <div id="app">
    <div class="loading">
      ⏳ Carregando dados...
    </div>
  </div>

</main>

<script>

var stateHist = {};
var stateTasks = {};
var stateSec = {};
var stateSecDet = {};

function toggleHist(id){

  var panel = document.getElementById('hist-'+id);
  var btn = document.getElementById('btnhist-'+id);

  stateHist[id] = !stateHist[id];

  panel.classList.toggle('visible',stateHist[id]);
  btn.classList.toggle('active',stateHist[id]);

  btn.innerHTML = stateHist[id]
  ? '▼ Fechar'
  : '▶ Histórico';
}

function toggleTasks(id){

  var panel = document.getElementById('tasks-'+id);
  var btn = document.getElementById('btntasks-'+id);

  stateTasks[id] = !stateTasks[id];

  panel.classList.toggle('visible',stateTasks[id]);
  btn.classList.toggle('active',stateTasks[id]);

  btn.innerHTML = stateTasks[id]
  ? '▼ Fechar'
  : '▶ Tarefas';

  if(stateTasks[id]){

    setTimeout(()=>{

      document
      .querySelectorAll('#tasks-'+id+' .bar-fill')
      .forEach(el=>{

        el.style.width = el.getAttribute('data-width');

      });

    },50);

  }

}

function toggleSec(id){

  var panel = document.getElementById('sec-'+id);
  var btn = document.getElementById('btnsec-'+id);

  stateSec[id] = !stateSec[id];

  panel.classList.toggle('visible',stateSec[id]);
  btn.classList.toggle('active',stateSec[id]);

  btn.innerHTML = stateSec[id]
  ? '▼ Fechar'
  : '▶ Secções';
}

function toggleSecDet(id){

  var el = document.getElementById('secdet-'+id);

  el.classList.toggle('visible');
}

fetch('dados.json?t=' + Date.now())

.then(r=>r.json())

.then(json=>{

  var data = json.data || [];

  var semanas = [];

  data.forEach(i=>{

    var s = String(i.Semana || '').trim();

    if(s && !semanas.includes(s)){
      semanas.push(s);
    }

  });

  var ultima = semanas[semanas.length-1] || '';

  var lojas = data

  .filter(i=>
    i.Loja &&
    !i.Secção &&
    String(i.Semana || '').trim() === ultima
  )

  .map(i=>{

    var pT = Number(i['P Total']) || 0;
    var pA = Number(i['P Aberto']) || 0;
    var pF = Number(i['P Fechado']) || 0;

    var nT = Number(i['NP Total']) || 0;
    var nA = Number(i['NP Aberto']) || 0;
    var nF = Number(i['NP Fechado']) || 0;

    var pctPA = pT > 0
    ? (pA/pT*100).toFixed(1)
    : '0.0';

    var pctPF = pT > 0
    ? (pF/pT*100).toFixed(1)
    : '0.0';

    var pctNA = nT > 0
    ? (nA/nT*100).toFixed(1)
    : '0.0';

    var pctNF = nT > 0
    ? (nF/nT*100).toFixed(1)
    : '0.0';

    return{

      loja:String(i.Loja).trim(),

      local:String(
        i['Resumo contactos.Localidade']
        || i['IM.Localidade']
        || ''
      ).trim(),

      pT,pA,pF,
      nT,nA,nF,

      pctPA,pctPF,
      pctNA,pctNF,

      nivel:
      parseFloat(pctPA)<=20 ? 1 :
      parseFloat(pctPA)<=40 ? 2 :
      3,

      historico:[],
      seccoes:[]

    };

  })

  .filter(l=>l.pA > 0);

  lojas.sort((a,b)=>b.pA-a.pA);

  var top = lojas.slice(0,10);

  var ids = {};

  top.forEach(l=>ids[l.loja]=true);

  var historicos = {};

  data.forEach(i=>{

    if(
      !i.Secção &&
      i.Loja &&
      i.Semana &&
      ids[String(i.Loja).trim()]
    ){

      var id = String(i.Loja).trim();

      if(!historicos[id]){
        historicos[id] = [];
      }

      historicos[id].push({

        semana:String(i.Semana).trim(),

        pA:Number(i['P Aberto']) || 0,
        pF:Number(i['P Fechado']) || 0,

        nA:Number(i['NP Aberto']) || 0,
        nF:Number(i['NP Fechado']) || 0

      });

    }

  });

  top.forEach(l=>{

    var h = historicos[l.loja] || [];

    l.historico = h
    .filter(x=>x.semana !== ultima)
    .slice(-8);

    var ultimas = h.slice(-2);

    l.diff = ultimas.length === 2
    ? ultimas[1].pA - ultimas[0].pA
    : null;

  });

  data.forEach(i=>{

    if(
      i.Secção &&
      i.Loja &&
      ids[String(i.Loja).trim()]
    ){

      var loja = top.find(
        l=>l.loja === String(i.Loja).trim()
      );

      if(loja){

        var nome = String(i.Secção)
        .replace(/^IM\s+\d+\s+/,'')
        .trim();

        if(nome.toLowerCase() !== 'admin'){

          var pT = Number(i['P Total']) || 0;
          var pA = Number(i['P Aberto']) || 0;
          var pF = Number(i['P Fechado']) || 0;

          var nT = Number(i['NP Total']) || 0;
          var nA = Number(i['NP Aberto']) || 0;
          var nF = Number(i['NP Fechado']) || 0;

          loja.seccoes.push({

            nome,

            pA,pF,nA,nF,

            pctPA:
            pT>0
            ? (pA/pT*100).toFixed(1)
            : '0.0',

            pctPF:
            pT>0
            ? (pF/pT*100).toFixed(1)
            : '0.0',

            pctNA:
            nT>0
            ? (nA/nT*100).toFixed(1)
            : '0.0',

            pctNF:
            nT>0
            ? (nF/nT*100).toFixed(1)
            : '0.0'

          });

        }

      }

    }

  });

  top.forEach(
    l=>l.seccoes.sort((a,b)=>b.pA-a.pA)
  );

  document.getElementById('sub-info').innerHTML =
  'Gerado hoje • ' + top.length + ' lojas';

  document.getElementById('periodo').innerHTML =
  '📅 ' + ultima;

  renderApp(top,ultima);

})

.catch(()=>{

  document.getElementById('app').innerHTML = `
    <div class="loading" style="color:#ef4444">
      ❌ Erro ao carregar dados
    </div>
  `;

});

function renderApp(lojas,ultima){

  var criticas = lojas.filter((l,i)=>i<3).length;

  var alertas = lojas.filter((l,i)=>i>=3).length;

  var piorando = lojas.filter(l=>l.diff > 0).length;

  var melhorando = lojas.filter(l=>l.diff < 0).length;

  var kpis = `

    <div class="kpi-grid">

      <div class="kpi-card">
        <div class="kpi-label">
          🔴 Lojas Críticas
        </div>

        <div class="kpi-value">
          ${criticas}
        </div>

        <div class="kpi-sublabel">
          Top 3 com mais abertas
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-label">
          ⚠️ Em Alerta
        </div>

        <div class="kpi-value">
          ${alertas}
        </div>

        <div class="kpi-sublabel">
          Necessitam acompanhamento
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-label">
          ▲ A Piorar
        </div>

        <div class="kpi-value">
          ${piorando}
        </div>

        <div class="kpi-sublabel">
          Mais abertas vs semana anterior
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-label">
          ▼ A Melhorar
        </div>

        <div class="kpi-value">
          ${melhorando}
        </div>

        <div class="kpi-sublabel">
          Menos abertas vs semana anterior
        </div>
      </div>

    </div>

  `;

  var topInfo = `

    <div class="top-layout">

      <div class="legend-card">

        <div class="legend-title">
          📊 Indicadores
        </div>

        <div class="legend-list">

          <div class="legend-item">
            <div class="legend-icon">
              🔴
            </div>
            <div>
              Top 3 lojas críticas
            </div>
          </div>

          <div class="legend-item">
            <div class="legend-icon">
              ▲
            </div>
            <div>
              Tendência de piora
            </div>
          </div>

          <div class="legend-item">
            <div class="legend-icon">
              ▼
            </div>
            <div>
              Tendência de melhoria
            </div>
          </div>

        </div>

      </div>

      <div class="levels-box">

        <div class="levels-head">
          🎯 Níveis de Incumprimento
        </div>

        <div class="levels-content">

          <div class="level-row">

            <div class="level-badge">
              🟢
            </div>

            <div>
              <div class="level-name">
                N1
              </div>

              <div class="level-range">
                0–20%
              </div>
            </div>

            <div class="level-right">
              <span>Estado</span>
              <strong>Excelente</strong>
            </div>

          </div>

          <div class="level-row">

            <div class="level-badge">
              🟠
            </div>

            <div>
              <div class="level-name">
                N2
              </div>

              <div class="level-range">
                21–40%
              </div>
            </div>

            <div class="level-right">
              <span>Estado</span>
              <strong>Aceitável</strong>
            </div>

          </div>

          <div class="level-row">

            <div class="level-badge">
              🔴
            </div>

            <div>
              <div class="level-name">
                N3
              </div>

              <div class="level-range">
                41%+
              </div>
            </div>

            <div class="level-right">
              <span>Estado</span>
              <strong>Crítico</strong>
            </div>

          </div>

        </div>

      </div>

    </div>

  `;

  var header = `

    <div class="table-header">

      <div class="th">
        Rank
      </div>

      <div class="th">
        Loja
      </div>

      <div class="th">
        Resumo
      </div>

      <div class="th">
        Tarefas
      </div>

      <div class="th">
        Tendência
      </div>

      <div class="th">
        Ações
      </div>

    </div>

  `;

  var rows = '';

  lojas.forEach((l,li)=>{

    var total = l.pA + l.pF + l.nA + l.nF;

    var abertas = l.pA + l.nA;

    var badge =
    l.nivel===1 ? 'badge-n1' :
    l.nivel===2 ? 'badge-n2' :
    'badge-n3';

    var diffIcon =
    l.diff === null ? '—' :
    l.diff > 0 ? '▲' :
    l.diff < 0 ? '▼' :
    '→';

    var diffClass =
    l.diff === null ? 'none' :
    l.diff > 0 ? 'up' :
    l.diff < 0 ? 'down' :
    'none';

    var histRows = '';

    l.historico.forEach(h=>{

      histRows += `

      <tr>
        <td>${h.semana}</td>
        <td>${h.pA}</td>
        <td>${h.pF}</td>
        <td>${h.nA}</td>
        <td>${h.nF}</td>
      </tr>

      `;

    });

    var secHtml = '';

    l.seccoes.forEach((s,si)=>{

      var id = l.loja.replace(/\s/g,'') + '-' + si;

      secHtml += `

      <div class="sec-card">

        <div class="sec-head"
        onclick="toggleSecDet('${id}')">

          ${s.nome}

        </div>

        <div class="sec-content"
        id="secdet-${id}">

          <div class="metric-group">

            <div class="metric-title">
              Programadas
            </div>

            <div class="metric">
              <span>Abertas</span>
              <span>${s.pA} • ${s.pctPA}%</span>
            </div>

            <div class="metric">
              <span>Fechadas</span>
              <span>${s.pF} • ${s.pctPF}%</span>
            </div>

          </div>

          <div class="metric-group">

            <div class="metric-title">
              Não Programadas
            </div>

            <div class="metric">
              <span>Abertas</span>
              <span>${s.nA} • ${s.pctNA}%</span>
            </div>

            <div class="metric">
              <span>Fechadas</span>
              <span>${s.nF} • ${s.pctNF}%</span>
            </div>

          </div>

        </div>

      </div>

      `;

    });

    rows += `

    <div class="row">

      <div class="rank">

        <div class="rank-emoji">
          ${li < 3 ? '🔴' : '🟠'}
        </div>

        <div class="rank-number">
          ${li+1}
        </div>

        <div class="rank-badge ${badge}">
          N${l.nivel}
        </div>

      </div>

      <div class="loja">

        <h3>
          ${l.loja}
        </h3>

        <p>
          ${l.local || '—'}
        </p>

      </div>

      <div class="summary">

        <div class="summary-box">
          <strong>${total}</strong>
          <span>Tarefas</span>
        </div>

        <div class="summary-box">
          <strong>${abertas}</strong>
          <span>Abertas</span>
        </div>

      </div>

      <div>
        <button
        class="btn"
        id="btntasks-${li}"
        onclick="toggleTasks(${li})">

          ▶ Tarefas

        </button>
      </div>

      <div class="trend">

        <div class="trend-icon ${diffClass}">
          ${diffIcon}
        </div>

        <div class="trend-value ${diffClass}">
          ${l.diff === null ? '—' : Math.abs(l.diff)}
        </div>

      </div>

      <div class="actions">

        <button
        class="btn"
        id="btnhist-${li}"
        onclick="toggleHist(${li})">

          ▶ Histórico

        </button>

        <button
        class="btn"
        id="btnsec-${li}"
        onclick="toggleSec(${li})">

          ▶ Secções

        </button>

      </div>

    </div>

    <!-- HISTÓRICO -->

    <div class="panel"
    id="hist-${li}">

      <div class="panel-inner">

        <div class="panel-title">
          📈 Evolução Semanal
        </div>

        <table class="hist-table">

          <thead>

            <tr>
              <th>Semana</th>
              <th>P Aberto</th>
              <th>P Fechado</th>
              <th>NP Aberto</th>
              <th>NP Fechado</th>
            </tr>

          </thead>

          <tbody>

            ${histRows}

            <tr class="current-row">

              <td>${ultima}</td>
              <td>${l.pA}</td>
              <td>${l.pF}</td>
              <td>${l.nA}</td>
              <td>${l.nF}</td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

    <!-- TASKS -->

    <div class="panel"
    id="tasks-${li}">

      <div class="panel-inner">

        <div class="panel-title">
          📋 Análise de Tarefas
        </div>

        <div class="tasks-grid">

          <div class="task-card">

            <div class="task-head">
              Programadas
            </div>

            <div class="task-item">

              <div class="task-line">

                <div class="task-left">
                  Abertas
                </div>

                <div class="task-right">

                  <div class="task-number">
                    ${l.pA}
                  </div>

                  <div class="task-percent">
                    ${l.pctPA}%
                  </div>

                </div>

              </div>

              <div class="bar">

                <div
                class="bar-fill"
                style="width:0;background:#ef4444"
                data-width="${l.pctPA}%">

                </div>

              </div>

            </div>

            <div class="task-item">

              <div class="task-line">

                <div class="task-left">
                  Fechadas
                </div>

                <div class="task-right">

                  <div class="task-number">
                    ${l.pF}
                  </div>

                  <div class="task-percent">
                    ${l.pctPF}%
                  </div>

                </div>

              </div>

              <div class="bar">

                <div
                class="bar-fill"
                style="width:0;background:#22c55e"
                data-width="${l.pctPF}%">

                </div>

              </div>

            </div>

          </div>

          <div class="task-card">

            <div class="task-head">
              Não Programadas
            </div>

            <div class="task-item">

              <div class="task-line">

                <div class="task-left">
                  Abertas
                </div>

                <div class="task-right">

                  <div class="task-number">
                    ${l.nA}
                  </div>

                  <div class="task-percent">
                    ${l.pctNA}%
                  </div>

                </div>

              </div>

              <div class="bar">

                <div
                class="bar-fill"
                style="width:0;background:#ef4444"
                data-width="${l.pctNA}%">

                </div>

              </div>

            </div>

            <div class="task-item">

              <div class="task-line">

                <div class="task-left">
                  Fechadas
                </div>

                <div class="task-right">

                  <div class="task-number">
                    ${l.nF}
                  </div>

                  <div class="task-percent">
                    ${l.pctNF}%
                  </div>

                </div>

              </div>

              <div class="bar">

                <div
                class="bar-fill"
                style="width:0;background:#22c55e"
                data-width="${l.pctNF}%">

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

    <!-- SECÇÕES -->

    <div class="panel"
    id="sec-${li}">

      <div class="panel-inner">

        <div class="panel-title">
          🏬 Detalhes por Secção
        </div>

        <div class="sec-grid">

          ${secHtml}

        </div>

      </div>

    </div>

    `;

  });

  var alert = `

  <div class="alert-box">

    <div class="alert-icon">
      ⚠️
    </div>

    <div>

      <h3>
        Ação Recomendada
      </h3>

      <p>
        Contactar imediatamente os responsáveis das lojas críticas e acompanhar semanalmente as lojas com tendência crescente de tarefas abertas.
      </p>

    </div>

  </div>

  `;

  document.getElementById('app').innerHTML =

  kpis +

  topInfo +

  `

  <div class="table-wrapper">

    ${header}

    ${rows}

  </div>

  `

  +

  alert;

}

</script>

</body>
</html>
