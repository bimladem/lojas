<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f0f0; color: #222; font-size: 14px; }

.header {
  background: #fff; border-bottom: 3px solid #222;
  padding: 16px 28px; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.header h1 { font-size: 20px; color: #111; }
.header .sub { font-size: 12px; color: #777; margin-top: 3px; }
.periodo { padding: 5px 14px; background: #f7f7f7; border-left: 4px solid #555; border-radius: 2px; font-size: 13px; color: #333; }

.container { max-width: 1300px; margin: 24px auto; padding: 0 16px 48px; }

.legenda { font-size: 12px; color: #888; margin-bottom: 16px; padding: 10px 16px; background: #fff; border-radius: 6px; border: 1px solid #e8e8e8; display: flex; flex-wrap: wrap; gap: 14px; }

.tabela-wrap { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }

.tabela-header {
  display: grid;
  grid-template-columns: 85px 180px 240px 165px 165px 95px 95px;
  background: #222; color: #fff;
  padding: 12px 14px; gap: 10px; font-size: 13px; font-weight: 500; align-items: center;
}

.loja-bloco { border-top: 1px solid #e8e8e8; }

.loja-linha {
  display: grid;
  grid-template-columns: 85px 180px 240px 165px 165px 95px 95px;
  padding: 14px 14px; gap: 10px; align-items: center;
  background: #fff; transition: background 0.12s;
}
.loja-linha:hover { background: #fafafa; }

.cel-rank { text-align: center; }
.rank-num { font-size: 16px; font-weight: bold; }
.nivel-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; border: 1px solid; margin-top: 4px; }
.n1 { color: #27ae60; border-color: #27ae60; }
.n2 { color: #e65100; border-color: #e65100; }
.n3 { color: #b71c1c; border-color: #b71c1c; }

.cel-loja .nome { font-size: 14px; font-weight: bold; color: #111; }
.cel-loja .local { font-size: 12px; color: #666; margin-top: 2px; }

.cel-tarefas { text-align: center; }
.tarefas-val { font-size: 22px; font-weight: bold; color: #111; }

.toggle-btn {
  background: none; border: 1px solid #ccc; border-radius: 5px;
  padding: 6px 12px; font-size: 12px; cursor: pointer; color: #444;
  transition: all 0.15s; white-space: nowrap;
}
.toggle-btn:hover { background: #f0f0f0; }
.toggle-btn.open { background: #222; color: #fff; border-color: #222; }

.painel { display: none; border-top: 1px solid #e0e0e0; }
.painel.visible { display: block; }

.hist-painel, .sec-painel { background: #f9f9f9; padding: 16px 20px; }
.sec-table { width: 100%; border-collapse: collapse; }
.sec-table th, .sec-table td { padding: 8px 12px; border-bottom: 1px solid #eee; }
.sec-table th { background: #444; color: #fff; text-align: left; }
.sec-table td:not(:first-child) { text-align: center; font-weight: bold; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 Análise Semanal IM</h1>
    <div class="sub" id="sub-info">A carregar dados...</div>
  </div>
  <div class="periodo" id="periodo-label">—</div>
</div>

<div class="container">
  <div id="app"><div class="loading">⏳ A carregar dados...</div></div>
</div>

<script>
fetch('dados.json?t=' + Date.now())
  .then(r => r.json())
  .then(json => {
    const data = json.data || [];

    let lojas = data
      .filter(item => item.Loja && item['P Total'] !== undefined && !item.Secção)
      .map(item => {
        const pTotal = Number(item['P Total']) || 0;
        const pAberto = Number(item['P Aberto']) || 0;
        const pFechado = Number(item['P Fechado']) || 0;
        const npTotal = Number(item['NP Total']) || 0;
        const npAberto = Number(item['NP Aberto']) || 0;
        const npFechado = Number(item['NP Fechado']) || 0;

        const pctPAberto = pTotal > 0 ? Math.round(pAberto / pTotal * 100) : 0;
        const pctNPAberto = npTotal > 0 ? Math.round(npAberto / npTotal * 100) : 0;
        const pctPFechado = pTotal > 0 ? Math.round(pFechado / pTotal * 100) : 0;
        const pctNPFechado = npTotal > 0 ? Math.round(npFechado / npTotal * 100) : 0;

        const pctP = pctPAberto;
        const nivel = pctP <= 20 ? 1 : pctP <= 40 ? 2 : 3;

        return {
          loja: item.Loja,
          localidade: item['IM.Localidade'] || '',
          pTotal, pAberto, pFechado,
          npTotal, npAberto, npFechado,
          pctPAberto, pctNPAberto, pctPFechado, pctNPFechado,
          nivel,
          seccoes: []
        };
      });

    lojas.sort((a, b) => b.pAberto - a.pAberto);
    const topLojas = lojas.slice(0, 10);

    // Adicionar Secções
    data.forEach(item => {
      if (item.Secção && item.Loja) {
        const loja = topLojas.find(l => l.loja === item.Loja);
        if (loja) {
          const pAberto = Number(item['P Aberto']) || 0;
          const npAberto = Number(item['NP Aberto']) || 0;
          if (pAberto > 0 || npAberto > 0) {
            loja.seccoes.push({
              nome: (item.Secção || '').replace(/^IM\s+\d+\s+/, '').trim(),
              pAberto,
              npAberto
            });
          }
        }
      }
    });

    topLojas.forEach(l => l.seccoes.sort((a,b) => b.pAberto - a.pAberto));

    document.getElementById('sub-info').textContent = `Gerado hoje · ${topLojas.length} lojas`;
    document.getElementById('periodo-label').innerHTML = `📅 Período atual`;

    renderApp(topLojas);
  })
  .catch(err => {
    document.getElementById('app').innerHTML = `<div style="color:red;padding:30px;">Erro: ${err.message}</div>`;
  });

function renderApp(lojas) {
  let html = `<div class="legenda">🔴 Top 3 críticas | 🟡 Em alerta</div>`;

  html += `<div class="tabela-wrap">`;

  // Header
  html += `<div class="tabela-header">
    <div># / Nível</div>
    <div>Loja / Localidade</div>
    <div style="text-align:center">Tarefas em Aberto</div>
    <div style="text-align:center">% P Aberto</div>
    <div style="text-align:center">% NP Aberto</div>
    <div style="text-align:center">Histórico</div>
    <div style="text-align:center">Secções</div>
  </div>`;

  lojas.forEach((l, li) => {
    const emoji = li < 3 ? '🔴' : '🟡';
    const nc = l.nivel === 1 ? 'n1' : l.nivel === 2 ? 'n2' : 'n3';

    html += `
    <div class="loja-bloco">
      <div class="loja-linha">
        <div class="cel-rank">
          <div class="rank-num">${emoji} ${li+1}</div>
          <span class="nivel-badge ${nc}">Nível ${l.nivel}</span>
        </div>
        <div class="cel-loja">
          <div class="nome">${l.loja}</div>
          <div class="local">${l.localidade || '—'}</div>
        </div>
        <div style="text-align:center">
          <strong style="font-size:22px">${l.pAberto}</strong><br>
          <small>de ${l.pTotal}</small><br>
          <small>NP: ${l.npAberto}</small>
        </div>
        <div style="text-align:center">
          <strong style="color:${l.pctPAberto > 40 ? '#b71c1c' : l.pctPAberto > 20 ? '#e65100' : '#27ae60'}">${l.pctPAberto}%</strong>
        </div>
        <div style="text-align:center">
          <strong style="color:${l.pctNPAberto > 40 ? '#b71c1c' : l.pctNPAberto > 20 ? '#e65100' : '#27ae60'}">${l.pctNPAberto}%</strong>
        </div>
        <div style="text-align:center">
          <button class="toggle-btn" id="btnhist-${li}" onclick="toggleHist(${li})">▶ Histórico</button>
        </div>
        <div style="text-align:center">
          <button class="toggle-btn" id="btnsec-${li}" onclick="toggleSec(${li})">▶ Secções</button>
          <div style="font-size:11px;color:#555;margin-top:4px">${l.seccoes.length}</div>
        </div>
      </div>

      <!-- Histórico -->
      <div class="painel" id="hist-${li}">
        <div style="padding:20px; color:#777; text-align:center;">Histórico não disponível neste ficheiro</div>
      </div>

      <!-- Secções -->
      <div class="painel" id="sec-${li}">
        ${l.seccoes.length ? 
          `<table class="sec-table" style="width:100%">
            <thead><tr><th>Secção</th><th>P Aberto</th><th>NP Aberto</th></tr></thead>
            <tbody>${l.seccoes.map(s => `<tr><td>${s.nome}</td><td style="text-align:center">${s.pAberto}</td><td style="text-align:center">${s.npAberto}</td></tr>`).join('')}</tbody>
          </table>` : 
          '<div style="padding:20px;color:#aaa;text-align:center">Sem secções com tarefas em aberto</div>'}
      </div>
    </div>`;
  });

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

// Funções de toggle
function toggleHist(li) {
  const painel = document.getElementById('hist-' + li);
  const btn = document.getElementById('btnhist-' + li);
  painel.classList.toggle('visible');
  btn.textContent = painel.classList.contains('visible') ? '▼ Fechar' : '▶ Histórico';
}

function toggleSec(li) {
  const painel = document.getElementById('sec-' + li);
  const btn = document.getElementById('btnsec-' + li);
  painel.classList.toggle('visible');
  btn.textContent = painel.classList.contains('visible') ? '▼ Fechar' : '▶ Secções';
}
</script>
</body>
</html>
