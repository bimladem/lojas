<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#ffffff;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
  --purple:#8b5cf6;
  --red:#ef4444;
  --green:#22c55e;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#f5f5f7;
  color:var(--text);
}

/* HEADER */

.header{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:24px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:14px;
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:22px;
}

.header h1{
  font-size:26px;
  font-weight:800;
}

.header p{
  margin-top:4px;
  color:var(--muted);
}

.periodo{
  background:rgba(139,92,246,.1);
  color:var(--purple);
  padding:10px 18px;
  border-radius:12px;
  font-weight:700;
}

/* MAIN */

.main{
  padding:30px;
  max-width:1800px;
  margin:auto;
}

/* KPIS */

.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:28px;
}

.kpi{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px;
}

.kpi-title{
  font-size:13px;
  font-weight:700;
  margin-bottom:16px;
  color:#555;
}

.kpi-value{
  font-size:42px;
  font-weight:800;
}

.kpi-sub{
  margin-top:8px;
  color:var(--muted);
}

/* TABLE */

.table{
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
}

.table-head{
  display:grid;
  grid-template-columns:
  120px
  220px
  repeat(6,150px)
  160px
  240px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
}

.head-cell{
  padding:22px 12px;
  text-align:center;
  font-size:13px;
  font-weight:800;
  color:#555;
}

.row{
  display:grid;
  grid-template-columns:
  120px
  220px
  repeat(6,150px)
  160px
  240px;
  border-bottom:1px solid var(--border);
  align-items:center;
}

.cell{
  padding:24px 12px;
  text-align:center;
}

/* RANK */

.rank-number{
  font-size:34px;
  font-weight:800;
}

.rank-badge{
  margin-top:10px;
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.n1{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

.n2{
  background:rgba(251,146,60,.12);
  color:#fb923c;
}

.n3{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

/* LOJA */

.loja{
  font-size:24px;
  font-weight:800;
}

.local{
  margin-top:8px;
  color:var(--muted);
  font-size:13px;
}

/* NUMBERS */

.metric-number{
  font-size:34px;
  font-weight:800;
}

.metric-title{
  font-size:12px;
  color:#666;
  margin-bottom:10px;
  font-weight:700;
}

.metric-percent{
  margin-top:8px;
  font-size:13px;
  color:#666;
}

.bar{
  width:100%;
  height:8px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin-top:12px;
}

.fill{
  height:100%;
}

.red{
  background:var(--red);
}

.green{
  background:var(--green);
}

/* TREND */

.trend-up{
  color:var(--red);
}

.trend-down{
  color:var(--green);
}

.trend-arrow{
  font-size:32px;
  font-weight:800;
}

.trend-value{
  margin-top:10px;
  font-size:26px;
  font-weight:800;
}

.trend-reason{
  margin-top:12px;
  font-size:12px;
  line-height:1.5;
  color:#666;
}

/* BUTTONS */

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
}

.btn{
  border:1px solid rgba(139,92,246,.2);
  background:#fff;
  color:var(--purple);
  padding:10px 16px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  background:rgba(139,92,246,.08);
}

/* PANELS */

.panel{
  background:#fafafa;
  padding:30px;
  border-bottom:1px solid var(--border);
}

/* HISTORY */

.history-table{
  width:100%;
  border-collapse:collapse;
}

.history-table th{
  background:#fff;
  padding:14px;
  border:1px solid var(--border);
  font-size:13px;
}

.history-table td{
  padding:14px;
  border:1px solid var(--border);
  text-align:center;
}

/* SECTIONS */

.sections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:22px;
}

.section-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:20px;
}

.section-group{
  margin-bottom:22px;
}

.section-label{
  font-size:12px;
  text-transform:uppercase;
  color:#666;
  font-weight:800;
  margin-bottom:14px;
}

.section-line{
  margin-bottom:16px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:100px;
  font-size:20px;
}

@media(max-width:1700px){

  .table{
    overflow:auto;
  }

  .table-head,
  .row{
    min-width:1800px;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-left">

    <div class="logo">
      📊
    </div>

    <div>
      <h1>Análise Semanal</h1>
      <p id="subInfo">Carregando...</p>
    </div>

  </div>

  <div class="periodo" id="periodo">
    —
  </div>

</header>

<main class="main">

  <div id="app">

    <div class="loading">
      ⏳ Carregando dados...
    </div>

  </div>

</main>

<script>

fetch('dados.json?t=' + Date.now())

.then(r => r.json())

.then(json => {

  const data = json.data || [];

  const semanas = [];

  data.forEach(i=>{

    const s = String(i.Semana || '').trim();

    if(s && !semanas.includes(s)){
      semanas.push(s);
    }

  });

  const ultima = semanas[semanas.length-1] || '';

  const lojas = data

  .filter(i =>
    i.Loja &&
    !i.Secção &&
    String(i.Semana).trim() === ultima
  )

  .map(i=>{

    const pTotal = Number(i['P Total']) || 0;
    const pAberto = Number(i['P Aberto']) || 0;
    const pFechado = Number(i['P Fechado']) || 0;

    const npTotal = Number(i['NP Total']) || 0;
    const npAberto = Number(i['NP Aberto']) || 0;
    const npFechado = Number(i['NP Fechado']) || 0;

    return {

      loja:String(i.Loja).trim(),

      local:String(
        i['Resumo contactos.Localidade']
        ||
        i['IM.Localidade']
        ||
        ''
      ).trim(),

      pTotal,
      pAberto,
      pFechado,

      npTotal,
      npAberto,
      npFechado,

      pctPA:
        pTotal > 0
        ? ((pAberto/pTotal)*100).toFixed(1)
        : '0.0',

      pctPF:
        pTotal > 0
        ? ((pFechado/pTotal)*100).toFixed(1)
        : '0.0',

      pctNPA:
        npTotal > 0
        ? ((npAberto/npTotal)*100).toFixed(1)
        : '0.0',

      pctNPF:
        npTotal > 0
        ? ((npFechado/npTotal)*100).toFixed(1)
        : '0.0',

      historico:[],
      seccoes:[],

      nivel:
        pAberto <= 20
        ? 1
        : pAberto <= 40
        ? 2
        : 3

    };

  });

  lojas.sort((a,b)=>b.pAberto-a.pAberto);

  const top = lojas.slice(0,10);

  const ids = {};

  top.forEach(l=>{
    ids[l.loja] = true;
  });

  data.forEach(i=>{

    if(
      i.Loja &&
      !i.Secção &&
      ids[String(i.Loja).trim()]
    ){

      const loja = top.find(
        x => x.loja === String(i.Loja).trim()
      );

      if(loja){

        loja.historico.push({

          semana:String(i.Semana).trim(),

          pAberto:Number(i['P Aberto']) || 0,
          pFechado:Number(i['P Fechado']) || 0,

          npAberto:Number(i['NP Aberto']) || 0,
          npFechado:Number(i['NP Fechado']) || 0

        });

      }

    }

  });

  data.forEach(i=>{

    if(
      i.Secção &&
      ids[String(i.Loja).trim()]
    ){

      const loja = top.find(
        x => x.loja === String(i.Loja).trim()
      );

      if(loja){

        const nome = String(i.Secção)
        .replace(/^IM\s+\d+\s+/,'')
        .trim();

        if(nome.toLowerCase() !== 'admin'){

          const pTotal = Number(i['P Total']) || 0;
          const pAberto = Number(i['P Aberto']) || 0;
          const pFechado = Number(i['P Fechado']) || 0;

          const npTotal = Number(i['NP Total']) || 0;
          const npAberto = Number(i['NP Aberto']) || 0;
          const npFechado = Number(i['NP Fechado']) || 0;

          loja.seccoes.push({

            nome,

            pAberto,
            pFechado,

            npAberto,
            npFechado,

            pctPA:
              pTotal > 0
              ? ((pAberto/pTotal)*100).toFixed(1)
              : '0.0',

            pctPF:
              pTotal > 0
              ? ((pFechado/pTotal)*100).toFixed(1)
              : '0.0',

            pctNPA:
              npTotal > 0
              ? ((npAberto/npTotal)*100).toFixed(1)
              : '0.0',

            pctNPF:
              npTotal > 0
              ? ((npFechado/npTotal)*100).toFixed(1)
              : '0.0'

          });

        }

      }

    }

  });

  top.forEach(l=>{

    const hist = l.historico.slice(-2);

    if(hist.length === 2){

      const atual = hist[1].pAberto;
      const anterior = hist[0].pAberto;

      l.diff = atual - anterior;

      if(l.diff > 0){

        l.motivo =
        'As tarefas programadas abertas aumentaram em comparação com a semana anterior.';

      }else if(l.diff < 0){

        l.motivo =
        'As tarefas programadas abertas diminuíram em comparação com a semana anterior.';

      }else{

        l.motivo =
        'Não houve alteração nas tarefas programadas abertas.';

      }

    }else{

      l.diff = 0;

      l.motivo =
      'Sem histórico suficiente para análise.';

    }

  });

  document.getElementById('subInfo').textContent =
  'Gerado hoje · ' + top.length + ' lojas';

  document.getElementById('periodo').textContent =
  '📅 ' + ultima;

  render(top,ultima);

});

function render(lojas,ultima){

  let html = `

  <div class="kpis">

    <div class="kpi">
      <div class="kpi-title">Lojas Críticas</div>
      <div class="kpi-value">${lojas.filter((l,i)=>i<3).length}</div>
      <div class="kpi-sub">Top 3 mais críticas</div>
    </div>

    <div class="kpi">
      <div class="kpi-title">Lojas em Alerta</div>
      <div class="kpi-value">${lojas.filter((l,i)=>i>=3).length}</div>
      <div class="kpi-sub">Necessitam atenção</div>
    </div>

    <div class="kpi">
      <div class="kpi-title">Lojas a Piorar</div>
      <div class="kpi-value" style="color:#ef4444">
        ${lojas.filter(l=>l.diff>0).length}
      </div>
      <div class="kpi-sub">Comparação semanal</div>
    </div>

    <div class="kpi">
      <div class="kpi-title">Lojas a Melhorar</div>
      <div class="kpi-value" style="color:#22c55e">
        ${lojas.filter(l=>l.diff<0).length}
      </div>
      <div class="kpi-sub">Comparação semanal</div>
    </div>

  </div>

  <div class="table">

    <div class="table-head">

      <div class="head-cell">RANK</div>
      <div class="head-cell">LOJA</div>

      <div class="head-cell">PROGRAMADAS TOTAIS</div>
      <div class="head-cell">PROGRAMADAS ABERTAS</div>
      <div class="head-cell">PROGRAMADAS FECHADAS</div>

      <div class="head-cell">NÃO PROGRAMADAS TOTAIS</div>
      <div class="head-cell">NÃO PROGRAMADAS ABERTAS</div>
      <div class="head-cell">NÃO PROGRAMADAS FECHADAS</div>

      <div class="head-cell">TENDÊNCIA</div>
      <div class="head-cell">AÇÕES</div>

    </div>

  `;

  lojas.forEach((l,index)=>{

    const badge =
      l.nivel === 1
      ? 'n1'
      : l.nivel === 2
      ? 'n2'
      : 'n3';

    const trendArrow =
      l.diff > 0
      ? '▲'
      : l.diff < 0
      ? '▼'
      : '→';

    const trendClass =
      l.diff > 0
      ? 'trend-up'
      : l.diff < 0
      ? 'trend-down'
      : '';

    html += `

    <div class="row">

      <div class="cell">

        <div class="rank-number">
          ${index+1}
        </div>

        <div class="rank-badge ${badge}">
          N${l.nivel}
        </div>

      </div>

      <div class="cell">

        <div>

          <div class="loja">
            ${l.loja}
          </div>

          <div class="local">
            ${l.local}
          </div>

        </div>

      </div>

      ${metricBox(
        'Total',
        l.pTotal,
        100,
        'green'
      )}

      ${metricBox(
        'Abertas',
        l.pAberto,
        l.pctPA,
        'red'
      )}

      ${metricBox(
        'Fechadas',
        l.pFechado,
        l.pctPF,
        'green'
      )}

      ${metricBox(
        'Total',
        l.npTotal,
        100,
        'green'
      )}

      ${metricBox(
        'Abertas',
        l.npAberto,
        l.pctNPA,
        'red'
      )}

      ${metricBox(
        'Fechadas',
        l.npFechado,
        l.pctNPF,
        'green'
      )}

      <div class="cell">

        <div class="${trendClass}">

          <div class="trend-arrow">
            ${trendArrow}
          </div>

          <div class="trend-value">
            ${Math.abs(l.diff)}
          </div>

          <div class="trend-reason">
            ${l.motivo}
          </div>

        </div>

      </div>

      <div class="cell">

        <div class="actions">

          <button class="btn">
            Histórico
          </button>

          <button class="btn">
            Secções
          </button>

        </div>

      </div>

    </div>

    <div class="panel">

      <table class="history-table">

        <thead>

          <tr>

            <th>Semana</th>

            <th>Programadas Abertas</th>
            <th>Programadas Fechadas</th>

            <th>Não Programadas Abertas</th>
            <th>Não Programadas Fechadas</th>

          </tr>

        </thead>

        <tbody>

          ${l.historico.map(h=>`

            <tr>

              <td>${h.semana}</td>

              <td>${h.pAberto}</td>
              <td>${h.pFechado}</td>

              <td>${h.npAberto}</td>
              <td>${h.npFechado}</td>

            </tr>

          `).join('')}

        </tbody>

      </table>

      <br><br>

      <div class="sections-grid">

        ${l.seccoes.map(s=>`

          <div class="section-card">

            <div class="section-title">
              ${s.nome}
            </div>

            <div class="section-group">

              <div class="section-label">
                Programadas
              </div>

              ${sectionLine(
                'Abertas',
                s.pAberto,
                s.pctPA,
                'red'
              )}

              ${sectionLine(
                'Fechadas',
                s.pFechado,
                s.pctPF,
                'green'
              )}

            </div>

            <div class="section-group">

              <div class="section-label">
                Não Programadas
              </div>

              ${sectionLine(
                'Abertas',
                s.npAberto,
                s.pctNPA,
                'red'
              )}

              ${sectionLine(
                'Fechadas',
                s.npFechado,
                s.pctNPF,
                'green'
              )}

            </div>

          </div>

        `).join('')}

      </div>

    </div>

    `;

  });

  html += `</div>`;

  document.getElementById('app').innerHTML = html;

}

function metricBox(title,value,pct,color){

  return `

  <div class="cell">

    <div>

      <div class="metric-title">
        ${title}
      </div>

      <div class="metric-number">
        ${value}
      </div>

      <div class="metric-percent">
        ${pct}%
      </div>

      <div class="bar">

        <div
          class="fill ${color}"
          style="width:${pct}%">
        </div>

      </div>

    </div>

  </div>

  `;

}

function sectionLine(title,value,pct,color){

  return `

  <div class="section-line">

    <div class="section-head">

      <span>${title}</span>

      <strong>
        ${value} (${pct}%)
      </strong>

    </div>

    <div class="bar">

      <div
        class="fill ${color}"
        style="width:${pct}%">
      </div>

    </div>

  </div>

  `;

}

</script>

</body>
</html>
