<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, sans-serif;
  background: #f0f0f0;
  color: #222;
  font-size: 14px;
}

.header {
  background: #fff;
  border-bottom: 3px solid #111;
  padding: 16px 28px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.10);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

.header h1 { font-size: 21px; color: #111; letter-spacing: -0.3px; }
.header .sub { font-size: 12px; color: #888; margin-top: 3px; }

.periodo {
  padding: 6px 16px;
  background: #f5f5f5;
  border-left: 4px solid #333;
  border-radius: 3px;
  font-size: 13px;
  color: #333;
  font-weight: 500;
}

.container {
  max-width: 1300px;
  margin: 24px auto;
  padding: 0 16px 56px;
}

.loading {
  text-align: center;
  padding: 80px 20px;
  color: #aaa;
  font-size: 15px;
}

.legenda {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  font-size: 12px;
  color: #777;
  background: #fff;
  border-radius: 8px;
  border: 1px solid #e8e8e8;
  padding: 11px 18px;
  margin-bottom: 16px;
}

.tabela-wrap {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 1px 6px rgba(0,0,0,.09);
  overflow: hidden;
}

.tabela-header {
  display: grid;
  grid-template-columns: 90px 190px 1fr 150px 150px 130px 130px;
  background: #111;
  color: #fff;
  padding: 11px 16px;
  gap: 10px;
  font-size: 12px;
  font-weight: 500;
  align-items: center;
}

.loja-bloco { border-top: 1px solid #efefef; }

.loja-linha {
  display: grid;
  grid-template-columns: 90px 190px 1fr 150px 150px 130px 130px;
  padding: 14px 16px;
  gap: 10px;
  align-items: center;
  background: #fff;
  transition: background 0.1s;
}

.loja-linha:hover { background: #fafafa; }

.cel-rank { text-align: center; }

.rank-num {
  font-size: 17px;
  font-weight: 700;
  color: #111;
}

.nivel-badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  margin-top: 5px;
}

.n1 { background: #e8f8f0; color: #1a8a4a; border: 1px solid #a3d9b8; }
.n2 { background: #fff4ec; color: #c85000; border: 1px solid #f5b88a; }
.n3 { background: #fdecea; color: #b71c1c; border: 1px solid #f5a5a0; }

.cel-loja .nome { font-size: 14px; font-weight: 700; color: #111; }
.cel-loja .local { font-size: 12px; color: #888; margin-top: 3px; }

.cel-tarefas { text-align: center; }

.t-val {
  font-size: 26px;
  font-weight: 700;
  color: #111;
  line-height: 1;
}

.t-sub { font-size: 11px; color: #999; margin-top: 3px; }
.t-np { font-size: 12px; color: #555; margin-top: 6px; }

.cel-pct { text-align: center; }

.pct-val {
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
}

.pct-lbl { font-size: 11px; color: #999; margin-top: 2px; }

.toggle-btn {
  width: 100%;
  background: #f5f5f5;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 12px;
  cursor: pointer;
  color: #444;
  font-weight: 500;
  transition: all 0.15s;
}

.toggle-btn:hover { background: #ebebeb; border-color: #bbb; }
.toggle-btn.open { background: #111; color: #fff; border-color: #111; }

/* ESSENCIAL: painel escondido e painel aberto */
.painel {
  display: none;
  background: #fafafa;
  border-top: 1px solid #e5e5e5;
  padding: 16px;
}

.painel.visible {
  display: block;
}

/* tabela das secções */
.sec-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.sec-table th {
  background: #333;
  color: white;
  text-align: left;
  padding: 10px;
}

.sec-table td {
  padding: 10px;
  border-top: 1px solid #ddd;
}

.sec-table td:nth-child(2),
.sec-table td:nth-child(3) {
  text-align: center;
  font-weight: 600;
}

/* responsivo */
@media (max-width: 1000px) {
  .tabela-header,
  .loja-linha {
    grid-template-columns: 70px 1fr 120px 120px;
  }

  .tabela-header div:nth-child(5),
  .tabela-header div:nth-child(6),
  .tabela-header div:nth-child(7),
  .loja-linha div:nth-child(5),
  .loja-linha div:nth-child(6),
  .loja-linha div:nth-child(7) {
    display: none;
  }
}
</style>
</head>

<body>

<div class="header">
  <div>
    <h1>📊 Análise Semanal IM</h1>
    <div class="sub" id="sub-info">A carregar dados...</div>
  </div>
  <div class="periodo" id="periodo-label">—</div>
</div>

<div class="container">
  <div id="app"><div class="loading">⏳ A carregar dados...</div></div>
</div>

<script>
fetch('dados.json?t=' + Date.now())
  .then(r => r.json())
  .then(json => {
    const data = json.data || [];

    // === DETECTAR A SEMANA MAIS RECENTE ===
    const semanasValidas = data
      .map(i => i.Semana)
      .filter(s => s !== undefined && s !== null && String(s).trim() !== "")
      .map(s => String(s).trim());

    // tenta ordenar como texto (caso seja "2025-W12" ou "Semana 12")
    // se for número simples funciona também
    let ultimaSemana = "";
    if (semanasValidas.length > 0) {
      ultimaSemana = semanasValidas.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))[semanasValidas.length - 1];
    }

    // === FILTRAR LOJAS APENAS DA ÚLTIMA SEMANA ===
    let lojas = data
      .filter(item =>
        item.Loja &&
        item['P Total'] !== undefined &&
        !item.Secção &&
        String(item.Semana).trim() === ultimaSemana
      )
      .map(item => {
        const pTotal = Number(item['P Total']) || 0;
        const pAberto = Number(item['P Aberto']) || 0;
        const pFechado = Number(item['P Fechado']) || 0;
        const npTotal = Number(item['NP Total']) || 0;
        const npAberto = Number(item['NP Aberto']) || 0;
        const npFechado = Number(item['NP Fechado']) || 0;

        const pctPAberto = pTotal > 0 ? Math.round(pAberto / pTotal * 100) : 0;
        const pctNPAberto = npTotal > 0 ? Math.round(npAberto / npTotal * 100) : 0;

        const nivel = pctPAberto <= 20 ? 1 : pctPAberto <= 40 ? 2 : 3;

        return {
          loja: item.Loja,
          localidade: item['IM.Localidade'] || '',
          pTotal, pAberto, pFechado,
          npTotal, npAberto, npFechado,
          pctPAberto, pctNPAberto,
          nivel,
          seccoes: []
        };
      });

    // ordenar por pior desempenho (mais P Aberto)
    lojas.sort((a, b) => b.pAberto - a.pAberto);

    // Top 10 (ou menos)
    const topLojas = lojas.slice(0, 10);

    // === CARREGAR SECÇÕES PARA AS TOP LOJAS ===
    data.forEach(item => {
      if (item.Secção && item.Loja && String(item.Semana).trim() === ultimaSemana) {
        const loja = topLojas.find(l => l.loja === item.Loja);
        if (loja) {
          const pAberto = Number(item['P Aberto']) || 0;
          const npAberto = Number(item['NP Aberto']) || 0;

          if (pAberto > 0 || npAberto > 0) {
            const nome = (item.Secção || '').replace(/^IM\s+\d+\s+/, '').trim();
            if (nome.toLowerCase() !== 'admin') {
              loja.seccoes.push({ nome, pAberto, npAberto });
            }
          }
        }
      }
    });

    topLojas.forEach(l => l.seccoes.sort((a, b) => b.pAberto - a.pAberto));

    // Renderizar
    document.getElementById('sub-info').textContent =
      `Última semana · ${topLojas.length} lojas analisadas`;

    document.getElementById('periodo-label').innerHTML =
      `📅 <strong>${ultimaSemana || '—'}</strong>`;

    renderApp(topLojas);
  })
  .catch(err => {
    document.getElementById('app').innerHTML =
      `<div style="color:#b71c1c;padding:40px;text-align:center">
        ❌ Erro: ${err.message}
      </div>`;
  });

function renderApp(lojas) {
  let html = `<div class="legenda">
    🔴 Top 3 críticas | 🟡 Restantes | Apenas lojas da última semana
  </div>`;

  html += `<div class="tabela-wrap">`;

  html += `<div class="tabela-header">
    <div># / Nível</div>
    <div>Loja / Localidade</div>
    <div style="text-align:center">Tarefas em Aberto</div>
    <div style="text-align:center">% P Aberto</div>
    <div style="text-align:center">% NP Aberto</div>
    <div style="text-align:center">Histórico</div>
    <div style="text-align:center">Secções</div>
  </div>`;

  lojas.forEach((l, li) => {
    const emoji = li < 3 ? '🔴' : '🟡';
    const nc = l.nivel === 1 ? 'n1' : l.nivel === 2 ? 'n2' : 'n3';

    html += `
    <div class="loja-bloco">
      <div class="loja-linha">
        <div class="cel-rank">
          <div class="rank-num">${emoji} ${li + 1}</div>
          <span class="nivel-badge ${nc}">Nível ${l.nivel}</span>
        </div>

        <div class="cel-loja">
          <div class="nome">${l.loja}</div>
          <div class="local">${l.localidade || '—'}</div>
        </div>

        <div class="cel-tarefas">
          <div class="t-val">${l.pAberto}</div>
          <div class="t-sub">de ${l.pTotal}</div>
          <div class="t-np">NP: <strong>${l.npAberto}</strong></div>
        </div>

        <div class="cel-pct">
          <div class="pct-val" style="color:${corPct(l.pctPAberto)}">${l.pctPAberto}%</div>
          <div class="pct-lbl">P aberto</div>
        </div>

        <div class="cel-pct">
          <div class="pct-val" style="color:${corPct(l.pctNPAberto)}">${l.pctNPAberto}%</div>
          <div class="pct-lbl">NP aberto</div>
        </div>

        <div style="text-align:center">
          <button class="toggle-btn" id="btnhist-${li}" onclick="toggleHist(${li})">
            ▶ Histórico
          </button>
        </div>

        <div style="text-align:center">
          <button class="toggle-btn" id="btnsec-${li}" onclick="toggleSec(${li})">
            ▶ Secções (${l.seccoes.length})
          </button>
        </div>
      </div>

      <div class="painel" id="hist-${li}">
        <div style="color:#777;text-align:center">
          Histórico ainda não disponível (precisa do ficheiro com semanas anteriores).
        </div>
      </div>

      <div class="painel" id="sec-${li}">
        ${l.seccoes.length ?
          `<table class="sec-table">
            <thead>
              <tr>
                <th>Secção</th>
                <th>P Aberto</th>
                <th>NP Aberto</th>
              </tr>
            </thead>
            <tbody>
              ${l.seccoes.map(s => `
                <tr>
                  <td>${s.nome}</td>
                  <td>${s.pAberto}</td>
                  <td>${s.npAberto}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>`
          :
          `<div style="color:#aaa;text-align:center;padding:10px">
            Sem secções com tarefas em aberto
          </div>`
        }
      </div>
    </div>`;
  });

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

function corPct(v) {
  if (v <= 20) return '#1a8a4a';
  if (v <= 40) return '#c85000';
  return '#b71c1c';
}

function toggleHist(li) {
  const p = document.getElementById('hist-' + li);
  const b = document.getElementById('btnhist-' + li);

  p.classList.toggle('visible');
  b.classList.toggle('open');
  b.textContent = p.classList.contains('visible') ? '▼ Fechar' : '▶ Histórico';
}

function toggleSec(li) {
  const p = document.getElementById('sec-' + li);
  const b = document.getElementById('btnsec-' + li);

  p.classList.toggle('visible');
  b.classList.toggle('open');

  const count = b.textContent.match(/\((\d+)\)/);
  b.textContent = p.classList.contains('visible')
    ? '▼ Fechar'
    : b.textContent.replace('▼ Fechar', '▶ Secções');
}
</script>

</body>
</html>
