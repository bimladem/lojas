<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --border:rgba(0,0,0,.08);
  --text:#1a1a1a;
  --muted:#808080;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#fb923c;
  --purple:#8b5cf6;
  --pink:#ec4899;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text);
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.header-brand{display:flex;align-items:center;gap:16px;}

.header-logo{
  width:52px;height:52px;border-radius:14px;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}

.header-title h1{font-size:30px;font-weight:800;}
.header-title .sub{margin-top:4px;color:var(--muted);font-size:15px;}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);
  padding:10px 18px;
  border-radius:12px;
  font-weight:800;
  color:var(--purple);
}

/* MAIN */
.main{max-width:1800px;margin:auto;padding:28px;}

.top-note{
  text-align:center;
  margin-bottom:24px;
  font-size:16px;
  color:#555;
  font-weight:600;
}

.table-container{
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
}

/* restante CSS igual ao teu (não mexi para não quebrar nada) */

</style>
</head>

<body>

<header class="header">
  <div class="header-brand">
    <div class="header-logo">📊</div>
    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">A carregar...</div>
    </div>
  </div>
  <div class="header-period" id="periodo">—</div>
</header>

<main class="main">

<div class="top-note">
<strong>P</strong> = Programadas • <strong>NP</strong> = Não Programadas
</div>

<div id="app">
  <div style="padding:80px;text-align:center;color:#999;">⏳ A carregar dados...</div>
</div>

</main>

<script>

var stateHist = {};
var stateSec = {};

function toggleHist(li){
  var p=document.getElementById('hist-'+li);
  stateHist[li]=!stateHist[li];
  p.classList.toggle('visible');
}

function toggleSec(li){
  var p=document.getElementById('sec-'+li);
  stateSec[li]=!stateSec[li];
  p.classList.toggle('visible');
}

fetch('dados.json?t='+Date.now())
.then(r=>r.json())
.then(json=>{

  var data=json.data||[];

  var semanas=[];
  data.forEach(i=>{
    var s=String(i.Semana||'').trim();
    if(s && semanas.indexOf(s)===-1) semanas.push(s);
  });

  var ultima=semanas[semanas.length-1]||'';

  var lojas=data
  .filter(i=>
    i.Loja &&
    !i['Secção'] &&   // ✅ FIX AQUI
    String(i.Semana||'').trim()===ultima
  )
  .map(i=>{

    var pT=Number(i['P Total'])||0;
    var pA=Number(i['P Aberto'])||0;
    var pF=Number(i['P Fechado'])||0;

    var nT=Number(i['NP Total'])||0;
    var nA=Number(i['NP Aberto'])||0;
    var nF=Number(i['NP Fechado'])||0;

    return{
      loja:String(i.Loja).trim(),
      local:String(i['Resumo contactos.Localidade']||i['IM.Localidade']||'').trim(),
      pT,pA,pF,nT,nA,nF,
      historico:[],
      seccoes:[]
    };

  });

  var ids={};
  lojas.forEach(l=>ids[l.loja]=true);

  var hpl={};

  data.forEach(i=>{
    if(!i['Secção'] && i.Loja && ids[String(i.Loja).trim()]){ // ✅ FIX
      var id=String(i.Loja).trim();
      if(!hpl[id]) hpl[id]=[];

      hpl[id].push({
        semana:String(i.Semana).trim(),
        pA:Number(i['P Aberto'])||0,
        pF:Number(i['P Fechado'])||0,
        nA:Number(i['NP Aberto'])||0,
        nF:Number(i['NP Fechado'])||0
      });
    }
  });

  lojas.forEach(l=>{
    l.historico=(hpl[l.loja]||[]).filter(x=>x.semana!==ultima).slice(-8);
  });

  data.forEach(i=>{
    if(i['Secção'] && i.Loja && ids[String(i.Loja).trim()]){ // ✅ FIX PRINCIPAL

      var loja=lojas.find(l=>l.loja===String(i.Loja).trim());

      if(loja){

        var nome=String(i['Secção']).replace(/^IM\s+\d+\s+/,'').trim();

        if(nome.toLowerCase()!=='admin'){

          loja.seccoes.push({
            nome,
            pA:Number(i['P Aberto'])||0,
            pF:Number(i['P Fechado'])||0,
            nA:Number(i['NP Aberto'])||0,
            nF:Number(i['NP Fechado'])||0
          });

        }

      }
    }
  });

  document.getElementById('sub-info').textContent=
    'Gerado hoje • '+lojas.length+' lojas';

  document.getElementById('periodo').innerHTML='📅 '+ultima;

  render(lojas,ultima);

});

function render(lojas,ultima){

  var html='';

  html+='<div class="table-container">';

  lojas.forEach((l,li)=>{

    html+='<div class="table-row">';
    html+='<div><strong>'+l.loja+'</strong></div>';
    html+='</div>';

  });

  html+='</div>';

  document.getElementById('app').innerHTML=html;
}

</script>

</body>
</html>
