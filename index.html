<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --border:rgba(0,0,0,.08);
  --text:#1a1a1a;
  --muted:#808080;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#fb923c;
  --purple:#8b5cf6;
  --pink:#ec4899;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text);
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:52px;
  height:52px;
  border-radius:14px;
  background:var(--grad);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.header-title h1{
  font-size:30px;
  font-weight:800;
}

.header-title .sub{
  margin-top:4px;
  color:var(--muted);
  font-size:15px;
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);
  padding:10px 18px;
  border-radius:12px;
  font-weight:800;
  color:var(--purple);
  font-size:15px;
}

.main{
  max-width:1900px;
  margin:auto;
  padding:28px;
}

.top-note{
  text-align:center;
  margin-bottom:24px;
  font-size:16px;
  color:#555;
  font-weight:600;
}

.table-container{
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
}

.table-header{
  display:grid;
  grid-template-columns:
    90px
    1.6fr
    180px
    120px
    120px
    120px
    120px
    120px
    120px
    180px
    120px
    120px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  font-size:14px;
  font-weight:800;
  color:#666;
  text-transform:uppercase;
}

.table-header div{
  padding:22px 10px;
  text-align:center;
}

.table-row{
  border-bottom:1px solid var(--border);
}

.row-main{
  display:grid;
  grid-template-columns:
    90px
    1.6fr
    180px
    120px
    120px
    120px
    120px
    120px
    120px
    180px
    120px
    120px;
  align-items:center;
  padding:20px 10px;
  transition:.2s;
}

.row-main:hover{
  background:rgba(139,92,246,.03);
}

.cell{
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.rank{
  flex-direction:column;
  gap:8px;
}

.rank-num{
  font-size:32px;
  font-weight:800;
}

.rank-badge{
  padding:5px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.n1{
  background:rgba(239,68,68,.12);
  color:var(--red);
}

.n2{
  background:rgba(251,146,60,.12);
  color:var(--orange);
}

.n3{
  background:rgba(34,197,94,.12);
  color:var(--green);
}

.loja{
  flex-direction:column;
  gap:8px;
}

.loja strong{
  font-size:22px;
}

.loja span{
  color:var(--muted);
  font-size:15px;
}

.metric{
  flex-direction:column;
  gap:6px;
}

.metric strong{
  font-size:22px;
}

.metric span{
  font-size:14px;
  font-weight:700;
}

.red{
  color:var(--red);
}

.green{
  color:var(--green);
}

.gray{
  color:#777;
}

.trend{
  flex-direction:column;
  gap:8px;
}

.trend-box{
  padding:12px;
  border-radius:14px;
  min-width:140px;
}

.trend-positive{
  background:rgba(34,197,94,.12);
}

.trend-negative{
  background:rgba(239,68,68,.12);
}

.trend-neutral{
  background:rgba(0,0,0,.04);
}

.trend-icon{
  font-size:26px;
  font-weight:800;
}

.trend-value{
  font-size:24px;
  font-weight:800;
  margin-top:4px;
}

.trend-text{
  margin-top:8px;
  font-size:12px;
  line-height:1.5;
  font-weight:700;
}

.btn{
  background:#fff;
  border:1px solid rgba(139,92,246,.25);
  color:var(--purple);
  border-radius:12px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:800;
  transition:.2s;
  font-size:14px;
}

.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  padding:24px;
  background:rgba(139,92,246,.03);
  border-top:1px solid var(--border);
}

.detail-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

.detail-table th,
.detail-table td{
  padding:16px;
  border-bottom:1px solid var(--border);
  text-align:center;
  font-size:15px;
}

.detail-table th{
  background:#fafafa;
  font-size:14px;
  font-weight:800;
}

.current{
  background:rgba(139,92,246,.06);
  font-weight:800;
}

.note{
  margin-top:26px;
  padding:22px;
  border-radius:18px;
  background:#fafafa;
  border:1px solid var(--border);
  text-align:center;
  line-height:2;
  font-size:16px;
  color:#555;
}

</style>
</head>

<body>

<header class="header">

  <div class="header-brand">

    <div class="header-logo">📊</div>

    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">A carregar...</div>
    </div>

  </div>

  <div class="header-period" id="periodo">—</div>

</header>

<main class="main">

  <div class="top-note">
    <strong>P</strong> = Programadas •
    <strong>NP</strong> = Não Programadas
  </div>

  <div id="app">
    <div style="padding:80px;text-align:center;color:#999;">
      ⏳ A carregar dados...
    </div>
  </div>

</main>

<script>

var stateHist = {};

function toggleHist(li){

  var p=document.getElementById('hist-'+li);

  stateHist[li]=!stateHist[li];

  p.classList.toggle('visible');

}

fetch('dados.json?t='+Date.now())

.then(r=>r.json())

.then(json=>{

  var data=json.data||[];

  var semanas=[];

  data.forEach(i=>{

    var s=String(i.Semana||'').trim();

    if(s && semanas.indexOf(s)===-1){
      semanas.push(s);
    }

  });

  var ultima=semanas[semanas.length-1]||'';

  var lojas=data

  .filter(i=>
    i.Loja &&
    !String(i.Secção || '').trim() &&
    String(i.Semana||'').trim()===ultima
  )

  .map(i=>{

    var pT=Number(i['P Total'])||0;
    var pA=Number(i['P Aberto'])||0;
    var pF=Number(i['P Fechado'])||0;

    var nT=Number(i['NP Total'])||0;
    var nA=Number(i['NP Aberto'])||0;
    var nF=Number(i['NP Fechado'])||0;

    var pctFechadas =
      pT>0 ? (pF/pT*100) : 0;

    return{

      loja:String(i.Loja).trim(),

      local:String(
        i['IM.Localidade']
        || 'Sem localização'
      ).trim(),

      pT,pA,pF,nT,nA,nF,

      pctPTotal:'100.0',
      pctNPTotal:'100.0',

      pctPA:pT>0?(pA/pT*100).toFixed(1):'0.0',
      pctPF:pT>0?(pF/pT*100).toFixed(1):'0.0',

      pctNA:nT>0?(nA/nT*100).toFixed(1):'0.0',
      pctNF:nT>0?(nF/nT*100).toFixed(1):'0.0',

      nivel:
        pctFechadas >= 80
        ? 3
        : pctFechadas >= 50
        ? 2
        : 1,

      historico:[]

    };

  });

  lojas.sort((a,b)=>b.pF-a.pF);

  var ids={};

  lojas.forEach(l=>{
    ids[l.loja]=true;
  });

  var hpl={};

  data.forEach(i=>{

    if(
      !String(i.Secção || '').trim() &&
      i.Loja &&
      i.Semana &&
      ids[String(i.Loja).trim()]
    ){

      var id=String(i.Loja).trim();

      if(!hpl[id]){
        hpl[id]=[];
      }

      hpl[id].push({

        semana:String(i.Semana).trim(),

        pA:Number(i['P Aberto'])||0,
        pF:Number(i['P Fechado'])||0,

        nA:Number(i['NP Aberto'])||0,
        nF:Number(i['NP Fechado'])||0

      });

    }

  });

  lojas.forEach(l=>{

    var h=hpl[l.loja]||[];

    l.historico=h
      .filter(x=>x.semana!==ultima)
      .slice(-8);

    var u=h.slice(-2);

    l.diff =
      u.length===2
      ? u[1].pF-u[0].pF
      : 0;

  });

  document.getElementById('sub-info').textContent=
    lojas.length+' lojas';

  document.getElementById('periodo').innerHTML=
    '📅 '+ultima;

  render(lojas,ultima);

});

function render(lojas,ultima){

  var html='';

  html+='<div class="table-container">';

  html+='<div class="table-header">';
  html+='<div>Rank</div>';
  html+='<div>Loja</div>';
  html+='<div>Localização</div>';
  html+='<div>P Total</div>';
  html+='<div>P Aberto</div>';
  html+='<div>P Fechado</div>';
  html+='<div>NP Total</div>';
  html+='<div>NP Aberto</div>';
  html+='<div>NP Fechado</div>';
  html+='<div>Tendência</div>';
  html+='<div>Histórico</div>';
  html+='</div>';

  lojas.forEach((l,li)=>{

    var badge=
      l.nivel===1?'n1':
      l.nivel===2?'n2':'n3';

    var trendClass=
      l.diff>0
      ?'trend-positive'
      :l.diff<0
      ?'trend-negative'
      :'trend-neutral';

    var icon=
      l.diff>0
      ?'▲'
      :l.diff<0
      ?'▼'
      :'→';

    html+='<div class="table-row">';

    html+='<div class="row-main">';

    html+='<div class="cell rank">';
    html+='<div class="rank-num">'+(li+1)+'</div>';
    html+='<div class="rank-badge '+badge+'">N'+l.nivel+'</div>';
    html+='</div>';

    html+='<div class="cell loja">';
    html+='<strong>'+l.loja+'</strong>';
    html+='</div>';

    html+='<div class="cell">';
    html+='<strong>'+l.local+'</strong>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="gray">'+l.pctPTotal+'%</span>';
    html+='<strong>'+l.pT+'</strong>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="red">'+l.pctPA+'%</span>';
    html+='<strong class="red">'+l.pA+'</strong>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="green">'+l.pctPF+'%</span>';
    html+='<strong class="green">'+l.pF+'</strong>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="gray">'+l.pctNPTotal+'%</span>';
    html+='<strong>'+l.nT+'</strong>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="red">'+l.pctNA+'%</span>';
    html+='<strong class="red">'+l.nA+'</strong>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="green">'+l.pctNF+'%</span>';
    html+='<strong class="green">'+l.nF+'</strong>';
    html+='</div>';

    html+='<div class="cell trend">';
    html+='<div class="trend-box '+trendClass+'">';
    html+='<div class="trend-icon">'+icon+'</div>';
    html+='<div class="trend-value">'+l.diff+'</div>';
    html+='</div>';
    html+='</div>';

    html+='<div class="cell">';
    html+='<button class="btn" onclick="toggleHist('+li+')">Histórico</button>';
    html+='</div>';

    html+='</div>';

    html+='<div class="panel" id="hist-'+li+'">';
    html+='<div class="panel-inner">';

    html+='<table class="detail-table">';

    html+='<thead>';
    html+='<tr>';
    html+='<th>Semana</th>';
    html+='<th>P Aberto</th>';
    html+='<th>P Fechado</th>';
    html+='<th>NP Aberto</th>';
    html+='<th>NP Fechado</th>';
    html+='</tr>';
    html+='</thead>';

    html+='<tbody>';

    l.historico.forEach(h=>{

      html+='<tr>';
      html+='<td>'+h.semana+'</td>';
      html+='<td>'+h.pA+'</td>';
      html+='<td>'+h.pF+'</td>';
      html+='<td>'+h.nA+'</td>';
      html+='<td>'+h.nF+'</td>';
      html+='</tr>';

    });

    html+='<tr class="current">';
    html+='<td>'+ultima+'</td>';
    html+='<td>'+l.pA+'</td>';
    html+='<td>'+l.pF+'</td>';
    html+='<td>'+l.nA+'</td>';
    html+='<td>'+l.nF+'</td>';
    html+='</tr>';

    html+='</tbody>';
    html+='</table>';

    html+='</div>';
    html+='</div>';

    html+='</div>';

  });

  html+='</div>';

  html+='<div class="note">';
  html+='<strong>Níveis por tarefas fechadas</strong><br><br>';
  html+='<span style="color:#ef4444;font-weight:800">N1</span> • Poucas tarefas fechadas<br>';
  html+='<span style="color:#fb923c;font-weight:800">N2</span> • Desempenho médio<br>';
  html+='<span style="color:#22c55e;font-weight:800">N3</span> • Muitas tarefas fechadas';
  html+='</div>';

  document.getElementById('app').innerHTML=html;

}

</script>

</body>
</html>
