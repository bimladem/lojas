<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f2f2f2; color: #222; }
  .header {
    background: #fff; border-bottom: 3px solid #222; padding: 18px 28px;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .header h1 { font-size: 22px; color: #111; }
  .header .sub { font-size: 13px; color: #666; margin-top: 3px; }
  .periodo { padding: 6px 16px; background: #f7f7f7; border-left: 4px solid #555; border-radius: 4px; font-size: 14px; color: #333; }

  .container { max-width: 1180px; margin: 24px auto; padding: 0 16px 40px; }
  .loading { text-align: center; padding: 80px; color: #666; font-size: 17px; }
  .legenda { font-size: 13px; color: #555; margin: 15px 0; padding: 12px 16px; background: #fff; border-radius: 6px; border: 1px solid #ddd; }

  .loja-card {
    background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1);
    margin-bottom: 24px; overflow: hidden;
  }
  .loja-header {
    padding: 16px 20px; background: #fafafa; border-bottom: 1px solid #eee;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .rank { font-size: 20px; font-weight: bold; }
  .nivel-badge { padding: 3px 10px; border-radius: 5px; font-size: 12.5px; font-weight: bold; border: 1px solid; }
  .n1 { color: #27ae60; border-color: #27ae60; }
  .n2 { color: #e65100; border-color: #e65100; }
  .n3 { color: #b71c1c; border-color: #b71c1c; }

  .stats { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat-box { text-align: center; min-width: 140px; }
  .stat-val { font-size: 26px; font-weight: bold; }
  .stat-lbl { font-size: 12px; color: #666; }

  .seccoes-header {
    display: grid; grid-template-columns: 1fr 110px 110px 130px; background: #222; color: #fff;
    padding: 10px 20px; font-size: 13px; font-weight: 500;
  }
  .seccao-row {
    display: grid; grid-template-columns: 1fr 110px 110px 130px; padding: 10px 20px;
    border-top: 1px solid #f0f0f0; align-items: center;
  }
  .seccao-row:hover { background: #f9f9f9; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 Análise Semanal IM</h1>
    <div class="sub" id="sub-gerado">A carregar ficheiro Excel...</div>
  </div>
  <div class="periodo" id="periodo-label">—</div>
</div>

<div class="container">
  <div id="app"><div class="loading">⏳ A processar dados do Excel...</div></div>
</div>

<script>
const EXCEL_FILE = 'Análise Semanal IM.xlsx';

async function carregarExcel() {
  try {
    const resp = await fetch(EXCEL_FILE + '?t=' + Date.now());
    if (!resp.ok) throw new Error('Ficheiro não encontrado');

    const arrayBuffer = await resp.arrayBuffer();
    const wb = XLSX.read(arrayBuffer, { type: 'array' });

    const sheetAnalise = wb.Sheets['Análise'] || wb.Sheets[wb.SheetNames[0]];
    const sheetHistorico = wb.Sheets['Por Loja Histórico'] || wb.Sheets[wb.SheetNames[1]];

    const analiseData = XLSX.utils.sheet_to_json(sheetAnalise);
    const historicoData = XLSX.utils.sheet_to_json(sheetHistorico);

    // ====================== LÓGICA EXATA DO TEU CÓDIGO n8n ======================
    const semanas = historicoData.map(r => String(r['Semana'] || '').trim()).filter(s => s);
    const ultimaSemana = semanas[semanas.length - 1];

    // Calcular lojas
    let lojas = historicoData
      .filter(r => String(r['Semana'] || '').trim() === ultimaSemana && r['Loja'])
      .map(r => {
        const pTotal = Number(r['P Total']) || 0;
        const pAberto = Number(r['P Aberto']) || 0;
        const pFechado = Number(r['P Fechado']) || 0;
        const npTotal = Number(r['NP Total']) || 0;
        const npAberto = Number(r['NP Aberto']) || 0;
        const npFechado = Number(r['NP Fechado']) || 0;

        const pctPAberto = pTotal > 0 ? (pAberto / pTotal * 100).toFixed(1) : '0.0';
        const pctNPAberto = npTotal > 0 ? (npAberto / npTotal * 100).toFixed(1) : '0.0';
        const pctPFechado = pTotal > 0 ? (pFechado / pTotal * 100).toFixed(1) : '0.0';
        const pctNPFechado = npTotal > 0 ? (npFechado / npTotal * 100).toFixed(1) : '0.0';

        const pctP = parseFloat(pctPAberto);
        const nivel = pctP <= 20 ? 1 : pctP <= 40 ? 2 : 3;

        return {
          loja: String(r['Loja']).trim(),
          localidade: String(r['Resumo contactos.Localidade'] || r['IM.Localidade'] || '').trim(),
          pTotal, pAberto, pFechado, npTotal, npAberto, npFechado,
          pctPAberto, pctNPAberto, pctPFechado, pctNPFechado,
          nivel,
          historico: [],
          seccoes: []
        };
      })
      .filter(r => r.pAberto > 0);

    lojas.sort((a, b) => b.pAberto - a.pAberto);
    const topLojas = lojas.slice(0, 10);
    const topIds = new Set(topLojas.map(l => l.loja));

    // Histórico
    const histPorLoja = {};
    historicoData.forEach(r => {
      const id = String(r['Loja'] || '').trim();
      if (!topIds.has(id)) return;
      if (!histPorLoja[id]) histPorLoja[id] = [];
      histPorLoja[id].push({
        semana: String(r['Semana']).trim(),
        pAberto: Number(r['P Aberto']) || 0
      });
    });

    topLojas.forEach(l => {
      const hist = histPorLoja[l.loja] || [];
      l.historico = hist.filter(h => h.semana !== ultimaSemana).slice(-5);
      const ult = hist.slice(-2);
      l.diff = ult.length === 2 ? ult[1].pAberto - ult[0].pAberto : null;
    });

    // Secções
    analiseData.forEach(row => {
      const lojaId = String(row['Loja'] || '').trim();
      const seccao = String(row['Secção'] || '').trim();
      if (!topIds.has(lojaId) || !seccao) return;

      const pAberto = Number(row['P Aberto']) || 0;
      const npAberto = Number(row['NP Aberto']) || 0;
      if (pAberto === 0 && npAberto === 0) return;

      const nomeCurto = seccao.replace(/^IM\s+\d+\s+/, '').trim();
      if (nomeCurto.toLowerCase() === 'admin') return;

      const loja = topLojas.find(l => l.loja === lojaId);
      if (loja) loja.seccoes.push({ nome: nomeCurto, pAberto, npAberto });
    });

    topLojas.forEach(l => l.seccoes.sort((a, b) => b.pAberto - a.pAberto));

    // ====================== RENDERIZAR ======================
    document.getElementById('sub-gerado').textContent = `Gerado em: ${new Date().toLocaleDateString('pt-PT', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}`;
    document.getElementById('periodo-label').innerHTML = `📅 Período analisado: <strong>${ultimaSemana}</strong>`;

    renderDashboard(topLojas, ultimaSemana);

  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="loading" style="color:#c0392b">❌ Erro: ${e.message}<br><br>Verifica se o ficheiro <b>${EXCEL_FILE}</b> está na pasta.</div>`;
  }
}

function corPct(pct) {
  const v = parseFloat(pct);
  if (v <= 20) return '#27ae60';
  if (v <= 40) return '#e65100';
  return '#b71c1c';
}

function renderDashboard(lojas, semana) {
  const app = document.getElementById('app');
  let html = `<div class="legenda">
    🔴 Top 3 críticas &nbsp;|&nbsp; 🟡 Em alerta &nbsp;|&nbsp; 
    Nível 1 (verde) = 0–20% &nbsp;|&nbsp; Nível 2 (laranja) = 21–40% &nbsp;|&nbsp; Nível 3 (vermelho) = 41%+
  </div>`;

  lojas.forEach((l, i) => {
    const emoji = i < 3 ? '🔴' : '🟡';
    const tendencia = l.diff === null ? '—' : 
                      l.diff > 0 ? `<span style="color:#c0392b">▲ +${l.diff}</span>` :
                      l.diff < 0 ? `<span style="color:#27ae60">▼ ${l.diff}</span>` : '→';

    html += `
    <div class="loja-card">
      <div class="loja-header">
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="rank">${emoji} ${i+1}</span>
          <div>
            <strong style="font-size:17px;">${l.loja}</strong><br>
            <span style="color:#555;font-size:13px;">${l.localidade || '—'}</span><br>
            <span class="nivel-badge n${l.nivel}">Nível ${l.nivel}</span>
          </div>
        </div>
        <div class="stats">
          <div class="stat-box">
            <div class="stat-val" style="color:#111">${l.pAberto}</div>
            <div class="stat-lbl">P em aberto</div>
            <div style="font-size:13px;color:${corPct(l.pctPAberto)}"><strong>${l.pctPAberto}%</strong> em aberto</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" style="color:#555">${l.npAberto}</div>
            <div class="stat-lbl">NP em aberto</div>
            <div style="font-size:13px;color:${corPct(l.pctNPAberto)}"><strong>${l.pctNPAberto}%</strong> em aberto</div>
          </div>
          <div class="stat-box">
            <div style="font-size:13px;margin-bottom:4px">Tendência: ${tendencia}</div>
            <small style="color:#666">Histórico: ${l.historico.map(h=>h.pAberto).join(' → ')}</small>
          </div>
        </div>
      </div>

      <div class="seccoes-header">
        <span>Secção</span>
        <span style="text-align:center">P em Aberto</span>
        <span style="text-align:center">NP em Aberto</span>
        <span></span>
      </div>
      ${l.seccoes.map(s => `
        <div class="seccao-row">
          <span><strong>${s.nome}</strong></span>
          <span style="text-align:center; font-weight:bold; color:#c0392b">${s.pAberto}</span>
          <span style="text-align:center">${s.npAberto}</span>
          <span></span>
        </div>
      `).join('')}
    </div>`;
  });

  app.innerHTML = html;
}

// Iniciar
carregarExcel();
</script>
</body>
</html>
