<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b1a;
  --bg2: #0d1128;
  --bg3: #141830;
  --card: rgba(20,24,48,0.85);
  --border: rgba(99,102,241,0.18);
  --border2: rgba(99,102,241,0.32);
  --accent: #6366f1;
  --accent2: #ec4899;
  --grad: linear-gradient(135deg,#6366f1,#ec4899);
  --text: #e2e8f0;
  --muted: #7c8db5;
  --green: #4ade80;
  --orange: #fb923c;
  --red: #f87171;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;}

/* HEADER */
.header{
  background:rgba(8,11,26,0.96);
  border-bottom:1px solid var(--border);
  padding:0 32px;
  height:60px;
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:space-between;
}
.header-brand{display:flex;align-items:center;gap:10px;}
.header-brand .logo{width:30px;height:30px;background:var(--grad);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.header-brand h1{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px;}
.header-brand .sub{font-size:11px;color:var(--muted);margin-top:1px;}
.periodo{
  background:rgba(99,102,241,0.12);
  border:1px solid var(--border2);
  border-radius:8px;padding:6px 14px;
  font-size:12px;font-weight:600;color:#a5b4fc;
  white-space:nowrap;
}

/* PAGE */
.page{max-width:1480px;margin:0 auto;padding:28px 24px 72px;display:flex;flex-direction:column;align-items:center;}

/* INFO BAR */
.info-bar{
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 20px;
  margin-bottom:16px;
  display:flex;flex-wrap:wrap;gap:0;
  backdrop-filter:blur(12px);
}
.info-row{display:flex;flex-wrap:wrap;gap:20px;width:100%;justify-content:center;}
.info-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;}
.info-key{font-weight:700;color:#a5b4fc;}
.info-sep{color:rgba(99,102,241,0.3);margin:0 2px;}

/* LEGENDA */
.legenda-wrapper{
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 20px;
  margin-bottom:20px;
  backdrop-filter:blur(12px);
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:30px;
}

.legenda{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  align-items:center;
  justify-content:center;
  font-size:12.5px;
  color:var(--muted);
  flex:1;
}

.legenda-nota{
  display:flex;
  flex-direction:column;
  gap:8px;
  font-size:12px;
  color:var(--muted);
  padding-left:20px;
  border-left:1px solid var(--border);
  text-align:right;
  min-width:180px;
}

.legenda-nota-title{
  font-size:11px;
  font-weight:700;
  color:#a5b4fc;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.legenda-nota-item{
  font-size:11.5px;
  color:var(--muted);
}

.leg{display:flex;align-items:center;gap:6px;}
.leg-sep{width:1px;height:14px;background:var(--border);margin:0 4px;}

/* TABLE WRAP */
.tabela-wrap{width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;backdrop-filter:blur(12px);margin-bottom:20px;}

.tabela-header{
  display:grid;
  grid-template-columns:72px 140px 110px 100px 110px 100px 90px 90px 90px;
  background:rgba(99,102,241,0.12);
  padding:13px 20px;gap:10px;
  font-size:11px;font-weight:600;color:#a5b4fc;
  letter-spacing:.04em;text-transform:uppercase;
  align-items:center;border-bottom:1px solid var(--border);
}
.th-sub{font-weight:400;font-size:9.5px;color:var(--muted);margin-top:2px;text-transform:none;letter-spacing:0;}
.th-group{text-align:center;}

/* LOJA */
.loja-bloco{border-top:1px solid var(--border);}
.loja-linha{
  display:grid;
  grid-template-columns:72px 140px 110px 100px 110px 100px 90px 90px 90px;
  padding:14px 20px;gap:10px;align-items:center;
  transition:background .15s;
}
.loja-linha:hover{background:rgba(99,102,241,0.07);}

/* RANK */
.cel-rank{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.rank-num{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#fff;}
.nivel-badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;}
.n1{background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.3);}
.n2{background:rgba(251,146,60,0.15);color:#fb923c;border:1px solid rgba(251,146,60,0.3);}
.n3{background:rgba(248,113,113,0.15);color:#f87171;border:1px solid rgba(248,113,113,0.3);}

/* LOJA */
.cel-loja{display:flex;flex-direction:column;gap:3px;}
.cel-loja .nome{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:#fff;}
.cel-loja .local{font-size:11.5px;color:var(--muted);}

/* TAREFAS P */
.cel-tar-p{text-align:center;display:flex;flex-direction:column;gap:3px;}
.tar-main{font-size:15px;font-weight:700;color:#fff;}
.tar-sub{font-size:10.5px;color:var(--muted);}

/* PCT P */
.cel-pct-p{text-align:center;display:flex;flex-direction:column;gap:2px;}
.pct-row{display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:700;color:#fff;}
.pct-label{font-size:9px;color:var(--muted);margin-top:2px;}

/* TAREFAS NP */
.cel-tar-np{text-align:center;display:flex;flex-direction:column;gap:3px;}

/* PCT NP */
.cel-pct-np{text-align:center;display:flex;flex-direction:column;gap:2px;}

/* TEND */
.cel-tend{text-align:center;}
.tend-title{font-size:10px;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.tend-val{font-size:16px;font-weight:700;}
.tend-sub{font-size:10px;color:var(--muted);margin-top:2px;}

/* BTNS */
.cel-btn{display:flex;flex-direction:column;align-items:center;gap:4px;}
.toggle-btn{
  width:85px;
  background:rgba(99,102,241,0.12);
  border:1px solid var(--border2);
  border-radius:7px;padding:7px 8px;
  font-size:11px;font-weight:600;
  cursor:pointer;color:#a5b4fc;
  transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.toggle-btn:hover{background:rgba(99,102,241,0.22);border-color:rgba(99,102,241,0.5);color:#c7d2fe;}
.toggle-btn.open{background:var(--grad);color:#fff;border-color:transparent;}
.btn-count{font-size:10px;color:var(--muted);}

/* PAINÉIS */
.painel{display:none;}
.painel.visible{display:block;}
.painel-inner{padding:20px;background:rgba(8,11,26,0.6);border-top:1px solid var(--border);}
.panel-title{font-size:11px;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;}

/* HISTÓRICO */
.hist-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.hist-table th{background:rgba(99,102,241,0.15);color:#a5b4fc;padding:7px 12px;text-align:left;font-size:11px;font-weight:600;border-bottom:1px solid var(--border);}
.hist-table th:not(:first-child){text-align:center;}
.hist-table td{padding:7px 12px;border-bottom:1px solid var(--border);color:var(--muted);}
.hist-table td:not(:first-child){text-align:center;font-weight:600;color:var(--text);}
.hist-table tr.atual td{background:rgba(99,102,241,0.1);color:#a5b4fc;font-weight:700;}
.tend-txt{margin-top:10px;font-size:12px;color:var(--muted);}

/* SECÇÕES */
.sec-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.sec-table thead th{background:rgba(99,102,241,0.12);color:#a5b4fc;padding:8px 12px;font-size:11px;font-weight:600;border-bottom:1px solid var(--border);text-align:left;}
.sec-table thead th:not(:first-child){text-align:center;}
.sec-table tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.sec-table tbody tr:hover{background:rgba(99,102,241,0.08);}
.sec-table tbody tr.sec-open{background:rgba(99,102,241,0.1);}
.sec-table tbody td{padding:9px 12px;color:var(--muted);}
.sec-table tbody td.sec-nome{font-weight:600;color:var(--text);}
.sec-table tbody td:not(.sec-nome){text-align:center;font-weight:600;color:var(--text);}
.pct-tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;margin-left:6px;}
.tag-green{background:rgba(74,222,128,0.15);color:#4ade80;}
.tag-orange{background:rgba(251,146,60,0.15);color:#fb923c;}
.tag-red{background:rgba(248,113,113,0.15);color:#f87171;}

/* SEC DET */
.sec-det-row td{padding:0!important;border:none!important;background:transparent!important;cursor:default;}
.sec-det-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;}
.sec-det-box{background:rgba(99,102,241,0.08);border:1px solid var(--border);border-radius:10px;padding:14px;}
.sdb-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.sdb-num{font-size:24px;font-weight:700;line-height:1;}
.sdb-pct{font-size:11px;color:var(--muted);margin-top:4px;}
.sdb-bar{height:4px;border-radius:2px;background:rgba(99,102,241,0.2);margin-top:7px;overflow:hidden;}
.sdb-bar-fill{height:100%;border-radius:2px;}

/* AÇÃO */
.acao-box{
  width:100%;
  background:linear-gradient(135deg,rgba(236,72,153,0.12),rgba(99,102,241,0.12));
  border:1px solid rgba(236,72,153,0.25);
  border-radius:14px;padding:20px 24px;
  display:flex;align-items:center;gap:16px;
  backdrop-filter:blur(12px);
}
.acao-icon{font-size:26px;flex-shrink:0;}
.acao-text strong{font-family:'Space Grotesk',sans-serif;font-size:15px;color:#f9a8d4;display:block;margin-bottom:4px;}
.acao-text p{font-size:13px;color:var(--muted);}

/* LOADING */
.loading{text-align:center;padding:80px 20px;color:var(--muted);font-size:15px;}

/* MOBILE */
.cards-mobile{display:none;width:100%;}
.card-m{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;margin-bottom:14px;
  backdrop-filter:blur(12px);
}
.card-m-head{
  background:rgba(99,102,241,0.12);
  padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.card-m-rank{display:flex;align-items:center;gap:10px;}
.card-m-nome{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:#fff;}
.card-m-local{font-size:11.5px;color:var(--muted);margin-top:2px;}
.card-m-body{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card-stat{background:rgba(99,102,241,0.08);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.card-stat-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.card-stat-val{font-size:15px;font-weight:700;color:#fff;}
.card-stat-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.card-btns{display:flex;gap:8px;padding:0 14px 14px;}
.card-btns .toggle-btn{flex:1;width:auto;}
.card-m .painel-inner{padding:14px;}

@media(max-width:900px){
  .tabela-wrap{display:none;}
  .cards-mobile{display:block;}
  .page{padding:20px 14px 60px;}
  .header{padding:0 16px;}
  .info-row{gap:12px;}
  .sec-det-grid{grid-template-columns:1fr 1fr;}
  
  .legenda-wrapper{
    flex-direction:column;
    gap:12px;
  }
  
  .legenda{
    width:100%;
    justify-content:flex-start;
  }
  
  .legenda-nota{
    border-left:none;
    border-top:1px solid var(--border);
    padding-left:0;
    padding-top:12px;
    text-align:left;
  }
}

@media(max-width:480px){
  .header-brand h1{font-size:14px;}
  .periodo{font-size:11px;padding:5px 10px;}
  .sec-det-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="logo">📊</div>
    <div>
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">A carregar dados...</div>
    </div>
  </div>
  <div class="periodo" id="periodo-label">—</div>
</div>

<div class="page">
  <div id="app"><div class="loading">⏳ A carregar dados...</div></div>
</div>

<script>
var stateHist={},stateSec={},stateSecDet={};

function corPct(v){v=parseFloat(v);if(v<=20)return'#4ade80';if(v<=40)return'#fb923c';return'#f87171';}
function tagClass(v){v=parseFloat(v);if(v<=20)return'tag-green';if(v<=40)return'tag-orange';return'tag-red';}
function prog(pct,cor){return'<div style="height:3px;border-radius:2px;background:rgba(99,102,241,0.2);margin-top:4px;overflow:hidden"><div style="height:100%;border-radius:2px;width:'+Math.min(100,parseFloat(pct)||0)+'%;background:'+cor+'"></div></div>';}
function sdbBar(pct,cor){return'<div class="sdb-bar"><div class="sdb-bar-fill" style="width:'+Math.min(100,parseFloat(pct)||0)+'%;background:'+cor+'"></div></div>';}

function toggleHist(li){
  var p=document.getElementById('hist-'+li),b=document.getElementById('btnhist-'+li);
  stateHist[li]=!stateHist[li];
  p.classList.toggle('visible',stateHist[li]);b.classList.toggle('open',stateHist[li]);
  b.innerHTML=stateHist[li]?'▼ Fechar':'▶ Histórico';
}
function toggleSec(li){
  var p=document.getElementById('sec-'+li),b=document.getElementById('btnsec-'+li);
  stateSec[li]=!stateSec[li];
  p.classList.toggle('visible',stateSec[li]);b.classList.toggle('open',stateSec[li]);
  b.innerHTML=stateSec[li]?'▼ Fechar':'▶ Secções';
}
function toggleSecDet(id){
  var det=document.getElementById('secdet-'+id),row=document.getElementById('secrow-'+id);
  stateSecDet[id]=!stateSecDet[id];
  det.classList.toggle('visible',stateSecDet[id]);
  if(row)row.classList.toggle('sec-open',stateSecDet[id]);
}
function toggleHistM(li){
  var p=document.getElementById('histm-'+li),b=document.getElementById('btnhistm-'+li);
  stateHist['m'+li]=!stateHist['m'+li];
  p.classList.toggle('visible',stateHist['m'+li]);b.classList.toggle('open',stateHist['m'+li]);
  b.innerHTML=stateHist['m'+li]?'▼ Fechar':'▶ Histórico';
}
function toggleSecM(li){
  var p=document.getElementById('secm-'+li),b=document.getElementById('btnsecm-'+li);
  stateSec['m'+li]=!stateSec['m'+li];
  p.classList.toggle('visible',stateSec['m'+li]);b.classList.toggle('open',stateSec['m'+li]);
  b.innerHTML=stateSec['m'+li]?'▼ Fechar':'▶ Secções';
}

fetch('dados.json?t='+Date.now())
  .then(function(r){return r.json();})
  .then(function(json){
    var data=json.data||[];
    var semanas=[];
    data.forEach(function(i){var s=String(i.Semana||'').trim();if(s&&semanas.indexOf(s)===-1)semanas.push(s);});
    var ultima=semanas.length>0?semanas[semanas.length-1]:'';

    var lojas=data
      .filter(function(i){return i.Loja&&!i.Secção&&String(i.Semana||'').trim()===ultima;})
      .map(function(i){
        var pT=Number(i['P Total'])||0,pA=Number(i['P Aberto'])||0,pF=Number(i['P Fechado'])||0;
        var nT=Number(i['NP Total'])||0,nA=Number(i['NP Aberto'])||0,nF=Number(i['NP Fechado'])||0;
        var pctPA=pT>0?(pA/pT*100).toFixed(1):'0.0',pctPF=pT>0?(pF/pT*100).toFixed(1):'0.0';
        var pctNA=nT>0?(nA/nT*100).toFixed(1):'0.0',pctNF=nT>0?(nF/nT*100).toFixed(1):'0.0';
        var loc=String(i['Resumo contactos.Localidade']||i['IM.Localidade']||'').trim();
        return{loja:String(i.Loja).trim(),local:loc,pT,pA,pF,nT,nA,nF,pctPA,pctPF,pctNA,pctNF,
               nivel:parseFloat(pctPA)<=20?1:parseFloat(pctPA)<=40?2:3,historico:[],seccoes:[]};
      }).filter(function(l){return l.pA>0;});

    lojas.sort(function(a,b){return b.pA-a.pA;});
    var top=lojas.slice(0,10);
    var ids={};top.forEach(function(l){ids[l.loja]=true;});

    var hpl={};
    data.forEach(function(i){
      if(!i.Secção&&i.Loja&&i.Semana&&ids[String(i.Loja).trim()]){
        var id=String(i.Loja).trim();
        if(!hpl[id])hpl[id]=[];
        hpl[id].push({semana:String(i.Semana).trim(),pA:Number(i['P Aberto'])||0,pF:Number(i['P Fechado'])||0,nA:Number(i['NP Aberto'])||0,nF:Number(i['NP Fechado'])||0});
      }
    });
    top.forEach(function(l){
      var h=hpl[l.loja]||[];
      l.historico=h.filter(function(x){return x.semana!==ultima;}).slice(-8);
      var u=h.slice(-2);l.diff=u.length===2?u[1].pA-u[0].pA:null;
    });

    data.forEach(function(i){
      if(i.Secção&&i.Loja&&ids[String(i.Loja).trim()]){
        var loja=top.find(function(l){return l.loja===String(i.Loja).trim();});
        if(loja){
          var pA=Number(i['P Aberto'])||0,pF=Number(i['P Fechado'])||0;
          var nA=Number(i['NP Aberto'])||0,nF=Number(i['NP Fechado'])||0;
          var pT=Number(i['P Total'])||0,nT=Number(i['NP Total'])||0;
          if(pA>0||pF>0||nA>0||nF>0){
            var nome=String(i.Secção).replace(/^IM\s+\d+\s+/,'').trim();
            if(nome.toLowerCase()!=='admin'){
              loja.seccoes.push({nome,pA,pF,nA,nF,pT,nT,
                pctPA:pT>0?(pA/pT*100).toFixed(0):'0',pctPF:pT>0?(pF/pT*100).toFixed(0):'0',
                pctNA:nT>0?(nA/nT*100).toFixed(0):'0',pctNF:nT>0?(nF/nT*100).toFixed(0):'0'});
            }
          }
        }
      }
    });
    top.forEach(function(l){l.seccoes.sort(function(a,b){return b.pA-a.pA;});});

    document.getElementById('sub-info').textContent='Gerado hoje · '+top.length+' lojas · semana '+ultima;
    document.getElementById('periodo-label').innerHTML='📅 '+ultima;
    renderApp(top,ultima);
  })
  .catch(function(err){
    document.getElementById('app').innerHTML='<div style="color:#f87171;padding:60px;text-align:center">❌ Erro ao carregar dados: '+err.message+'</div>';
  });

function histContent(l,ultima){
  var c='<div class="painel-inner"><div class="panel-title">Evolução Semanal</div>';
  if(l.historico&&l.historico.length>0){
    var rows=l.historico.map(function(h){return'<tr><td>'+h.semana+'</td><td>'+h.pA+'</td><td>'+h.pF+'</td><td>'+h.nA+'</td><td>'+h.nF+'</td></tr>';}).join('');
    var d=l.diff===null?'—':l.diff>0?'<span style="color:#f87171;font-weight:700">▲ +'+l.diff+'</span>':l.diff<0?'<span style="color:#4ade80;font-weight:700">▼ '+l.diff+'</span>':'<span style="color:var(--muted)">→</span>';
    c+='<table class="hist-table"><thead><tr><th>Semana</th><th>P Ab</th><th>P Fe</th><th>NP Ab</th><th>NP Fe</th></tr></thead><tbody>'
      +rows+'<tr class="atual"><td>'+ultima+' (atual)</td><td>'+l.pA+'</td><td>'+l.pF+'</td><td>'+l.nA+'</td><td>'+l.nF+'</td></tr></tbody></table>'
      +'<div class="tend-txt">Tendência P: '+d+'</div>';
  }else{
    c+='<p style="color:var(--muted);font-size:12px">Sem semanas anteriores. Atual: <strong style="color:#fff">'+l.pA+'</strong></p>';
  }
  return c+'</div>';
}

function secContent(l){
  if(!l.seccoes.length)return'<div style="padding:14px;color:var(--muted);font-size:12px">Sem secções com tarefas.</div>';
  var rows=l.seccoes.map(function(s,si){
    var id=l.loja.replace(/\s/g,'')+'-'+si;
    var tag='<span class="pct-tag '+tagClass(s.pctPA)+'">'+s.pctPA+'%</span>';
    var pVal=s.pA+' / '+s.pF;
    var nVal=s.nA+' / '+s.nF;
    return'<tr id="secrow-'+id+'" onclick="toggleSecDet(\''+id+'\')">'
      +'<td class="sec-nome">'+s.nome+tag+'</td>'
      +'<td>'+pVal+'</td><td>'+nVal+'</td>'
      +'</tr>'
      +'<tr class="sec-det-row"><td colspan="3">'
      +'<div class="painel" id="secdet-'+id+'">'
      +'<div class="sec-det-grid">'
      +'<div class="sec-det-box"><div class="sdb-label">P Abertas</div><div class="sdb-num" style="color:'+corPct(s.pctPA)+'">'+s.pA+'</div><div class="sdb-pct">'+s.pctPA+'%</div>'+sdbBar(s.pctPA,corPct(s.pctPA))+'</div>'
      +'<div class="sec-det-box"><div class="sdb-label">P Fechadas</div><div class="sdb-num" style="color:#4ade80">'+s.pF+'</div><div class="sdb-pct">'+s.pctPF+'%</div>'+sdbBar(s.pctPF,'#4ade80')+'</div>'
      +'<div class="sec-det-box"><div class="sdb-label">NP Abertas</div><div class="sdb-num" style="color:'+corPct(s.pctNA)+'">'+s.nA+'</div><div class="sdb-pct">'+s.pctNA+'%</div>'+sdbBar(s.pctNA,corPct(s.pctNA))+'</div>'
      +'<div class="sec-det-box"><div class="sdb-label">NP Fechadas</div><div class="sdb-num" style="color:#4ade80">'+s.nF+'</div><div class="sdb-pct">'+s.pctNF+'%</div>'+sdbBar(s.pctNF,'#4ade80')+'</div>'
      +'</div></div></td></tr>';
  }).join('');
  return'<div class="painel-inner"><table class="sec-table">'
    +'<thead><tr><th>Secção</th><th>P (Ab/Fe)</th><th>NP (Ab/Fe)</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>';
}

function renderApp(lojas,ultima){
  var infoBar='<div class="info-bar">'
    +'<div class="info-row"><div class="info-item"><span class="info-key">P:</span>Programadas<span class="info-sep">|</span><span class="info-key">NP:</span>Não Programadas</div></div>'
    +'<div class="info-row" style="margin-top:4px"><div class="info-item"><span class="info-key">Ab:</span>Abertas<span class="info-sep">|</span><span class="info-key">Fe:</span>Fechadas</div></div>'
    +'</div>';

  var leg='<div class="legenda-wrapper">'
    +'<div class="legenda">'
    +'<span class="leg"><span style="color:#f87171">●</span>&nbsp;Top 3 críticas</span>'
    +'<div class="leg-sep"></div>'
    +'<span class="leg"><span style="color:#fb923c">●</span>&nbsp;Em alerta</span>'
    +'<div class="leg-sep"></div>'
    +'<span class="leg"><span style="color:#4ade80;font-weight:700">N1</span>&nbsp;0–20%</span>'
    +'<span class="leg"><span style="color:#fb923c;font-weight:700">N2</span>&nbsp;21–40%</span>'
    +'<span class="leg"><span style="color:#f87171;font-weight:700">N3</span>&nbsp;41%+</span>'
    +'<div class="leg-sep"></div>'
    +'<span class="leg" style="color:#f87171">▲ A piorar</span>'
    +'<span class="leg" style="color:#4ade80">▼ A melhorar</span>'
    +'</div>'
    +'<div class="legenda-nota">'
    +'<div class="legenda-nota-title">Níveis de Incumprimento</div>'
    +'<div class="legenda-nota-item">N1: Desempenho Excelente</div>'
    +'<div class="legenda-nota-item">N2: Desempenho Aceitável</div>'
    +'<div class="legenda-nota-item">N3: Desempenho Crítico</div>'
    +'</div>'
    +'</div>';

  var header='<div class="tabela-header">'
    +'<div style="text-align:center"># / Nível</div>'
    +'<div>Loja</div>'
    +'<div class="th-group">Tarefas P<div class="th-sub">ab · fe</div></div>'
    +'<div class="th-group">% P<div class="th-sub">ab · fe</div></div>'
    +'<div class="th-group">Tarefas NP<div class="th-sub">ab · fe</div></div>'
    +'<div class="th-group">% NP<div class="th-sub">ab · fe</div></div>'
    +'<div style="text-align:center">Tendência</div>'
    +'<div style="text-align:center">Histórico</div>'
    +'<div style="text-align:center">Secções</div>'
    +'</div>';

  var blocos='',cards='';

  lojas.forEach(function(l,li){
    var emoji=li<3?'🔴':'🟡';
    var nc=l.nivel===1?'n1':l.nivel===2?'n2':'n3';
    var hc=histContent(l,ultima);
    var sc=secContent(l);

    var diffTxt=l.diff===null?'<span style="color:var(--muted)">—</span>'
      :l.diff>0?'<span style="color:#f87171">▲ +'+l.diff+'</span>'
      :l.diff<0?'<span style="color:#4ade80">▼ '+l.diff+'</span>'
      :'<span style="color:var(--muted)">→</span>';

    // Desktop row
    blocos+='<div class="loja-bloco">'
      +'<div class="loja-linha">'
      +'<div class="cel-rank"><div class="rank-num">'+emoji+' '+(li+1)+'</div><span class="nivel-badge '+nc+'">N'+l.nivel+'</span></div>'
      +'<div class="cel-loja"><div class="nome">'+l.loja+'</div><div class="local">'+(l.local||'—')+'</div></div>'

      // Tarefas P
      +'<div class="cel-tar-p"><div class="tar-main">'+l.pA+' / '+l.pF+'</div><div class="tar-sub">('+l.pT+')</div>'+prog(l.pctPA,corPct(l.pctPA))+'</div>'

      // % P
      +'<div class="cel-pct-p"><div class="pct-row"><span style="color:'+corPct(l.pctPA)+'">'+l.pctPA+'%</span><span style="color:var(--muted);font-size:12px">·</span><span style="color:#fff">'+l.pctPF+'%</span></div><div class="pct-label">ab · fe</div></div>'

      // Tarefas NP
      +'<div class="cel-tar-np"><div class="tar-main">'+l.nA+' / '+l.nF+'</div><div class="tar-sub">('+l.nT+')</div>'+prog(l.pctNA,corPct(l.pctNA))+'</div>'

      // % NP
      +'<div class="cel-pct-np"><div class="pct-row"><span style="color:'+corPct(l.pctNA)+'">'+l.pctNA+'%</span><span style="color:var(--muted);font-size:12px">·</span><span style="color:#fff">'+l.pctNF+'%</span></div><div class="pct-label">ab · fe</div></div>'

      +'<div class="cel-tend"><div class="tend-title">Tendência</div><div class="tend-val">'+diffTxt+'</div><div class="tend-sub">vs ant.</div></div>'
      +'<div class="cel-btn"><button class="toggle-btn" id="btnhist-'+li+'" onclick="toggleHist('+li+')">▶ Histórico</button></div>'
      +'<div class="cel-btn"><button class="toggle-btn" id="btnsec-'+li+'" onclick="toggleSec('+li+')">▶ Secções</button><div class="btn-count">'+l.seccoes.length+'</div></div>'
      +'</div>'
      +'<div class="painel" id="hist-'+li+'">'+hc+'</div>'
      +'<div class="painel" id="sec-'+li+'">'+sc+'</div>'
      +'</div>';

    // Mobile card
    cards+='<div class="card-m">'
      +'<div class="card-m-head">'
      +'<div class="card-m-rank"><div class="rank-num">'+emoji+' '+(li+1)+'</div><span class="nivel-badge '+nc+'">N'+l.nivel+'</span></div>'
      +'<div><div class="card-m-nome">'+l.loja+'</div><div class="card-m-local">'+(l.local||'—')+'</div></div>'
      +'</div>'
      +'<div class="card-m-body">'
      +'<div class="card-stat"><div class="card-stat-label">P Abertas / Fechadas</div><div class="card-stat-val" style="color:'+corPct(l.pctPA)+'">'+l.pA+' / <span style="color:#fff">'+l.pF+'</span></div><div class="card-stat-sub">'+l.pctPA+'% ab · '+l.pctPF+'% fe ('+l.pT+')</div>'+prog(l.pctPA,corPct(l.pctPA))+'</div>'
      +'<div class="card-stat"><div class="card-stat-label">NP Abertas / Fechadas</div><div class="card-stat-val" style="color:'+corPct(l.pctNA)+'">'+l.nA+' / <span style="color:#fff">'+l.nF+'</span></div><div class="card-stat-sub">'+l.pctNA+'% ab · '+l.pctNF+'% fe ('+l.nT+')</div>'+prog(l.pctNA,corPct(l.pctNA))+'</div>'
      +'<div class="card-stat"><div class="card-stat-label">Tendência</div><div class="card-stat-val">'+diffTxt+'</div><div class="card-stat-sub">vs semana anterior</div></div>'
      +'<div class="card-stat"><div class="card-stat-label">Período</div><div class="card-stat-val" style="font-size:12px;color:#a5b4fc">'+ultima+'</div></div>'
      +'</div>'
      +'<div class="card-btns">'
      +'<button class="toggle-btn" id="btnhistm-'+li+'" onclick="toggleHistM('+li+')">▶ Histórico</button>'
      +'<button class="toggle-btn" id="btnsecm-'+li+'" onclick="toggleSecM('+li+')">▶ Secções ('+l.seccoes.length+')</button>'
      +'</div>'
      +'<div class="painel" id="histm-'+li+'">'+hc+'</div>'
      +'<div class="painel" id="secm-'+li+'">'+sc+'</div>'
      +'</div>';
  });

  var acao='<div class="acao-box">'
    +'<div class="acao-icon">⚠️</div>'
    +'<div class="acao-text">'
    +'<strong>Ação recomendada</strong>'
    +'<p>Contactar urgentemente os responsáveis das lojas críticas. Para lojas com tendência crescente, escalar para supervisor de zona.</p>'
    +'</div></div>';

  document.getElementById('app').innerHTML=infoBar+leg
    +'<div class="tabela-wrap">'+header+blocos+'</div>'
    +'<div class="cards-mobile">'+cards+'</div>'
    +acao;
}
</script>
</body>
</html>
