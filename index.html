<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --border:rgba(0,0,0,.08);
  --text:#1a1a1a;
  --muted:#808080;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#fb923c;
  --purple:#8b5cf6;
  --pink:#ec4899;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text);
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:52px;
  height:52px;
  border-radius:14px;
  background:var(--grad);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.header-title h1{
  font-size:30px;
  font-weight:800;
}

.header-title .sub{
  margin-top:4px;
  color:var(--muted);
  font-size:15px;
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);
  padding:10px 18px;
  border-radius:12px;
  font-weight:800;
  color:var(--purple);
  font-size:15px;
}

/* MAIN */

.main{
  max-width:1800px;
  margin:auto;
  padding:28px;
}

/* NOTE */

.top-note{
  text-align:center;
  margin-bottom:24px;
  font-size:16px;
  color:#555;
  font-weight:600;
}

.top-note strong{
  color:#000;
}

/* TABLE */

.table-container{
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
}

/* HEADER */

.table-header{
  display:grid;
  grid-template-columns:
    90px
    1.6fr
    120px
    120px
    120px
    120px
    120px
    120px
    180px
    120px
    120px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  font-size:14px;
  font-weight:800;
  color:#666;
  text-transform:uppercase;
}

.table-header div{
  padding:22px 10px;
  text-align:center;
}

/* ROW */

.table-row{
  border-bottom:1px solid var(--border);
}

.row-main{
  display:grid;
  grid-template-columns:
    90px
    1.6fr
    120px
    120px
    120px
    120px
    120px
    120px
    180px
    120px
    120px;
  align-items:center;
  padding:20px 10px;
  transition:.2s;
}

.row-main:hover{
  background:rgba(139,92,246,.03);
}

/* CELLS */

.cell{
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* RANK */

.rank{
  flex-direction:column;
  gap:8px;
}

.rank-num{
  font-size:32px;
  font-weight:800;
}

.rank-badge{
  padding:5px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.n1{ background:rgba(34,197,94,.12); color:var(--green); }
.n2{ background:rgba(251,146,60,.12); color:var(--orange); }
.n3{ background:rgba(239,68,68,.12); color:var(--red); }

/* LOJA */

.loja{
  flex-direction:column;
  gap:8px;
}

.loja strong{ font-size:22px; }
.loja span{ color:var(--muted); font-size:15px; }

/* NUMBERS */

.metric{
  flex-direction:column;
  gap:6px;
}

.metric strong{ font-size:28px; }
.metric span{ font-size:14px; font-weight:700; }

.red{ color:var(--red); }
.green{ color:var(--green); }
.gray{ color:#777; }

/* TREND */

.trend{
  flex-direction:column;
  gap:8px;
}

.trend-box{
  padding:12px;
  border-radius:14px;
  min-width:140px;
}

.trend-positive{
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.2);
}

.trend-negative{
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.2);
}

.trend-neutral{
  background:rgba(0,0,0,.04);
  border:1px solid rgba(0,0,0,.08);
}

.trend-icon{ font-size:26px; font-weight:800; }
.trend-value{ font-size:24px; font-weight:800; margin-top:4px; }
.trend-text{ margin-top:8px; font-size:12px; line-height:1.5; font-weight:700; }

/* BUTTON */

.btn{
  background:#fff;
  border:1px solid rgba(139,92,246,.25);
  color:var(--purple);
  border-radius:12px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:800;
  transition:.2s;
  font-size:14px;
}

.btn:hover{ background:rgba(139,92,246,.08); }

/* PANELS */

.panel{ display:none; }
.panel.visible{ display:block; }

.panel-inner{
  padding:24px;
  background:rgba(139,92,246,.03);
  border-top:1px solid var(--border);
}

/* HISTORY */

.detail-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

.detail-table th,
.detail-table td{
  padding:16px;
  border-bottom:1px solid var(--border);
  text-align:center;
  font-size:15px;
}

.detail-table th{
  background:#fafafa;
  font-size:14px;
  font-weight:800;
}

.current{
  background:rgba(139,92,246,.06);
  font-weight:800;
}

/* SECTIONS */

.sections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

.section-card{
  border:1px solid var(--border);
  border-radius:16px;
  background:#fff;
  overflow:hidden;
}

.section-head{
  padding:16px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  font-size:18px;
  font-weight:800;
  text-align:center;
}

.section-body{ padding:18px; }

.sec-line{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:15px;
}

.bar{
  height:8px;
  border-radius:999px;
  overflow:hidden;
  background:#eee;
  margin-bottom:18px;
}

.fill-red{ height:100%; background:var(--red); }
.fill-green{ height:100%; background:var(--green); }

/* FOOT NOTE */

.note{
  margin-top:26px;
  padding:22px;
  border-radius:18px;
  background:#fafafa;
  border:1px solid var(--border);
  text-align:center;
  line-height:2;
  font-size:16px;
  color:#555;
}

.note strong{ color:#000; }

</style>
</head>

<body>

<header class="header">
  <div class="header-brand">
    <div class="header-logo">📊</div>
    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">A carregar...</div>
    </div>
  </div>

  <div class="header-period" id="periodo">—</div>
</header>

<main class="main">

  <div class="top-note">
    <strong>P</strong> = Programadas • <strong>NP</strong> = Não Programadas
  </div>

  <div id="app">
    <div style="padding:80px;text-align:center;color:#999;">
      ⏳ A carregar dados...
    </div>
  </div>

</main>

<script>
var stateHist = {};
var stateSec = {};

function toggleHist(li){
  var p=document.getElementById('hist-'+li);
  stateHist[li]=!stateHist[li];
  p.classList.toggle('visible');
}

function toggleSec(li){
  var p=document.getElementById('sec-'+li);
  stateSec[li]=!stateSec[li];
  p.classList.toggle('visible');
}

fetch('dados.json?t='+Date.now())
.then(r=>r.json())
.then(json=>{
  var data=json.data||[];

  var semanas=[];
  data.forEach(i=>{
    var s=String(i.Semana||'').trim();
    if(s && semanas.indexOf(s)===-1) semanas.push(s);
  });

  var ultima=semanas[semanas.length-1]||'';

  var lojas=data.filter(i=>i.Loja && !i.Secção && String(i.Semana||'').trim()===ultima)
  .map(i=>{
    var pT=Number(i['P Total'])||0;
    var pA=Number(i['P Aberto'])||0;
    var pF=Number(i['P Fechado'])||0;

    var nT=Number(i['NP Total'])||0;
    var nA=Number(i['NP Aberto'])||0;
    var nF=Number(i['NP Fechado'])||0;

    return{
      loja:String(i.Loja).trim(),
      local:String(i['Resumo contactos.Localidade']||i['IM.Localidade']||'').trim(),
      pT,pA,pF,nT,nA,nF,
      nivel:(pT>0?(pA/pT*100):0)<=20?1:(pT>0?(pA/pT*100):0)<=40?2:3,
      historico:[],
      seccoes:[]
    };
  });

  lojas.sort((a,b)=>b.pA-a.pA);

  render(lojas,ultima);
});

function render(lojas,ultima){
  var html='';
  html+='<div class="table-container">';

  html+='<div class="table-header">';
  html+='<div>Rank</div><div>Loja</div><div>P Total</div><div>P Aberto</div><div>P Fechado</div><div>NP Total</div><div>NP Aberto</div><div>NP Fechado</div><div>Tendência</div><div>Histórico</div><div>Secções</div>';
  html+='</div>';

  lojas.forEach((l,li)=>{
    html+='<div class="table-row"><div class="row-main">';
    html+='<div class="cell rank"><div class="rank-num">'+(li+1)+'</div></div>';
    html+='<div class="cell loja"><strong>'+l.loja+'</strong></div>';
    html+='</div></div>';
  });

  html+='</div>';
  document.getElementById('app').innerHTML=html;
}
</script>

</body>
</html>
