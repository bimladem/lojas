<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg-primary:#ffffff;
  --bg-secondary:#f8f9fa;
  --bg-tertiary:#f0f2f5;

  --border:rgba(0,0,0,0.08);
  --border-hover:rgba(0,0,0,0.15);

  --text-primary:#1a1a1a;
  --text-secondary:#4a4a4a;
  --text-tertiary:#808080;

  --accent-purple:#8b5cf6;
  --accent-pink:#ec4899;

  --success:#22c55e;
  --warning:#f59e0b;
  --critical:#ef4444;

  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  font-family:'Inter',sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  min-height:100vh;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(0,0,0,0.06);

  padding:20px 36px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:44px;
  height:44px;
  border-radius:14px;
  background:var(--grad);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  color:white;
}

.header-title h1{
  font-size:24px;
  font-weight:800;
  letter-spacing:-0.5px;
}

.header-title .sub{
  font-size:12px;
  color:var(--text-tertiary);
  margin-top:4px;
}

.header-period{
  background:rgba(139,92,246,0.08);
  border:1px solid rgba(139,92,246,0.14);
  padding:10px 14px;
  border-radius:10px;

  font-size:13px;
  font-weight:700;
  color:var(--accent-purple);
}

/* MAIN */

.main{
  max-width:1600px;
  margin:auto;
  padding:40px;
}

/* KPI */

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.kpi-card{
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  transition:0.25s ease;
}

.kpi-card:hover{
  background:rgba(139,92,246,0.04);
  border-color:var(--border-hover);
  transform:translateY(-2px);
}

.kpi-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--text-tertiary);
  margin-bottom:12px;
  font-weight:700;
}

.kpi-value{
  font-size:34px;
  font-weight:800;
  line-height:1;
}

.kpi-sublabel{
  margin-top:10px;
  color:var(--text-tertiary);
  font-size:12px;
}

.kpi-critical .kpi-value{ color:#ef4444; }
.kpi-warning .kpi-value{ color:#f59e0b; }
.kpi-success .kpi-value{ color:#22c55e; }
.kpi-pending .kpi-value{ color:#64748b; }

/* TABLE */

.table-container{
  margin-top:20px;
}

.table-header{
  display:grid;
  grid-template-columns:110px 1.3fr 1fr 120px 110px 190px;
  gap:14px;

  padding:18px 0;
  border-bottom:1px solid var(--border);
}

.th-cell{
  font-size:12px;
  text-transform:uppercase;
  color:var(--text-tertiary);
  font-weight:700;
  letter-spacing:0.4px;
}

.table-row{
  display:grid;
  grid-template-columns:110px 1.3fr 1fr 120px 110px 190px;
  gap:14px;

  align-items:center;

  padding:22px 0;

  border-bottom:1px solid var(--border);

  transition:0.2s ease;
}

.table-row:hover{
  background:rgba(139,92,246,0.03);
}

/* RANK */

.cell-rank{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.rank-emoji{
  font-size:24px;
}

.rank-number{
  font-size:18px;
  font-weight:800;
}

.rank-badge{
  font-size:10px;
  font-weight:700;
  border-radius:999px;
  padding:5px 10px;
}

.badge-n1{
  background:rgba(34,197,94,0.1);
  color:#22c55e;
}

.badge-n2{
  background:rgba(245,158,11,0.12);
  color:#f59e0b;
}

.badge-n3{
  background:rgba(239,68,68,0.12);
  color:#ef4444;
}

/* LOJA */

.cell-loja{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.loja-nome{
  font-size:16px;
  font-weight:700;
}

.loja-local{
  font-size:13px;
  color:var(--text-tertiary);
}

/* SUMMARY */

.cell-summary{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.summary-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.summary-label{
  font-size:12px;
  color:var(--text-tertiary);
}

.summary-number{
  font-size:16px;
  font-weight:800;
}

/* TREND */

.cell-trend{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.trend-icon{
  font-size:20px;
  font-weight:800;
}

.trend-value{
  font-size:14px;
  font-weight:700;
}

.trend-up{
  color:#ef4444;
}

.trend-down{
  color:#22c55e;
}

.trend-none{
  color:#64748b;
}

/* BUTTONS */

.cell-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  cursor:pointer;
  border-radius:10px;
  padding:9px 12px;

  font-size:12px;
  font-weight:700;

  transition:0.2s ease;
}

.btn-primary{
  background:var(--grad);
  color:white;
}

.btn-primary:hover{
  opacity:0.92;
}

.btn-outline{
  background:white;
  border:1px solid rgba(139,92,246,0.25);
  color:var(--accent-purple);
}

.btn-outline:hover{
  background:rgba(139,92,246,0.08);
}

/* PANELS */

.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  background:rgba(139,92,246,0.04);
  border-radius:16px;
  padding:24px;
  margin:10px 0 20px;
  border:1px solid rgba(139,92,246,0.08);

  animation:fade 0.25s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(-5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.panel-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:20px;
}

/* TASKS */

.tasks-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.task-card{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.task-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:16px;
}

.task-item{
  margin-bottom:16px;
}

.task-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.task-label{
  font-size:13px;
  color:var(--text-secondary);
}

.task-value{
  font-size:13px;
  font-weight:700;
}

.bar{
  height:7px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  border-radius:999px;
  transition:0.5s ease;
}

/* HISTORY */

.detail-table{
  width:100%;
  border-collapse:collapse;
}

.detail-table th{
  text-align:left;
  padding:12px 0;
  font-size:11px;
  color:var(--text-tertiary);
  border-bottom:1px solid var(--border);
  text-transform:uppercase;
}

.detail-table td{
  padding:12px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

.detail-table tr.current td{
  font-weight:700;
  color:var(--accent-purple);
}

/* SECTIONS */

.sections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

.section-card{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.section-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:16px;
}

.section-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:13px;
}

/* ACTION BOX */

.action-box{
  margin-top:50px;
  background:rgba(239,68,68,0.06);
  border:1px solid rgba(239,68,68,0.12);
  border-radius:16px;
  padding:24px;

  display:flex;
  gap:16px;
}

.action-icon{
  font-size:24px;
}

.action-content h3{
  color:#ef4444;
  margin-bottom:8px;
  font-size:15px;
}

.action-content p{
  font-size:13px;
  line-height:1.7;
  color:var(--text-secondary);
}

/* LOADING */

.loading{
  text-align:center;
  padding:120px 20px;
  color:var(--text-tertiary);
}

/* RESPONSIVE */

@media(max-width:1100px){

  .table-header,
  .table-row{
    grid-template-columns:90px 1fr 1fr 110px 90px 170px;
  }

  .tasks-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:780px){

  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .main{
    padding:20px;
  }

  .table-header{
    display:none;
  }

  .table-row{
    grid-template-columns:1fr;
    gap:14px;
    padding:20px;
    border:1px solid var(--border);
    border-radius:18px;
    margin-bottom:16px;
  }

  .cell-actions{
    justify-content:flex-start;
  }

  .cell-rank{
    flex-direction:row;
    justify-content:flex-start;
  }

  .tasks-grid{
    grid-template-columns:1fr;
  }

  .sections-grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header class="header">

  <div class="header-brand">
    <div class="header-logo">📊</div>

    <div class="header-title">
      <h1>Análise Semanal</h1>
      <div class="sub" id="sub-info">Carregando dados...</div>
    </div>
  </div>

  <div class="header-period" id="periodo">—</div>

</header>

<main class="main">

  <div id="app">
    <div class="loading">⏳ Carregando dados...</div>
  </div>

</main>

<script>

var stateHist = {};
var stateTasks = {};
var stateSec = {};

function toggleHist(id){

  var panel = document.getElementById('hist-' + id);

  stateHist[id] = !stateHist[id];

  panel.classList.toggle('visible', stateHist[id]);

}

function toggleTasks(id){

  var panel = document.getElementById('tasks-' + id);

  stateTasks[id] = !stateTasks[id];

  panel.classList.toggle('visible', stateTasks[id]);

  if(stateTasks[id]){

    setTimeout(() => {

      var bars = panel.querySelectorAll('.bar-fill');

      bars.forEach(bar => {

        bar.style.width = bar.dataset.width;

      });

    },50);

  }

}

function toggleSec(id){

  var panel = document.getElementById('sec-' + id);

  stateSec[id] = !stateSec[id];

  panel.classList.toggle('visible', stateSec[id]);

}

fetch('dados.json?t=' + Date.now())

.then(r => r.json())

.then(json => {

  var data = json.data || [];

  var semanas = [];

  data.forEach(i => {

    var s = String(i.Semana || '').trim();

    if(s && !semanas.includes(s)) semanas.push(s);

  });

  var ultima = semanas[semanas.length - 1] || '';

  var lojas = data

    .filter(i =>
      i.Loja &&
      !i.Secção &&
      String(i.Semana || '').trim() === ultima
    )

    .map(i => {

      var pT = Number(i['P Total']) || 0;
      var pA = Number(i['P Aberto']) || 0;
      var pF = Number(i['P Fechado']) || 0;

      var nT = Number(i['NP Total']) || 0;
      var nA = Number(i['NP Aberto']) || 0;
      var nF = Number(i['NP Fechado']) || 0;

      var pctPA = pT > 0 ? (pA / pT * 100).toFixed(1) : '0.0';
      var pctPF = pT > 0 ? (pF / pT * 100).toFixed(1) : '0.0';

      var pctNA = nT > 0 ? (nA / nT * 100).toFixed(1) : '0.0';
      var pctNF = nT > 0 ? (nF / nT * 100).toFixed(1) : '0.0';

      var nivel =
        parseFloat(pctPA) <= 20 ? 1 :
        parseFloat(pctPA) <= 40 ? 2 : 3;

      return {

        loja:String(i.Loja).trim(),
        local:String(i['Resumo contactos.Localidade'] || '').trim(),

        pT,pA,pF,
        nT,nA,nF,

        pctPA,pctPF,
        pctNA,pctNF,

        nivel,

        historico:[],
        seccoes:[]

      };

    })

    .filter(l => l.pA > 0);

  lojas.sort((a,b) => b.pA - a.pA);

  var top = lojas.slice(0,10);

  var ids = {};

  top.forEach(l => ids[l.loja] = true);

  /* HISTÓRICO */

  var hist = {};

  data.forEach(i => {

    if(
      !i.Secção &&
      i.Loja &&
      i.Semana &&
      ids[String(i.Loja).trim()]
    ){

      var id = String(i.Loja).trim();

      if(!hist[id]) hist[id] = [];

      hist[id].push({

        semana:String(i.Semana).trim(),

        pA:Number(i['P Aberto']) || 0,
        pF:Number(i['P Fechado']) || 0,

        nA:Number(i['NP Aberto']) || 0,
        nF:Number(i['NP Fechado']) || 0

      });

    }

  });

  top.forEach(l => {

    var h = hist[l.loja] || [];

    l.historico = h.filter(x => x.semana !== ultima).slice(-8);

    var ultimas = h.slice(-2);

    l.diff =
      ultimas.length === 2
      ? ultimas[1].pA - ultimas[0].pA
      : null;

  });

  /* SECÇÕES */

  data.forEach(i => {

    if(
      i.Secção &&
      i.Loja &&
      ids[String(i.Loja).trim()]
    ){

      var loja = top.find(
        l => l.loja === String(i.Loja).trim()
      );

      if(loja){

        var pA = Number(i['P Aberto']) || 0;
        var pF = Number(i['P Fechado']) || 0;

        var nA = Number(i['NP Aberto']) || 0;
        var nF = Number(i['NP Fechado']) || 0;

        var pT = Number(i['P Total']) || 0;
        var nT = Number(i['NP Total']) || 0;

        var nome = String(i.Secção)
          .replace(/^IM\s+\d+\s+/,'')
          .trim();

        if(nome.toLowerCase() !== 'admin'){

          loja.seccoes.push({

            nome,

            pA,pF,
            nA,nF,

            pctPA:pT > 0 ? (pA / pT * 100).toFixed(1) : '0.0',
            pctPF:pT > 0 ? (pF / pT * 100).toFixed(1) : '0.0',

            pctNA:nT > 0 ? (nA / nT * 100).toFixed(1) : '0.0',
            pctNF:nT > 0 ? (nF / nT * 100).toFixed(1) : '0.0'

          });

        }

      }

    }

  });

  top.forEach(l => {

    l.seccoes.sort((a,b) => b.pA - a.pA);

  });

  document.getElementById('sub-info').innerHTML =
    'Gerado hoje · ' + top.length + ' lojas';

  document.getElementById('periodo').innerHTML =
    '📅 ' + ultima;

  renderApp(top,ultima);

})

.catch(err => {

  document.getElementById('app').innerHTML =
    '<div class="loading" style="color:#ef4444">❌ Erro ao carregar dados</div>';

});

function renderApp(lojas,ultima){

  var criticas = lojas.filter((l,i) => i < 3).length;
  var alertas = lojas.filter((l,i) => i >= 3).length;

  var piorando = lojas.filter(l => l.diff > 0).length;
  var melhorando = lojas.filter(l => l.diff < 0).length;

  var html = '';

  /* KPI */

  html += `
    <div class="kpi-grid">

      <div class="kpi-card kpi-critical">
        <div class="kpi-label">🔴 Críticas</div>
        <div class="kpi-value">${criticas}</div>
        <div class="kpi-sublabel">Top 3 lojas</div>
      </div>

      <div class="kpi-card kpi-warning">
        <div class="kpi-label">🟠 Alertas</div>
        <div class="kpi-value">${alertas}</div>
        <div class="kpi-sublabel">Em observação</div>
      </div>

      <div class="kpi-card kpi-pending">
        <div class="kpi-label">▲ A piorar</div>
        <div class="kpi-value">${piorando}</div>
        <div class="kpi-sublabel">vs semanas anteriores</div>
      </div>

      <div class="kpi-card kpi-success">
        <div class="kpi-label">▼ A melhorar</div>
        <div class="kpi-value">${melhorando}</div>
        <div class="kpi-sublabel">vs semanas anteriores</div>
      </div>

    </div>
  `;

  /* TABLE */

  html += `
    <div class="table-container">

      <div class="table-header">

        <div class="th-cell">Rank</div>
        <div class="th-cell">Loja</div>
        <div class="th-cell">Resumo</div>
        <div class="th-cell">Tarefas</div>
        <div class="th-cell">Tendência</div>
        <div class="th-cell">Ações</div>

      </div>
  `;

  lojas.forEach((l,li) => {

    var total = l.pA + l.pF + l.nA + l.nF;

    var emoji =
      li < 3 ? '🔴' :
      li < 6 ? '🟠' : '🟡';

    var badge =
      l.nivel === 1 ? 'badge-n1' :
      l.nivel === 2 ? 'badge-n2' :
      'badge-n3';

    var diffIcon =
      l.diff === null ? '→' :
      l.diff > 0 ? '▲' :
      l.diff < 0 ? '▼' : '→';

    var diffClass =
      l.diff === null ? 'trend-none' :
      l.diff > 0 ? 'trend-up' :
      l.diff < 0 ? 'trend-down' :
      'trend-none';

    var diffVal =
      l.diff === null
      ? '—'
      : Math.abs(l.diff);

    /* HIST */

    var histRows = l.historico.map(h => `
      <tr>
        <td>${h.semana}</td>
        <td>${h.pA}</td>
        <td>${h.pF}</td>
        <td>${h.nA}</td>
        <td>${h.nF}</td>
      </tr>
    `).join('');

    /* SEC */

    var secRows = l.seccoes.map(s => `
      <div class="section-card">

        <div class="section-title">${s.nome}</div>

        <div class="section-row">
          <span>P Abertas</span>
          <strong>${s.pA} (${s.pctPA}%)</strong>
        </div>

        <div class="section-row">
          <span>P Fechadas</span>
          <strong>${s.pF} (${s.pctPF}%)</strong>
        </div>

        <div class="section-row">
          <span>NP Abertas</span>
          <strong>${s.nA} (${s.pctNA}%)</strong>
        </div>

        <div class="section-row">
          <span>NP Fechadas</span>
          <strong>${s.nF} (${s.pctNF}%)</strong>
        </div>

      </div>
    `).join('');

    html += `

      <div class="table-row">

        <div class="cell-rank">

          <div class="rank-emoji">${emoji}</div>

          <div class="rank-number">${li + 1}</div>

          <div class="rank-badge ${badge}">
            N${l.nivel}
          </div>

        </div>

        <div class="cell-loja">

          <div class="loja-nome">${l.loja}</div>

          <div class="loja-local">
            ${l.local || '—'}
          </div>

        </div>

        <div class="cell-summary">

          <div class="summary-box">
            <span class="summary-label">Total</span>
            <span class="summary-number">${total}</span>
          </div>

          <div class="summary-box">
            <span class="summary-label">Abertas</span>
            <span class="summary-number">${l.pA + l.nA}</span>
          </div>

        </div>

        <div>

          <button
            class="btn btn-primary"
            onclick="toggleTasks(${li})"
          >
            Tarefas
          </button>

        </div>

        <div class="cell-trend">

          <div class="trend-icon ${diffClass}">
            ${diffIcon}
          </div>

          <div class="trend-value ${diffClass}">
            ${diffVal}
          </div>

        </div>

        <div class="cell-actions">

          <button
            class="btn btn-outline"
            onclick="toggleHist(${li})"
          >
            Histórico
          </button>

          <button
            class="btn btn-outline"
            onclick="toggleSec(${li})"
          >
            Secções
          </button>

        </div>

      </div>

      <!-- TASKS -->

      <div class="panel" id="tasks-${li}">

        <div class="panel-inner">

          <div class="panel-title">
            📋 Análise de Tarefas
          </div>

          <div class="tasks-grid">

            <div class="task-card">

              <div class="task-title">
                Programadas
              </div>

              <div class="task-item">

                <div class="task-row">
                  <span class="task-label">Abertas</span>
                  <span class="task-value">${l.pA} (${l.pctPA}%)</span>
                </div>

                <div class="bar">
                  <div
                    class="bar-fill"
                    data-width="${l.pctPA}%"
                    style="width:0;background:#ef4444"
                  ></div>
                </div>

              </div>

              <div class="task-item">

                <div class="task-row">
                  <span class="task-label">Fechadas</span>
                  <span class="task-value">${l.pF} (${l.pctPF}%)</span>
                </div>

                <div class="bar">
                  <div
                    class="bar-fill"
                    data-width="${l.pctPF}%"
                    style="width:0;background:#22c55e"
                  ></div>
                </div>

              </div>

            </div>

            <div class="task-card">

              <div class="task-title">
                Não Programadas
              </div>

              <div class="task-item">

                <div class="task-row">
                  <span class="task-label">Abertas</span>
                  <span class="task-value">${l.nA} (${l.pctNA}%)</span>
                </div>

                <div class="bar">
                  <div
                    class="bar-fill"
                    data-width="${l.pctNA}%"
                    style="width:0;background:#ef4444"
                  ></div>
                </div>

              </div>

              <div class="task-item">

                <div class="task-row">
                  <span class="task-label">Fechadas</span>
                  <span class="task-value">${l.nF} (${l.pctNF}%)</span>
                </div>

                <div class="bar">
                  <div
                    class="bar-fill"
                    data-width="${l.pctNF}%"
                    style="width:0;background:#22c55e"
                  ></div>
                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

      <!-- HIST -->

      <div class="panel" id="hist-${li}">

        <div class="panel-inner">

          <div class="panel-title">
            📈 Evolução Semanal
          </div>

          <table class="detail-table">

            <thead>
              <tr>
                <th>Semana</th>
                <th>P Aberto</th>
                <th>P Fechado</th>
                <th>NP Aberto</th>
                <th>NP Fechado</th>
              </tr>
            </thead>

            <tbody>

              ${histRows}

              <tr class="current">
                <td>${ultima}</td>
                <td>${l.pA}</td>
                <td>${l.pF}</td>
                <td>${l.nA}</td>
                <td>${l.nF}</td>
              </tr>

            </tbody>

          </table>

        </div>

      </div>

      <!-- SEC -->

      <div class="panel" id="sec-${li}">

        <div class="panel-inner">

          <div class="panel-title">
            🧩 Detalhes por Secção
          </div>

          <div class="sections-grid">

            ${secRows}

          </div>

        </div>

      </div>

    `;

  });

  html += `</div>`;

  /* ACTION */

  html += `

    <div class="action-box">

      <div class="action-icon">⚠️</div>

      <div class="action-content">

        <h3>Ação Recomendada</h3>

        <p>
          Contactar urgentemente os responsáveis das lojas críticas.
          Para lojas com tendência crescente, escalar para supervisor
          de zona. Acompanhamento semanal obrigatório das lojas em alerta.
        </p>

      </div>

    </div>

  `;

  document.getElementById('app').innerHTML = html;

}

</script>

</body>
</html>
