<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --border:rgba(0,0,0,.08);
  --text:#1a1a1a;
  --muted:#808080;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#fb923c;
  --purple:#8b5cf6;
  --pink:#ec4899;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text);
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:52px;
  height:52px;
  border-radius:14px;
  background:var(--grad);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.header-title h1{
  font-size:30px;
  font-weight:800;
}

.header-title .sub{
  margin-top:4px;
  color:var(--muted);
  font-size:15px;
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);
  padding:10px 18px;
  border-radius:12px;
  font-weight:800;
  color:var(--purple);
  font-size:15px;
}

.main{
  max-width:1900px;
  margin:auto;
  padding:28px;
}

.table-container{
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
}

.table-header{
  display:grid;
  grid-template-columns:
    90px
    220px
    180px
    120px
    120px
    120px
    120px
    120px
    120px
    200px
    120px
    120px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  font-size:14px;
  font-weight:800;
  color:#666;
  text-transform:uppercase;
}

.table-header div{
  padding:22px 10px;
  text-align:center;
}

.table-row{
  border-bottom:1px solid var(--border);
}

.row-main{
  display:grid;
  grid-template-columns:
    90px
    220px
    180px
    120px
    120px
    120px
    120px
    120px
    120px
    200px
    120px
    120px;
  align-items:center;
  padding:20px 10px;
}

.row-main:hover{
  background:rgba(139,92,246,.03);
}

.cell{
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.rank{
  flex-direction:column;
  gap:8px;
}

.rank-num{
  font-size:32px;
  font-weight:800;
}

.rank-badge{
  padding:5px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.n1{
  background:rgba(239,68,68,.12);
  color:var(--red);
}

.n2{
  background:rgba(251,146,60,.12);
  color:var(--orange);
}

.n3{
  background:rgba(34,197,94,.12);
  color:var(--green);
}

.loja{
  flex-direction:column;
  gap:6px;
}

.loja strong{
  font-size:20px;
}

.loja span{
  color:var(--muted);
  font-size:14px;
}

.metric{
  flex-direction:column;
  gap:6px;
}

.metric strong{
  font-size:24px;
}

.metric span{
  font-size:14px;
  font-weight:700;
}

.red{
  color:var(--red);
}

.green{
  color:var(--green);
}

.gray{
  color:#777;
}

.trend{
  flex-direction:column;
}

.trend-box{
  padding:14px;
  border-radius:14px;
}

.trend-positive{
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.2);
}

.trend-negative{
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.2);
}

.trend-neutral{
  background:rgba(0,0,0,.04);
  border:1px solid rgba(0,0,0,.08);
}

.trend-icon{
  font-size:24px;
  font-weight:800;
}

.trend-value{
  font-size:24px;
  font-weight:800;
}

.trend-text{
  margin-top:6px;
  font-size:12px;
  line-height:1.4;
  font-weight:700;
}

.btn{
  background:#fff;
  border:1px solid rgba(139,92,246,.25);
  color:var(--purple);
  border-radius:12px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:800;
  transition:.2s;
  font-size:14px;
}

.btn:hover{
  background:rgba(139,92,246,.08);
}

.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  padding:24px;
  background:rgba(139,92,246,.03);
  border-top:1px solid var(--border);
}

.sections-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:18px;
}

.section-card{
  border:1px solid var(--border);
  border-radius:16px;
  background:#fff;
  overflow:hidden;
}

.section-head{
  padding:16px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  font-size:18px;
  font-weight:800;
  text-align:center;
}

.section-body{
  padding:18px;
}

.sec-line{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:14px;
}

.bar{
  height:8px;
  border-radius:999px;
  overflow:hidden;
  background:#eee;
  margin-bottom:18px;
}

.fill-red{
  height:100%;
  background:var(--red);
}

.fill-green{
  height:100%;
  background:var(--green);
}

.note{
  margin-top:24px;
  padding:20px;
  border-radius:18px;
  background:#fafafa;
  border:1px solid var(--border);
  text-align:center;
  line-height:2;
  color:#555;
}

@media(max-width:1400px){

  .table-header{
    display:none;
  }

  .row-main{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }

  .cell{
    background:#fafafa;
    border-radius:14px;
    padding:14px;
    flex-direction:column;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-brand">

    <div class="header-logo">
      📊
    </div>

    <div class="header-title">
      <h1>Análise Semanal IM</h1>
      <div class="sub" id="sub-info">
        A carregar...
      </div>
    </div>

  </div>

  <div class="header-period" id="periodo">
    —
  </div>

</header>

<main class="main">

  <div id="app">

    <div style="padding:80px;text-align:center;color:#999;">
      ⏳ A carregar dados...
    </div>

  </div>

</main>

<script>

var stateSec = {};

function toggleSec(li){

  var p=document.getElementById('sec-'+li);

  if(!p) return;

  stateSec[li]=!stateSec[li];

  if(stateSec[li]){
    p.classList.add('visible');
  }else{
    p.classList.remove('visible');
  }

}

fetch('dados.json?t='+Date.now())

.then(r=>r.json())

.then(json=>{

  var data=json.data || [];

  var semanas=[];

  data.forEach(i=>{

    var s=String(i.Semana || '').trim();

    if(s && !semanas.includes(s)){
      semanas.push(s);
    }

  });

  var ultima=semanas[semanas.length-1] || '';

  var lojas=[];

  data.forEach(i=>{

    if(
      i.Loja &&
      String(i.Secção || '').trim()===''
    ){

      var semana=String(i.Semana || '').trim();

      if(semana===ultima){

        var pT=Number(i["P Total"] || 0);
        var pA=Number(i["P Aberto"] || 0);
        var pF=Number(i["P Fechado"] || 0);

        var nT=Number(i["NP Total"] || 0);
        var nA=Number(i["NP Aberto"] || 0);
        var nF=Number(i["NP Fechado"] || 0);

        var pctPF = pT>0 ? (pF/pT*100) : 0;

        var nivel =
          pctPF >= 80 ? 3 :
          pctPF >= 50 ? 2 :
          1;

        lojas.push({

          loja:String(i.Loja).trim(),

          local:String(
            i["Resumo contactos.Localidade"] ||
            ""
          ).trim(),

          pT,pA,pF,nT,nA,nF,

          pctPA:pT>0?(pA/pT*100).toFixed(1):'0.0',
          pctPF:pT>0?(pF/pT*100).toFixed(1):'0.0',

          pctNA:nT>0?(nA/nT*100).toFixed(1):'0.0',
          pctNF:nT>0?(nF/nT*100).toFixed(1):'0.0',

          nivel,

          diff:0,

          seccoes:[]

        });

      }

    }

  });

  lojas.sort((a,b)=>b.pF-a.pF);

  lojas.forEach(loja=>{

    var historico=data.filter(x=>
      String(x.Loja || '').trim()===loja.loja &&
      String(x.Secção || '').trim()===''
    );

    if(historico.length>=2){

      var pen=historico[historico.length-2];
      var atu=historico[historico.length-1];

      loja.diff =
        Number(atu["P Fechado"] || 0)
        -
        Number(pen["P Fechado"] || 0);

    }

  });

  data.forEach(i=>{

    if(
      i.Loja &&
      String(i.Secção || '').trim()!==''
    ){

      var loja=lojas.find(
        l=>l.loja===String(i.Loja).trim()
      );

      if(loja){

        loja.seccoes.push({

          nome:String(i.Secção)
          .replace(/^IM\s+\d+\s+/,'')
          .trim(),

          pT:Number(i["P Total"] || 0),
          pA:Number(i["P Aberto"] || 0),
          pF:Number(i["P Fechado"] || 0),

          nT:Number(i["NP Total"] || 0),
          nA:Number(i["NP Aberto"] || 0),
          nF:Number(i["NP Fechado"] || 0)

        });

      }

    }

  });

  document.getElementById('sub-info').innerHTML=
    lojas.length+' lojas';

  document.getElementById('periodo').innerHTML=
    '📅 '+ultima;

  render(lojas);

});

function render(lojas){

  var html='';

  html+='<div class="table-container">';

  html+='<div class="table-header">';
  html+='<div>Rank</div>';
  html+='<div>Loja</div>';
  html+='<div>Localização</div>';
  html+='<div>P Total</div>';
  html+='<div>P Aberto</div>';
  html+='<div>P Fechado</div>';
  html+='<div>P Não Realizadas</div>';
  html+='<div>NP Total</div>';
  html+='<div>NP Aberto</div>';
  html+='<div>Tendência</div>';
  html+='<div>Secções</div>';
  html+='</div>';

  lojas.forEach((l,li)=>{

    var badge =
      l.nivel===3 ? 'n3' :
      l.nivel===2 ? 'n2' :
      'n1';

    var trendClass =
      l.diff>0
      ? 'trend-positive'
      : l.diff<0
      ? 'trend-negative'
      : 'trend-neutral';

    var icon =
      l.diff>0
      ? '▲'
      : l.diff<0
      ? '▼'
      : '→';

    html+='<div class="table-row">';

    html+='<div class="row-main">';

    html+='<div class="cell rank">';
    html+='<div class="rank-num">'+(li+1)+'</div>';
    html+='<div class="rank-badge '+badge+'">N'+l.nivel+'</div>';
    html+='</div>';

    html+='<div class="cell loja">';
    html+='<strong>'+l.loja+'</strong>';
    html+='</div>';

    html+='<div class="cell loja">';
    html+='<span>'+l.local+'</span>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="gray">'+l.pT+'</span>';
    html+='<strong>Total</strong>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="red">'+l.pctPA+'%</span>';
    html+='<strong class="red">'+l.pA+'</strong>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="green">'+l.pctPF+'%</span>';
    html+='<strong class="green">'+l.pF+'</strong>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="red">'+l.pctPA+'%</span>';
    html+='<strong class="red">'+l.pA+'</strong>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="gray">'+l.nT+'</span>';
    html+='<strong>Total</strong>';
    html+='</div>';

    html+='<div class="cell metric">';
    html+='<span class="red">'+l.pctNA+'%</span>';
    html+='<strong class="red">'+l.nA+'</strong>';
    html+='</div>';

    html+='<div class="cell trend">';
    html+='<div class="trend-box '+trendClass+'">';
    html+='<div class="trend-icon">'+icon+'</div>';
    html+='<div class="trend-value">'+l.diff+'</div>';
    html+='<div class="trend-text">';

    if(l.diff>0){
      html+='Fechou mais tarefas que na semana anterior';
    }else if(l.diff<0){
      html+='Fechou menos tarefas que na semana anterior';
    }else{
      html+='Sem alterações';
    }

    html+='</div>';
    html+='</div>';
    html+='</div>';

    html+='<div class="cell">';
    html+='<button class="btn" onclick="toggleSec('+li+')">';
    html+='Secções';
    html+='</button>';
    html+='</div>';

    html+='</div>';

    html+='<div class="panel" id="sec-'+li+'">';
    html+='<div class="panel-inner">';
    html+='<div class="sections-grid">';

    l.seccoes.forEach(s=>{

      html+='<div class="section-card">';

      html+='<div class="section-head">';
      html+=s.nome;
      html+='</div>';

      html+='<div class="section-body">';

      html+='<div class="sec-line">';
      html+='<span>P Total</span>';
      html+='<strong>'+s.pT+'</strong>';
      html+='</div>';

      html+='<div class="sec-line">';
      html+='<span>P Fechado</span>';
      html+='<strong>'+s.pF+'</strong>';
      html+='</div>';

      html+='<div class="bar">';
      html+='<div class="fill-green" style="width:'+(s.pT>0?(s.pF/s.pT*100):0)+'%"></div>';
      html+='</div>';

      html+='<div class="sec-line">';
      html+='<span>P Aberto</span>';
      html+='<strong>'+s.pA+'</strong>';
      html+='</div>';

      html+='<div class="bar">';
      html+='<div class="fill-red" style="width:'+(s.pT>0?(s.pA/s.pT*100):0)+'%"></div>';
      html+='</div>';

      html+='<div class="sec-line">';
      html+='<span>NP Total</span>';
      html+='<strong>'+s.nT+'</strong>';
      html+='</div>';

      html+='<div class="sec-line">';
      html+='<span>NP Aberto</span>';
      html+='<strong>'+s.nA+'</strong>';
      html+='</div>';

      html+='<div class="bar">';
      html+='<div class="fill-red" style="width:'+(s.nT>0?(s.nA/s.nT*100):0)+'%"></div>';
      html+='</div>';

      html+='</div>';
      html+='</div>';

    });

    html+='</div>';
    html+='</div>';
    html+='</div>';

    html+='</div>';

  });

  html+='</div>';

  html+='<div class="note">';
  html+='<strong>Níveis</strong><br><br>';
  html+='<span style="color:#ef4444;font-weight:800">N1</span> = poucas tarefas programadas fechadas<br>';
  html+='<span style="color:#fb923c;font-weight:800">N2</span> = desempenho médio<br>';
  html+='<span style="color:#22c55e;font-weight:800">N3</span> = muitas tarefas programadas fechadas';
  html+='</div>';

  document.getElementById('app').innerHTML=html;

}

</script>

</body>
</html>
