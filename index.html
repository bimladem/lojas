<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Semanal IM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg-primary:#ffffff;
  --bg-secondary:#f8f9fa;
  --bg-tertiary:#f0f2f5;
  --border:rgba(0,0,0,0.08);
  --text-primary:#1a1a1a;
  --text-tertiary:#808080;
  --accent-purple:#8b5cf6;
  --accent-pink:#ec4899;
  --success:#22c55e;
  --danger:#ef4444;
  --warning:#fb923c;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:var(--text-primary);
  font-size:14px;
  min-height:100vh;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.header-logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--grad);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:20px;
}

.header-title h1{
  font-size:24px;
  font-weight:800;
}

.header-title .sub{
  color:var(--text-tertiary);
  margin-top:4px;
}

.header-period{
  background:rgba(139,92,246,.08);
  border:1px solid rgba(139,92,246,.15);
  padding:10px 16px;
  border-radius:10px;
  font-weight:700;
  color:#8b5cf6;
}

.main{
  max-width:1800px;
  margin:auto;
  padding:30px;
}

/* LEGENDA */

.legend{
  display:flex;
  gap:14px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--border);
  padding:10px 14px;
  border-radius:12px;
  background:#fff;
  font-weight:700;
}

.legend-color{
  width:14px;
  height:14px;
  border-radius:50%;
}

.green{ background:#22c55e; }
.orange{ background:#fb923c; }
.red{ background:#ef4444; }

/* TABLE */

.table-container{
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  background:#fff;
}

.table-header{
  display:grid;
  grid-template-columns:
  .6fr
  1.2fr
  2.5fr
  .7fr
  1fr;
  padding:18px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  color:#666;
}

.table-row{
  display:grid;
  grid-template-columns:
  .6fr
  1.2fr
  2.5fr
  .7fr
  1fr;
  border-bottom:1px solid var(--border);
  transition:.2s;
}

.table-row:hover{
  background:rgba(139,92,246,.03);
}

.cell{
  padding:20px;
  display:flex;
  align-items:center;
}

/* RANK */

.cell-rank{
  flex-direction:column;
  justify-content:center;
  gap:10px;
}

.rank-number{
  font-size:28px;
  font-weight:800;
}

.rank-badge{
  padding:5px 10px;
  border-radius:10px;
  font-size:11px;
  font-weight:800;
}

.badge-n1{
  background:rgba(34,197,94,.12);
  color:#22c55e;
}

.badge-n2{
  background:rgba(251,146,60,.12);
  color:#fb923c;
}

.badge-n3{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

/* LOJA */

.cell-loja{
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  gap:6px;
}

.loja-nome{
  font-size:18px;
  font-weight:800;
}

.loja-local{
  color:var(--text-tertiary);
}

/* TAREFAS */

.tasks-wrapper{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.task-box{
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  background:#fafafa;
}

.task-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:14px;
}

.task-line{
  margin-bottom:14px;
}

.task-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.task-bar{
  height:8px;
  border-radius:999px;
  background:#e5e7eb;
  overflow:hidden;
}

.task-fill{
  height:100%;
}

.fill-red{
  background:#ef4444;
}

.fill-green{
  background:#22c55e;
}

/* TENDENCIA */

.cell-trend{
  flex-direction:column;
  justify-content:center;
  gap:6px;
  font-size:28px;
  font-weight:800;
}

.trend-up{
  color:#ef4444;
}

.trend-down{
  color:#22c55e;
}

.trend-flat{
  color:#808080;
}

/* BUTTONS */

.cell-actions{
  justify-content:center;
  gap:10px;
}

.btn-action{
  background:#fff;
  border:1px solid rgba(139,92,246,.25);
  color:#8b5cf6;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:700;
  transition:.2s;
}

.btn-action:hover{
  background:rgba(139,92,246,.08);
}

/* PANELS */

.panel{
  display:none;
}

.panel.visible{
  display:block;
}

.panel-inner{
  padding:30px;
  background:rgba(139,92,246,.03);
  border-top:1px solid var(--border);
}

/* HIST */

.detail-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

.detail-table th{
  text-align:left;
  padding:14px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
}

.detail-table td{
  padding:14px;
  border-bottom:1px solid var(--border);
}

/* SECCOES */

.sections-panel{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
}

.section-block{
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  background:#fff;
}

.section-block-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:20px;
}

.section-category{
  margin-bottom:25px;
}

.section-category-title{
  font-size:12px;
  font-weight:800;
  color:#777;
  margin-bottom:14px;
  text-transform:uppercase;
}

.section-metric{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.loading{
  padding:100px;
  text-align:center;
  font-size:20px;
}

@media(max-width:1200px){

  .table-header{
    display:none;
  }

  .table-row{
    grid-template-columns:1fr;
  }

  .tasks-wrapper{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-brand">

    <div class="header-logo">
      📊
    </div>

    <div class="header-title">
      <h1>Análise Semanal</h1>
      <div class="sub" id="sub-info">Carregando...</div>
    </div>

  </div>

  <div class="header-period" id="periodo">
    —
  </div>

</header>

<main class="main">

  <div class="legend">

    <div class="legend-item">
      <div class="legend-color green"></div>
      N1 → Até 20 tarefas abertas
    </div>

    <div class="legend-item">
      <div class="legend-color orange"></div>
      N2 → Entre 21 e 40 tarefas abertas
    </div>

    <div class="legend-item">
      <div class="legend-color red"></div>
      N3 → Mais de 40 tarefas abertas
    </div>

  </div>

  <div id="app">

    <div class="loading">
      ⏳ Carregando dados...
    </div>

  </div>

</main>

<script>

var stateHist = {};
var stateSec = {};

function toggleHist(li){

  var p = document.getElementById('hist-' + li);
  var b = document.getElementById('btnhist-' + li);

  stateHist[li] = !stateHist[li];

  p.classList.toggle('visible', stateHist[li]);

  b.innerHTML = stateHist[li]
    ? '▼ Histórico'
    : '▶ Histórico';
}

function toggleSec(li){

  var p = document.getElementById('sec-' + li);
  var b = document.getElementById('btnsec-' + li);

  stateSec[li] = !stateSec[li];

  p.classList.toggle('visible', stateSec[li]);

  b.innerHTML = stateSec[li]
    ? '▼ Secções'
    : '▶ Secções';
}

fetch('dados.json?t=' + Date.now())

.then(r => r.json())

.then(json => {

  var data = json.data || [];

  var semanas = [];

  data.forEach(i => {

    var s = String(i.Semana || '').trim();

    if(s && semanas.indexOf(s) === -1){
      semanas.push(s);
    }

  });

  var ultima = semanas[semanas.length - 1] || '';

  var lojas = data

  .filter(i =>
    i.Loja &&
    !i.Secção &&
    String(i.Semana || '').trim() === ultima
  )

  .map(i => {

    var pT = Number(i['P Total']) || 0;
    var pA = Number(i['P Aberto']) || 0;
    var pF = Number(i['P Fechado']) || 0;

    var nT = Number(i['NP Total']) || 0;
    var nA = Number(i['NP Aberto']) || 0;
    var nF = Number(i['NP Fechado']) || 0;

    return {

      loja:String(i.Loja).trim(),

      local:String(
        i['Resumo contactos.Localidade']
        ||
        i['IM.Localidade']
        ||
        ''
      ).trim(),

      pA,pF,nA,nF,pT,nT,

      pctPA:pT > 0 ? (pA/pT*100).toFixed(1) : '0.0',
      pctPF:pT > 0 ? (pF/pT*100).toFixed(1) : '0.0',

      pctNA:nT > 0 ? (nA/nT*100).toFixed(1) : '0.0',
      pctNF:nT > 0 ? (nF/nT*100).toFixed(1) : '0.0',

      nivel:
        pA <= 20
        ? 1
        : pA <= 40
        ? 2
        : 3,

      historico:[],
      seccoes:[]

    };

  });

  lojas.sort((a,b)=>b.pA-a.pA);

  var ids = {};

  lojas.forEach(l => {
    ids[l.loja] = true;
  });

  var hpl = {};

  data.forEach(i => {

    if(
      !i.Secção &&
      i.Loja &&
      i.Semana &&
      ids[String(i.Loja).trim()]
    ){

      var id = String(i.Loja).trim();

      if(!hpl[id]){
        hpl[id] = [];
      }

      hpl[id].push({

        semana:String(i.Semana).trim(),

        pA:Number(i['P Aberto']) || 0,
        pF:Number(i['P Fechado']) || 0,

        nA:Number(i['NP Aberto']) || 0,
        nF:Number(i['NP Fechado']) || 0

      });

    }

  });

  lojas.forEach(l => {

    var h = hpl[l.loja] || [];

    l.historico = h
      .filter(x => x.semana !== ultima)
      .slice(-8);

    var u = h.slice(-2);

    l.diff = u.length === 2
      ? u[1].pA - u[0].pA
      : 0;

  });

  data.forEach(i => {

    if(
      i.Secção &&
      i.Loja &&
      ids[String(i.Loja).trim()]
    ){

      var loja = lojas.find(
        l => l.loja === String(i.Loja).trim()
      );

      if(loja){

        var nome = String(i.Secção)
          .replace(/^IM\s+\d+\s+/,'')
          .trim();

        if(nome.toLowerCase() !== 'admin'){

          var pA = Number(i['P Aberto']) || 0;
          var pF = Number(i['P Fechado']) || 0;

          var nA = Number(i['NP Aberto']) || 0;
          var nF = Number(i['NP Fechado']) || 0;

          var pT = Number(i['P Total']) || 0;
          var nT = Number(i['NP Total']) || 0;

          loja.seccoes.push({

            nome,

            pA,pF,nA,nF,

            pctPA:pT>0?(pA/pT*100).toFixed(1):'0.0',
            pctPF:pT>0?(pF/pT*100).toFixed(1):'0.0',

            pctNA:nT>0?(nA/nT*100).toFixed(1):'0.0',
            pctNF:nT>0?(nF/nT*100).toFixed(1):'0.0'

          });

        }

      }

    }

  });

  document.getElementById('sub-info').textContent =
    'Gerado hoje · ' + lojas.length + ' lojas';

  document.getElementById('periodo').textContent =
    '📅 ' + ultima;

  renderApp(lojas,ultima);

});

function renderApp(lojas,ultima){

  var html = `

  <div class="table-container">

    <div class="table-header">

      <div>RANK</div>
      <div>LOJA</div>
      <div>TAREFAS</div>
      <div>TENDÊNCIA</div>
      <div>AÇÕES</div>

    </div>

  `;

  lojas.forEach((l,li)=>{

    var badge =
      l.nivel === 1
      ? 'badge-n1'
      : l.nivel === 2
      ? 'badge-n2'
      : 'badge-n3';

    var trend = '→';
    var trendClass = 'trend-flat';

    if(l.diff > 0){
      trend = '▲';
      trendClass = 'trend-up';
    }

    if(l.diff < 0){
      trend = '▼';
      trendClass = 'trend-down';
    }

    html += `

    <div class="table-row">

      <div class="cell cell-rank">

        <div class="rank-number">
          ${li+1}
        </div>

        <div class="rank-badge ${badge}">
          N${l.nivel}
        </div>

      </div>

      <div class="cell cell-loja">

        <div class="loja-nome">
          ${l.loja}
        </div>

        <div class="loja-local">
          ${l.local}
        </div>

      </div>

      <div class="cell">

        <div class="tasks-wrapper">

          <div class="task-box">

            <div class="task-title">
              Programadas
            </div>

            <div class="task-line">

              <div class="task-head">
                <span>Abertas</span>
                <strong>${l.pctPA}% (${l.pA})</strong>
              </div>

              <div class="task-bar">
                <div class="task-fill fill-red"
                style="width:${l.pctPA}%"></div>
              </div>

            </div>

            <div class="task-line">

              <div class="task-head">
                <span>Fechadas</span>
                <strong>${l.pctPF}% (${l.pF})</strong>
              </div>

              <div class="task-bar">
                <div class="task-fill fill-green"
                style="width:${l.pctPF}%"></div>
              </div>

            </div>

          </div>

          <div class="task-box">

            <div class="task-title">
              Não Programadas
            </div>

            <div class="task-line">

              <div class="task-head">
                <span>Abertas</span>
                <strong>${l.pctNA}% (${l.nA})</strong>
              </div>

              <div class="task-bar">
                <div class="task-fill fill-red"
                style="width:${l.pctNA}%"></div>
              </div>

            </div>

            <div class="task-line">

              <div class="task-head">
                <span>Fechadas</span>
                <strong>${l.pctNF}% (${l.nF})</strong>
              </div>

              <div class="task-bar">
                <div class="task-fill fill-green"
                style="width:${l.pctNF}%"></div>
              </div>

            </div>

          </div>

        </div>

      </div>

      <div class="cell cell-trend ${trendClass}">

        ${trend}

        <div style="font-size:18px">
          ${Math.abs(l.diff)}
        </div>

      </div>

      <div class="cell cell-actions">

        <button
          class="btn-action"
          id="btnhist-${li}"
          onclick="toggleHist(${li})">
          ▶ Histórico
        </button>

        <button
          class="btn-action"
          id="btnsec-${li}"
          onclick="toggleSec(${li})">
          ▶ Secções
        </button>

      </div>

    </div>

    <div class="panel" id="hist-${li}">

      <div class="panel-inner">

        <table class="detail-table">

          <thead>

            <tr>
              <th>Semana</th>
              <th>P Aberto</th>
              <th>P Fechado</th>
              <th>NP Aberto</th>
              <th>NP Fechado</th>
            </tr>

          </thead>

          <tbody>

            ${l.historico.map(h=>`

              <tr>

                <td>${h.semana}</td>
                <td>${h.pA}</td>
                <td>${h.pF}</td>
                <td>${h.nA}</td>
                <td>${h.nF}</td>

              </tr>

            `).join('')}

            <tr style="font-weight:800;background:#fafafa">

              <td>${ultima}</td>
              <td>${l.pA}</td>
              <td>${l.pF}</td>
              <td>${l.nA}</td>
              <td>${l.nF}</td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

    <div class="panel" id="sec-${li}">

      <div class="panel-inner">

        <div class="sections-panel">

          ${l.seccoes.map(s=>`

            <div class="section-block">

              <div class="section-block-title">
                ${s.nome}
              </div>

              <div class="section-category">

                <div class="section-category-title">
                  Programadas
                </div>

                <div class="section-metric">
                  <span>Abertas</span>
                  <strong>${s.pctPA}% (${s.pA})</strong>
                </div>

                <div class="task-bar">
                  <div class="task-fill fill-red"
                  style="width:${s.pctPA}%"></div>
                </div>

                <br>

                <div class="section-metric">
                  <span>Fechadas</span>
                  <strong>${s.pctPF}% (${s.pF})</strong>
                </div>

                <div class="task-bar">
                  <div class="task-fill fill-green"
                  style="width:${s.pctPF}%"></div>
                </div>

              </div>

              <div class="section-category">

                <div class="section-category-title">
                  Não Programadas
                </div>

                <div class="section-metric">
                  <span>Abertas</span>
                  <strong>${s.pctNA}% (${s.nA})</strong>
                </div>

                <div class="task-bar">
                  <div class="task-fill fill-red"
                  style="width:${s.pctNA}%"></div>
                </div>

                <br>

                <div class="section-metric">
                  <span>Fechadas</span>
                  <strong>${s.pctNF}% (${s.nF})</strong>
                </div>

                <div class="task-bar">
                  <div class="task-fill fill-green"
                  style="width:${s.pctNF}%"></div>
                </div>

              </div>

            </div>

          `).join('')}

        </div>

      </div>

    </div>

    `;

  });

  html += `</div>`;

  document.getElementById('app').innerHTML = html;

}

</script>

</body>
</html>
